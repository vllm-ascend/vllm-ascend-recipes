api_version: recipe-ci/v1
kind: MultiNodePlan

metadata:
  name: qwen3.5-27b-a2-pd-reduced

model:
  id: Eco-Tech/Qwen3.5-27B-w8a8-mtp
  cache_path: Eco-Tech/Qwen3.5-27B-w8a8-mtp
  served_name: qwen3.5

resources:
  npu_per_node: 8

nodes:
  - id: node0
    role: prefill
    launch: nodes/node0/run.sh
    readiness:
      port_start: 7100
      count: 4

  - id: node1
    role: decode
    launch: nodes/node1/run.sh
    readiness:
      port_start: 7100
      count: 4

gateway:
  launch: gateway/run.sh
  port: 38085

checks:
  - id: completion
    script: checks/completion.sh
    timeout_seconds: 300

evaluations:
  accuracy:
    - id: gsm8k
      script: evaluations/accuracy.sh
      timeout_seconds: 7200
  performance:
    - id: gsm8k-perf
      script: evaluations/performance.sh
      timeout_seconds: 7200
