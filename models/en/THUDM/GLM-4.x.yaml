- npu: Atlas 800I A2
  precision: W8A8
  deployment: Single-Node
  case: Multi Card
  default_configs:
  - fusion_ops_gmmswigluquant
  config_params:
    tensor_parallel_size:
      default: 8
      type: number
      description: "A2 single-node serving uses tp8 by default to cover all 8 NPUs"
  steps:
  - title: Start the server
    content: |-
      Single-node deployment for GLM-4.7 W8A8 quantized model on Atlas 800I A2.

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=512
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export VLLM_ASCEND_BALANCE_SCHEDULING=1
      export VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1

      vllm serve your_model_path \
          --served-model-name glm \
          --trust-remote-code \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens {{max_num_batched_tokens}} \
          --tensor-parallel-size {{tensor_parallel_size}} \
          --enable-expert-parallel \
          --quantization ascend \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          --additional-config '{"enable_shared_expert_dp": true, "ascend_fusion_config": {%%CONFIG:fusion_ops_gmmswigluquant%%"fusion_ops_gmmswigluquant": false%%/CONFIG:fusion_ops_gmmswigluquant%%}}' \
          --seed 1024 \
          --port 8000
      ```

      > - A2 has 8 NPUs, so `--tensor-parallel-size 8` uses all available NPUs.
      > - `--quantization ascend`: required for W8A8 quantized models. Remove this parameter when using BF16 weights.
      > - `--speculative-config`: configures MTP speculative decoding to accelerate inference.
      > - `fusion_ops_gmmswigluquant`: should be `false` when total number of NPUs is <= 16 due to performance degradation.
      > - `max-model-len` and `max-num-seqs` should be set according to the actual scenario.
  - title: Service Verification
    content: |-
      After the service is started, verify it is running by sending a prompt. Refer to the verification section below for a usage example.
