      vllm serve your_model_path \
          --served-model-name glm \
          --trust-remote-code \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens {{max_num_batched_tokens}} \
          --data-parallel-size 2 \
          --data-parallel-size-local 1 \
          --data-parallel-start-rank 1 \
          --data-parallel-address <node0_ip> \
          --data-parallel-rpc-port 13389 \
          --tensor-parallel-size {{tensor_parallel_size}} \
          --enable-expert-parallel \
          --headless \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          --additional-config '{"enable_shared_expert_dp": true, "ascend_fusion_config": {%%CONFIG:fusion_ops_gmmswigluquant%%"fusion_ops_gmmswigluquant": false%%/CONFIG:fusion_ops_gmmswigluquant%%}}' \
          --seed 1024 \
          --port 8000
      ```

      > - Replace `<node0_ip>` and `<node1_ip>` with actual node IP addresses.
      > - Replace `<nic_name>` with the actual network interface name.
      > - Node 1 requires `--headless` and `--data-parallel-start-rank 1`.
      > - BF16 weights do not need `--quantization ascend`.
      > - `max-model-len` and `max-num-seqs` should be set according to the actual scenario.
