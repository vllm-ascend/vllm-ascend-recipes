    url: https://www.modelscope.cn/models/ZhipuAI/GLM-4.5
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model ZhipuAI/GLM-4.5
      ```
- weight_version: GLM-4.5 W8A8 (with MTP)
