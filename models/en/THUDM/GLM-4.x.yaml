  benchmark: |-
    ### Recommended Configurations

    > **Note**: The following configurations are validated in specific test environments and are for reference only.

    #### Best Practices

    | Scenario | Recommended Config | Notes |
    |----------|-------------------|-------|
    | Long-context, low concurrency (<=4) | dp1 tp16 | Maximizes context capacity |
    | Long-context, high concurrency (>4) | dp2 tp8 | Balances throughput and context |
    | Low-latency, short sequences | dp2 tp8 | Reduces per-token latency |
    | High-throughput, short sequences | dp2 tp8 | Maximizes concurrent request processing |

    > `max-model-len` and `max-num-seqs` should be tuned per scenario.
tuning: |-
  ### Tuning Guidelines

  Please refer to the [Public Performance Tuning Documentation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) for tuning methods.
  Please refer to the [Feature Guide](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html) for detailed feature descriptions.

  **Key tuning notes for GLM-4.x:**

  - `fusion_ops_gmmswigluquant` should be `false` when total number of NPUs is <= 16 due to performance degradation.
  - `VLLM_ASCEND_ENABLE_FLASHCOMM1`: disable for long-sequence (>=16k) and low-concurrency (<=8 batch size) scenarios.
  - `VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1` is recommended for GLM-4.x models.
faq: |-
  For common environment, installation, and general parameter issues, please refer to the [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html). This chapter only covers model-specific issues.

  **Q: HCCL port conflicts?**

  Run `pkill -f VLLM*` to clean up old processes.

  **Q: OOM or unstable startup?**

  Reduce `--max-num-seqs` and `--max-model-len`, lower concurrency and load-testing pressure.

  **Q: How to enable function calling?**

  Add the following flags to the `vllm serve` command:

  ```bash
  --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
  ```
