meta:
  title: "GLM-4.5/4.6/4.7"
  slug: "glm-4.x"
  provider: "THUDM"
  description: "GLM-4.x series are Mixture-of-Experts (MoE) foundational models from Zhipu AI, specifically designed for agent applications. GLM-4.7 features the latest improvements with support for MTP speculative decoding, expert parallelism, and PD disaggregation on Ascend NPUs."
  date_added: 2026-07-13
  performance_headline: "Single-node deployment on Atlas 800 A3 (128G × 8) with W8A8 precision"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "ZhipuAI/GLM-4.7"
  min_vllm_version: "0.10.0rc1"
  architecture: moe
  parameter_count: "31B"
  active_parameters: null
  context_length: 133000
  modality: text

# Upstream-aligned weight variants (vllm-project/recipes schema). VRAM = minimum to load.
variants:
  default:
    precision: W8A8
    vram_minimum_gb: 426
    description: "W8A8 quantized weights (GLM-4.7-W8A8-floatmtp ships MTP heads) - 1x Atlas 800I A2 (64Gx8) or 1x Atlas 800I A3"
  bf16:
    model_id: "ZhipuAI/GLM-4.7"
    precision: BF16
    vram_minimum_gb: 852
    description: "Full BF16 weights - 1x Atlas 800I A3 (64Gx16)"

features:
  expert_parallel:
    description: "MoE expert parallelism across DP ranks"
    args: ["--enable-expert-parallel"]
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "Configures MTP (Multi-Token Prediction) speculative decoding to accelerate inference"
    args: ["--speculative-config", '{"num_speculative_tokens": 3, "method": "mtp"}']
  compilation_config:
    label: "Compilation Config"
    description: "Runs decode with full ACL graph execution to reduce scheduling latency"
    args: ["--compilation-config", '{"cudagraph_capture_sizes": [1,2,4,8,16,32,64,128,256,512], "cudagraph_mode": "FULL_DECODE_ONLY"}']
  tool_calling:
    label: "Tool Calling"
    description: "GLM-4.7 tool-call parser"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "glm47"]
  reasoning:
    label: "Reasoning Parser"
    description: "GLM-4.x reasoning parser"
    args: ["--reasoning-parser", "glm45"]
  topk_optimize:
    label: "TopK Optimize"
    description: "TopK optimization recommended for GLM-4.x models"
    env:
      VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE: "1"
  balance_scheduling:
    label: "Balance Scheduling"
    description: "Ascend balanced scheduling optimization"
    env:
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"

extra_config:
- key: fusion_ops_gmmswigluquant
  label: "fusion_ops_gmmswigluquant=false"

config_params:
  max_model_len:
    default: 133000
    type: number
    description: "Maximum context length (input + output tokens); set it according to your actual scenario"
  max_num_seqs:
    default: 16
    type: number
    description: "Maximum concurrent sequences; use <=4 for long-context low-concurrency scenarios"
  max_num_batched_tokens:
    default: 8192
    type: number
    description: "Maximum batched tokens per scheduler iteration"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "NPU memory fraction available for KV cache"

guide: ""
performance_model_names:
  - "GLM-4.5"
  - "GLM-4.6"
  - "GLM-4.7"
overview: |-
