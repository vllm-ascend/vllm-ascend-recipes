- npu: Atlas 800I A3
  precision: W8A8
  deployment: Multi-Node PD Separation
  case: PD Separation
  tags: [pd-multinode]
  strategy: pd_cluster
  steps:
  - title: Overview
    content: |-
      Prefill-Decode Disaggregation (1P1D) separates the prefill and decode stages across nodes for better throughput and latency. GLM-5 W8A8 runs with 2 prefill nodes (dp=2, tp=16) and 4 decode nodes (dp=16, tp=4), with KV transfer over Mooncake.
  - title: Prepare launch_online_dp.py
    content: |-
      Prepare the script `launch_online_dp.py` on each node.

      ```python
      import argparse, multiprocessing, os, subprocess, sys

      def parse_args():
          parser = argparse.ArgumentParser()
          parser.add_argument("--dp-size", type=int, required=True)
          parser.add_argument("--tp-size", type=int, default=1)
          parser.add_argument("--dp-size-local", type=int, default=-1)
          parser.add_argument("--dp-rank-start", type=int, default=0)
          parser.add_argument("--dp-address", type=str, required=True)
          parser.add_argument("--dp-rpc-port", type=str, default=12345)
          parser.add_argument("--vllm-start-port", type=int, default=9000)
          return parser.parse_args()

      args = parse_args()
      dp_size, tp_size = args.dp_size, args.tp_size
      dp_size_local = args.dp_size_local if args.dp_size_local != -1 else dp_size
      dp_rank_start, dp_address, dp_rpc_port = args.dp_rank_start, args.dp_address, args.dp_rpc_port
      vllm_start_port = args.vllm_start_port

      def run_command(visible_devices, dp_rank, vllm_engine_port):
          command = ["bash", "./run_dp_template.sh", visible_devices, str(vllm_engine_port),
                     str(dp_size), str(dp_rank), dp_address, dp_rpc_port, str(tp_size)]
          subprocess.run(command, check=True)

      num_cards = dp_size_local * tp_size
      for i in range(dp_size_local):
          rank = dp_rank_start + i
          start = rank * tp_size
          devices = ",".join(str(d) for d in range(start, start + tp_size))
          p = multiprocessing.Process(target=run_command, args=(devices, rank, vllm_start_port + rank * tp_size))
          p.start()
      ```
  - title: Prepare run_dp_template.sh – Prefill node
    content: |-
      Prepare `run_dp_template.sh` on each prefill node (2 prefill nodes; only `kv_port` and `engine_id` change per node).

      To support a 200k context window on the prefill stage, add `"layer_sharding": ["q_b_proj", "o_proj"]` to `--additional_config` on each prefill node.

      ```shell
      nic_name="xxxx" # change to your own nic name
      local_ip="xxxx" # change to your own ip

      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_IF_IP=$local_ip
      export GLOO_SOCKET_IFNAME=$nic_name
      export TP_SOCKET_IFNAME=$nic_name
      export HCCL_SOCKET_IFNAME=$nic_name
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export HCCL_BUFFSIZE=256
      export ASCEND_AGGREGATE_ENABLE=1
      export ASCEND_TRANSPORT_PRINT=1
      export ACL_OP_INIT_MODE=1
      export ASCEND_A3_ENABLE=1
      export VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT=480
      export ASCEND_RT_VISIBLE_DEVICES=$1
      {{flashcomm1}}
      export VLLM_ASCEND_ENABLE_FUSED_MC2=1
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib

      vllm serve /root/.cache/modelscope/hub/models/vllm-ascend/GLM5-w8a8 \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --speculative-config '{"num_speculative_tokens": 1, "method":"deepseek_mtp", "enforce_eager": true}' \
          --seed 1024 \
          --served-model-name glm-5 \
          --max-model-len 131072 \
          --additional-config '{"enable_dsa_cp": true, "layer_sharding": ["q_b_proj", "o_proj"]}' \
          --max-num-batched-tokens 4096 \
          --trust-remote-code \
          --max-num-seqs 64 \
          --enable-chunked-prefill \
          --quantization ascend \
          --gpu-memory-utilization 0.95 \
          --enforce-eager \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_producer",
          "kv_port": "30000",
          "kv_connector_extra_config": {
                      "use_ascend_direct": true,
                      "prefill": {"dp_size": 2, "tp_size": 16},
                      "decode": {"dp_size": 16, "tp_size": 4}
              }
          }'
      ```
  - title: Prepare run_dp_template.sh – Decode node
    content: |-
      Prepare `run_dp_template.sh` on each decode node (4 decode nodes; only `kv_port` and `engine_id` change per node).

      ```shell
