meta:
  title: "GLM-5"
  slug: "glm-5"
  provider: "THUDM"
  description: "GLM-5 and GLM-5.1 are Mixture-of-Experts (MoE) models from Zhipu AI, targeting complex systems engineering and long-horizon agentic tasks. GLM-5 features 744B total parameters, with support for MTP speculative decoding, expert parallelism, and PD disaggregation on Ascend NPUs."
  date_added: 2026-07-13
  date_updated: 2026-07-13
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - "zai-org/GLM-5.1"
  performance_headline: "Multi-node deployment on Atlas 800 A3 (128G × 8) with W4A8/W8A8 precision"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "zai-org/GLM-5"
  performance_model_names:
    - "GLM-5"
    - "GLM-5.1"
  min_vllm_version: "0.17.0rc1"
  architecture: moe
  parameter_count: "744B"
  active_parameters: null
  context_length: 131072
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    HCCL_BUFFSIZE: "200"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    VLLM_ASCEND_BALANCE_SCHEDULING: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.22.1rc"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.22.1rc-a3"
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g --device /dev/davinci0 --device /dev/davinci1 ... --device /dev/davinci15 -it quay.io/ascend/vllm-ascend:v0.22.1rc bash"
      note: "Official Ascend image; full device/driver mounts are covered in env_setup.container."

# —— Upstream alignment: features / variants / strategies / overrides / guide ——
features:
  expert_parallel:
    description: "MoE expert parallelism across the DP ranks (required for GLM-5 MoE)"
    args: ["--enable-expert-parallel"]
  tool_calling:
    description: "GLM function calling"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "glm47"]
  reasoning:
    description: "GLM reasoning parser"
    args: ["--reasoning-parser", "glm45"]
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP speculative decoding (deepseek_mtp, 3 tokens) to accelerate inference"
    args: ["--speculative-config", '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": true}']
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm communication optimization (disable for long-sequence / low-concurrency scenarios)"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  prefix_caching:
    label: "Prefix Caching"
    description: "KV-cache prefix caching (recommended for long context)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  compilation_config:
    label: "Compilation Config"
    description: "Full ACL graph execution in decode (--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  multistream_overlap:
    label: "Multi-stream Overlap"
    description: "MoE shared expert multi-stream overlap"
    args: ["--additional-config", '{"multistream_overlap_shared_expert": true}']

opt_in_features: []

variants:
  default:
    precision: W4A8
    vram_minimum_gb: 447
    description: "W4A8 quantized weights on Atlas 800 A2/A3"
  w8a8:
    model_id: "Eco-Tech/GLM-5-w8a8"
    precision: W8A8
    vram_minimum_gb: 893
    description: "W8A8 quantized weights (requires VLLM_ASCEND_ENABLE_MLAPO=1)"
  bf16:
    model_id: "ZhipuAI/GLM-5"
    precision: bf16
    vram_minimum_gb: 1786
    description: "BF16 weights — needs 2× Atlas 800 A3 (16 chips each)"

compatible_strategies:
  - single_node_A3
  - single_node_A2
  - multi_node_dp
  - pd_cluster

hardware_overrides: {}
strategy_overrides:
  pd_cluster:
    prefill:
      nodes: { default: 2 }
    decode:
      nodes: { default: 4 }

dependencies:
  - note: "transformers >= 5.2.0 is required for the GLM-5 tokenizer"
    command: "pip install 'transformers>=5.2.0'"

guide: ""

# —— Configurable value params (page/CI extension; defaults = tutorial baseline) ——
config_params:
  gpu_memory_utilization:
    default: 0.95
    type: number
    description: "Fraction of NPU memory available for the KV cache"

overview: |-
  GLM-5 and GLM-5.1 are Mixture-of-Experts (MoE) models from Zhipu AI (THUDM), targeting complex systems engineering and long-horizon agentic tasks. With 744B total parameters.
