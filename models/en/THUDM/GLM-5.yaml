      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export HCCL_BUFFSIZE=256
      export ASCEND_AGGREGATE_ENABLE=1
      export ASCEND_TRANSPORT_PRINT=1
      export ACL_OP_INIT_MODE=1
      export ASCEND_A3_ENABLE=1
      export VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT=480
      export TASK_QUEUE_ENABLE=1
      export ASCEND_RT_VISIBLE_DEVICES=$1
      export VLLM_ASCEND_ENABLE_FUSED_MC2=1
      export VLLM_ASCEND_ENABLE_MLAPO=1
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib

      vllm serve /root/.cache/modelscope/hub/models/vllm-ascend/GLM5-w8a8 \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --speculative-config '{"num_speculative_tokens": 3, "method":"deepseek_mtp", "enforce_eager": true}' \
          --seed 1024 \
          --served-model-name glm-5 \
          --max-model-len 200000 \
          --max-num-batched-tokens 32 \
          {{compilation_config}} \
          --additional-config '{"recompute_scheduler_enable": true}' \
          --trust-remote-code \
          --max-num-seqs 8 \
          --gpu-memory-utilization 0.92 \
          --quantization ascend \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_consumer",
          "kv_port": "30100",
          "kv_connector_extra_config": {
                      "use_ascend_direct": true,
                      "prefill": {"dp_size": 2, "tp_size": 16},
                      "decode": {"dp_size": 16, "tp_size": 4}
              }
          }'
      ```
  - title: Start the service
    content: |-
      Start the service on each node with `launch_online_dp.py`.

      Prefill nodes:
      ```bash
      python launch_online_dp.py --dp-size 2 --tp-size 16 --dp-size-local 1 --dp-rank-start 0 --dp-address $node_p0_ip --dp-rpc-port 10521 --vllm-start-port 6700
      python launch_online_dp.py --dp-size 2 --tp-size 16 --dp-size-local 1 --dp-rank-start 1 --dp-address $node_p0_ip --dp-rpc-port 10521 --vllm-start-port 6700
      ```
      Decode nodes (4 nodes, dp-size-local 4):
      ```bash
      python launch_online_dp.py --dp-size 16 --tp-size 4 --dp-size-local 4 --dp-rank-start 0 --dp-address $node_d0_ip --dp-rpc-port 10523 --vllm-start-port 6721
      python launch_online_dp.py --dp-size 16 --tp-size 4 --dp-size-local 4 --dp-rank-start 4 --dp-address $node_d0_ip --dp-rpc-port 10523 --vllm-start-port 6721
      python launch_online_dp.py --dp-size 16 --tp-size 4 --dp-size-local 4 --dp-rank-start 8 --dp-address $node_d0_ip --dp-rpc-port 10523 --vllm-start-port 6721
      python launch_online_dp.py --dp-size 16 --tp-size 4 --dp-size-local 4 --dp-rank-start 12 --dp-address $node_d0_ip --dp-rpc-port 10523 --vllm-start-port 6721
      ```
  - title: Request forwarding
    content: |-
      Run the load-balance proxy on any machine to forward requests to the PD service (program: [load_balance_proxy_server_example.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py)).

      ```shell
      unset http_proxy
      unset https_proxy

      python load_balance_proxy_server_example.py \
          --port 8000 \
          --host 0.0.0.0 \
          --prefiller-hosts $node_p0_ip $node_p1_ip \
          --prefiller-ports 6700 6700 \
          --decoder-hosts $node_d0_ip $node_d0_ip $node_d0_ip $node_d0_ip $node_d1_ip $node_d1_ip $node_d1_ip $node_d1_ip $node_d2_ip $node_d2_ip $node_d2_ip $node_d2_ip $node_d3_ip $node_d3_ip $node_d3_ip $node_d3_ip \
          --decoder-ports 6721 6722 6723 6724 6721 6722 6723 6724 6721 6722 6723 6724 6721 6722 6723 6724
      ```
