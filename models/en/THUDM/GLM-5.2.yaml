meta:
  title: "GLM-5.2"
  slug: "glm-5.2"
  provider: "THUDM"
  description: "GLM-5.2 is a Mixture-of-Experts (MoE) model from Zhipu AI with 753B total parameters, targeting complex systems engineering and long-horizon agentic tasks. It supports MTP speculative decoding with up to 5 speculative tokens, async scheduling, and PD disaggregation on Ascend NPUs."
  date_added: 2026-07-13
  performance_headline: "Multi-node deployment on Atlas 800 A2/A3 with W8A8 and W4A8C8 precision"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "zai-org/GLM-5.2"
  min_vllm_version: "0.22.1rc"
  architecture: moe
  parameter_count: "753B"
  active_parameters: null
  context_length: 131072
  modality: text

# Upstream-aligned weight variants (vllm-project/recipes schema). VRAM = minimum to load.
variants:
  default:
    model_id: "Eco-Tech/GLM-5.2-w8a8"
    precision: W8A8
    vram_minimum_gb: 904
    description: "W8A8 pre-quantized weights - 1x Atlas 800I A3 or 2x Atlas 800I A2"
  w4a8c8:
    model_id: "Eco-Tech/GLM-5.2-w4a8c8"
    precision: W4A8C8
    vram_minimum_gb: 452
    description: "W4A8C8 compressed weights - 1x Atlas 800I A3 or 2x Atlas 800I A2"
  bf16:
    model_id: "ZhipuAI/GLM-5.2"
    precision: BF16
    vram_minimum_gb: 1807
    description: "Full BF16 weights - 2x Atlas 800I A3 or 4x Atlas 800I A2"


guide: ""
performance_model_names:
  - "GLM-5.2"
overview: |-
  GLM-5.2 is a Mixture-of-Experts (MoE) model from Zhipu AI (THUDM) with 753B total parameters, targeting complex systems engineering and long-horizon agentic tasks.
weight_download:
- weight_version: BF16
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/ZhipuAI/GLM-5.2
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model ZhipuAI/GLM-5.2
      ```
  - source: HuggingFace
    url: https://huggingface.co/zai-org/GLM-5.2
    command: |-
      ```bash
      pip install -U huggingface_hub
      huggingface-cli download zai-org/GLM-5.2
      ```
- weight_version: W8A8 (Pre-quantized)
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Eco-Tech/GLM-5.2-w8a8
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model Eco-Tech/GLM-5.2-w8a8
      ```
- weight_version: W4A8C8 (Pre-quantized)
  sources:
  - source: ModelScope
