meta:
  title: "DeepSeek-V2-Lite W8A8 — Multi-Node PD Separation (demo)"
  slug: "deepseek-v2-lite-w8a8"
  provider: "DeepSeek"
  description: "DeepSeek-V2-Lite MoE (16B total / 2.4B active) served as a multi-node PD-separated deployment (1P1D) with W8A8 quantization and Mooncake KV transfer."
  date_added: "2026-08-07"
  date_updated: "2026-08-07"
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - "deepseek-ai/DeepSeek-V4-Flash"
  hardware:
    atlas_800_a2: verified

model:
  model_id: "vllm-ascend/DeepSeek-V2-Lite-W8A8"
  min_vllm_version: "v0.23.0rc1"
  architecture: moe
  parameter_count: "16B"
  active_parameters: "2.4B"
  context_length: 32768
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
    - "--quantization"
    - "ascend"
  base_env:
    HCCL_BUFFSIZE: "256"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0rc1"
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g -v /root/.cache/modelscope:/root/.cache/modelscope --device /dev/davinci0 --device /dev/davinci1 ... --device /dev/davinci7 -it quay.io/ascend/vllm-ascend:v0.23.0rc1 bash"
      note: "Official Ascend image; full device/driver mounts are covered in env_setup.container."

# —— Upstream alignment: features / variants / strategies / overrides / guide ——
features:
  expert_parallel:
    description: "MoE expert parallelism across the DP ranks"
    args: ["--enable-expert-parallel"]
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm communication optimization"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"

opt_in_features: []

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 20
    description: "W8A8 pre-quantized weights on Atlas 800 A2"

compatible_strategies:
  - pd_cluster

hardware_overrides: {}
strategy_overrides:
  # Declarative PD-cluster topology for the site's node selector; CI still runs `scenarios`.
  pd_cluster:
    prefill:
      nodes: { default: 1 }
    decode:
      nodes: { default: 1 }

dependencies:
  - note: "ModelScope is used to download the W8A8 weights"
    command: "pip install modelscope"

guide: ""

# —— Configurable value params (page/CI extension; defaults = tutorial baseline) ——
config_params:
  max_model_len:
    default: 4096
    type: number
    description: "Maximum context length (input + output tokens)"
  max_num_seqs:
    default: 8
    type: number
    description: "Maximum number of concurrent sequences"

overview: |-
  DeepSeek-V2-Lite is the 16B-total / 2.4B-active MoE sibling of DeepSeek-V2.
weight_download:
- weight_version: W8A8 (Pre-quantized)
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/vllm-ascend/DeepSeek-V2-Lite-W8A8
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model vllm-ascend/DeepSeek-V2-Lite-W8A8
      ```

prerequisites:
- title: Model Weight
  content: |-
    - W8A8 weights: `vllm-ascend/DeepSeek-V2-Lite-W8A8` (pre-quantized, hosted on [ModelScope](https://www.modelscope.cn/models/vllm-ascend/DeepSeek-V2-Lite-W8A8)).
    - Requires 2 Atlas 800I A2 (64G × 8) nodes; download the weights to the shared cache (`/root/.cache/`) on each node.
- title: Verify Multi-node Communication
  content: |-
    Verify multi-node communication first: [verify multi-node communication environment](../../installation.md#verify-multi-node-communication).

env_setup:
  container:
    A2:
      content: |-
        Select the A2 image and start the docker container on each node, refer to [using docker](../../installation.md#set-up-using-docker).

        This scenario uses **2 NPUs per node**; expose `davinci0`/`davinci1` (adjust if your cards use different indexes):

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1
        docker run --rm \
            --name vllm-ascend \
            --shm-size=64g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      If you don't want to use the docker image as above, install `vllm-ascend` from source on each node, refer to [installation](../../installation.md).

scenarios:
- npu: Atlas 800I A2
  precision: W8A8
  deployment: Multi-Node PD Separation
  case: 1P1D (1 Prefill node + 1 Decode node)
  tags: [pd-multinode]
  strategy: pd_cluster
  test_id: dsv2lite-pd-2n2c
  npu_per_node: 2
  aisbench: [accuracy, performance]
  scripts:
    prefill-0-template:
      language: bash
      content: |-
        # NIC: auto-injected by the deployment runtime (HCCL_SOCKET_IFNAME).
        # To pin a specific interface, set it in hosts.yaml or export it
        # before launch; GLOO/TP use the same NIC.
        export GLOO_SOCKET_IFNAME="${GLOO_SOCKET_IFNAME:-$HCCL_SOCKET_IFNAME}"
        export TP_SOCKET_IFNAME="${TP_SOCKET_IFNAME:-$HCCL_SOCKET_IFNAME}"
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=10
        export TASK_QUEUE_ENABLE=1
        export HCCL_BUFFSIZE=256
        # launch_online_dp.py passes logical device indexes; map them onto the
        # container's assigned physical devices (ASCEND_RT_VISIBLE_DEVICES).
        IFS=',' read -r -a selected_devices <<< "${ASCEND_RT_VISIBLE_DEVICES:-0,1}"
        export ASCEND_RT_VISIBLE_DEVICES="${selected_devices[$1]}"
        export VLLM_ASCEND_ENABLE_FLASHCOMM1=0

        vllm serve vllm-ascend/DeepSeek-V2-Lite-W8A8 \
            --host 0.0.0.0 \
            --port $2 \
            --served-model-name dsv2 \
            --data-parallel-size $3 \
            --data-parallel-rank $4 \
            --data-parallel-address $5 \
            --data-parallel-rpc-port $6 \
            --tensor-parallel-size $7 \
            --trust-remote-code \
            --enable-expert-parallel \
            --quantization ascend \
            --max-model-len {{max_model_len}} \
            --max-num-seqs {{max_num_seqs}} \
            --kv-transfer-config '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1}, "decode": {"dp_size": 2, "tp_size": 1}}}'
    decode-0-template:
      language: bash
      content: |-
        # NIC: auto-injected by the deployment runtime (HCCL_SOCKET_IFNAME).
        # To pin a specific interface, set it in hosts.yaml or export it
        # before launch; GLOO/TP use the same NIC.
        export GLOO_SOCKET_IFNAME="${GLOO_SOCKET_IFNAME:-$HCCL_SOCKET_IFNAME}"
        export TP_SOCKET_IFNAME="${TP_SOCKET_IFNAME:-$HCCL_SOCKET_IFNAME}"
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=10
        export TASK_QUEUE_ENABLE=1
        export HCCL_BUFFSIZE=256
        # launch_online_dp.py passes logical device indexes; map them onto the
        # container's assigned physical devices (ASCEND_RT_VISIBLE_DEVICES).
        IFS=',' read -r -a selected_devices <<< "${ASCEND_RT_VISIBLE_DEVICES:-0,1}"
        export ASCEND_RT_VISIBLE_DEVICES="${selected_devices[$1]}"
        export VLLM_ASCEND_ENABLE_FLASHCOMM1=0

        vllm serve vllm-ascend/DeepSeek-V2-Lite-W8A8 \
            --host 0.0.0.0 \
            --port $2 \
            --served-model-name dsv2 \
            --data-parallel-size $3 \
            --data-parallel-rank $4 \
            --data-parallel-address $5 \
            --data-parallel-rpc-port $6 \
            --tensor-parallel-size $7 \
            --trust-remote-code \
            --enable-expert-parallel \
            --quantization ascend \
            --max-model-len {{max_model_len}} \
            --max-num-seqs {{max_num_seqs}} \
            --kv-transfer-config '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1}, "decode": {"dp_size": 2, "tp_size": 1}}}'
    prefill-0-launch:
      language: bash
      content: |-
        python /vllm-workspace/vllm-ascend/examples/external_online_dp/launch_online_dp.py \
          --dp-size 2 --tp-size 1 --dp-size-local 2 --dp-rank-start 0 \
          --dp-address "$PREFILL_NODE_0_IP" --dp-rpc-port 12321 --vllm-start-port 7100
    decode-0-launch:
      language: bash
      content: |-
        python /vllm-workspace/vllm-ascend/examples/external_online_dp/launch_online_dp.py \
          --dp-size 2 --tp-size 1 --dp-size-local 2 --dp-rank-start 0 \
          --dp-address "$DECODE_NODE_0_IP" --dp-rpc-port 12321 --vllm-start-port 7100
    gateway-0:
      language: bash
      content: |-
        python /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py \
          --host "$GATEWAY_NODE_0_IP" \
          --port 38085 \
          --prefiller-hosts "$PREFILL_NODE_0_IP" "$PREFILL_NODE_0_IP" \
          --prefiller-ports 7100 7101 \
          --decoder-hosts "$DECODE_NODE_0_IP" "$DECODE_NODE_0_IP" \
          --decoder-ports 7100 7101
    service-check:
      language: bash
      content: |-
        response=$(curl --fail --silent --show-error \
          "http://${GATEWAY_NODE_0_IP}:38085/v1/completions" \
          -H 'Content-Type: application/json' \
          -d '{"model":"dsv2","prompt":"The future of AI is","max_tokens":50,"temperature":0}')

        python3 -c 'import json, sys; assert json.load(sys.stdin)["choices"]' <<<"$response"
  steps:
  - title: Topology and variables
    content: |-
      `1P1D` means one Prefill node and one Decode node. Each node runs two
      external-DP ranks on two NPUs (`DP=2`, `TP=1`). Set the node addresses
      and optionally override the selected devices:

      ```bash
      export PREFILL_NODE_0_IP="${PREFILL_NODE_0_IP:-<prefill_node_0_ip>}"
      export DECODE_NODE_0_IP="${DECODE_NODE_0_IP:-<decode_node_0_ip>}"
      export GATEWAY_NODE_0_IP="${GATEWAY_NODE_0_IP:-$PREFILL_NODE_0_IP}"
      export PREFILL_NODE_0_DEVICES="${PREFILL_NODE_0_DEVICES:-0,1}"
      export DECODE_NODE_0_DEVICES="${DECODE_NODE_0_DEVICES:-0,1}"
      ```

  - title: Prepare run_dp_template.sh – Prefill node
    content: |-
      {{script:prefill-0-template}}

  - title: Prepare run_dp_template.sh – Decode node
    content: |-
      {{script:decode-0-template}}

  - title: Start the service
    content: |-
      ```bash
      unset ftp_proxy
      unset https_proxy
      unset http_proxy
      ```

      {{script:prefill-0-launch}}

      {{script:decode-0-launch}}

      Start the gateway after both rank services are ready:

      {{script:gateway-0}}
  - title: Verify the service
    content: |-
      {{script:service-check}}

references:
- title: ModelScope Model Download
  url: https://www.modelscope.cn/models/vllm-ascend/DeepSeek-V2-Lite-W8A8
- title: PD Disaggregation Guide (Mooncake)
  url: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html
- title: vllm-ascend GitHub
  url: https://github.com/vllm-project/vllm-ascend
