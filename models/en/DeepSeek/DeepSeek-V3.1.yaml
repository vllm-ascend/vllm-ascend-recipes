meta:
  title: DeepSeek-V3.1
  slug: deepseek-v3-1
  provider: DeepSeek
  description: DeepSeek-V3.1 hybrid thinking/non-thinking MoE model with improved tool calling and thinking efficiency (legacy recipe, model discontinued since vLLM Ascend v0.30.0).
  date_added: "2026-10-13"
  date_updated: "2026-10-13"
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - deepseek-ai/DeepSeek-V3.2
  performance_headline: 685B/37B MoE — single-node W8A8 serving on Atlas 800 A3, multi-node DP on A2, and 2P1D PD disaggregation on A3 / Ascend 950DT
  hardware:
    atlas_800_a3: experimental
    atlas_800_a2: experimental
    ascend_950dt: experimental

model:
  model_id: "deepseek-ai/DeepSeek-V3.1"
  min_vllm_version: "v0.23.0rc1"
  architecture: moe
  parameter_count: "685B"
  active_parameters: "37B"
  context_length: 163840
  modality: text

features:
  tool_calling:
    description: DeepSeek-V3.1 native tool calling (post-training optimized)
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "deepseek_v3"]
  thinking_mode:
    label: Hybrid Thinking Mode
    description: One model supports both thinking and non-thinking mode via chat template
    args: ["--trust-remote-code"]
  expert_parallel:
    description: MoE expert parallelism
    args: ["--enable-expert-parallel"]
  mtp:
    label: MTP Speculative Decoding
    description: Multi-token prediction draft for faster decode
    args: ["--speculative-config", '{"num_speculative_tokens": 3, "method": "mtp"}']
  prefix_caching:
    label: Prefix Caching
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

variants:
  default:
    model_id: "Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot"
    precision: W8A8
    vram_minimum_gb: 822
    description: W8A8 quantized weights with MTP draft — single-node A3, multi-node DP A2, and 2P1D Layerwise PD on A3
    supported_hardware: ["atlas_800_a2", "atlas_800_a3"]
  w8a8c8-950dt:
    model_id: "Eco-Tech/DeepSeek-V3.1-w8a8c8-mxfp8"
    precision: W8A8C8
    vram_minimum_gb: 822
    description: W8A8C8 MXFP8 weights for Ascend 950DT PD disaggregation (8 nodes)
    supported_hardware: ["ascend_950dt"]

compatible_strategies:
  - single_node
  - single_node_a5
  - multi_node_dp
  - pd_cluster
  - pd_cluster_a5

dependencies:
  - name: mooncake-transfer-engine
    reason: KV transfer for PD disaggregation scenarios
    scenarios: ["pd"]

guide: ""

overview: |-
  DeepSeek-V3.1 is a hybrid model that supports both thinking mode and non-thinking mode. Compared to the previous version, this upgrade brings improvements in multiple aspects:

  - **Hybrid thinking mode**: One model supports both thinking mode and non-thinking mode by changing the chat template.
  - **Smarter tool calling**: Through post-training optimization, the model's performance in tool usage and agent tasks has significantly improved.
  - **Higher thinking efficiency**: DeepSeek-V3.1-Think achieves comparable answer quality to DeepSeek-R1-0528, while responding more quickly.

  > **Status note**: DeepSeek-V3.1 (and DeepSeek-V3) has been discontinued since vLLM Ascend v0.30.0 and will no longer receive support or fixes. This recipe is migrated from the v0.23.0 historical tutorial for users who still deploy the existing V3.1 weights. Commands are migrated verbatim from the v0.23.0 docs and have not been re-verified on the v0.30.0rc1 image yet (hardware status above is `experimental` until end-to-end verification). For new deployments, prefer the DeepSeek-V3.2 recipe.

