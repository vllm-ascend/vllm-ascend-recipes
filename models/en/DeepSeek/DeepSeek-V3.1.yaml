scenarios:
- npu: Atlas 800I A3
  precision: W8A8
  deployment: Single-Node
  case: High Throughput
  tags: [a3-single]
  strategy: single_node
  steps:
  - title: Start the server
    content: |-
      Single-node deployment completes both Prefill and Decode within the same node. The quantized model `DeepSeek-V3.1-w8a8-mtp-QuaRot` can be deployed on 1 Atlas 800 A3 (64GB × 16).

      ```shell
        #!/bin/sh
        # this obtained through ifconfig
        # nic_name is the network interface name corresponding to local_ip of the current node
        nic_name="xxxx"
        local_ip="xxxx"

        # [Optional] jemalloc
        # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
        # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

        # AIV
        export HCCL_OP_EXPANSION_MODE="AIV"

        export HCCL_IF_IP=$local_ip
        export GLOO_SOCKET_IFNAME=$nic_name
        export TP_SOCKET_IFNAME=$nic_name
        export HCCL_SOCKET_IFNAME=$nic_name
        export VLLM_ASCEND_BALANCE_SCHEDULING=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

        vllm serve /weights/DeepSeek-V3.1-w8a8-mtp-QuaRot \
        --host 0.0.0.0 \
        --port 8015 \
        --data-parallel-size 4 \
        --tensor-parallel-size 4 \
        --quantization ascend \
        --seed 1024 \
        --served-model-name deepseek_v3 \
        --enable-expert-parallel \
        --max-num-seqs 16 \
        --max-model-len 16384 \
        --max-num-batched-tokens 4096 \
        --trust-remote-code \
        --no-enable-prefix-caching \
        --gpu-memory-utilization 0.92 \
        --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}' \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      ```

      Key parameter descriptions:

      - Setting the environment variable `VLLM_ASCEND_BALANCE_SCHEDULING=1` enables balance scheduling. This may help increase output throughput and reduce TPOT in v1 scheduler. However, TTFT may degrade in some scenarios. Furthermore, enabling this feature is not recommended in scenarios where PD is separated.
      - For single-node deployment, we recommend using `dp4tp4` instead of `dp2tp8`.
      - `--max-model-len` specifies the maximum context length — the sum of input and output tokens for a single request. For performance testing with an input length of 3.5k and output length of 1.5k, a value of `16384` is sufficient; for precision testing, set it to at least `35000`.
      - `--no-enable-prefix-caching` indicates that prefix caching is disabled. To enable it, remove this option.
      - If you use the w4a8 weight, more memory will be allocated to kvcache, and you can try to increase system throughput to achieve greater throughput.

      If you encounter issues, please refer to the [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html) for troubleshooting.

  - title: Service Verification
    content: |-
      ```shell
      curl http://<node0_ip>:<port>/v1/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "deepseek_v3",
              "prompt": "The future of AI is",
              "max_completion_tokens": 50,
              "temperature": 0
          }'
      ```

- npu: Ascend 950DT
  precision: W4A4MLP+W8A8C8Attn
  deployment: Single-Node
  case: High Throughput
  tags: [a5-single]
  strategy: single_node_a5
  steps:
  - title: Start the server
    content: |-
      Ascend 950DT single-node deployment uses the mixed-precision weights (`w4a4_mlp-w8a8c8_attn`). The model is supported from **vllm-ascend v0.23.0rc1** on 950DT.

      ```shell
        export HCCL_BUFFSIZE=512
        export HCCL_CONNECT_TIMEOUT=600
        export HCCL_EXEC_TIMEOUT=600

        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=10
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export TASK_QUEUE_ENABLE=1

        export VLLM_ASCEND_ENABLE_MLAPO=1

        vllm serve /weight/dsk-v3.1-w4a4_mlp-w8a8c8_attn-0618-full \
        --host 0.0.0.0 \
        --port 8015 \
        --max_model_len 135168 \
        --max-num-batched-tokens 16384 \
        --served-model-name deepseek_v3 \
        --gpu-memory-utilization 0.9 \
        --data-parallel-size 1 \
        --tensor-parallel-size 8 \
        --enable-expert-parallel \
        --async-scheduling \
        --max-num-seqs 96 \
        --no-enable-prefix-caching \
        --trust-remote-code \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
        --speculative-config '{"num_speculative_tokens": 3,"method": "deepseek_mtp"}' \
        --quantization ascend \
        --additional_config '{"enable_cpu_binding": true, "multistream_overlap_shared_expert": true, "enable_balance_scheduling": true}' \
      ```

      Note: `VLLM_ASCEND_ENABLE_MLAPO=1` enables the MLAPO fusion operator for faster decode; `--additional_config` enables CPU binding, shared-expert multistream overlap, and balance scheduling.

  - title: Service Verification
    content: |-
      ```shell
      curl http://<node0_ip>:<port>/v1/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "deepseek_v3",
              "prompt": "The future of AI is",
              "max_completion_tokens": 50,
              "temperature": 0
          }'
      ```

- npu: Atlas 800I A2
  precision: W8A8
  deployment: Multi-Node Data Parallel
  case: 2-Node DP
  tags: [a2-dp]
  strategy: multi_node_dp
  steps:
  - title: Node 0
    content: |-
      `DeepSeek-V3.1-w8a8-mtp-QuaRot` requires at least 2 Atlas 800 A2 (64GB × 8) nodes. Run the following script on node 0.

      ```shell
        #!/bin/sh

        # this obtained through ifconfig
        # nic_name is the network interface name corresponding to local_ip of the current node
        nic_name="xxxx"
        local_ip="xxxx"

        # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
        node0_ip="xxxx"

        # [Optional] jemalloc
        # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
        # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

        export HCCL_IF_IP=$local_ip
        export GLOO_SOCKET_IFNAME=$nic_name
        export TP_SOCKET_IFNAME=$nic_name
        export HCCL_SOCKET_IFNAME=$nic_name
        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=1
        export HCCL_BUFFSIZE=200
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export VLLM_ASCEND_BALANCE_SCHEDULING=1
        export HCCL_INTRA_PCIE_ENABLE=1
        export HCCL_INTRA_ROCE_ENABLE=0

        vllm serve /weights/DeepSeek-V3.1-w8a8-mtp-QuaRot \
        --host 0.0.0.0 \
        --port 8004 \
        --data-parallel-size 4 \
        --data-parallel-size-local 2 \
        --data-parallel-address $node0_ip \
        --data-parallel-rpc-port 13389 \
        --tensor-parallel-size 4 \
        --quantization ascend \
        --seed 1024 \
        --served-model-name deepseek_v3 \
        --enable-expert-parallel \
        --max-num-seqs 16 \
        --max-model-len 16384 \
        --max-num-batched-tokens 4096 \
        --trust-remote-code \
        --no-enable-prefix-caching \
        --gpu-memory-utilization 0.92 \
        --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}' \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      ```

  - title: Node 1
    content: |-
      Run the following script on node 1.

      ```shell
        #!/bin/sh

        # this obtained through ifconfig
        # nic_name is the network interface name corresponding to local_ip of the current node
        nic_name="xxx"
        local_ip="xxx"

        # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
        node0_ip="xxxx"

        # [Optional] jemalloc
        # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
        # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

        export HCCL_IF_IP=$local_ip
        export GLOO_SOCKET_IFNAME=$nic_name
        export TP_SOCKET_IFNAME=$nic_name
        export HCCL_SOCKET_IFNAME=$nic_name
        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=1
        export HCCL_BUFFSIZE=200
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export VLLM_ASCEND_BALANCE_SCHEDULING=1
        export HCCL_INTRA_PCIE_ENABLE=1
        export HCCL_INTRA_ROCE_ENABLE=0

        vllm serve /weights/DeepSeek-V3.1-w8a8-mtp-QuaRot \
        --host 0.0.0.0 \
        --port 8004 \
        --headless \
        --data-parallel-size 4 \
        --data-parallel-size-local 2 \
        --data-parallel-start-rank 2 \
        --data-parallel-address $node0_ip \
        --data-parallel-rpc-port 13389 \
        --tensor-parallel-size 4 \
        --quantization ascend \
        --seed 1024 \
        --served-model-name deepseek_v3 \
        --enable-expert-parallel \
        --max-num-seqs 16 \
        --max-model-len 16384 \
        --max-num-batched-tokens 4096 \
        --trust-remote-code \
        --no-enable-prefix-caching \
        --gpu-memory-utilization 0.92 \
        --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}' \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      ```

      Key parameter descriptions:

      - `--data-parallel-size` specifies the total number of DP ranks across all nodes.
      - `--data-parallel-size-local` specifies the number of DP ranks on the current node.
      - `--data-parallel-start-rank` identifies the starting global DP rank of this node.
      - `--data-parallel-address` is the IP address of the DP master node (node 0).
      - `--data-parallel-rpc-port` is the RPC port for DP master communication.
      - `--headless` workers join node 0 without serving a separate HTTP endpoint.
      - `--enable-expert-parallel` distributes MoE experts across the EP group.

- npu: Atlas 800I A3
  precision: W8A8
  deployment: Multi-Node PD Separation
  case: PD Separation (2P1D Layerwise)
  tags: [pd-multinode]
  strategy: pd_cluster
  steps:
  - title: Overview
    content: |-
      We recommend using Mooncake for deployment: [Mooncake](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html).

      `DeepSeek-V3.1-w8a8-mtp-QuaRot 2P1D Layerwise` requires 4 Atlas 800 A3 (64GB × 16) nodes. We recommend deploying 2P1D (4 nodes) rather than 1P1D (2 nodes), because there is not enough NPU memory to serve high concurrency in the 1P1D case.

      To run the vllm-ascend Prefill-Decode Disaggregation service, deploy the `launch_online_dp.py` and `run_dp_template.sh` scripts on each node, and deploy the proxy script on the prefill master node to forward requests:

      - [launch_online_dp.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/external_online_dp/launch_online_dp.py)
      - [load_balance_proxy_server_example.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py)

      Parameter descriptions for `launch_online_dp.py`:

      | Parameter | Type | Required | Default | Description |
      | --------- | ---- | -------- | ------- | ----------- |
      | `--dp-size` | int | Yes | - | Data parallel size (total number of DP ranks across all nodes). |
      | `--tp-size` | int | No | 1 | Tensor parallel size within each DP rank. |
      | `--dp-size-local` | int | No | (same as `--dp-size`) | Number of DP ranks on the current node. If not set, defaults to `--dp-size`. |
      | `--dp-rank-start` | int | No | 0 | Starting rank offset for data parallel ranks on this node. |
      | `--dp-address` | str | Yes | - | IP address of the data parallel master node (node 0). |
      | `--dp-rpc-port` | str | No | 12345 | RPC port for data parallel master communication. |
      | `--vllm-start-port` | int | No | 9000 | Starting port for each vLLM engine instance on this node. Each DP rank's engine port = `vllm_start_port` + local rank index. |

  - title: Configure Prefill nodes
    content: |-
      On each prefill node, set the network interface and IP, then start the vLLM engine with the `kv_producer` role. Node 0 (Prefill) shown below; Node 1 (Prefill) is identical except for `local_ip`, `engine_id` (set to 1), and `kv_port` (set to 30100).

      ```shell
        # this obtained through ifconfig
           # nic_name is the network interface name corresponding to local_ip of the current node
           nic_name="xxx"
           local_ip="141.xx.xx.1"

           # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
           node0_ip="xxxx"

           # [Optional] jemalloc
           # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
           # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

           export HCCL_IF_IP=$local_ip
           export GLOO_SOCKET_IFNAME=$nic_name
           export TP_SOCKET_IFNAME=$nic_name
           export HCCL_SOCKET_IFNAME=$nic_name

           export VLLM_RPC_TIMEOUT=3600000
           export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=30000
           export HCCL_EXEC_TIMEOUT=204
           export HCCL_CONNECT_TIMEOUT=120

           export OMP_PROC_BIND=false
           export OMP_NUM_THREADS=10
           export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
           export HCCL_BUFFSIZE=256
           export TASK_QUEUE_ENABLE=1
           export HCCL_OP_EXPANSION_MODE="AIV"
           export VLLM_USE_V1=1
