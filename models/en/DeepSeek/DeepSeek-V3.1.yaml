      Key environment/config notes (from the tutorial):

      - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1`: enables the communication optimization function on the prefill nodes.
      - `VLLM_ASCEND_ENABLE_MLAPO=1`: enables the fusion operator, which can significantly improve performance but consumes more NPU memory. In the PD separation scenario, enable MLAPO only on decode nodes.
      - `recompute_scheduler_enable: true`: enables the recomputation scheduler. When the KV cache of the decode node is insufficient, requests will be sent to the prefill node to recompute the KV cache. Enable this configuration only on decode nodes.
      - `multistream_overlap_shared_expert: true`: when TP size is 1 or `enable_shared_expert_dp` is true, an additional stream is enabled to overlap the computation process of shared experts.
      - `lmhead_tensor_parallel_size: 16`: when the TP size of the decode node is 1, this parameter allows the TP size of the LMHead embedding layer to be greater than 1, reducing the computational load of each card on the LMHead embedding layer.

