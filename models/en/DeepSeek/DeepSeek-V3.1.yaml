faq: |-
  For common environment, installation, and general parameter issues, please refer to the [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html); this chapter only covers model-specific issues.

  - **Q: Is DeepSeek-V3.1 still supported?**

    A: DeepSeek-V3.1 (and DeepSeek-V3) has been discontinued since vLLM Ascend v0.30.0 and will no longer receive support or fixes. This recipe is migrated from the v0.23.0 historical tutorial for users who still deploy the existing V3.1 weights; the commands have not yet been re-verified on the v0.30.0rc1 image. For new deployments, prefer DeepSeek-V3.2.

