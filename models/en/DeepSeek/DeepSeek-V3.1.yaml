        - **Input/Output**: 3.5k/1.5k
        - **Performance**: TTFT = 6.16s, TPOT = 48.82ms, average performance of each card is 478 TPS (tokens per second).

        Using vLLM Benchmark, take `serve` as an example:

        ```shell
        vllm bench serve --model /weights/DeepSeek-V3.1-w8a8-mtp-QuaRot --dataset-name random --random-input 1024 --num-prompts 200 --request-rate 1 --save-result --result-dir ./
        ```

        There are three `vllm bench` subcommands: `latency` (single-batch latency), `serve` (online serving throughput), `throughput` (offline inference throughput). Refer to [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/) for more details.

        Using Language Model Evaluation Harness: not tested yet.

tuning: |-
  The following configurations are validated in specific test environments and are for reference only. The optimal configuration depends on factors such as maximum input/output length, prefix cache hit rate, precision requirements, and deployment machine ratios.

  Scenario overview (A3, `DeepSeek-V3.1-w4a8-perchannle`; 1 node = 1 Atlas 800 A3 server with 64GB × 16 NPUs):

  | Scenario | Deployment Mode | Total NPUs | Weight Version | Key Considerations |
