# DeepSeek-R1 recipe (en) — source of truth: vllm-ascend v0.23.0 tutorial docs/source/tutorials/models/DeepSeek-R1.md
# Section citations in comments refer to that tutorial. Version matrix: tutorial declares vLLM-Ascend
# v0.13.0 as the version it was validated on and the first supporting this model (§1); the tutorial
# image is templated as |vllm_ascend_version| (§4.1) — this recipe pins the repo-convention tag
# v0.23.0rc1 (the -a3 suffix selects the Atlas A3 image).
meta:
  title: "DeepSeek-R1"
  slug: "deepseek-r1"
  provider: "DeepSeek"
  description: "High-performance Mixture-of-Experts reasoning model from DeepSeek for complex logical reasoning, mathematical problem-solving, and code generation; this recipe deploys the fully quantized DeepSeek-R1-W8A8 build."
  date_added: "2026-11-25"
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - "deepseek-ai/DeepSeek-V4-Flash"
  performance_headline: "1x Atlas 800 A3 (64G x 16) dp4 tp4 W8A8 serving; AISBench aime2024 80.00 / GPQA 72.22 (tutorial §7, measured on vllm-ascend:0.13.0)"
  hardware:
    atlas_800_a3: verified   # tutorial §5.1/§7 publish official deployment & measured accuracy on A3 (repo convention per GLM-5/V4-Flash; first-party service verification + performance recorded 2026-11-25 on nightly, accuracy re-run blocked by an official-weights issue)
    atlas_800_a2: unsupported   # tutorial §3.1 mentions 2x A2 as an option, but this recipe ships no A2 scenario — keep the A2 nightly leg off

model:
  model_id: "vllm-ascend/DeepSeek-R1-W8A8"
  min_vllm_version: "v0.13.0"   # tutorial §1: validated and first-supported version
  architecture: moe
  parameter_count: "671B"        # source: HF model card (not stated in tutorial)
  active_parameters: "37B"       # source: HF model card
  context_length: 16384          # validated serving length in tutorial §5.1; raise to >=35000 for precision runs (§5.1)
  modality: text
  base_args:
    - "--quantization ascend"    # §5.1: required for W8A8 quantized weights
    - "--trust-remote-code"      # §5.1
    - "--enable-expert-parallel" # §5.1
  base_env:
    VLLM_ASCEND_BALANCE_SCHEDULING: "1"                # §5.1: balance scheduling; raises output throughput; may degrade TTFT; not recommended with PD separation
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True" # §5.1
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0rc1-a3"   # §4.1: -a3 suffix selects the Atlas A3 image
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0rc1"        # §4.1: A2 image has no suffix
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host -it quay.io/ascend/vllm-ascend:v0.23.0rc1-a3 bash"
      note: "Simplified form; run the full device-mount command in env_setup.container (tutorial §4.1) for real deployments."

features:
  expert_parallel:
    description: "MoE expert parallelism across NPUs (tutorial §5.1)"
    args: ["--enable-expert-parallel"]
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP speculative decoding shipped in the validated startup command (tutorial §5.1)"
    args: ["--speculative-config", '{"num_speculative_tokens":3,"method":"mtp"}']
  balance_scheduling:
    label: "Balance Scheduling"
    description: "Ascend balanced scheduling; raises output throughput and reduces TPOT, may degrade TTFT; not recommended with PD separation (tutorial §5.1)"
    env:
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"

variants:
  default:
    model_id: "vllm-ascend/DeepSeek-R1-W8A8"
    precision: W8A8
    vram_minimum_gb: 806   # estimator per docs/recipe-schema.md formula ceil(671 x 1 x 1.2) = 806 (671B INT8 ≈ 1 byte/param); not a tutorial number
    description: "Fully quantized W8A8 (INT8 weights and activations) on 1x Atlas 800 A3 or 2x Atlas 800 A2"
    supported_hardware: [atlas_800_a3, atlas_800_a2]

compatible_strategies:
  - single_node_A3
  - multi_node_dp

config_params:
  max_model_len:
    default: 16384
    type: number
    description: "Max input+output tokens; 16384 covers 3.5k/1.5k performance tests — use at least 35000 for precision runs (tutorial §5.1)"

guide: ""
performance_model_names:
  - "DeepSeek-R1-W8A8"

overview: |-
  DeepSeek-R1 is a high-performance Mixture-of-Experts reasoning model from DeepSeek that
  excels at complex logical reasoning, mathematics, and code generation. This recipe deploys
  the fully quantized `DeepSeek-R1-W8A8` build (INT8 weights and activations), which fits on
  a single Atlas 800 A3 (64G x 16) node or two Atlas 800 A2 (64G x 8) nodes. The validated
  single-node layout is dp4 tp4 — the tutorial recommends it over dp2 tp8 (§5.1) — with MTP
  speculative decoding enabled. Two-node data-parallel deployment follows the §5.2 per-node
  scripts (DP4 across 2 nodes, node 1 running headless). For PD-separated deployments the
  tutorial recommends DeepSeek-V3.1 instead (§5.3). Reference accuracy: AISBench aime2024
  80.00 and GPQA 72.22 on vllm-ascend:0.13.0 (§7).

weight_download:
  # Note (2026-11-25): this weights repo's README states it is intended for vLLM Ascend CI
  # testing; the tutorial §7 accuracy figures cite this build "for reference only". A first-party
  # accuracy re-run on the 2026-11-25 nightly image hit a quantization-format incompatibility
  # (weights load but inference output is garbled; the v0.23.0rc1 image serves correctly) —
  # details tracked in a follow-up upstream issue.
  - weight_version: W8A8
    sources:
      - source: ModelScope   # tutorial §3.1 download link
        url: "https://www.modelscope.cn/models/vllm-ascend/DeepSeek-R1-W8A8"
        # Example command, not verbatim from the tutorial; target dir is this recipe's choice.
        command: |
          pip install modelscope
          modelscope download --model vllm-ascend/DeepSeek-R1-W8A8

prerequisites:
- title: Model Weight
  content: |-
    - `DeepSeek-R1-W8A8` (quantized): requires 1 Atlas 800 A3 (64G x 16) node or 2 Atlas 800 A2
      (64G x 8) nodes. [Download model weight](https://www.modelscope.cn/models/vllm-ascend/DeepSeek-R1-W8A8).

    It is recommended to download the model weight to the shared directory of multiple nodes
    (tutorial §3.1).

- title: Supported Features
  content: |-
    See the [Supported Features List](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/supported_models.html)
    for the model support matrix, and the [Feature Guide](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/feature_guide/index.html)
    for feature configuration (tutorial §2). The §5.1 notes also mention that W4A8 weights
    allocate more memory to KV cache, allowing higher system throughput.
- title: Verify Multi-node Communication (Optional)
  content: |-
    If you want to deploy a multi-node environment, verify multi-node communication per
    [verify multi-node communication environment](https://docs.vllm.ai/projects/ascend/en/latest/installation.html#verify-multi-node-communication)
    (tutorial §3.2).

env_setup:
  container:
    A3:
      content: |-
        Select an image based on your machine type and start the docker image on your node, refer to [using docker](https://docs.vllm.ai/projects/ascend/en/latest/installation.html#set-up-using-docker).

        ```shell
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1-a3

        docker run --rm \
            --name vllm-ascend \
            --privileged=true \
            --shm-size=1g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci8 \
            --device /dev/davinci9 \
            --device /dev/davinci10 \
            --device /dev/davinci11 \
            --device /dev/davinci12 \
            --device /dev/davinci13 \
            --device /dev/davinci14 \
            --device /dev/davinci15 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        After a successful docker run, verify the running container with `docker ps` (tutorial §4.1).
    A2:
      content: |-
        The A2 image has no `-a3` suffix and exposes 8 devices:

        ```shell
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1

        docker run --rm \
            --name vllm-ascend \
            --privileged=true \
            --shm-size=1g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

scenarios:
  - npu: Atlas 800I A3   # hardware enum aligned with repo convention; tutorial wording: Atlas 800 A3
    precision: W8A8
    deployment: "Single-Node"
    case: "Baseline serving"
    tags: [a3-single]
    strategy: single_node_A3
    steps:
      - title: "Start the server"
        content: |-
          ```bash
          nic_name="xxxx"      # NIC matching local_ip, obtained via ifconfig
          local_ip="xxxx"      # this node's IP

          export HCCL_OP_EXPANSION_MODE="AIV"   # §5.1 (single-node env set)
          export HCCL_IF_IP=$local_ip
          export GLOO_SOCKET_IFNAME=$nic_name
          export TP_SOCKET_IFNAME=$nic_name
          export HCCL_SOCKET_IFNAME=$nic_name
          export VLLM_ASCEND_BALANCE_SCHEDULING=1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve vllm-ascend/DeepSeek-R1-W8A8 \
            --host 0.0.0.0 \
            --port 8000 \
            --data-parallel-size 4 \
            --tensor-parallel-size 4 \
            --quantization ascend \
            --seed 1024 \
            --served-model-name deepseek_r1 \
            --enable-expert-parallel \
            --max-num-seqs 16 \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens 4096 \
            --trust-remote-code \
            --gpu-memory-utilization 0.92 \
            --speculative-config '{"num_speculative_tokens":3,"method":"mtp"}' \
            --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
          ```

          All values are the validated baselines from tutorial §5.1. Single-node deploys
          `dp4 tp4` — the tutorial recommends it over `dp2 tp8`. `--max-model-len` 16384 is
          sufficient for 3.5k/1.5k performance tests; use at least 35000 for accuracy runs.
          The server registers the model as `deepseek_r1` via `--served-model-name`. Note: these
          baselines were validated on `vllm-ascend:v0.13.0` (tutorial §1); the recipe image follows the
          repo convention (v0.23.0rc1) — re-verify flags if the toolchain differs.
      - title: "Functional verification"
        content: |-
          ```bash
          curl http://<server_ip>:8000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                  "model": "deepseek_r1",
                  "messages": [{
                      "role": "user",
                      "content": [{"type": "text", "text": "The future of AI is"}]
                  }],
                  "max_tokens": 1024,
                  "temperature": 1.0,
                  "top_p": 0.95
              }'
          ```

          Expected: HTTP 200 OK with a `choices` field containing the generated text
          (`<think>...` reasoning prefix is normal for this model, tutorial §5.1).
      - title: "Quick benchmark"
        content: |-
          ```bash
          vllm bench serve --model deepseek_r1 --dataset-name random --random-input 200 --num-prompts 200 --request-rate 1 --save-result --result-dir ./
          ```

          See the Performance section below for details (tutorial §8).
  - npu: Atlas 800I A3
    precision: W8A8
    deployment: "Multi-Node"
    case: "Data Parallel on 2 nodes (dp4 tp4)"
    tags: [a3-multi]
    strategy: multi_node_dp
    steps:
      - title: "Topology"
        content: |-
          Two-node data-parallel deployment (tutorial §5.2): DP4 across both nodes, 2 local
          ranks each, tp4 per rank. Node 0 is the master (no `--headless`); node 1 runs
          `--headless` with `--data-parallel-start-rank 2`.

          Shared env set (both nodes): `HCCL_IF_IP`, `GLOO_SOCKET_IFNAME`, `TP_SOCKET_IFNAME`,
          `HCCL_SOCKET_IFNAME` (all derived from the node IP/NIC), `OMP_PROC_BIND=false`,
          `OMP_NUM_THREADS=1`, `HCCL_BUFFSIZE=200`, `PYTORCH_NPU_ALLOC_CONF=expandable_segments:True`,
          `VLLM_ASCEND_BALANCE_SCHEDULING=1`, `HCCL_INTRA_PCIE_ENABLE=1`,
          `HCCL_INTRA_ROCE_ENABLE=0`.

          Serve arguments are identical to the single-node baseline (§5.1: quantization ascend,
          seed 1024, served-model-name deepseek_r1, expert parallelism, max-num-seqs 16,
          max-model-len 16384, max-num-batched-tokens 4096, trust-remote-code,
          gpu-memory-utilization 0.92, MTP speculative config, FULL_DECODE_ONLY) plus the
          data-parallel flags: `--data-parallel-size 4`, `--data-parallel-size-local 2`,
          `--data-parallel-rpc-port 13389`, and per-node `--data-parallel-start-rank`
          (0 on node 0, 2 on node 1) with `--data-parallel-address` set to the node 0 IP.
      - title: "Full commands"
        content: |-
          The complete node 0 / node 1 startup scripts are published in tutorial §5.2
          ([DeepSeek-R1 tutorial](https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/DeepSeek-R1.html)) —
          copy them verbatim and set `local_ip`/`nic_name`/`node0_ip` per node. This recipe keeps
          the multi-node commands out of band so cluster CI does not execute a two-node serve as a
          single-node case.
      - title: "Functional verification"
        content: |-
          ```bash
          curl http://<server_ip>:8000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                  "model": "deepseek_r1",
                  "messages": [{
                      "role": "user",
                      "content": [{"type": "text", "text": "The future of AI is"}]
                  }],
                  "max_tokens": 1024,
                  "temperature": 1.0,
                  "top_p": 0.95
              }'
          ```

          Expected: HTTP 200 OK with a `choices` field containing the generated text.

verification: |-
  Once your server is started, you can query the model with input prompts:

  ```shell
  curl http://<server_ip>:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "deepseek_r1",
          "prompt": "The future of AI is",
          "max_completion_tokens": 50,
          "temperature": 0
      }'
  ```

  Expected Result:

  The service returns HTTP 200 OK with a JSON response containing the generated text
  (tutorial §6).

evaluation:
  accuracy:
    content: |-
      ### Using AISBench

      Refer to [Using AISBench](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html) for details.

      ### Using lm-eval

      Install lm-eval per [Using lm_eval](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_lm_eval.html), then run:

      ```shell
      lm_eval \
        --model local-completions \
        --model_args model=deepseek_r1,base_url=http://<server_ip>:<port>/v1/completions,tokenized_requests=False,trust_remote_code=True \
        --tasks gsm8k \
        --output_path ./
      ```

performance:
  accuracy: |-
      Reference results for `DeepSeek-R1-W8A8` on `vllm-ascend:0.13.0`, from tutorial §7:

      | dataset | version | metric | mode | vllm-api-general-chat |
      |----- | ----- | ----- | ----- | -----|
      | aime2024dataset | - | accuracy | gen | 80.00 |
      | gpqadataset | - | accuracy | gen | 72.22 |
  benchmark: |-
      Benchmark via `vllm bench serve` (tutorial §8). The harness provides three subcommands:
      `latency` (single batch), `serve` (online serving throughput), and `throughput` (offline
      inference). Serve example:

      ```shell
      vllm bench serve --model deepseek_r1 --dataset-name random --random-input 200 --num-prompts 200 --request-rate 1 --save-result --result-dir ./
      ```

      Refer to [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/) for more details,
      and to [Using AISBench for performance evaluation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation)
      for the AISBench flow.

tuning: |-
  For performance tuning and PD-separated deployments the tutorial recommends DeepSeek-V3.1:
  [DeepSeek-V3.1](https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/DeepSeek-V3.1.html)
  (tutorial §5.3/§9 — "tested and demonstrates excellent performance").

  General tuning reference (family convention, not from this tutorial): [Public Performance Tuning Documentation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)
  and the [Feature Guide](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html).

faq: |-
  For common environment, installation, and general parameter issues, refer to the
  [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html) (tutorial §10; the
  tutorial declares no model-specific FAQ entries).

  - **Q: Prefix caching — enabled or disabled?**

    A: The validated startup command in tutorial §5.1 sets no prefix-caching flag, so the
    feature stays at its default state. The §5.1 notes mention `--no-enable-prefix-caching`
    as the explicit way to disable it; if you have added that flag, remove it to turn the
    feature back on.

references:
  - title: "Official tutorial"
    url: "https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/DeepSeek-R1.html"
  - title: "Model weights (ModelScope)"
    url: "https://www.modelscope.cn/models/vllm-ascend/DeepSeek-R1-W8A8"
