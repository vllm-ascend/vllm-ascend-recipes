tuning: |-
  ### Tuning Guidelines

  Please refer to the [Public Performance Tuning Documentation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) for tuning methods.
  Please refer to the [Feature Matrix](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html) for detailed feature descriptions.

  ### Recommended Configurations

  > **Note**: The following configurations are validated in specific test environments and are for reference only. The optimal configuration depends on factors such as maximum input/output length, prefix cache hit rate, precision requirements, and deployment machine ratios. It is recommended to refer to Section 9.2 for tuning based on actual conditions.

  | Scenario | Deployment Mode | Total NPUs | Weight Version | Key Considerations |
  | -------- | --------------- | ---------- | -------------- | ------------------ |
  | Multimodal (1080P) | Single-Node Mixed | 16 (A3) | deepseekocr2 | dp1 tp1 for high-resolution visual inputs |
faq: |-
  For common environment, installation, and general parameter issues, please refer to the [Public FAQs](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html). This chapter only covers model-specific issues.

  - **Q: Startup fails with HCCL port conflicts (address already bound). What should I do?**

    A: Clean up old processes and restart: `pkill -f vLLM*`.

  - **Q: How to handle OOM or unstable startup?**

    A: Reduce `--max-num-seqs` and `--max-model-len` first. If needed, reduce concurrency and load-testing pressure (e.g. `max-concurrency` / `num-prompts`).
