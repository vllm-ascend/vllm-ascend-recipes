      curl -sS --fail-with-body http://<server_ip>:<port>/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3","messages":[{"role":"user","content":"What is the capital of France?"}],"temperature":0.6,"top_p":0.95,"top_k":20,"max_tokens":64,"chat_template_kwargs":{"enable_thinking":false}}'
      ```
- npu: Atlas 800I A3
  precision: W8A8
  checkpoint_model_id: vllm-ascend/Qwen3-32B-W8A8
  deployment: Single-Node
  case: Low Latency
  strategy: single_node_A3
  npu_per_node: 8
  steps:
  - title: Start the server
    content: |-
      Uses the original tutorial’s tuned A3 settings, with the removed weight-prefetch option omitted. Replace `your_eagle3_model_path` with the mounted path of a compatible Qwen3-32B Eagle3 draft checkpoint.

      The default service port is `8000`.

      ```bash
      export HCCL_OP_EXPANSION_MODE="AIV"
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve /weights/Qwen3-32B-W8A8 \
          --host 127.0.0.1 \
          --served-model-name qwen3 \
          --trust-remote-code \
          --distributed-executor-backend "mp" \
          --tensor-parallel-size 8 \
          --max-model-len 5500 \
          --max-num-batched-tokens 40960 \
          --no-enable-prefix-caching \
          --quantization ascend \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,32,64,72,76,80,96,100,120,140,144,160,192,216,240,252,288,320,336,360,384,400,408,416,420,432,480,540,576,600]}' \
          --speculative-config '{"method": "eagle3", "model":"your_eagle3_model_path", "enforce_eager": true, "num_speculative_tokens": 3}' \
          --port 8000 \
          --block-size 128 \
          --gpu-memory-utilization 0.9
      ```
  - title: Check readiness
    content: |-
      After startup, use `127.0.0.1` for `<server_ip>` and the selected port. The model list should include `qwen3`.

