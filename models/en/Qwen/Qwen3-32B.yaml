meta:
  title: Qwen3-32B
  slug: qwen3-32b
  provider: Qwen
  description: Single-node Ascend inference recipes for Qwen3-32B.
  date_added: '2026-11-19'
  difficulty: intermediate
  hardware:
    atlas_800_a2: experimental
    atlas_800_a3: experimental
    atlas_300i_duo: experimental
model:
  model_id: Qwen/Qwen3-32B
  architecture: dense
  parameter_count: 32B
  active_parameters: null
  context_length: 40960
  modality: text
  min_vllm_version: 0.21.0
  docker_image:
    atlas_800_a2: quay.io/ascend/vllm-ascend:nightly-main
    atlas_800_a3: quay.io/ascend/vllm-ascend:nightly-main-a3
    atlas_300i_duo: quay.io/ascend/vllm-ascend:nightly-main-310p
  nightly_required: false
compatible_strategies:
- single_node_A2
- single_node_A3
- single_node_310p
overview: Qwen3-32B is a dense model for text generation with a native context window of 40,960 tokens.
weight_download:
- weight_version: BF16
  sources:
  - source: HuggingFace
    url: https://huggingface.co/Qwen/Qwen3-32B
    command: |-
      ```bash
      hf download Qwen/Qwen3-32B --local-dir "$MODEL_DIR/Qwen3-32B"
      ```
  - source: ModelScope
    url: https://www.modelscope.cn/models/Qwen/Qwen3-32B
    command: |-
      ```bash
      modelscope download --model Qwen/Qwen3-32B --local_dir "$MODEL_DIR/Qwen3-32B"
      ```
- weight_version: W8A8
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/vllm-ascend/Qwen3-32B-W8A8
    command: |-
      ```bash
      modelscope download --model vllm-ascend/Qwen3-32B-W8A8 --local_dir "$MODEL_DIR/Qwen3-32B-W8A8"
      ```
- weight_version: W4A4
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/vllm-ascend/Qwen3-32B-W4A4
    command: |-
      ```bash
      modelscope download --model vllm-ascend/Qwen3-32B-W4A4 --local_dir "$MODEL_DIR/Qwen3-32B-W4A4"
      ```
- weight_version: W8A8SC-310
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Eco-Tech/Qwen3-32B-w8a8sc-310-vllm
    command: |-
      ```bash
      modelscope download --model Eco-Tech/Qwen3-32B-w8a8sc-310-vllm --local_dir "$MODEL_DIR/Qwen3-32B-w8a8sc-310-vllm"
      ```
prerequisites:
- title: Weights and devices
  content: Set `MODEL_DIR` to the host weight parent directory in the same shell before running the download command. The
    container mounts it at `/weights`. Install the CLI for the selected source and check available chips with `npu-smi info`.
    Docker defaults to the largest listed TP configuration. Set `NPU_COUNT` to the selected TP size to map only the chips
    you need.
env_setup:
  pip:
    content: See the [installation guide](https://docs.vllm.ai/projects/ascend/en/latest/installation.html) for source installation
      and driver compatibility. Replace `/weights` with the weight directory when running outside Docker.
      For a 310P source installation, uninstall `triton-ascend` and `triton` if they were installed as dependencies.
  container:
    A2:
      content: |-
        ```bash
        IMAGE=quay.io/ascend/vllm-ascend:nightly-main
        MODEL_DIR="${MODEL_DIR:?Set MODEL_DIR to the absolute parent directory of the downloaded weights}"
        NPU_COUNT="${NPU_COUNT:-4}"
        device_flags=(
          --device /dev/davinci0
          --device /dev/davinci1
          --device /dev/davinci2
          --device /dev/davinci3
        )
        devices=("${device_flags[@]:0:2*NPU_COUNT}")
        docker pull "$IMAGE"
        docker run --rm -it --name qwen3-${USER} --shm-size=10g --net=host \
          "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm \
          --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
          -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
          -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
          -v "$MODEL_DIR:/weights:ro" "$IMAGE" bash
        ```
    A3:
      content: |-
        ```bash
        IMAGE=quay.io/ascend/vllm-ascend:nightly-main-a3
        MODEL_DIR="${MODEL_DIR:?Set MODEL_DIR to the absolute parent directory of the downloaded weights}"
        NPU_COUNT="${NPU_COUNT:-8}"
        device_flags=(
          --device /dev/davinci0
          --device /dev/davinci1
          --device /dev/davinci2
          --device /dev/davinci3
          --device /dev/davinci4
          --device /dev/davinci5
          --device /dev/davinci6
          --device /dev/davinci7
        )
        devices=("${device_flags[@]:0:2*NPU_COUNT}")
        docker pull "$IMAGE"
        docker run --rm -it --name qwen3-${USER} --shm-size=10g --net=host \
          "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm \
          --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
          -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
          -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
          -v "$MODEL_DIR:/weights:ro" "$IMAGE" bash
        ```
    Atlas 300I DUO:
      content: |-
        ```bash
        IMAGE=quay.io/ascend/vllm-ascend:nightly-main-310p
        MODEL_DIR="${MODEL_DIR:?Set MODEL_DIR to the absolute parent directory of the downloaded weights}"
        NPU_COUNT="${NPU_COUNT:-4}"
        device_flags=(
          --device /dev/davinci0
          --device /dev/davinci1
          --device /dev/davinci2
          --device /dev/davinci3
        )
        devices=("${device_flags[@]:0:2*NPU_COUNT}")
        docker pull "$IMAGE"
        docker run --rm -it --name qwen3-${USER} --shm-size=10g --net=host \
          "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm \
          --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
          -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
          -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
          -v "$MODEL_DIR:/weights:ro" "$IMAGE" bash
        ```
scenarios:
- npu: Atlas 800I A2
  precision: BF16
  deployment: Single-Node
  case: TP2
  strategy: single_node_A2
  npu_per_node: 2
  steps:
  - title: Start the server
    content: |-
      Use the original BF16 weights. This adapts the official Qwen3 quick start with tensor parallelism sized for this checkpoint.

      The default service port is `8000`.

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1
      MODEL_PATH=Qwen/Qwen3-32B
      if [[ -r /weights/Qwen3-32B/config.json ]]; then MODEL_PATH=/weights/Qwen3-32B; fi
      vllm serve "$MODEL_PATH" --served-model-name qwen3 --dtype bfloat16 --host 127.0.0.1 --port 8000 --tensor-parallel-size 2 --distributed-executor-backend mp
      ```
  - title: Check readiness
    content: |-
      After startup, use `127.0.0.1` for `<server_ip>` and the selected port. The model list should include `qwen3`.

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/health
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/models
      ```
  - title: Send an inference request
    content: |-
      Expect HTTP 200 and nonempty `choices[0].message.content`.

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3","messages":[{"role":"user","content":"What is the capital of France?"}],"temperature":0.6,"top_p":0.95,"top_k":20,"max_tokens":64,"chat_template_kwargs":{"enable_thinking":false}}'
      ```
