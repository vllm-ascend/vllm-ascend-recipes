- npu: Atlas 800I A3
  precision: W8A8
  checkpoint_model_id: vllm-ascend/Qwen3-32B-W8A8
  deployment: Single-Node
  case: Long Context
  strategy: single_node_A3
  npu_per_node: 4
  steps:
  - title: Start the server
    content: |-
      Uses the original tutorial’s tuned A3 settings, with the removed weight-prefetch option omitted. Replace `your_eagle3_model_path` with the mounted path of a compatible Qwen3-32B Eagle3 draft checkpoint.

      The default service port is `8000`.

      ```bash
      export HCCL_OP_EXPANSION_MODE="AIV"
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve /weights/Qwen3-32B-W8A8 \
          --host 127.0.0.1 \
          --port 8000 \
          --served-model-name qwen3 \
          --trust-remote-code \
          --seed 1024 \
          --max-model-len 135000 \
          --max-num-batched-tokens 40960 \
          --tensor-parallel-size 4 \
          --distributed-executor-backend "mp" \
          --no-enable-prefix-caching \
          --speculative-config '{"method": "eagle3", "model":"your_eagle3_model_path", "num_speculative_tokens": 3}' \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
          --hf-overrides '{"rope_parameters": {"rope_type":"yarn","rope_theta":1000000,"factor":4,"original_max_position_embeddings":131072}}' \
          --gpu-memory-utilization 0.9 \
          --quantization ascend
      ```
  - title: Check readiness
    content: |-
      After startup, use `127.0.0.1` for `<server_ip>` and the selected port. The model list should include `qwen3`.

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/health
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/models
      ```
  - title: Send an inference request
