      ```
evaluation:
  accuracy:
    content: |-
      Configure `vllm_api_general_chat.py` using the [AISBench guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html). Set the local model path, service port and model alias `qwen3`. The tutorial uses batch size 32, maximum output 32768, temperature 0.6, top_k 20, top_p 0.95, and extract_non_reasoning_content. Keep the output limit within the server's context budget.

      ```bash
      ais_bench --models vllm_api_general_chat --datasets aime2025_gen_0_shot_chat_prompt --debug
      ```
  performance:
    content: |-
      Point the AISBench streaming config `vllm_api_stream_chat.py` at the same service. The tutorial uses batch size 90, maximum output 1500, temperature 0 and ignore_eos=True. Record request and output-token throughput, mean and P99 TTFT/TPOT. Match checkpoint, hardware, input/output lengths and concurrency before comparing runs.

      ```bash
      ais_bench --models vllm_api_stream_chat --datasets gsm8k_gen_0_shot_cot_str_perf --debug --summarizer default_perf --mode perf --num-prompts 360
      ```

      ```bash
      vllm bench serve --model "$WEIGHT_PATH" --served-model-name qwen3 --port "$PORT" --dataset-name random --random-input-len 200 --num-prompts 200 --request-rate 1 --save-result --result-dir .
      ```
