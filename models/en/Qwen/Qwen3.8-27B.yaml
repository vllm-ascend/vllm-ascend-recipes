meta:
  title: "Qwen3.8-27B"
  slug: "qwen3-8-27b"
  provider: "Qwen"
  description: "27B dense Qwen3.8 text serving on Ascend. Verified Atlas A3 W8A8 TP=2 with vLLM Ascend 0.23.0 (eager)."
  date_added: "2026-10-29"
  date_updated: "2026-10-29"
  difficulty: intermediate
  tasks:
    - text-generation
  performance_headline: "Atlas A3 W8A8 TP=2 smoke with vLLM Ascend 0.23.0 (enforce-eager)"
  related_recipes: []
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Eco-Tech/Qwen3.8-27B-w8a8"
  min_vllm_version: "0.23.0"
  architecture: dense
  parameter_count: "27B"
  active_parameters: null
  context_length: 262144
  modality: text
  base_args:
    - "--served-model-name"
    - "qwen3.8"
    - "--data-parallel-size"
    - "1"
    - "--tensor-parallel-size"
    - "2"
    - "--quantization"
    - "ascend"
    - "--max-num-seqs"
    - "4"
    - "--max-model-len"
    - "8192"
    - "--max-num-batched-tokens"
    - "2048"
    - "--trust-remote-code"
    - "--gpu-memory-utilization"
    - "0.65"
    - "--enforce-eager"
  base_env:
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
    VLLM_USE_MODELSCOPE: "1"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:qwen3.8-a3"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:qwen3.8-a2"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0-310p"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:qwen3.8-a3 bash"
      note: "Official Qwen3.8 A3 image; full device/driver mounts are in env_setup.container."

features: {}

opt_in_features: []

variants:
  ascend_w8a8:
    precision: int8
    vram_minimum_gb: 64
    description: "ModelSlim W8A8 (Eco-Tech). Requires --quantization ascend. Verified on Atlas A3 with TP=2."

compatible_strategies:
  - single_node_A3
  - single_node_A2

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: ""

config_params:
  max_model_len:
    default: 8192
    type: number
    description: "Smoke uses 8192. Tutorial A3 example uses up to 131072 when HBM allows."
  gpu_memory_utilization:
    default: 0.65
    type: number
    description: "Lower on shared 2-die containers if residual HBM or zombie workers remain; tutorial default is 0.85."

overview: |-
  Qwen3.8-27B is the 27B dense member of Qwen3.8 with hybrid attention (16/64 full attention layers) and a native MTP head. This Ascend recipe covers W8A8 text serving on Atlas A3 / A2 with vLLM Ascend 0.23.0. Verified end-to-end on Atlas A3 (Ascend910 ×2) with `Eco-Tech/Qwen3.8-27B-w8a8`, TP=2, `--quantization ascend`, and `--enforce-eager` (aclgraph FULL_DECODE_ONLY hit gemma-rms issues on this stack).

weight_download:
  - weight_version: W8A8
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Eco-Tech/Qwen3.8-27B-w8a8
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Eco-Tech/Qwen3.8-27B-w8a8
          ```
      - source: HuggingFace
        url: ""
        command: ""
      - source: Modelers
        url: ""
        command: ""
      - source: GitCode
        url: ""
        command: ""

prerequisites:
  - title: Model Weight
    content: |-
      | Weight Version | Hardware Requirements | Download Links |
      |----------------|------------------------|----------------|
      | W8A8 | Atlas 800 A3 (64GB×16) or Atlas 800 A2 (64GB×8); lab smoke uses 2 Ascend910 dies with TP=2 | [ModelScope](https://www.modelscope.cn/models/Eco-Tech/Qwen3.8-27B-w8a8) |
      | BF16 | Larger HBM footprint; see tutorial | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3.8-27B) |

      > **Path description**: Record the local path and pass the same directory to `vllm serve`, or pass the ModelScope id with `VLLM_USE_MODELSCOPE=1`.

env_setup:
  container:
    A3:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:qwen3.8-a3
        export NAME=vllm-ascend

        docker run --rm \
            --name $NAME \
            --net=host \
            --shm-size=1g \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        > Prefer the A3 variant wheel (`…-aarch64-a3.whl`, rename for plain pip) or the `qwen3.8-a3` image. On 0.23.0, keep `--enforce-eager` if aclgraph fails.
    A2:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:qwen3.8-a2
        # Same device mounts as tutorial A2 section; use A2 variant wheel if installing via pip.
        ```
  pip:
    content: |-
      Install matching Ascend torch / torch_npu 2.10 and `vllm==0.23.0`, then the A3/A2 variant `vllm-ascend==0.23.0` wheel from Huawei WheelNext (`…-a3.whl` / `…-910b.whl`). Rename the variant suffix before `pip install` if using plain pip.

scenarios:
  - npu: Atlas A3
    title: W8A8 TP=2 online serve
    content: |-
      ```bash
      export MODEL_PATH=Eco-Tech/Qwen3.8-27B-w8a8
      export VLLM_USE_MODELSCOPE=True
      export HCCL_BUFFSIZE=512
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 1 \
          --tensor-parallel-size 2 \
          --quantization ascend \
          --served-model-name qwen3.8 \
          --max-num-seqs 4 \
          --max-model-len 8192 \
          --max-num-batched-tokens 2048 \
          --trust-remote-code \
          --gpu-memory-utilization 0.65 \
          --enforce-eager
      ```

      Tutorial full-length A3 command may raise `--max-model-len`, `--max-num-seqs`, enable prefix caching / MTP speculative decoding, and use `--compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'` when graph mode is healthy.

  - npu: Atlas A3
    title: Smoke chat
    content: |-
      ```bash
      curl http://127.0.0.1:8000/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{
          "model": "qwen3.8",
          "messages": [{"role":"user","content":"Say hello in one short sentence."}],
          "max_tokens": 64,
          "temperature": 0
        }'
      ```

accuracy_and_performance: |-
  Functional smoke on Atlas A3 (Ascend910 ×2 dies, W8A8 TP=2, vLLM / vLLM Ascend 0.23.0, `--enforce-eager`, `--quantization ascend`, `max_model_len=8192`, `gpu_memory_utilization=0.65`). `/v1/models` returned HTTP 200 with served id `qwen3.8`. Chat completion (`temperature=0`, `max_tokens=64`) returned HTTP 200 in ~45 s cold-path latency (thinking model; final answer “Hello!”). Weights ~14.1 GiB/die; free HBM ~61 GiB/die at startup.

faq:
  - q: Why `--enforce-eager`?
    a: On the verified 0.23.0 A3 stack, aclgraph FULL_DECODE_ONLY failed (rms / graph capture). Eager is the reliable smoke path; retry graph mode after upgrading the image/wheel.
  - q: Why lower `--gpu-memory-utilization`?
    a: Shared 2-die containers often retain residual HBM. Kill leftover `VLLMWorker_TP` processes before raising utilization toward the tutorial 0.85 default.
  - q: A2 wheel on A3?
    a: `vllm_ascend._build_info.__device_type__` must be `A3`. Install the `…-a3.whl` variant (rename for plain pip).
  - q: Worker fails with `libtbe_adapter.so: undefined symbol: Mki::Dl(std::__cxx11::string)`?
    a: Another `libmki.so` (for example under `nnal/asdsip`) is earlier on `LD_LIBRARY_PATH` than ATB `cxx_abi_1`. Keep `/usr/local/Ascend/nnal/atb/.../cxx_abi_1/lib` ahead of asdsip, or omit asdsip from the path when only ATB is needed.

