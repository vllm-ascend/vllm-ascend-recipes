meta:
  title: "Qwen3-VL-235B-A22B-Instruct"
  slug: "qwen3-vl-235b-a22b-instruct"
  provider: "Qwen"
  description: "Qwen3-VL flagship MoE vision-language model with 235B total and 22B active parameters, serving images and text with W8A8 weights on Atlas 800 A3, Atlas 800 A2 multi-node MP, and Ascend 950DT."
  date_added: 2026-11-10
  difficulty: advanced
  tasks: [multimodal, text]
  performance_headline: "W8A8 on one Atlas 800 A3 node (DP4 + TP4 + EP), one Ascend 950DT node (TP8), or two Atlas 800 A2 nodes with multi-node MP"
  related_recipes:
    - "Qwen/Qwen3-VL-30B-A3B-Instruct"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    ascend_950dt: experimental

model:
  model_id: "Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot"
  min_vllm_version: "0.12.0"
  architecture: moe
  parameter_count: "235B"
  active_parameters: "22B"
  context_length: 262144
  modality: multimodal
  base_args:
    - "--quantization"
    - "ascend"
    - "--served-model-name"
    - "qwen3-vl-235b"
    - "--seed"
    - "1024"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0.post1-a3"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0.post1"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.23.0.post1-a5"
  nightly_required: false
  # The model is discontinued in vLLM-Ascend v0.30.0. Every command in this
  # recipe comes from the v0.23.0.post1 tutorial tag; the tutorial on main is a
  # 329-byte deprecation stub. Keep the v0.23.0.post1 image tags until the recipe is
  # retired.
  install:
    pip: false

features:
  expert_parallel:
    label: "Expert Parallelism"
    description: "Distributes MoE experts across NPU ranks; enabled in every tutorial baseline."
    args: ["--enable-expert-parallel"]
  flashcomm1:
    label: "FlashComm1"
    description: "Ascend communication optimization enabled by the tutorial baselines for large TP and high concurrency."
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  fused_mc2:
    label: "Fused MC2"
    description: "MoE fused operators used by the Atlas 800 A3 single-node baseline."
    env:
      VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  prefix_caching:
    label: "Prefix Caching"
    description: "Disabled in every tutorial baseline; enable only for repeated-prefix workloads."
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  compilation_config:
    label: "Compilation Config"
    description: "Full decode ACLGraph replay used by the tutorial baselines."
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']

opt_in_features: [prefix_caching]

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 282
    description: "W8A8 QuaRot checkpoint for the single-node Atlas 800 A3 and two-node MP scenarios."
  bf16:
    model_id: "Qwen/Qwen3-VL-235B-A22B-Instruct"
    precision: BF16
    vram_minimum_gb: 564
    description: "Original BF16 checkpoint; the tutorial lists one Atlas 800 A3 node or two Atlas 800 A2 nodes but publishes no BF16 serve command."
  mxfp8:
    model_id: "Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8"
    precision: W8A8
    vram_minimum_gb: 282
    description: "W8A8 MXFP8 checkpoint for one Ascend 950DT node with tensor parallelism 8."
    supported_hardware: [ascend_950dt]

compatible_strategies: [single_node_A3, single_node_A5, multi_node_dp]
hardware_overrides: {}
strategy_overrides: {}
guide: ""

config_params:
  max_model_len:
    default: 32768
    type: number
    description: "Maximum input plus output length of a single request."
  max_num_seqs:
    default: 32
    type: number
    description: "Maximum active requests scheduled per DP group."
  max_num_batched_tokens:
    default: 16384
    type: number
    description: "Maximum tokens processed in one scheduler step."
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "Fraction of NPU memory available for model execution and KV cache."

overview: |-
  Qwen3-VL-235B-A22B-Instruct is a sparse MoE vision-language model in the Qwen3-VL family with 235B total and 22B active parameters. It serves multimodal chat, image understanding, multi-image reasoning, OCR-like visual question answering, and long-context generation, and the 262K context can be used for long documents and video.

  **Deprecated.** vLLM-Ascend discontinued this model tutorial in v0.30.0. The deployment commands below are reproduced from the v0.23.0.post1 tutorial and target that historical version (v0.23.0.post1 images); the tutorial on `main` is a deprecation stub. Treat the recipe as a reference for reproducing the v0.23.0.post1 validation, not as a supported configuration on current releases.

  The tutorial's validated deployments are one Atlas 800 A3 node (16x 64G NPUs) with W8A8 weights in DP4 + TP4 + expert parallel, one Ascend 950DT node (8x 96G NPUs) with W8A8 MXFP8 weights in TP8 + expert parallel, and a two-node multi-node dataparallel deployment with tensor parallelism inside each node. The BF16 checkpoint needs one Atlas 800 A3 node or two Atlas 800 A2 nodes, but the tutorial only gives serve commands for the quantized weights.

weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Qwen/Qwen3-VL-235B-A22B-Instruct
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3-VL-235B-A22B-Instruct
          ```
  - weight_version: W8A8 QuaRot
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
          ```
  - weight_version: W8A8 MXFP8 (Ascend 950DT)
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8
          ```

prerequisites:
  - title: Model weight
    content: |-
      The BF16 checkpoint needs 1 Atlas 800 A3 (64G x 16) node or 2 Atlas 800 A2 (64G x 8) nodes. The W8A8 QuaRot checkpoint used by the single-node and MP validation needs 1 Atlas 800 A3 (64G x 16) node. The W8A8 MXFP8 checkpoint needs 1 Ascend 950DT (96G x 8) node. Download the weights to a directory shared across nodes when you deploy multiple nodes.
  - title: Multi-node communication
    content: |-
      Only the two-node MP scenario needs this. Verify the communication environment first, following the multi-node communication check in the vLLM-Ascend installation guide. Network interface names, IP addresses, DP ranks, and the DP RPC port must be consistent across nodes.

env_setup:
  container:
    A3:
      content: |-
        Start this image on each node when you deploy Atlas 800 A3. Replace the version placeholder in the tutorial with the v0.23.0.post1 A3 image.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
        docker run --rm \
            --name vllm-ascend \
            --shm-size=512g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci8 \
            --device /dev/davinci9 \
            --device /dev/davinci10 \
            --device /dev/davinci11 \
            --device /dev/davinci12 \
            --device /dev/davinci13 \
            --device /dev/davinci14 \
            --device /dev/davinci15 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
    A2:
      content: |-
        Start this image on each node when you deploy two Atlas 800 A2 nodes.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1
        docker run --rm \
            --name vllm-ascend \
            --shm-size=512g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
    Ascend 950DT:
      content: |-
        Start this image on each node when you deploy Ascend 950DT.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a5
        export NAME=vllm-ascend

        docker run --rm \
          --name $NAME \
          --net=host \
          --shm-size=1g \
          --device /dev/davinci0 \
          --device /dev/davinci1 \
          --device /dev/davinci2 \
          --device /dev/davinci3 \
          --device /dev/davinci4 \
          --device /dev/davinci5 \
          --device /dev/davinci6 \
          --device /dev/davinci7 \
          --device /dev/davinci_manager \
          --device /dev/hisi_hdc \
          --device /dev/ummu \
          --device /dev/uburma \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /etc/hccl_rootinfo.json:/etc/hccl_rootinfo.json \
          -v /etc/hixlep/:/etc/hixlep/ \
          -v /root/.cache:/root/.cache \
          -v /usr/local/sbin:/usr/local/sbin \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi \
          -v /usr/lib64:/usr/lib64 \
          -itd $IMAGE bash
        ```

scenarios:
  - npu: Ascend 950DT
    precision: W8A8
    deployment: Single-Node
    case: Image-Only Online Serving (950DT)
    tags: [a5-single]
    strategy: single_node_A5
    steps:
      - title: Start the server
        content: |-
          This scenario runs the W8A8 MXFP8 checkpoint on one Ascend 950DT node (8x 96G NPUs) with tensor parallelism 8, expert parallelism, and image-only multimodal limits.

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export HCCL_OP_EXPANSION_MODE="AIV"
          export HCCL_BUFFSIZE=400
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=100
          export TASK_QUEUE_ENABLE=1
          export VLLM_ASCEND_ENABLE_FLASHCOMM1=1

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8 \
            --host 0.0.0.0 \
            --port 8000 \
            --distributed-executor-backend mp \
            --data-parallel-size 1 \
            --tensor-parallel-size 8 \
            --enable-expert-parallel \
            --seed 1024 \
            --quantization ascend \
            --served-model-name qwen3-vl-235b \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens 8192 \
            --trust-remote-code \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          ```
      - title: Verify inference
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                  "model": "qwen3-vl-235b",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Who are you?"
                      }
                  ],
                  "max_tokens": 256,
                  "temperature": 0
              }'
          ```

          The service returns HTTP 200 OK with a JSON response containing the `choices` field.
      - title: Verify image understanding
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3-vl-235b",
              "messages": [
                {"role": "system", "content": "You are a helpful assistant."},
                {"role": "user", "content": [
                  {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
                  {"type": "text", "text": "What is the text in the illustration?"}
                ]}
              ],
              "max_completion_tokens": 100,
              "temperature": 0
            }'
          ```

          The HTTP status is 200 and the JSON response contains a `choices` field with generated text, for example text similar to `TONGYI Qwen`.
  - npu: Atlas 800 A3
    precision: W8A8
    deployment: Single-Node
    case: Image-Only Online Serving (A3)
    tags: [a3-single]
    strategy: single_node_A3
    steps:
      - title: Start the server
        content: |-
          This scenario runs the W8A8 QuaRot checkpoint on one Atlas 800 A3 node (16x 64G NPUs). Data parallelism 4 and tensor parallelism 4 map the 16 NPUs into four DP groups with TP4, and expert parallelism is enabled on the MoE layers. Do not mix MoE tensor parallelism and expert parallelism in the same MoE layer. The tutorial notes that this W8A8 example suits functional validation and image-only online serving.

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export HCCL_OP_EXPANSION_MODE="AIV"
          export HCCL_BUFFSIZE=1536
          export OMP_NUM_THREADS=1
          export OMP_PROC_BIND=false
          export TASK_QUEUE_ENABLE=1
          export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
          export VLLM_ASCEND_ENABLE_FUSED_MC2=1
          export VLLM_ASCEND_BALANCE_SCHEDULING=1

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port 8000 \
            --served-model-name qwen3-vl-235b \
            --quantization ascend \
            --data-parallel-size 4 \
            --tensor-parallel-size 4 \
            --enable-expert-parallel \
            --seed 1024 \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens {{max_num_batched_tokens}} \
            --trust-remote-code \
            --gpu-memory-utilization 0.92 \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}'
          ```
      - title: Verify inference
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                  "model": "qwen3-vl-235b",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Who are you?"
                      }
                  ],
                  "max_tokens": 256,
                  "temperature": 0
              }'
          ```

          The service returns HTTP 200 OK with a JSON response containing the `choices` field.
      - title: Verify image understanding
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3-vl-235b",
              "messages": [
                {"role": "system", "content": "You are a helpful assistant."},
                {"role": "user", "content": [
                  {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
                  {"type": "text", "text": "What is the text in the illustration?"}
                ]}
              ],
              "max_completion_tokens": 100,
              "temperature": 0
            }'
          ```

          The HTTP status is 200 and the JSON response contains a `choices` field with generated text.
  - npu: Atlas 800 A2
    precision: W8A8
    deployment: Multi-Node
    case: 2-Node MP with DP2 TP8
    tags: [a2-multi]
    strategy: multi_node_dp
    steps:
      - title: Collect network values
        content: |-
          The tutorial assumes two Atlas 800 A2 (64G x 8) nodes and deploys the W8A8 QuaRot checkpoint across them with data parallelism across nodes and tensor parallelism inside each node. Get the interface name and IP addresses with `ifconfig` and substitute them in both node scripts: `nic_name` is the network interface that carries `local_ip`, and `node0_ip` must equal node 0's `local_ip`. The tutorial leaves these values as placeholders, so no address is fixed by this recipe.
      - title: Start node 0
        content: |-
          ```bash
          #!/bin/sh

          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          # Get these values through ifconfig.
          # nic_name is the network interface name corresponding to local_ip.
          nic_name="<nic_name>"
          local_ip="<local_ip>"

          export HCCL_IF_IP=$local_ip
          export GLOO_SOCKET_IFNAME=$nic_name
          export TP_SOCKET_IFNAME=$nic_name
          export HCCL_SOCKET_IFNAME=$nic_name
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export HCCL_BUFFSIZE=1024
          export TASK_QUEUE_ENABLE=1
          export HCCL_OP_EXPANSION_MODE="AIV"

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port 8000 \
            --quantization ascend \
            --data-parallel-size 2 \
            --api-server-count 2 \
            --data-parallel-size-local 1 \
            --data-parallel-address $local_ip \
            --data-parallel-rpc-port 13389 \
            --seed 1024 \
            --served-model-name qwen3-vl-235b \
            --tensor-parallel-size 8 \
            --enable-expert-parallel \
            --max-num-seqs 16 \
            --max-model-len 262144 \
            --max-num-batched-tokens 4096 \
            --trust-remote-code \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
          ```
      - title: Start node 1
        content: |-
          ```bash
          #!/bin/sh

          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          # Get these values through ifconfig.
          # nic_name is the network interface name corresponding to local_ip.
          nic_name="<nic_name>"
          local_ip="<local_ip>"

          # The value of node0_ip must be consistent with local_ip on node 0.
          node0_ip="<node0_ip>"

          export HCCL_IF_IP=$local_ip
          export GLOO_SOCKET_IFNAME=$nic_name
          export TP_SOCKET_IFNAME=$nic_name
          export HCCL_SOCKET_IFNAME=$nic_name
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export HCCL_BUFFSIZE=1024
          export TASK_QUEUE_ENABLE=1
          export HCCL_OP_EXPANSION_MODE="AIV"

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port 8000 \
            --quantization ascend \
            --headless \
            --data-parallel-size 2 \
            --data-parallel-size-local 1 \
            --data-parallel-start-rank 1 \
            --data-parallel-address $node0_ip \
            --data-parallel-rpc-port 13389 \
            --seed 1024 \
            --tensor-parallel-size 8 \
            --served-model-name qwen3-vl-235b \
            --max-num-seqs 16 \
            --max-model-len 262144 \
            --max-num-batched-tokens 4096 \
            --enable-expert-parallel \
            --trust-remote-code \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
          ```
      - title: Verify the service
        content: |-
          When the service starts successfully, node 0 prints two `Application startup complete.` messages because `--api-server-count 2` starts two API server processes. Send the request to node 0:

          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3-vl-235b",
              "messages": [
                {"role": "system", "content": "You are a helpful assistant."},
                {"role": "user", "content": [
                  {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
                  {"type": "text", "text": "What is the text in the illustration?"}
                ]}
              ],
              "max_completion_tokens": 100,
              "temperature": 0
            }'
          ```

          The HTTP status is 200 and the JSON response contains a `choices` field with generated text. If node 1 cannot join or HCCL initialization times out, check the multi-node communication environment and make sure interface names, IP addresses, and the DP RPC port match on both nodes.

verification: |-
  This recipe was not re-run during migration: the commands are reproduced from the v0.23.0.post1 tutorial, which is the last version that documents the model (vLLM-Ascend discontinued the tutorial in v0.30.0, and `main` only carries a deprecation stub). The tutorial's stated expected results are: the service returns HTTP 200 with a JSON body containing `choices`, the image request with `https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png` returns text similar to `TONGYI Qwen`, and the two-node MP service prints `Application startup complete.` on node 0. Replace `<server_ip>` and `<port>` with the address of the node running the API server, and substitute the `nic_name`, `local_ip`, and `node0_ip` placeholders in the MP scenario before use.

performance:
  accuracy: |-
    The tutorial reports AISBench `vllm-api-general-chat` results in generation mode: textvqa-lite accuracy 83 and aime2024 accuracy 93. See [Using AISBench](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html) for the evaluation workflow.
  benchmark: |-
    The tutorial publishes no serving latency or throughput numbers, so this recipe states none. It only documents how to measure them, using `vllm bench serve` with random text prompts:

    ```bash
    export VLLM_USE_MODELSCOPE=True

    vllm bench serve \
      --model Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
      --served-model-name qwen3-vl-235b \
      --dataset-name random \
      --random-input 200 \
      --num-prompts 200 \
      --request-rate 1 \
      --save-result \
      --result-dir ./
    ```

    For multimodal performance, use AISBench or a custom image dataset instead of random text prompts, because random prompts exercise only the text path.

tuning: |-
  Start from a scenario above and tune in the order the tutorial recommends:

  1. Set the deployment topology first. Use single-node deployment for validation, multi-node MP for simple multi-node serving, and PD disaggregation when prefill and decode need different resource ratios. The tutorial also documents a Mooncake 1P1D topology on two Atlas 800 A3 nodes (prefill DP2 + TP8, decode DP4 + TP4), but this recipe does not reproduce it.
  2. Choose `--max-model-len` for the workload. Multimodal requests consume KV cache for both text tokens and visual tokens; if HBM runs out, reduce image resolution, image count, `--max-num-seqs`, or context length.
  3. Tune multimodal limits with `--limit-mm-per-prompt.image` and `--limit-mm-per-prompt.video`; every tutorial baseline disables video and allows one image per request.
  4. Tune `--max-num-batched-tokens`. Larger values usually improve prefill throughput but increase activation memory; decode-heavy workloads usually need smaller values.
  5. Tune `--max-num-seqs` for the target concurrency. For performance tests, keep `--max-num-seqs` times `--data-parallel-size` at or above the test concurrency, since waiting time counts toward TTFT and TPOT.
  6. Tune `--gpu-memory-utilization`. Higher values give more KV cache but leave less headroom for runtime fluctuation, image preprocessing, and expert imbalance.
  7. Tune ACLGraph capture. `FULL_DECODE_ONLY` is recommended for decode; when setting `cudagraph_capture_sizes` manually, include the common decode batch sizes.

  Model-specific options from the tutorial: `--mm-processor-cache-gb 0` disables the multimodal processor cache for memory-constrained validation; `VLLM_ASCEND_ENABLE_FLASHCOMM1=1` or `--additional-config '{"enable_flashcomm1":true}'` reduces communication overhead at large TP and high concurrency but may not help low concurrency; `VLLM_ASCEND_ENABLE_FUSED_MC2=1` enables fused MoE operators, so compare against the disabled state if accuracy or performance regresses; `--async-scheduling` can improve high-concurrency throughput but should be compared for latency-sensitive workloads. Prefix caching is disabled in every baseline because the tutorial's prompts and images do not share prefixes; for PD deployments, always start with prefix caching disabled.

