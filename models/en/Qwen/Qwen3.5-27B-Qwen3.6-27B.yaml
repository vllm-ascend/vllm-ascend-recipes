meta:
  title: "Qwen3.5-27B & Qwen3.6-27B"
  slug: "qwen3.5-27b-qwen3.6-27b"
  provider: "Qwen"
  description: "Qwen3.5-27B and Qwen3.6-27B are dense hybrid Mamba-Transformer language models in the Qwen3.5/Qwen3.6 family, integrating breakthroughs in architectural efficiency, reinforcement learning scale, and global accessibility. They share the same hybrid attention design (GDN + full attention) and the same deployment pattern on Ascend NPUs, suitable for general-purpose text generation tasks such as dialogue, content creation, and code generation."
  date_added: 2026-07-27
  tasks:
    - text
  performance_headline: "Single-node deployment on Atlas 800 A2/A3 with TP=2 + DP=8 DP-first parallelism"
  date_updated: 2026-07-27
  difficulty: advanced
  related_recipes:
    - "Qwen/Qwen3-30B-A3B"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified
    atlas_300i_duo: verified

model:
  model_id: "Qwen/Qwen3.6-27B"
  min_vllm_version: "0.18.0rc1"
  architecture: dense
  parameter_count: "27B"
  active_parameters: null
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.18.0rc1"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.18.0rc1-a3"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=512g -v /root/.cache/modelscope:/root/.cache/modelscope --device /dev/davinci0 --device /dev/davinci1 ... --device /dev/davinci7 -it quay.io/ascend/vllm-ascend:v0.18.0rc1 bash"
      note: "Official Ascend image; full device/driver mounts are covered in env_setup.container."

# —— Upstream alignment: features / variants / strategies / overrides / guide ——
features:
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP speculative decoding (qwen3_5_mtp, 3 tokens) to accelerate inference"
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3, "enforce_eager": true}']
  compilation_config:
    label: "Compilation Config"
    description: "Full ACL graph execution in decode (--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "Asynchronous scheduling to overlap CPU scheduling with NPU computation"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV-cache prefix caching (--enable-prefix-caching / --no-enable-prefix-caching)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  cpu_binding:
    label: "CPU Binding"
    description: "CPU core binding for reduced NUMA latencies"
    args: ["--additional-config", '{"enable_cpu_binding":true}']
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm communication optimization"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"

opt_in_features:
  - prefix_caching

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 33
    description: "W8A8 quantized weights on Atlas 800 A2/A3"
  w8a8_mtp:
    model_id: "Eco-Tech/Qwen3.5-27B-w8a8-mtp"
    precision: W8A8
    vram_minimum_gb: 33
    description: "W8A8 + MTP weights (Qwen3.5-27B-w8a8-mtp)"
  bf16:
    model_id: "Qwen/Qwen3.6-27B"
    precision: bf16
    vram_minimum_gb: 65
    description: "BF16 weights on Atlas 800 A3"

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_310p
  - pd_cluster

hardware_overrides: {}
strategy_overrides:
  pd_cluster:
    prefill:
      nodes: { default: 1 }
    decode:
      nodes: { default: 1 }

dependencies: []

guide: ""

# —— Configurable value params (page/CI extension; defaults = tutorial baseline) ——
config_params:
  max_model_len:
    default: 133000
    type: number
    description: "Maximum context length (input + output tokens)"
  max_num_seqs:
    default: 32
    type: number
    description: "Maximum number of concurrent sequences"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "Fraction of NPU memory available for the KV cache"

overview: |-
  Qwen3.5-27B and Qwen3.6-27B are dense hybrid Mamba-Transformer language models in the Qwen3.5/Qwen3.6 family. Both share the same hybrid attention design (GDN + full attention) and the same MTP head design. They are suitable for general-purpose text generation tasks such as dialogue, content creation, and code generation.
