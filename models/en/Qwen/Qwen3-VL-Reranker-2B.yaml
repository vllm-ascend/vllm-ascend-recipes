meta:
  title: 'Qwen3-VL-Reranker-2B'
  slug: 'qwen3-vl-reranker-2b'
  provider: 'Qwen'
  description: 'A 2B vision-language reranker in the Qwen3 series, producing relevance scores for query-document pairs across text and multimodal inputs, with single-card deployment on Ascend NPUs.'
  date_added: 2026-10-14
  difficulty: beginner
  performance_headline: 'Single-node single-card pooling deployment on Atlas 800I A2 / Atlas 300I DUO with vLLM-Ascend'
  hardware:
    atlas_800_a2: verified

model:
  model_id: 'Qwen/Qwen3-VL-Reranker-2B'
  min_vllm_version: '0.9.2rc1'
  architecture: dense
  parameter_count: '2B'
  active_parameters: null
  context_length: 32768
  modality: multimodal
  base_args:
    - '--runner'
    - 'pooling'
    - '--hf_overrides'
    - '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}'
  docker_image:
    atlas_800_a2: 'quay.io/ascend/vllm-ascend:v0.30.0rc2'
    atlas_800_a3: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-a3'
    ascend_950dt: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-a5'
    atlas_300i_duo: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-310p'
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: 'docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.30.0rc2 bash'
      note: 'Official Ascend image; full device/driver mounts are covered in env_setup.container.'

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_A5
  - single_node_310p

# —— Configurable value params (defaults = tutorial baseline) ——
config_params:
  max_model_len:
    default: 1024
    type: number
    description: 'Maximum context length (input + output tokens). Keep an explicit conservative value, otherwise the attention mask (O(max_model_len^2)) may exceed NPU memory.'

overview: |-
  The Qwen3-VL-Reranker-2B is a vision-language reranking model in the Qwen3 series. It produces relevance scores for query-document pairs across text and multimodal inputs, and is suitable for search, retrieval, and RAG pipelines. vLLM Ascend 0.9.2rc1 and higher supports this model.
weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Qwen/Qwen3-VL-Reranker-2B
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3-VL-Reranker-2B
          ```
      - source: HuggingFace
        url: https://huggingface.co/Qwen/Qwen3-VL-Reranker-2B
        command: |-
          ```bash
          pip install -U huggingface_hub
          huggingface-cli download Qwen/Qwen3-VL-Reranker-2B
          ```
      - source: Modelers
        url: ''
        command: ''
      - source: GitCode
        url: ''
        command: ''
prerequisites:
  - title: Model Weight
    content: |-
      It is recommended to download the model weight to a shared directory, such as `/root/.cache/`.

      | Weight Version | Download Links |
      | -------------- | -------------- |
      | Qwen3-VL-Reranker-2B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-Reranker-2B) / [HuggingFace](https://huggingface.co/Qwen/Qwen3-VL-Reranker-2B) |
env_setup:
  container:
    A2:
      content: |-
        You can use the official all-in-one Docker image to run `Qwen3-VL-Reranker-2B` directly.

        **Docker Pull:**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
        ```

        **Docker Run:**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        After a successful docker run, you can verify the running container service by executing the `docker ps` command.
    A3:
      content: |-
        You can use the official all-in-one Docker image to run `Qwen3-VL-Reranker-2B` directly.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2-a3

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```
    A5:
      content: |-
        The following command uses the Ubuntu image for Ascend 950DT&950PR Products to start the container.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2-a5

        docker run --rm \
            --name vllm-ascend \
            --net=host \
            --shm-size=1g \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```
    300I DUO:
      content: |-
        For Atlas 300I DUO, use the `-310p` image:

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2-310p

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      If you do not want to use the Docker image, you can also build all from source:

      - Install `vllm-ascend` from source, refer to the [installation guide](https://docs.vllm.ai/projects/ascend/en/latest/installation.html).

      If you want to deploy a multi-node environment, you need to set up the environment on each node.
scenarios:
  - npu: Atlas 800I A2
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card
    tags: [a2-single]
    strategy: single_node_A2
    steps:
      - title: Start the server
        content: |-
          Single-card pooling deployment, suitable for development, testing, and small-to-medium scale reranking scenarios.

          ```bash
          vllm serve Qwen/Qwen3-VL-Reranker-2B \
              --served-model-name Qwen/Qwen3-VL-Reranker-2B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - `--max-model-len` represents the context length, which is the maximum value of the input plus output for a single request. If automatic parsing resolves to a large context length, allocating this mask (O(max_model_len^2)) may exceed NPU memory and trigger OOM. Be sure to set an explicit and conservative value, such as 1024.
          > - Replace `Qwen/Qwen3-VL-Reranker-2B` with your local weight directory if you pre-downloaded the model.
      - title: Service Verification
        content: |-
          After the service is started, verify it by sending a rerank request. Refer to the verification section below for a usage example.
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: Single-Node
    case: 300I DUO (TP1)
    tags: [310p-single]
    strategy: single_node_310p
    steps:
      - title: Start the server
        content: |-
          Atlas 300I DUO single-node pooling deployment (TP=1).

          ```bash
          vllm serve Qwen/Qwen3-VL-Reranker-2B \
              --served-model-name Qwen/Qwen3-VL-Reranker-2B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
              --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
              --dtype float16 \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - `--compilation-config`: For Atlas 300I DUO, due to limited hardware streams, the size of `cudagraph_capture_sizes` is restricted.
          > - `--dtype float16` matches the Atlas 300I DUO inference execution path.
          > - `--max-model-len`: if automatic parsing resolves to a large context length, allocating this mask (O(max_model_len^2)) may exceed NPU memory and trigger OOM. Be sure to set an explicit and conservative value, such as 1024.
      - title: Service Verification
        content: |-
          After the service is started, verify it by sending a rerank request. Refer to the verification section below for a usage example.
verification: |-
  Once your server is started, you can verify by the following command:

  ```bash
  curl http://localhost:<port>/v1/rerank \
      -X POST \
      -d '{"query":"What is the capital of China?", "documents": ["The capital of China is Beijing.", "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."]}' \
      -H 'Content-Type: application/json'
  ```

  Expected result: The service returns HTTP 200 OK with a JSON response containing the `relevance_score` field. The capital-of-China document should receive a much higher score than the gravity document. Example output:

  ```json
  {
      "id": "score-xxxxx",
      "model": "Qwen/Qwen3-VL-Reranker-2B",
      "usage": {
          "prompt_tokens": 179,
          "total_tokens": 179
      },
      "results": [
          {
              "index": 0,
              "document": {
                  "text": "The capital of China is Beijing.",
                  "multi_modal": null
              },
              "relevance_score": 0.7209711670875549
          },
          {
              "index": 1,
              "document": {
                  "text": "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
                  "multi_modal": null
              },
              "relevance_score": 0.18871910870075226
          }
      ]
  }
  ```

  For more usage examples, please reference the [score examples](https://github.com/vllm-project/vllm/tree/main/examples/pooling/score).
evaluation:
  accuracy:
    content: |-
      ### Using MTEB

      Refer to [MTEB](https://docs.mteb.org/) for details.

      Run the following code to execute the accuracy evaluation:

      ```python
      import os

      from mteb.models.vllm_wrapper import VllmCrossEncoderWrapper

      if __name__ == "__main__":
          import mteb

          data_path = "/home/data/mteb_data"
          os.environ["HF_DATASETS_CACHE"] = data_path
          os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

          model = VllmCrossEncoderWrapper("/root/.cache/Qwen3-VL-Reranker-2B",
                                      revision="norm",
                                      dtype="float16",
                                      enforce_eager=True,
                                      max_model_len=10240,
                                      hf_overrides={"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": True})

          cache = mteb.ResultCache(data_path)
          tasks = mteb.get_tasks(
              task_types=["Reranking"],
              languages=["zho"]
          )
          tasks = mteb.get_tasks(tasks=["MultiLongDocReranking"])
          results = mteb.evaluate(model, tasks=tasks, cache=cache, overwrite_strategy="always")
          print(results)
      ```

      After execution, you can get the evaluation result.
  performance:
    content: |-
      ### Using vLLM Benchmark

      Run performance of `Qwen3-VL-Reranker-2B` as an example. Refer to [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/cli/) for more details.

      Take the `serve` as an example. Run the code as follows:

      ```bash
      vllm bench serve --model Qwen/Qwen3-VL-Reranker-2B --backend vllm-rerank --port 8000 --dataset-name random-rerank --endpoint /v1/rerank --random-input 200 --save-result --result-dir ./
      ```

      After about several minutes, you can get the performance evaluation result.
performance:
  accuracy: |-
    The official tutorial does not publish fixed accuracy numbers for this model. Run the MTEB evaluation in the "More Info" tab to measure retrieval accuracy on your own deployment.
  benchmark: |-
    No fixed throughput/latency numbers are published for this model; results depend on hardware resources, input length, concurrency, and runtime configuration.

    Use the reproducible `vllm bench serve --backend vllm-rerank` command in the "More Info" tab to measure rerank throughput and latency on your own deployment.
