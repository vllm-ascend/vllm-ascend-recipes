meta:
  title: "Qwen3.6-35B-A3B"
  slug: "qwen3.6-35b-a3b"
  provider: "Qwen"
  description: "Deploy Qwen3.6-35B-A3B on Ascend NPUs."
  date_added: "2026-10-28"
  difficulty: "intermediate"
  tasks:
    - "text"
  hardware:
    atlas_800_a3: "verified"
    atlas_800_a2: "experimental"
    ascend_950dt: "experimental"
    atlas_300i_duo: "experimental"

model:
  model_id: "Qwen/Qwen3.6-35B-A3B"
  min_vllm_version: "0.18.0rc1"
  architecture: "moe"
  parameter_count: "35B"
  active_parameters: "3B"
  context_length: 262144
  modality: "multimodal"
  base_args:
    - "--served-model-name"
    - "qwen3.6"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend@sha256:943b63f8f634f09e3f8ca810f0d8c7a8c68a8e5312dfcb241caf0b0a48487c73"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:nightly-main"
    ascend_950dt: "quay.io/ascend/vllm-ascend:nightly-main-a5"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:nightly-main-310p"
  nightly_required: true
  install:
    pip: false
    docker:
      command: "docker pull quay.io/ascend/vllm-ascend@sha256:943b63f8f634f09e3f8ca810f0d8c7a8c68a8e5312dfcb241caf0b0a48487c73"
      note: "Use the hardware-specific image and device mounts below."

variants:
  default:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w8a8"
    precision: "W8A8"
    vram_minimum_gb: 48
    supported_hardware:
      - "atlas_800_a3"
      - "atlas_800_a2"
      - "atlas_300i_duo"
    description: "W8A8 quantized weights."
  bf16:
    model_id: "Qwen/Qwen3.6-35B-A3B"
    precision: "BF16"
    vram_minimum_gb: 84
    description: "Original BF16 weights."
  mxfp8:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8"
    precision: "W8A8 MXFP8"
    supported_hardware:
      - "ascend_950dt"
    description: "950DT W8A8 MXFP8 weights."
  c8_mxfp8:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8"
    precision: "W8A8C8 MXFP8"
    supported_hardware:
      - "ascend_950dt"
    description: "950DT weights paired with MXFP8 KV cache."
  w4a8_mxfp:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w4a8-mxfp"
    precision: "W4A8 MXFP"
    supported_hardware:
      - "ascend_950dt"
    description: "W4A8 MXFP for 950DT; see the model card for requirements."

compatible_strategies:
  - "single_node_A3"
  - "single_node_A2"
  - "single_node_A5"
  - "single_node_310p"

hardware_overrides:
  atlas_800_a3:
    extra_args:
      - "--dtype"
      - "bfloat16"

strategy_overrides: {}

guide: ""

config_params:
  gpu_memory_utilization:
    default: 0.9
    type: "number"
    description: "NPU memory fraction used by the model executor"

overview: "Qwen3.6-35B-A3B is a sparse MoE model with 35B total parameters and about 3B active per token. It combines gated delta networks with full attention and supports text and vision-language workloads."

