# Qwen3.5-397B-A17B recipe (en) — source of truth: vllm-ascend main tutorial docs/source/tutorials/models/Qwen3.5-397B-A17B.md (revised mid-October 2026)
meta:
  title: "Qwen3.5-397B-A17B"
  slug: "qwen3-5-397b-a17b"
  provider: "Qwen"
  description: "Qwen3.5 flagship 397B MoE with 17B activated parameters and hybrid linear-attention (Mamba-style) plus full-attention layers; top-tier open-source reasoning, coding and agentic performance."
  date_added: 2026-10-30
  difficulty: advanced
  tasks:
    - text
  performance_headline: "Single-node Atlas 800I A3 (64G x 16) W8A8 TP16 133K serving with qwen3_5_mtp; 1P1D PD disaggregation on one 16-NPU A3 host (W4A8)"
  hardware:
    atlas_800_a3: verified   # tutorial §5.1/§5.4 publish official deployment on 1x A3 (64G x 16); first-party serving re-runs completed 2026-10-29/30: one Atlas 800T A3 host (8 cards x 2 die = 16 devices, 64G HBM per card, TP16) — single-node, single-host PD, and cross-host PD all verified; see PR description
    atlas_800_a2: experimental   # tutorial §5.2/§5.6 publish A2 deployment; no first-party A2 run — expect A2-leg skips (see PR description)
    ascend_950dt: experimental   # tutorial §5.1/§5.5 publish 950DT deployment; no 950DT resource available (see PR description). Note: tutorial §5.5 requires a v0.30.0 MRv1 build containing #19017 for the W4A8C8 path — verify the image carries it before use

model:
  min_vllm_version: "v0.17.0rc1"   # tutorial §1 support floor (950DT tiers from v0.23.0rc1; 950DT W4A8C8 additionally needs the #19017 fix in a v0.30.0 MRv1 build)
  model_id: "Eco-Tech/Qwen3.5-397B-A17B-w8a8-mtp"   # real download org (ModelScope), matching Qwen3-VL/DeepSeek-V2-Lite precedent
  architecture: moe
  parameter_count: "397B"
  active_parameters: "17B"
  context_length: 133000          # serving length validated in tutorial §5.1 A3 example (model native context is larger; see config.json)
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--quantization ascend"   # for the quantized checkpoints; remove for the BF16 variant (tutorial §3.1)
    - "--enable-expert-parallel"
    # NOTE: the W8A8 checkpoint ships an MTP draft consumed via the qwen3_5_mtp
    # speculative method (tutorial §5.1); it is declared per scenario below.
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    VLLM_USE_V2_MODEL_RUNNER: "0"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:nightly-main"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:nightly-main-a3"
    ascend_950dt: "quay.io/ascend/vllm-ascend:nightly-main-a5"
  nightly_required: true   # first-party verification ran on quay.io/ascend/vllm-ascend:nightly-main-a3 (vLLM v0.32.0) on 2026-10-29; the single-node and single-host PD commands are transcribed from the v0.30.0-based tutorial and verified on main; the cross-host variant is a first-party derivation — `qwen3_5_mtp` maps to `mtp` on newer images (deprecation warning)
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=512g --net=host --privileged=true -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:nightly-main-a3 bash"
      note: "Simplified; full device/driver mount set in env_setup.container. --shm-size=512g, --privileged and the /etc/hccn.conf mount are recipe additions (the tutorial §4.1 template ships --shm-size=1g without them)."

features:
  expert_parallel:
    description: "MoE expert parallelism (tutorial §5.1)"
    args: ["--enable-expert-parallel"]
  spec_decoding:
    label: "Qwen3.5 MTP Spec Decoding"
    description: "The W8A8/W4A8 checkpoints ship an MTP draft consumed with 3 speculative tokens (tutorial §5.1/§9.1). Keep the same method and token count on Prefill and Decode in PD deployment (tutorial §5.4). Method name: current images take `mtp` (the tutorial's `qwen3_5_mtp` emits a deprecation warning on nightly and maps to `mtp`; use the tutorial spelling on v0.30.0 release images)."
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3, "enforce_eager": true}']   # `mtp` spelling on nightly (deprecation-mapped; see description)
  tool_calling:
    label: "Function Calling (tutorial §6.1)"
    description: "Append to the `vllm serve` command (both Prefill and Decode in PD, then restart): --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3. Verify with a chat request carrying a tool definition; the serving process parses tool calls, it does not execute them (tutorial §6.1)."
    args: ["--enable-auto-tool-choice", "--tool-call-parser qwen3_coder", "--reasoning-parser qwen3"]
  flashcomm1:
    label: "FlashComm1"
    description: "MoE sequence parallelism; requires --enable-expert-parallel and TP > 1 (tutorial §9.3). The tutorial scripts enable it via the enable_flashcomm1 member of --additional-config (not via this env toggle); the env form follows the DeepSeek-V4-Flash recipe convention."
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  prefix_caching:
    label: "Prefix Caching"
    description: "Enabled in all tutorial deployment examples (§5.1/§5.4/§9.1). Short prefixes may not be cached when the hybrid KV cache manager adjusts the block size to a large value (tutorial §5.1 note)."
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  async_scheduling:
    label: "Asynchronous Scheduling"
    description: "Present in the tutorial 950DT single-node example; optional on A3 (tutorial §5.1). Not enabled in the A3 single-node scenario below."
    args: ["--async-scheduling"]

compatible_strategies:
  - single_node
  - multi_node_dp
  - pd_cluster

guide: ""
performance_model_names:
  - "Qwen3.5-397B-A17B-w8a8"
  - "Qwen3.5-397B-A17B-w4a8"

overview: |-
  Qwen3.5-397B-A17B is the flagship of the Qwen3.5 family: a 397B-parameter MoE with 17B
  activated parameters that mixes linear-attention (Mamba-style) layers with full attention.
  The tutorial publishes deployment for six topologies: single-node W8A8 on one Atlas 800I A3
  (64 GB x 16) with TP16 and a 133K context; single-node W4A4-MXFP4 on one 950DT product
  (96 GB x 8); two-node MP on Atlas 800I A2 (64 GB x 8 each); 1P1D PD disaggregation on a
  single 16-NPU A3 host with the W4A8 checkpoint (Prefill TP8 on devices 0-7, Decode TP4/DP2
  on devices 8-15, MooncakeConnectorV1 with the standard Pull proxy); W4A8C8 PD across 950DT
  products; and PD on A2. Reference accuracy for W8A8 on vLLM-Ascend v0.30.0: AISBench GPQA 88
  (§7.1). All quantized checkpoints ship an MTP draft served through the qwen3_5_mtp
  speculative method with 3 tokens (§9.1).

weight_download:
