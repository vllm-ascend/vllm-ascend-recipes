  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''
- weight_version: W8A8 (Pre-quantized)
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Eco-Tech/Qwen3-Coder-30B-A3B-Instruct-w8a8
    command: |-
