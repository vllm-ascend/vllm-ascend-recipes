meta:
  title: "Qwen3-Coder-30B-A3B-Instruct"
  slug: "qwen3-coder-30b-a3b-instruct"
  provider: "Qwen"
  description: "A 30.5B-parameter Mixture-of-Experts coding model with 3.3B activated parameters, agentic coding and function-calling support, and a native context window of 262144 tokens."
  date_added: 2026-11-19
  performance_headline: "Single-node W8A8 deployment on Atlas 800I A3 for high throughput, low latency, and 128K long context"
  difficulty: intermediate
  hardware:
    atlas_800_a3: verified

model:
  model_id: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  min_vllm_version: "0.30.0"
  architecture: moe
  parameter_count: "30.5B"
  active_parameters: "3.3B"
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
  base_env:
    HCCL_BUFFSIZE: "1024"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g -v /models:/models --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 -it quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler bash"
      note: "Official Ascend image; full device/driver mounts are covered in env_setup.container."

features:
  expert_parallel:
    description: "MoE expert parallelism across the TP ranks (scenarios that use TP4)"
    args: ["--enable-expert-parallel"]
  compilation_config:
    label: "Compilation Config"
    description: "Full ACL graph execution in decode (--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode": "FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "Asynchronous scheduling to overlap CPU scheduling with NPU computation"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV-cache prefix caching (disabled by default in the validated scenarios)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

opt_in_features:
  - prefix_caching

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 32
    description: "W8A8 quantized weights on Atlas 800I A3"
  bf16:
    model_id: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    precision: bf16
    vram_minimum_gb: 60
    description: "BF16 weights on Atlas 800I A3"

compatible_strategies:
  - single_node_A3

hardware_overrides: {}
strategy_overrides: {}

guide: ""

config_params:
  max_model_len:
    default: 37364
    type: number
    description: "Maximum context length (input + output tokens)"
  max_num_seqs:
    default: 100
    type: number
    description: "Maximum number of concurrent sequences"
  gpu_memory_utilization:
    default: 0.95
    type: number
    description: "Fraction of NPU memory available for the KV cache"

overview: |-
  Qwen3-Coder-30B-A3B-Instruct is a Mixture-of-Experts coding model with 30.5B total parameters and 3.3B activated per token. It targets agentic coding, repository-level code generation, and tool calling, and supports a native context length of 262144 tokens. This recipe covers the three single-node scenarios used by the upstream tutorial: high throughput (TP1), low latency (TP4 with expert parallelism), and long context (TP4 with 131072 tokens).

