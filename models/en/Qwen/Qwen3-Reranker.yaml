scenarios:
  - npu: Atlas 800I A3
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card
    tags: [a3-single]
    strategy: single_node_A3
    steps:
      - title: Start the server
        content: |-
          Serve the official original Qwen3-Reranker checkpoint with the pooling runner. The `hf_overrides` route the model to `Qwen3ForSequenceClassification` and extract the yes/no classifier vectors from `lm_head`.

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - Replace `Qwen/Qwen3-Reranker-0.6B` with `Qwen/Qwen3-Reranker-4B` or `Qwen/Qwen3-Reranker-8B` as needed.
          > - `--max-model-len` is the maximum input+output length for a single request. Prefer an explicit conservative value (for example `1024`) when the automatic context length would allocate an oversized attention mask.
      - title: Service Verification
        content: |-
          After the service is started, verify it with the `/v1/rerank` request in the verification section below.
  - npu: Atlas 800I A2
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card (A2)
    tags: [a2-single]
    strategy: single_node_A2
    steps:
      - title: Start the server
        content: |-
          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```
      - title: Service Verification
        content: |-
          After the service is started, verify it with the `/v1/rerank` request in the verification section below.
  - npu: Ascend 950DT&950PR Products
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card (A5)
    tags: [a5-single]
    strategy: single_node_A5
    steps:
      - title: "Start the server"
        content: |-
          Migrated from the source tutorial for Ascend 950DT&950PR Products. This A5 scenario is experimental and has not been validated on A5 hardware. Use the separate `v0.23.0-a5` container above; the serving arguments are shared with A3/A2.

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```
      - title: "Service Verification"
        content: |-
          After the service is started, verify it with the `/v1/rerank` request in the verification section below.
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: Single-Node
    case: 300I DUO
    tags: [310p-single]
    strategy: single_node_310p
    steps:
      - title: Start the server
        content: |-
          On Atlas 300I DUO, limit the capture sizes and disable `fuse_norm_quant` due to limited hardware streams.

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
              --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
              --dtype float16 \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > `--compilation-config`: on Atlas 300I DUO, `cudagraph_capture_sizes` must stay small because hardware streams are limited.
      - title: Service Verification
        content: |-
          After the service is started, verify it with the `/v1/rerank` request in the verification section below.

verification: |-
  Once your server is started, verify with:

  ```python
  import math

  import requests

  url = "http://127.0.0.1:8000/v1/rerank"

  # Please use the query_template and document_template to format the query and
  # document for better reranker results.

  prefix = '<|im_start|>system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be "yes" or "no".<|im_end|>\n<|im_start|>user\n'
  suffix = "<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n"

  query_template = "{prefix}<Instruct>: {instruction}\n<Query>: {query}\n"
  document_template = "<Document>: {doc}{suffix}"

  instruction = (
      "Given a web search query, retrieve relevant passages that answer the query"
  )

  query = "What is the capital of China?"

  documents = [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
  ]

  documents = [
      document_template.format(doc=doc, suffix=suffix) for doc in documents
  ]

  response = requests.post(
      url,
      json={
          "query": query_template.format(
              prefix=prefix, instruction=instruction, query=query
          ),
          "documents": documents,
      },
      timeout=(10, 120),
  )
  response.raise_for_status()
  payload = response.json()
  assert isinstance(payload, dict), payload
  results = payload.get("results")
  assert isinstance(results, list) and len(results) == len(documents), payload
  assert all(isinstance(row, dict) for row in results), payload
  assert all(type(row.get("index")) is int for row in results), payload
  assert {row["index"] for row in results} == set(range(len(documents))), payload
  scores = {row["index"]: row.get("relevance_score") for row in results}
  assert all(
      isinstance(score, (int, float))
      and not isinstance(score, bool)
      and math.isfinite(score)
      and 0 <= score <= 1
      for score in scores.values()
  ), payload
  assert scores[0] > scores[1], scores
  assert [row["index"] for row in results] == sorted(
      scores, key=scores.get, reverse=True
  ), payload
  print(payload)
  ```

  Expected result: HTTP 200 with one finite `relevance_score` in [0, 1] per document, sorted by descending score. The assertions verify that the Beijing document ranks first; HTTP errors, invalid JSON, missing results, and incorrect rankings fail the check.

  For more usage examples, see the [vLLM pooling/score examples](https://github.com/vllm-project/vllm/tree/main/examples/pooling/score).

evaluation:
  accuracy:
    content: |-
      ### Using MTEB

      1. Refer to [MTEB](https://docs.mteb.org/) for details.
      2. Run:

      ```python
      import os

      from mteb.models.vllm_wrapper import VllmCrossEncoderWrapper

      if __name__ == "__main__":
          import mteb

          data_path = "/home/data/mteb_data"
          os.environ["HF_DATASETS_CACHE"] = data_path
          os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

          model = VllmCrossEncoderWrapper(
              "/root/.cache/Qwen3-Reranker-0.6B",
              revision="norm",
              dtype="float16",
              enforce_eager=True,
              max_model_len=10240,
              hf_overrides={
                  "architectures": ["Qwen3ForSequenceClassification"],
                  "classifier_from_token": ["no", "yes"],
                  "is_original_qwen3_reranker": True,
              },
          )

          cache = mteb.ResultCache("/home/data/mteb_data")
          tasks = mteb.get_tasks(tasks=["MultiLongDocReranking"])
          results = mteb.evaluate(
              model, tasks=tasks, cache=cache, overwrite_strategy="always"
          )
          print(results)
      ```

performance:
  benchmark: |-
    ### Using vLLM Benchmark

    Example for `Qwen3-Reranker-0.6B` (refer to the [vLLM benchmark CLI](https://docs.vllm.ai/en/latest/benchmarking/cli/)):

    ```bash
    vllm bench serve \
        --model Qwen/Qwen3-Reranker-0.6B \
        --backend vllm-rerank \
        --port 8000 \
        --dataset-name random-rerank \
        --endpoint /v1/rerank \
        --random-input 200 \
        --save-result \
        --result-dir ./
    ```

