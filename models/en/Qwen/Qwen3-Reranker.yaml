  - single_node_A5
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: ""

config_params:
  max_model_len:
    default: 1024
    type: number
    description: "Maximum context length (input + output tokens). Keep conservative on Atlas 300I DUO to avoid OOM."

overview: |-
  The Qwen3 Reranker model series is designed for text ranking tasks. Building upon the dense foundational models of the Qwen3 series, it provides reranking models in 0.6B, 4B, and 8B sizes. This recipe serves the official original checkpoints with the pooling runner and the `/v1/rerank` API.

  > **Historical version scope:** [Qwen3-Reranker support ended in vLLM Ascend v0.30.0](https://github.com/vllm-project/vllm-ascend/blob/main/docs/source/tutorials/models/Qwen3-Reranker.md). This recipe retains the pinned `v0.23.0rc1` images for A2/A3/Atlas 300I DUO and uses the separately pinned `v0.23.0-a5` image for Ascend 950DT&950PR. The A5 scenario is migrated from the pinned source tutorial and has not been validated on A5 hardware. The `min_vllm_version` field does not imply support in current releases. Do not replace these images with `latest` or nightly without validating model support and the deployment. See the [archived v0.23.0 tutorial](https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/Qwen3-Reranker.html).

