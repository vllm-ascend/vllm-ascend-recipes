prerequisites:
- title: Model Weight
  content: |-
    The family ships three checkpoints. Download the one you plan to serve and record its local path:

    | Model | Parameters | Download |
    | --- | --- | --- |
    | Qwen3-Reranker-0.6B | 0.6B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-0.6B) |
    | Qwen3-Reranker-4B | 4B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-4B) |
    | Qwen3-Reranker-8B | 8B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-8B) |

    It is recommended to download the model weight to the shared directory of multiple nodes, such as `/root/.cache/`.

    **Path description**: download the model weights to a directory of your choice and record it. Ensure the model path in the subsequent deployment command matches this directory.
- title: Version Note
  content: |-
    Only vLLM Ascend 0.9.2rc1 and higher support this model, and the tutorial was withdrawn from the documentation set in vLLM Ascend v0.30.0 (the model is discontinued from that release on). Pin the `v0.23.0` image line shown below — the newest release line that still ships Qwen3-Reranker support — and do not upgrade it to the newest published tag.

env_setup:
  container:
    A3:
      content: |-
        Use the official all-in-one image for the A3 series:

        **Docker Pull:**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.23.0-a3
        ```

        **Docker Run:**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
        docker run --rm \
          --name vllm-ascend \
          --shm-size=1g \
          --net=host \
          --privileged=true \
          --device /dev/davinci0 \
          --device /dev/davinci_manager \
          --device /dev/devmm_svm \
          --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```

        After a successful docker run, you can verify the running container service by executing the `docker ps` command.
