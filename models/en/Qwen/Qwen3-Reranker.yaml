overview: |-
  The Qwen3 Reranker model series is designed for text ranking tasks. Building upon the dense foundational models of the Qwen3 series, it provides reranking models in 0.6B, 4B, and 8B sizes. This recipe shows how to serve the official original checkpoints with vLLM Ascend using the pooling runner and the OpenAI-compatible `/v1/rerank` API. Requires vLLM Ascend 0.9.2rc1 or newer.

