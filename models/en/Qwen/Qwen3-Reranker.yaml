scenarios:

- npu: Atlas 800I A3
  precision: bf16
  deployment: Single-Node
  case: Single NPU
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      Qwen3-Reranker is served with the pooling runner: `--runner pooling` switches the server to the embedding/reranker API path, and `--hf_overrides` loads the Qwen3 reranker classification head from the `no`/`yes` classifier tokens.

      ```bash
      vllm serve Qwen/Qwen3-Reranker-0.6B \
        --served-model-name Qwen/Qwen3-Reranker-0.6B \
        --runner pooling \
        --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
        --port 8000 \
        --max-model-len {{max_model_len}}
      ```

      > - `--max-model-len` is the context length (input plus output of one request). Keep the explicit conservative value; on Atlas 300I DUO a large auto-parsed value can OOM while allocating the mask.
      > - `--served-model-name` is the id clients pass in the request body; keep it aligned with the requests below.
      > - The same command is used on the A2 series; only the image tag differs.
  - title: Service Verification
    content: |-
      After the service is started, send a rerank request to `/v1/rerank` and check that every result carries a `relevance_score`. See the verification section below for the full example.
- npu: Atlas 800I A2
  precision: bf16
  deployment: Single-Node
  case: Single NPU (A2)
  tags: [a2-single]
  strategy: single_node_A2
  steps:
  - title: Start the server
    content: |-
      The A2 series uses the same serving flags as the A3 series; run it from the `v0.23.0` image (without the `-a3` suffix).

      ```bash
      vllm serve Qwen/Qwen3-Reranker-0.6B \
        --served-model-name Qwen/Qwen3-Reranker-0.6B \
        --runner pooling \
        --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
        --port 8000 \
        --max-model-len {{max_model_len}}
      ```

      > - `--port` may be changed to avoid conflicts with other services on the same machine.
  - title: Service Verification
    content: |-
      After the service is started, send a rerank request to `/v1/rerank`. See the verification section below for the full example.
- npu: Atlas 300I DUO
  precision: bf16
  deployment: Single-Node
  case: 300I DUO
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: Start the server
    content: |-
      On Atlas 300I DUO the graph capture sizes must be limited and float16 is used, so the launch line adds `--compilation-config`, `--additional-config` and `--dtype`:

      ```bash
      vllm serve Qwen/Qwen3-Reranker-0.6B \
        --served-model-name Qwen/Qwen3-Reranker-0.6B \
        --runner pooling \
        --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
        --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
        --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
        --dtype float16 \
        --port 8000 \
        --max-model-len {{max_model_len}}
      ```

      **Required parameter descriptions:**

      - `--compilation-config`: for Atlas 300I DUO, due to limited hardware streams, the size of `cudagraph_capture_sizes` is restricted.

      **Key parameter description:**

      - `--max-model-len`: for Atlas 300I DUO, if the automatic parse resolves to a large context length, allocating this mask (O(max_model_len^2)) may exceed NPU memory and trigger OOM. Be sure to set an explicit and conservative value, such as `--max-model-len 1024`.
  - title: Service Verification
    content: |-
      After the service is started, send a rerank request to `/v1/rerank`. See the verification section below for the full example.

verification: |-
  Once your server is started, you can verify it with the following script. Use the query and document templates so that the reranker receives the prompts it was trained on:

  ```python
  import requests

  url = "http://127.0.0.1:8000/v1/rerank"

  # Please use the query_template and document_template to format the query and
  # document for better reranker results.

  prefix = '<|im_start|>system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be "yes" or "no".<|im_end|>\n<|im_start|>user\n'
  suffix = "<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n"

  query_template = "{prefix}<Instruct>: {instruction}\n<Query>: {query}\n"
  document_template = "<Document>: {doc}{suffix}"

  instruction = (
      "Given a web search query, retrieve relevant passages that answer the query"
  )

  query = "What is the capital of China?"

  documents = [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
  ]

  documents = [
      document_template.format(doc=doc, suffix=suffix) for doc in documents
  ]

  response = requests.post(url,
                           json={
                               "query": query_template.format(prefix=prefix, instruction=instruction, query=query),
                               "documents": documents,
                           }).json()

  print(response)
  ```

  Expected result: the service returns HTTP 200 OK with a JSON response containing the `relevance_score` field. Example output:

  ```json
  {
      "id": "score-xxx",
      "model": "Qwen/Qwen3-Reranker-0.6B",
      "usage": {
          "prompt_tokens": 193,
          "total_tokens": 193
      },
      "results": [
          {
              "index": 0,
              "document": {
                  "text": "<Document>: The capital of China is Beijing.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n",
                  "multi_modal": null
              },
              "relevance_score": 0.9994981288909912
          },
          {
              "index": 1,
              "document": {
                  "text": "<Document>: Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n",
                  "multi_modal": null
              },
              "relevance_score": 0.00000506485957885161
          }
      ]
  }
  ```

  For more usage examples, refer to the [vLLM pooling/score examples](https://github.com/vllm-project/vllm/tree/main/examples/pooling/score).

evaluation:
  accuracy:
    content: |-
      ### Using MTEB

      1. Refer to [MTEB](https://docs.mteb.org/) for details.
      2. Run the following code to execute the accuracy evaluation.

      ```python
      import os

      from mteb.models.vllm_wrapper import VllmCrossEncoderWrapper

      if __name__ == "__main__":
          import mteb

          data_path = "/home/data/mteb_data"
          os.environ["HF_DATASETS_CACHE"] = data_path
          os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

          model = VllmCrossEncoderWrapper(f"/home/data/Qwen3-Reranker-0.6B",
                                      revision="norm",
                                      dtype="float16",
                                      enforce_eager=True,
                                      max_model_len=10240,
                                      hf_overrides={"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": True})

          cache = mteb.ResultCache("/home/data/mteb_data")
          tasks = mteb.get_tasks(
              task_types=["Reranking"],
              languages=["zho"]
          )
          tasks = mteb.get_tasks(tasks=["MultiLongDocReranking"])
          results = mteb.evaluate(model, tasks=tasks, cache=cache, overwrite_strategy="always")
          print(results)
      ```

      3. After execution, you can get the result.
performance:
  accuracy: |-
    Accuracy is measured with the MTEB reranking tasks (`MultiLongDocReranking` and the `Reranking` task type). See the evaluation section for the runnable script and [MTEB](https://docs.mteb.org/) for the metric definitions.

    The tutorial does not publish a reference score for Qwen3-Reranker on Ascend, so no accuracy number is claimed here.
  benchmark: |-
    ### Using vLLM Benchmark

    Performance of `Qwen3-Reranker-0.6B` is measured with the rerank backend of `vllm bench serve`. Refer to [vLLM benchmark](https://docs.vllm.ai/en/latest/benchmarking/cli/) for details.

    ```bash
    vllm bench serve --model Qwen/Qwen3-Reranker-0.6B --backend vllm-rerank  --port 8000 --dataset-name random-rerank --endpoint /v1/rerank --random-input 200  --save-result --result-dir ./
    ```

    After about several minutes, you can get the performance evaluation result.
tuning: |-
  ### Tuning Guidelines

  Refer to the [Public Performance Tuning Documentation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) for tuning methods, and the [Feature Guide](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html) for feature descriptions.

  Reranker-specific note: `--max-model-len` is the only tuning knob the tutorial pins per scenario. Raising it grows the attention mask (O(max_model_len^2)) and can OOM on Atlas 300I DUO — keep 1024 there and raise it only after measuring the memory headroom on A2/A3.
faq: |-
  **Q: The server OOMs on Atlas 300I DUO at startup.**

  A: Set an explicit and conservative `--max-model-len` (for example 1024). A large auto-parsed context length allocates an O(max_model_len^2) mask and exceeds NPU memory.

  **Q: `/v1/chat/completions` does not work on this model.**

  A: Qwen3-Reranker is a pooling model. `--runner pooling` exposes `/v1/rerank`, `/v1/score` and `/v1/embeddings` instead of the chat API.

  **Q: Which image should I use?**

  A: The `v0.23.0` line (`-a3`, plain, `-310p`). The model is discontinued from vLLM Ascend v0.30.0 on, so newer tags no longer ship support.

  For common environment, installation, and general parameter issues, please refer to the [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html).

