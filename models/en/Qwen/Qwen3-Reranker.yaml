meta:
  title: "Qwen3-Reranker"
  slug: "qwen3-reranker"
  provider: "Qwen"
  description: "The Qwen3 Reranker model series is the proprietary reranking model family of Qwen, built on the dense Qwen3 base models and shipped in 0.6B, 4B and 8B sizes. On Ascend NPUs it is served by vLLM Ascend through the pooling runner and exposed as the /v1/rerank relevance-scoring API."
  date_added: 2026-10-29
  date_updated: 2026-10-29
  difficulty: beginner
  tasks:
    - embedding
  performance_headline: "Single-node pooling deployment on Atlas 800I A2/A3 and Atlas 300I DUO, scored through /v1/rerank"
  related_recipes: []
  # The tutorial documents all three SKUs. They are marked experimental because
  # this recipe was migrated statically from the v0.23.0 tutorial and has not
  # been re-run end-to-end on hardware by the recipe author.
  hardware:
    atlas_800_a3: experimental
    atlas_800_a2: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Qwen/Qwen3-Reranker-0.6B"
  min_vllm_version: "0.23.0"
  architecture: dense
  parameter_count: "0.6B"
  active_parameters: null
  context_length: 40960
  modality: text
  base_args:
    - "--runner"
    - "pooling"
    - "--hf_overrides"
    - '{"architectures": ["Qwen3VLForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
  base_env: {}
  # Qwen3-Reranker is discontinued from vLLM Ascend v0.30.0 on, so the image is
  # pinned to the v0.23.0 release line (the newest line that still ships it)
  # instead of the newest published tag.
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0-310p"
  nightly_required: false
  install:
    # Ascend recommends Docker; there is no official wheel, so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info -v /etc/ascend_install.info:/etc/ascend_install.info -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.23.0 bash"
      note: "Official Ascend image; the per-SKU device mounts and the -a3 / -310p tags are covered in env_setup.container."

features: {}

opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 2
    description: "BF16 weights of Qwen3-Reranker-0.6B — the checkpoint used by every command in the tutorial."
  reranker_4b:
    model_id: "Qwen/Qwen3-Reranker-4B"
    precision: bf16
    vram_minimum_gb: 10
    description: "BF16 weights of the 4B member of the family; same serving flags as the 0.6B baseline."
  reranker_8b:
    model_id: "Qwen/Qwen3-Reranker-8B"
    precision: bf16
    vram_minimum_gb: 20
    description: "BF16 weights of the 8B member of the family; same serving flags as the 0.6B baseline."

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}

guide: ""

config_params:
  max_model_len:
    default: 1024
    type: number
    description: "Context length, i.e. the maximum input plus output tokens of a single request. The tutorial pins 1024 for every scenario; on Atlas 300I DUO a larger auto-parsed value allocates an O(max_model_len^2) mask and can OOM."

overview: |-
  The Qwen3 Reranker model series is the latest proprietary model of the Qwen family, specifically designed for text embedding and ranking tasks. Building upon the dense foundational models of the Qwen3 series, it provides a comprehensive range of text embeddings and reranking models in various sizes (0.6B, 4B, and 8B).

  On vLLM Ascend the checkpoints are served with the pooling runner and a Qwen3 reranker head override, then queried through the `/v1/rerank` endpoint, which returns a `relevance_score` per document.

