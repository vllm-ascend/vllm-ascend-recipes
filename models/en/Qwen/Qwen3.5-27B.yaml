# ===== Atlas 800 A3, W8A8, long context TP=8 + DP=2 =====
- npu: Atlas 800I A3
  precision: W8A8
  deployment: Single-Node
  case: Long Context (256K+)
  tags: [a3-single, long-context]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      **Status: experimental.** For 256K+ context, shard the KV cache across eight dies (TP=8) and keep two DP groups, then raise `--max-model-len` to the model maximum. TP=8 is the only layout in this recipe where the full 262144-token window is reachable on A3.

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.5-27B-w8a8-mtp
      export VLLM_USE_MODELSCOPE=True
      export HCCL_BUFFSIZE=512
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 2 \
          --tensor-parallel-size 8 \
          --quantization ascend \
          --served-model-name qwen3.5 \
          --max-num-seqs 8 \
          --max-model-len 262144 \
          --max-num-batched-tokens 8192 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --dtype bfloat16 \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization 0.90 \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          {{cpu_binding}} \
          {{async_scheduling}}
      ```
  - title: Service verification
    content: |-
      See the `verification` section below.

# ===== Atlas 300I DUO, W8A8, TP=4, FP16 =====
- npu: Atlas 300I DUO
  precision: W8A8
  deployment: Single-Node
  case: 300I DUO (TP)
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: Start the server
    content: |-
      **Status: experimental — no 310P hardware available.** Atlas 300I DUO supports TP only (pick TP=2 or TP=4 for the devices you have) and an FP16 runtime. `enable_npugraph_ex` is not available on this platform, so it is switched off explicitly.

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.5-27B-w8a8-mtp
      export VLLM_USE_MODELSCOPE=True
      export OMP_NUM_THREADS=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 4 \
          --quantization ascend \
          --served-model-name qwen3.5 \
          --max-num-seqs 128 \
          --max-model-len 16384 \
          --trust-remote-code \
          --gpu-memory-utilization 0.90 \
          --mamba-ssm-cache-dtype float16 \
          --dtype float16 \
          --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 1}' \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2, 16]}' \
          --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
      ```
  - title: Service verification
    content: |-
      See the `verification` section below. Use `--served-model-name qwen3.5` and 16384 as the context ceiling.

verification: |-
  After the service starts, the log should show:
  ```text
  (APIServer pid=<pid>) INFO:     Started server process [<pid>]
  (APIServer pid=<pid>) INFO:     Waiting for application startup.
  (APIServer pid=<pid>) INFO:     Application startup complete.
  ```

  Smoke-test the **Completions API**:
  ```bash
  curl http://localhost:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.5",
          "prompt": "The future of AI is",
          "max_tokens": 50,
          "temperature": 0
      }'
  ```

  And the **Chat Completions API**:
  ```bash
  curl http://localhost:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.5",
          "messages": [{"role": "user", "content": "The future of AI is"}],
          "max_completion_tokens": 4096,
          "chat_template_kwargs": {"enable_thinking": false},
          "temperature": 0.7,
          "top_p": 0.95
      }'
  ```

  Expected: HTTP 200 OK with a `choices` field carrying generated text.

evaluation:
  accuracy:
    content: |-
      ### Using AISBench (recommended)

      Follow the vllm-ascend AISBench guide. The only published number for this model is the upstream tutorial's `gsm8k` run of `Qwen3.5-27B-w8a8` on **Atlas 800 A3 with `vllm-ascend:v0.17.0rc1`**:

      | dataset | version | metric | mode | vllm-api-general-chat |
      |---------|---------|--------|------|-----------------------|
      | gsm8k   | -       | accuracy | gen | 96.74 |

      That number predates the v0.30.0 image line and has not been reproduced here; treat it as a reference, not a baseline for this recipe.

      ### Using Language Model Evaluation Harness (lm_eval)

      ```shell
      lm_eval \
        --model local-completions \
        --model_args model=qwen3.5,base_url=http://127.0.0.1:8000/v1/completions,tokenized_requests=False,trust_remote_code=True \
        --tasks gsm8k \
        --output_path ./
      ```
  performance:
    content: |-
      ### Using AISBench

      See the vllm-ascend AISBench performance-evaluation guide.

      ### Using vllm bench serve

      ```bash
      export VLLM_USE_MODELSCOPE=True
      # W8A8 MTP checkpoint
      vllm bench serve --model Eco-Tech/Qwen3.5-27B-w8a8-mtp \
        --dataset-name random --random-input 200 --num-prompts 200 \
        --request-rate 1 --save-result --result-dir ./
      # BF16 checkpoint
      vllm bench serve --model Qwen/Qwen3.5-27B \
        --dataset-name random --random-input 200 --num-prompts 200 \
        --request-rate 1 --save-result --result-dir ./
      ```

      No throughput or latency figures are published for this recipe on Ascend.

tuning: |-
  ### Parallelism strategy (DP-first)

  `Qwen3.5-27B-w8a8` is roughly 30 GB, so it fits on a single 64 GB HBM die. Keep **TP=2** as the default and give the remaining dies to DP for parallel request batches. **TP=8 is only for 256K+ context**, where sharding the KV cache across eight dies is what makes the window reachable.

  **Atlas 300I DUO**: TP only — TP=2 or TP=4, FP16 runtime, `--max-model-len` capped at 16384 here (raise it only after checking HBM headroom).

  | Scenario | Deployment | NPUs | Weight | Notes |
  |----------|------------|------|--------|-------|
  | High Throughput (128K ctx) | Single-Node A2 | 8 | Qwen3.5-27B-w8a8-mtp | TP=2 + DP=4 — uses all 8 NPUs for parallel request batches |
  | High Throughput (128K ctx) | Single-Node A3 | 16 | Qwen3.5-27B-w8a8-mtp | TP=2 + DP=8 — uses all 16 NPUs for parallel request batches |
  | Low Latency (128K ctx) | Single-Node A3 | 16 | Qwen3.5-27B-w8a8-mtp | TP=2 + DP=8, `--max-num-seqs 4` — lower per-layer Allreduce overhead for small interactive batches |
  | Long Context (256K+ ctx) | Single-Node A3 | 16 | Qwen3.5-27B-w8a8-mtp | TP=8 + DP=2 — shards the KV cache across 8 NPUs |
  | Short context, FP16 | Single-Node 300I DUO | 2-8 | Qwen3.5-27B-w8a8-mtp | TP=2 or TP=4, `--dtype float16` |

  | Scenario | Config | TP | DP | Max Num Seqs | Max Num Batched Tokens | Max Model Len | MTP Num | Async Scheduling |
  |----------|--------|----|----|--------------|------------------------|---------------|---------|-------------------|
  | High Throughput (128K) | Single-Node A2 | 2 | 4 | 32 | 16384 | 133000 | 3 | On |
  | High Throughput (128K) | Single-Node A3 | 2 | 8 | 32 | 16384 | 133120 | 3 | On |
  | Low Latency (128K) | Single-Node A3 | 2 | 8 | 4 | 4096 | 133120 | 3 | On |
  | Long Context (256K+) | Single-Node A3 | 8 | 2 | 8 | 8192 | 262144 | 3 | On |
  | Short context | Single-Node 300I DUO | 2-4 | 1 | 128 | 8192 | 16384 | 1 | Off |

  ### Key levers

  - `--gpu-memory-utilization`: raise it to grow the KV cache; too high risks OOM because the warm-up peak differs from steady-state usage.
  - `--max-num-batched-tokens`: larger means lower latency but more activation HBM.
  - `--speculative-config`: both Qwen3.5-27B and Qwen3.6-27B use `qwen3_5_mtp`; on Atlas 300I DUO set `num_speculative_tokens` to 1.
  - `--compilation-config cudagraph_mode=FULL_DECODE_ONLY`: recommended; `PIECEWISE` is the alternative. On Atlas 300I DUO use at most two capture sizes.
  - `--additional-config '{"enable_cpu_binding": true}'`: pins threads and NPU IRQs near the driven NPU; on by default from v0.18.0rc1.

