meta:
  title: "Qwen3.6-27B"
  slug: "qwen3.6-27b"
  provider: "Qwen"
  description: "Qwen3.6-27B is a dense hybrid Mamba-Transformer multimodal model (gated delta networks + full attention, 27B parameters, 262144-token context, MTP head). This recipe covers W8A8, W8A8 MXFP8, W8A8C8 MXFP8 and BF16 deployment on Atlas 800 A2/A3, Ascend 950DT and Atlas 300I DUO."
  date_added: 2026-07-27
  tasks:
    - text
    - multimodal
  performance_headline: "DP-first W8A8 (TP=2) on Atlas 800 A3/A2, TP=1 + DP=8 on Ascend 950DT, FP16 TP on Atlas 300I DUO"
  date_updated: 2026-11-18
  difficulty: advanced
  related_recipes:
    - "Qwen/Qwen3.5-27B"
  hardware:
    atlas_800_a2: verified
    atlas_800_a3: experimental
    ascend_950dt: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Qwen/Qwen3.6-27B"
  min_vllm_version: "0.30.0"
  architecture: dense
  parameter_count: "27B"
  active_parameters: null
  context_length: 262144
  modality: multimodal
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.30.0"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.30.0-a3"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.30.0-a5"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.30.0-310p"
  nightly_required: false
  install:
    # Ascend ships no vllm-ascend wheel on PyPI; the pinned image is the only
    # supported install path, so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=1g --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info -v /etc/ascend_install.info:/etc/ascend_install.info -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.30.0 bash"
      note: "Pinned Ascend image; the full per-SKU device and driver mounts are listed in env_setup."

# —— Upstream-aligned extension fields (features / variants / strategies) ——
features:
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP speculative decoding (qwen3_5_mtp, 3 tokens) — both Qwen3.5-27B and Qwen3.6-27B share this MTP head"
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}']
  compilation_config:
    label: "Compilation Config"
    description: "Full ACL graph execution in decode (--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "Asynchronous scheduling to overlap CPU scheduling with NPU computation"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV-cache prefix caching (--enable-prefix-caching / --no-enable-prefix-caching)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  cpu_binding:
    label: "CPU Binding"
    description: "Pin Ascend worker threads and NPU IRQs to the CPU ranges closest to the driven NPU"
    args: ["--additional-config", '{"enable_cpu_binding":true}']

opt_in_features:
  - prefix_caching

variants:
  default:
    model_id: "Eco-Tech/Qwen3.6-27B-w8a8"
    precision: W8A8
    label: "W8A8"
    vram_minimum_gb: 33
    description: "ModelSlim W8A8 checkpoint; the recommended default on Atlas 800 A2/A3"
  bf16:
    model_id: "Qwen/Qwen3.6-27B"
    precision: bf16
    label: "BF16"
    vram_minimum_gb: 65
    description: "Full-precision BF16 weights (~55.6 GB) — needs TP=2 on 64 GB dies"
    supported_hardware: [atlas_800_a2, atlas_800_a3, ascend_950dt]
  a5_mxfp8:
    model_id: "Eco-Tech/Qwen3.6-27B-w8a8-mxfp8"
    precision: MXFP8
    label: "W8A8 MXFP8 (A5)"
    vram_minimum_gb: 33
    description: "W8A8 MXFP8 checkpoint without an FP8 KV cache — short-sequence workloads on Ascend 950DT"
    supported_hardware: [ascend_950dt]
  a5_c8_mxfp8:
    model_id: "Eco-Tech/Qwen3.6-27B-w8a8c8-mxfp8"
    precision: MXFP8
    label: "W8A8C8 MXFP8 (A5, FP8 KV)"
    vram_minimum_gb: 33
    description: "W8A8C8 MXFP8 checkpoint with an FP8 KV cache (--kv-cache-dtype mxfp8) — long-sequence workloads on Ascend 950DT"
    supported_hardware: [ascend_950dt]
  p310:
    model_id: "Eco-Tech/Qwen3.6-27B-W8A8-310P"
    precision: W8A8
    label: "W8A8 (300I DUO)"
    vram_minimum_gb: 33
    description: "310P-specific W8A8 checkpoint for Atlas 300I DUO, which only supports TP and requires FP16 runtime"
    supported_hardware: [atlas_300i_duo]

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_310p
  - single_node_A5

hardware_overrides: {}

strategy_overrides: {}

dependencies: []

guide: ""

# —— Configurable value params (page/CI extension; defaults = tutorial baseline) ——
config_params:
  max_model_len:
    default: 133120
    type: number
    description: "Maximum context length (input + output tokens); the model supports up to 262144"
  max_num_seqs:
    default: 32
    type: number
    description: "Maximum number of concurrent sequences per DP group"
  gpu_memory_utilization:
    default: 0.85
    type: number
    description: "Fraction of NPU HBM used for the KV cache"

overview: |-
  Qwen3.6-27B is the flagship dense model of the Qwen3.6 family and shares Qwen3.5-27B's hybrid attention design: gated delta networks for three of every four blocks plus a full-attention block. It takes text plus image/video input, serves a 262144-token context, and ships the MTP head used by `qwen3_5_mtp` speculative decoding.

  Two families of weights exist. On Atlas 800 A2/A3 the ModelSlim W8A8 checkpoint is the default and the deployment principle is **DP-first** (about 30 GB of weights per die, TP=2, rest to DP). On Ascend 950DT the W8A8C8 MXFP8 checkpoint with an FP8 KV cache is the long-sequence choice at TP=1 + DP=8; the W8A8 MXFP8 checkpoint without an FP8 KV cache covers shorter sequences.
