# ===== Atlas 800 A3, W8A8, long context TP=8 + DP=2 =====
- npu: Atlas 800I A3
  precision: W8A8
  deployment: Single-Node
  case: Long Context (256K+)
  tags: [a3-single, long-context]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      **Status: experimental.** For 256K+ context, shard the KV cache across eight dies (TP=8) and keep two DP groups, then raise `--max-model-len` to the model maximum of 262144.

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.6-27B-w8a8
      export VLLM_USE_MODELSCOPE=True
      export HCCL_BUFFSIZE=512
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 2 \
          --tensor-parallel-size 8 \
          --quantization ascend \
          --served-model-name qwen3.6 \
          --max-num-seqs 8 \
          --max-model-len 262144 \
          --max-num-batched-tokens 8192 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --dtype bfloat16 \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization 0.90 \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          {{cpu_binding}} \
          {{async_scheduling}}
      ```
  - title: Service verification
    content: |-
      See the `verification` section below.

# ===== Ascend 950DT, W8A8C8 MXFP8 (FP8 KV cache), TP=1 + DP=8 =====
- npu: Ascend 950DT
  precision: MXFP8 / BF16
  deployment: Single-Node
  case: Multi Card
  tags: [a5-single]
  strategy: single_node_A5
  steps:
  - title: Start the server (W8A8C8 MXFP8, FP8 KV cache)
    content: |-
      **Status: experimental — no 950DT hardware available.** This is the tutorial's long-sequence path: `--kv-cache-dtype mxfp8` keeps full-attention KV in FP8. For short-sequence workloads use `Eco-Tech/Qwen3.6-27B-w8a8-mxfp8` and remove `--kv-cache-dtype mxfp8`. BF16 works on this platform too (set `MODEL_PATH=Qwen/Qwen3.6-27B` and drop `--quantization ascend`).

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.6-27B-w8a8c8-mxfp8
      export VLLM_USE_MODELSCOPE=True
      export HCCL_BUFFSIZE=1024
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 8 \
          --tensor-parallel-size 1 \
          --quantization ascend \
          --kv-cache-dtype mxfp8 \
          --served-model-name qwen3.6 \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len 153600 \
          --max-num-batched-tokens 16384 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization 0.90 \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          --additional-config '{"enable_cpu_binding": true, "enable_flashcomm1": true}'
      ```
  - title: Service verification
    content: |-
      Use the served name `qwen3.6` on this platform:

      ```bash
      curl --fail-with-body --silent --show-error http://localhost:<port>/v1/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3.6","prompt":"The future of AI is","max_tokens":50,"temperature":0}'
      ```

      ```bash
      curl --fail-with-body --silent --show-error http://localhost:<port>/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3.6","messages":[{"role":"user","content":"The future of AI is"}],"max_completion_tokens":1024,"temperature":0.7,"top_p":0.95}'
      ```

# ===== Atlas 300I DUO, W8A8-310P, TP=4, FP16 =====
- npu: Atlas 300I DUO
  precision: W8A8
  deployment: Single-Node
  case: 300I DUO (TP)
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: Start the server
    content: |-
      **Status: experimental — no 310P hardware available.** Use the 310P-specific checkpoint (`Qwen3.6-27B-W8A8-310P`). Atlas 300I DUO supports TP only (TP=2 or TP=4) and an FP16 runtime; `enable_npugraph_ex` is not available, so it is switched off explicitly.

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.6-27B-W8A8-310P
      export VLLM_USE_MODELSCOPE=True
      export OMP_NUM_THREADS=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 4 \
          --quantization ascend \
          --served-model-name qwen3.6 \
          --max-num-seqs 128 \
          --max-model-len 16384 \
          --trust-remote-code \
          --gpu-memory-utilization 0.90 \
          --mamba-ssm-cache-dtype float16 \
          --dtype float16 \
          --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 1}' \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2, 16]}' \
          --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
      ```
  - title: Service verification
    content: |-
      See the `verification` section below. Use `--served-model-name qwen3.6` and 16384 as the context ceiling.

verification: |-
  After the service starts, the log should show:
  ```text
  (APIServer pid=<pid>) INFO:     Started server process [<pid>]
  (APIServer pid=<pid>) INFO:     Waiting for application startup.
  (APIServer pid=<pid>) INFO:     Application startup complete.
  ```

  Smoke-test the **Completions API**:
  ```bash
  curl http://localhost:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.6",
          "prompt": "The future of AI is",
          "max_tokens": 50,
          "temperature": 0
      }'
  ```

  And the **Chat Completions API**:
  ```bash
  curl http://localhost:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.6",
          "messages": [{"role": "user", "content": "The future of AI is"}],
          "max_completion_tokens": 1024,
          "temperature": 0.7,
          "top_p": 0.95
      }'
  ```

  Expected: HTTP 200 OK with a `choices` field carrying generated text.

evaluation:
  accuracy:
    content: |-
      ### Using AISBench (recommended)

      Follow the vllm-ascend AISBench guide with `--served-model-name qwen3.6`. The upstream tutorial publishes an accuracy table only for Qwen3.5-27B-w8a8 (gsm8k 96.74) and states that Qwen3.6-27B "can be obtained in the same way and is not listed here" — so no Qwen3.6-27B number exists upstream, and none is claimed here.

      ### Using Language Model Evaluation Harness (lm_eval)

      ```shell
      lm_eval \
        --model local-completions \
        --model_args model=qwen3.6,base_url=http://127.0.0.1:8000/v1/completions,tokenized_requests=False,trust_remote_code=True \
        --tasks gsm8k \
        --output_path ./
      ```
  performance:
    content: |-
      ### Using AISBench

      See the vllm-ascend AISBench performance-evaluation guide.

      ### Using vllm bench serve

      ```bash
      export VLLM_USE_MODELSCOPE=True
      vllm bench serve --model Eco-Tech/Qwen3.6-27B-w8a8 \
        --dataset-name random --random-input 200 --num-prompts 200 \
        --request-rate 1 --save-result --result-dir ./
      ```

      No throughput or latency figures are published for this recipe on Ascend.

tuning: |-
  ### Parallelism strategy (DP-first)

  `Qwen3.6-27B-w8a8` is roughly 30 GB, so it fits on a single 64 GB HBM die. Keep **TP=2** as the default on Atlas 800 A2/A3 and give the remaining dies to DP. **TP=8 is only for 256K+ context**, where sharding the KV cache across eight dies is what makes the window reachable. On Ascend 950DT the C8 checkpoint fits one 96 GB die, so **TP=1 + DP=8** is the throughput default.

  **Atlas 300I DUO**: TP only — TP=2 or TP=4, FP16 runtime, `--max-model-len` capped at 16384 here (raise it only after checking HBM headroom).

  | Scenario | Deployment | NPUs | Weight | Notes |
  |----------|------------|------|--------|-------|
  | High Throughput (128K ctx) | Single-Node A2 | 8 | Qwen3.6-27B-w8a8 | TP=2 + DP=4 — uses all 8 NPUs for parallel request batches |
  | High Throughput (128K ctx) | Single-Node A3 | 16 | Qwen3.6-27B-w8a8 | TP=2 + DP=8 — uses all 16 NPUs for parallel request batches |
  | Low Latency (128K ctx) | Single-Node A3 | 16 | Qwen3.6-27B-w8a8 | TP=2 + DP=8, `--max-num-seqs 4` — lower per-layer Allreduce overhead for small interactive batches |
  | Long Context (256K+ ctx) | Single-Node A3 | 16 | Qwen3.6-27B-w8a8 | TP=8 + DP=2 — shards the KV cache across 8 NPUs |
  | High Throughput (128K ctx) | Single-Node 950DT | 8 | Qwen3.6-27B-w8a8c8-mxfp8 | TP=1 + DP=8 with `--kv-cache-dtype mxfp8` |
  | Long Context (256K+ ctx) | Single-Node 950DT | 8 | Qwen3.6-27B-w8a8c8-mxfp8 | TP=1 + DP=8, raise `--max-model-len` to 262144 |
  | Short context, FP16 | Single-Node 300I DUO | 2-8 | Qwen3.6-27B-W8A8-310P | TP=2 or TP=4, `--dtype float16` |

  | Scenario | Config | TP | DP | Max Num Seqs | Max Num Batched Tokens | Max Model Len | MTP Num | Async Scheduling |
  |----------|--------|----|----|--------------|------------------------|---------------|---------|-------------------|
  | High Throughput (128K) | Single-Node A2 | 2 | 4 | 32 | 16384 | 133000 | 3 | On |
  | High Throughput (128K) | Single-Node A3 | 2 | 8 | 32 | 16384 | 133120 | 3 | On |
  | Low Latency (128K) | Single-Node A3 | 2 | 8 | 4 | 4096 | 133120 | 3 | On |
  | Long Context (256K+) | Single-Node A3 | 8 | 2 | 8 | 8192 | 262144 | 3 | On |
  | High Throughput (128K) | Single-Node 950DT | 1 | 8 | 32 | 16384 | 153600 | 3 | On |
  | Long Context (256K+) | Single-Node 950DT | 1 | 8 | 32 | 16384 | 262144 | 3 | On |
  | Short context | Single-Node 300I DUO | 2-4 | 1 | 128 | 8192 | 16384 | 1 | Off |

  ### Key levers

  - `--gpu-memory-utilization`: raise it to grow the KV cache; too high risks OOM because the warm-up peak differs from steady-state usage.
  - `--max-num-batched-tokens`: larger means lower latency but more activation HBM.
  - `--kv-cache-dtype mxfp8`: required by the W8A8C8 checkpoint; only supported on 950PR/950DT products, and it forces `--block-size` to a multiple of 512.
  - `--speculative-config`: both Qwen3.5-27B and Qwen3.6-27B use `qwen3_5_mtp`; on Atlas 300I DUO set `num_speculative_tokens` to 1.
  - `--compilation-config cudagraph_mode=FULL_DECODE_ONLY`: recommended; `PIECEWISE` is the alternative. On Atlas 300I DUO use at most two capture sizes.
  - `--additional-config '{"enable_cpu_binding": true, "enable_flashcomm1": true}'`: CPU binding plus FlashComm1 (splits the TP AllReduce into Reduce-Scatter/All-Gather) on Ascend 950DT.

