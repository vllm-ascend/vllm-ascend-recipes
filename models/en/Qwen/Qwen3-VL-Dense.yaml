meta:
  title: "Qwen3-VL-Dense"
  slug: "qwen3-vl-dense"
  provider: "Qwen"
  description: "Qwen3-VL dense vision-language models (8B / 32B) for image-text understanding. Migrated from the vLLM-Ascend tutorial, covering Atlas 800 A2/A3, Atlas 300I DUO, and Ascend 950DT W8A8 single-node serve."
  date_added: "2026-10-19"
  date_updated: "2026-10-19"
  difficulty: intermediate
  tasks:
    - multimodal
  performance_headline: "Single-node dense VL serve on A2/A3, 300I DUO, and 950DT W8A8"
  related_recipes:
    - "qwen3-vl-30b-a3b-instruct"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    atlas_300i_duo: verified
    ascend_950dt: verified

model:
  model_id: "Qwen/Qwen3-VL-8B-Instruct"
  min_vllm_version: "0.18.0"
  architecture: dense
  parameter_count: "8B"
  active_parameters: null
  context_length: 256000
  modality: multimodal
  base_args:
    - "--served-model-name"
    - "qwen3vl"
    - "--trust-remote-code"
    - "--no-enable-prefix-caching"
    - "--mm-processor-cache-gb"
    - "0"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    VLLM_USE_MODELSCOPE: "True"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0-310p"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=1g -v /root/.cache:/root/.cache --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -it quay.io/ascend/vllm-ascend:v0.23.0-a3 bash"
      note: "Pick the image tag for your hardware (A2 / A3 / 310p / a5). Full device mounts are in env_setup.container."

features:
  prefix_caching:
    label: "Prefix Caching"
    description: "Disabled in the tutorial image baseline."
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  compilation_config:
    label: "Compilation Config"
    description: "FULL_DECODE_ONLY ACLGraph replay from the tutorial. Use --enforce-eager on older CANN or when graphs are unavailable."
    args:
      - "--compilation-config"
      - "{\"cudagraph_mode\": \"FULL_DECODE_ONLY\", \"cudagraph_capture_sizes\": [1,2,4,8,16,32]}"
  async_scheduling:
    label: "Async Scheduling"
    description: "Tutorial throughput knob for A2/A3/950DT baselines."
    args: ["--async-scheduling"]

opt_in_features: [prefix_caching]

variants:
  default:
    precision: bf16
    vram_minimum_gb: 20
    description: "BF16 Qwen3-VL-8B-Instruct (1 card on A2/A3/300I DUO)"
  vl_8b_w8a8:
    model_id: "vllm-ascend/Qwen3-VL-8B-Instruct-W8A8"
    precision: W8A8
    vram_minimum_gb: 16
    description: "W8A8 Qwen3-VL-8B (1 card on 950DT). Tutorial Eco-Tech mxfp8 id is 404; use this ascend W8A8 checkpoint."
  vl_32b:
    model_id: "Qwen/Qwen3-VL-32B-Instruct"
    precision: bf16
    vram_minimum_gb: 64
    description: "BF16 Qwen3-VL-32B-Instruct (2 cards on A2/A3)"
  vl_32b_w8a8:
    model_id: "Eco-Tech/Qwen3-VL-32B-Instruct-w8a8-QuaRot"
    precision: W8A8
    vram_minimum_gb: 48
    description: "W8A8 Qwen3-VL-32B (1 card on 950DT). Tutorial Eco-Tech mxfp8 id is 404; use the public QuaRot W8A8 checkpoint."

compatible_strategies:
  - single_node_A3
  - single_node_A2
  - single_node_310p
  - single_node_A5

hardware_overrides: {}
strategy_overrides: {}
dependencies: []
guide: ""

config_params:
  max_model_len:
    default: 32768
    type: number
    description: "Maximum context length. Lower this (for example 4096) on memory-tight smokes."
  max_num_seqs:
    default: 128
    type: number
    description: "Maximum concurrent sequences."
  max_num_batched_tokens:
    default: 16384
    type: number
    description: "Maximum tokens batched per step."
  gpu_memory_utilization:
    default: 0.91
    type: number
    description: "Fraction of NPU HBM reserved for the engine."
  port:
    default: 8000
    type: number
    description: "HTTP listen port."

overview: |-
  Qwen3-VL Dense is the dense vision-language line of Qwen3-VL (8B / 32B Instruct). This recipe migrates the official vLLM-Ascend tutorial into EN/ZH recipes: BF16 single-card 8B on A2/A3 and Atlas 300I DUO, BF16 two-card 32B on A2/A3, and W8A8 single-card 8B/32B on 950DT products. Atlas inference products need vLLM-Ascend 0.18.0+; 950DT needs v0.23.0rc1+.

