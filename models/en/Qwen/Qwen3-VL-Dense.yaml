prerequisites:
  - title: Model Weight
    content: |-
      | Weight Version | Hardware | Download |
      |----------------|----------|----------|
      | `Qwen3-VL-8B-Instruct` | 1 card A2 / A3 / 300I DUO | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-8B-Instruct) |
      | `Qwen3-VL-8B-Instruct-W8A8` | 1 card 950DT | [ModelScope](https://www.modelscope.cn/models/vllm-ascend/Qwen3-VL-8B-Instruct-W8A8) |
      | `Qwen3-VL-32B-Instruct` | 2 cards A2 / A3 | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-32B-Instruct) |
      | `Qwen3-VL-32B-Instruct-w8a8-QuaRot` | 1 card 950DT | [ModelScope](https://www.modelscope.cn/models/Eco-Tech/Qwen3-VL-32B-Instruct-w8a8-QuaRot) |

      The tutorial `Eco-Tech/...-w8a8-mxfp8` links currently 404 on ModelScope. Use the W8A8 replacements above.

env_setup:
  container:
    A3:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
        docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true \
          --device /dev/davinci0 --device /dev/davinci1 \
          --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    A2:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0
        docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true \
          --device /dev/davinci0 --device /dev/davinci_manager \
          --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    300I DUO:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-310p
        docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true \
          --device /dev/davinci0 --device /dev/davinci_manager \
          --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    A5:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a5
        docker run --rm --name vllm-ascend --net=host --shm-size=1g --privileged=true \
          --device /dev/davinci0 --device /dev/davinci_manager --device /dev/hisi_hdc \
          --device /dev/ummu --device /dev/uburma \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -itd $IMAGE bash
        ```
  pip:
    content: |-
      Prefer the prebuilt Ascend image. For source installs see the [Installation Guide](https://docs.vllm.ai/projects/ascend/en/latest/installation.html). On A3 use the A3 wheel / image.

scenarios:
  - npu: Atlas 800I A3
    precision: bf16
    deployment: Single-Node
    case: 8B Single Card
    tags: [a3-8b]
    strategy: single_node_A3
    steps:
      - title: Start the server
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-8B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype bfloat16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --data-parallel-size 1 \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens {{max_num_batched_tokens}} \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --async-scheduling \
            --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1,2,4,8,16,32]}' \
            --mm-processor-cache-gb 0
          ```

          For a quick smoke, prefer `--enforce-eager`, `--max-model-len 8192`, `--max-num-batched-tokens 4096`, `--max-num-seqs 4`, and `--gpu-memory-utilization 0.6`.
      - title: Service Verification
        content: |-
          Use the image chat request in the verification section. Expect HTTP 200 and content mentioning `TONGYI Qwen`.
  - npu: Atlas 800I A3
    precision: bf16
    deployment: Single-Node
    case: 32B Two Cards
    tags: [a3-32b]
    strategy: single_node_A3
    steps:
      - title: Start the server
        content: |-
          Qwen3-VL-32B-Instruct needs two cards (TP=2) on A2/A3 / Atlas inference products.

          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0,1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-32B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype bfloat16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 2 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.8 \
            --enforce-eager \
            --mm-processor-cache-gb 0
          ```
      - title: Service Verification
        content: |-
          Use the image chat request in the verification section.
  - npu: Atlas 800I A2
    precision: bf16
    deployment: Single-Node
    case: 8B Single Card (A2)
    tags: [a2-8b]
    strategy: single_node_A2
    steps:
      - title: Start the server
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-8B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype bfloat16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens {{max_num_batched_tokens}} \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --async-scheduling \
            --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1,2,4,8,16,32]}' \
            --mm-processor-cache-gb 0
          ```
      - title: Service Verification
        content: |-
          Use the image chat request in the verification section.
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: Single-Node
    case: 8B Single Card
    tags: [310p-8b]
    strategy: single_node_310p
    steps:
      - title: Start the server
        content: |-
          On Atlas 300I DUO only `float16` is supported. Disable `enable_npugraph_ex`. On CANN older than 9.0.0 use `--enforce-eager` instead of graph compilation.

          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-8B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype float16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.7 \
            --enforce-eager \
            --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}' \
            --mm-processor-cache-gb 0
          ```

          Tutorial 32B is two full cards on A2/A3 / Atlas inference products, not 300I DUO. Dual-die TP=2 on one 300I DUO was observed to hang after load.
      - title: Service Verification
        content: |-
          Use the image chat request in the verification section.
  - npu: Ascend 950DT
    precision: W8A8
    deployment: Single-Node
    case: 8B W8A8 Single Card
    tags: [a5-8b-w8a8]
    strategy: single_node_A5
    steps:
      - title: Start the server
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve vllm-ascend/Qwen3-VL-8B-Instruct-W8A8 \
            --host 0.0.0.0 \
            --port {{port}} \
            --quantization ascend \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.8 \
            --enforce-eager \
            --mm-processor-cache-gb 0
          ```
      - title: Service Verification
        content: |-
          Use the image chat request in the verification section.
  - npu: Ascend 950DT
    precision: W8A8
    deployment: Single-Node
    case: 32B W8A8 Single Card
    tags: [a5-32b-w8a8]
    strategy: single_node_A5
    steps:
      - title: Start the server
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Eco-Tech/Qwen3-VL-32B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port {{port}} \
            --quantization ascend \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.8 \
            --enforce-eager \
            --mm-processor-cache-gb 0
          ```
      - title: Service Verification
        content: |-
          Use the image chat request in the verification section.

verification: |-
  Once the server is up:

  ```bash
  curl http://127.0.0.1:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "qwen3vl",
      "messages": [
        {"role": "system", "content": "You are a helpful assistant."},
        {"role": "user", "content": [
          {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
          {"type": "text", "text": "What is the text in the illustration?"}
        ]}
      ],
      "max_completion_tokens": 100,
      "temperature": 0
    }'
  ```

  Expected: HTTP 200 with assistant content containing `TONGYI Qwen`.

evaluation:
  accuracy:
    content: |-
      A2 / A3 `mmmu_val` via lm_eval (tutorial reference on vllm-ascend 0.11.0rc3: about 0.5389):

      ```bash
      lm_eval --model vllm-vlm \
        --model_args pretrained=Qwen/Qwen3-VL-8B-Instruct,max_model_len=8192,gpu_memory_utilization=0.7 \
        --tasks mmmu_val --batch_size 32 --apply_chat_template --trust_remote_code \
        --output_path ./results
      ```

      Atlas 300I DUO AISBench `text_vqa` (tutorial reference on v0.23.0rc1: about 80.57):

      ```bash
      ais_bench --models vllm_api_general_chat --datasets textvqa_gen_base64 --mode all --debug
      ```

performance:
  benchmark: |-
    ```bash
    vllm bench serve \
      --backend openai-chat \
      --model Qwen/Qwen3-VL-8B-Instruct \
      --endpoint /v1/chat/completions \
      --dataset-name random \
      --num-prompts 100 \
      --request-rate 1 \
      --save-result \
      --result-dir ./
    ```

tuning: |-
  Cap `--max-model-len` when KV cache OOMs. On 300I DUO keep TP=1 for the 8B row. Triton `target_info` warnings on 950PR do not block `--enforce-eager` W8A8 serve. If ACLGraph is unavailable, replace `--compilation-config` and `--async-scheduling` with `--enforce-eager`.

