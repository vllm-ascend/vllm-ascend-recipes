meta:
  title: "Qwen3-Omni-30B-A3B-Thinking"
  slug: "qwen3-omni-30b-a3b-thinking"
  provider: "Qwen"
  description: "A 30.5B-parameter omni-modal Mixture-of-Experts model (3.3B activated per token) that accepts text, images, audio, and video and returns text with chain-of-thought reasoning."
  date_added: 2026-11-19
  performance_headline: "Single-node BF16 deployment on Atlas 800I A3 for high throughput, low latency, and 128K long context"
  difficulty: advanced
  hardware:
    atlas_800_a3: verified

model:
  model_id: "Qwen/Qwen3-Omni-30B-A3B-Thinking"
  min_vllm_version: "0.30.0"
  architecture: moe
  parameter_count: "30.5B"
  active_parameters: "3.3B"
  context_length: 65536
  modality: "text, image, audio, video"
  base_args:
    - "--trust-remote-code"
  base_env:
    HCCL_BUFFSIZE: "1024"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g -v /models:/models --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 -it quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler bash"
      note: "Official Ascend image; full device/driver mounts are covered in env_setup.container."

features:
  expert_parallel:
    description: "MoE expert parallelism across the TP ranks (scenarios that use TP4)"
    args: ["--enable-expert-parallel"]
  compilation_config:
    label: "Compilation Config"
    description: "Full ACL graph execution in decode (--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode": "FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "Asynchronous scheduling to overlap CPU scheduling with NPU computation"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV-cache prefix caching (disabled by default in the validated scenarios)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

  spec_decoding:
    label: "Eagle3 Spec Decoding"
    description: "Optional Eagle3 speculative decoding; replace your_eagle3_model_path with the downloaded draft model path"
    args: ["--speculative-config", '{"method": "eagle3", "model": "your_eagle3_model_path", "num_speculative_tokens": 3}']

opt_in_features:
  - prefix_caching
  - spec_decoding

variants:
  default:
    model_id: "Qwen/Qwen3-Omni-30B-A3B-Thinking"
    precision: BF16
    vram_minimum_gb: 64
    description: "Official BF16 checkpoint; the default and CI-verifiable configuration on Atlas 800I A3"
  w8a8:
    precision: W8A8
    vram_minimum_gb: 32
    description: "Optional W8A8 weights quantized locally from the official BF16 checkpoint with msmodelslim"

compatible_strategies:
  - single_node_A3

hardware_overrides: {}
strategy_overrides: {}

dependencies:
  - note: "Optional Eagle3 draft model for speculative decoding (replace your_eagle3_model_path)"
    command: "pip install modelscope && modelscope download --model AngelSlim/Qwen3-a3B_eagle3"
    optional: true

guide: ""

config_params:
  max_model_len:
    default: 37364
    type: number
    description: "Maximum context length (input + output tokens)"
  max_num_seqs:
    default: 100
    type: number
    description: "Maximum number of concurrent sequences"
  gpu_memory_utilization:
    default: 0.95
    type: number
    description: "Fraction of NPU memory available for the KV cache"

overview: |-
  Qwen3-Omni-30B-A3B-Thinking is the thinker variant of Qwen3-Omni: a native end-to-end omni-modal Mixture-of-Experts model with 30.5B total parameters and 3.3B activated per token. It accepts text, images, audio, and video, produces text output, and exposes chain-of-thought reasoning. This recipe covers the three single-node scenarios from the upstream tutorial: high throughput (TP2), low latency (TP4 with expert parallelism), and long context (TP4 with 131072 tokens and YaRN). All validated scenarios use the public official BF16 checkpoint and require no local weight conversion.

weight_download:
- weight_version: BF16
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Qwen/Qwen3-Omni-30B-A3B-Thinking
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model Qwen/Qwen3-Omni-30B-A3B-Thinking
      ```
  - source: HuggingFace
    url: https://huggingface.co/Qwen/Qwen3-Omni-30B-A3B-Thinking
    command: |-
      ```bash
      pip install -U huggingface_hub
      huggingface-cli download Qwen/Qwen3-Omni-30B-A3B-Thinking
      ```
  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''
- weight_version: W8A8 (quantized locally with msmodelslim)
  sources:
  - source: msmodelslim
    url: https://gitcode.com/Ascend/msmodelslim
    command: |-
      ```bash
      git clone https://gitcode.com/Ascend/msmodelslim.git
      # Quantize the BF16 checkpoint to W8A8 following the quantization guide below.
      ```
  - source: HuggingFace
    url: ''
    command: ''
  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''
- weight_version: Eagle3 Draft Model (optional)
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/AngelSlim/Qwen3-a3B_eagle3
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model AngelSlim/Qwen3-a3B_eagle3
      ```
  - source: HuggingFace
    url: https://huggingface.co/AngelSlim/Qwen3-a3B_eagle3
    command: |-
      ```bash
      pip install -U huggingface_hub
      huggingface-cli download AngelSlim/Qwen3-a3B_eagle3
      ```
  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''

quantization:
  content: |-
    No public W8A8 checkpoint is published for this model; the validated W8A8 weights were produced from the official BF16 checkpoint with **msmodelslim**. The quantized checkpoint keeps the following hybrid layout:

    - **Embedding layer**: BF16 (not quantized)
    - **Q/K normalization** (`q_norm`, `k_norm`): BF16
    - **Attention projections** (`q/k/v/o_proj`): static W8A8 with per-tensor scales; biases remain BF16
    - **MoE routing gate** (`mlp.gate`): BF16
    - **MoE expert projections** (`gate/up/down_proj`): dynamic W8A8

    Follow the [Quantization Guide](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/feature_guide/quantization.html) and keep the generated directory layout unchanged so that `--quantization ascend` can load it.

prerequisites:
- title: Model Weight
  content: |-
    | Model | Hardware Requirement | Download |
    | --- | --- | --- |
    | Qwen3-Omni-30B-A3B-Thinking (BF16) | Atlas 800I A3 (64GB, 1~2 cards) | [Download](https://www.modelscope.cn/models/Qwen/Qwen3-Omni-30B-A3B-Thinking) |
    | Qwen3-Omni-30B-A3B-Thinking-W8A8 | Atlas 800I A3 (64GB, 1~2 cards) | Quantize locally with msmodelslim |
    | Eagle3 Draft Model (optional) | Atlas 800I A3 | [Download](https://www.modelscope.cn/models/AngelSlim/Qwen3-a3B_eagle3) |

    The card counts are recommendations. Keep the weights in a shared directory visible to the container.
- title: Driver and Firmware
  content: |-
    Install the Ascend driver and firmware on the host before starting the container, and install the matching Ascend HDK toolkit inside the container. Refer to the [Ascend HDK installation guide](https://www.hiascend.com/document) for supported versions.

env_setup:
  container:
    A3:
      content: |-
        Use the official vLLM-Ascend all-in-one image validated for this recipe.

        **Docker Pull:**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
        ```

        **Docker Run:**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler

        docker run \
            --name vllm-ascend-env \
            --shm-size=128g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /models:/models \
            -it -d $IMAGE bash
        ```

        > **Note**: Atlas 800I A3 has 8 NPUs with a dual-die design (16 chips). This recipe uses at most 4 chips (`/dev/davinci0` to `/dev/davinci3`). Add more device mounts to expose the remaining chips.

scenarios:
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: High Throughput
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      Two-chip tensor-parallel deployment (TP2) maximizes aggregate throughput for many concurrent requests while keeping the official BF16 weights resident across two chips.

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=1024
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve your_model_path \
          --served-model-name qwen3-omni \
          --trust-remote-code \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens 16384 \
          --tensor-parallel-size 2 \
          --distributed_executor_backend "mp" \
          {{prefix_caching}} \
          {{async_scheduling}} \
          {{compilation_config}} \
          --additional-config '{"enable_flashcomm1": false}' \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --port 8000 \
          {{spec_decoding}}
      ```

      > - No `--quantization` flag is needed: the official BF16 checkpoint is loaded as floating-point weights.
      > - Prefix caching is disabled in the validated configuration.
      > - Omni multimodal inputs are processed by the same OpenAI-compatible endpoint; no extra server flag is needed.
  - title: Verify the service
    content: |-
      ```bash
      curl http://localhost:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "qwen3-omni",
              "messages": [
                  {"role": "user", "content": "Reply with exactly one word: OK"}
              ],
              "temperature": 0,
              "max_tokens": 64
          }'
      ```

      Expected result: HTTP 200 with a non-empty `choices` array.

      For multimodal input, send an `image_url`, `input_audio`, or `video_url` content part in the same message. A validated example combined one image, one audio clip, and one video clip in a single request and received a coherent description.
  - title: Benchmark
    content: |-
      ```bash
      vllm bench serve \
          --model your_model_path \
          --served-model-name qwen3-omni \
          --host 127.0.0.1 \
          --port 8000 \
          --dataset-name random \
          --random-input-len 200 \
          --random-output-len 512 \
          --num-prompts 200 \
          --max-concurrency 32 \
          --seed 1234 \
          --ignore-eos \
          --save-result \
          --result-dir ./
      ```

      Measured on Atlas 800I A3 with the v0.30.0 image and the official BF16 checkpoint: 200/200 successful requests, 960.72 output tok/s, mean TTFT 293.05 ms, mean TPOT 30.60 ms.
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: Low Latency
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      Four-chip tensor parallelism with expert parallelism reduces per-token latency. FlashComm1 is disabled for this model, matching the upstream tutorial.

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=1024
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve your_model_path \
          --served-model-name qwen3-omni \
          --trust-remote-code \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens 16384 \
          --tensor-parallel-size 4 \
          --enable-expert-parallel \
          --distributed_executor_backend "mp" \
          {{prefix_caching}} \
          {{async_scheduling}} \
          {{compilation_config}} \
          --additional-config '{"enable_flashcomm1": false}' \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --port 8000 \
          {{spec_decoding}}
      ```

      > - Assign four chips to `ASCEND_RT_VISIBLE_DEVICES`; TP4 maps one rank to each chip.
      > - `--enable-expert-parallel` distributes the MoE experts across the four ranks.
  - title: Verify the service
    content: |-
      ```bash
      curl http://localhost:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "qwen3-omni",
              "messages": [
                  {"role": "user", "content": "Describe the color red in one short sentence."}
              ],
              "temperature": 0,
              "max_tokens": 128
          }'
      ```

      Expected result: HTTP 200 with a non-empty `choices` array.
  - title: Benchmark
    content: |-
      ```bash
      vllm bench serve \
          --model your_model_path \
          --served-model-name qwen3-omni \
          --host 127.0.0.1 \
          --port 8000 \
          --dataset-name random \
          --random-input-len 200 \
          --random-output-len 128 \
          --num-prompts 200 \
          --request-rate 1 \
          --seed 1234 \
          --ignore-eos \
          --save-result \
          --result-dir ./
      ```

      Measured on Atlas 800I A3 with the v0.30.0 image and the official BF16 checkpoint: 200/200 successful requests, 126.89 output tok/s, mean TTFT 168.74 ms, mean TPOT 15.92 ms.
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: Long Context
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      The long-context scenario keeps TP4 with expert parallelism, raises the context limit to 131072 tokens with YaRN, and lowers `--max-num-seqs` to 14. vLLM-Ascend v0.30.0 validates `max_position_embeddings` strictly, so `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1` is required when the requested length exceeds the checkpoint value.

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=1024
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

      vllm serve your_model_path \
          --served-model-name qwen3-omni \
          --trust-remote-code \
          --max-num-seqs 14 \
          --max-model-len 131072 \
          --max-num-batched-tokens 16384 \
          --tensor-parallel-size 4 \
          --enable-expert-parallel \
          --distributed_executor_backend "mp" \
          {{prefix_caching}} \
          {{async_scheduling}} \
          {{compilation_config}} \
          --additional-config '{"enable_flashcomm1": false}' \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --port 8000 \
          --hf-overrides '{"rope_parameters": {"rope_type": "yarn", "factor": 2, "original_max_position_embeddings": 65536}}' \
          {{spec_decoding}}
      ```

      > - `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1` is needed because the checkpoint declares 65536 positions while the scenario requests 131072.
      > - Reduce `--max-num-seqs` further if the KV cache approaches the NPU memory limit.
  - title: Verify the service
    content: |-
      Send a prompt longer than 65536 tokens and check that the response is coherent and does not time out.

      ```bash
      curl http://localhost:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "qwen3-omni",
              "messages": [
                  {"role": "user", "content": "Summarize the main idea of the text above in one sentence."}
              ],
              "temperature": 0,
              "max_tokens": 128
          }'
      ```

      Expected result: HTTP 200 with a non-empty `choices` array.
  - title: Benchmark
    content: |-
      ```bash
      vllm bench serve \
          --model your_model_path \
          --served-model-name qwen3-omni \
          --host 127.0.0.1 \
          --port 8000 \
          --dataset-name random \
          --random-input-len 8192 \
          --random-output-len 256 \
          --num-prompts 20 \
          --max-concurrency 4 \
          --seed 1234 \
          --ignore-eos \
          --save-result \
          --result-dir ./
      ```

      The benchmark above completed 20/20 requests with 201.30 output tok/s, mean TTFT 864.92 ms, and mean TPOT 16.54 ms. A single 70,025-token request returned the correct animal name (`fox`) in 5.93 s, with no error or timeout.

verification: |-
  After the service is started, send a chat request. Replace `<port>` with the port from the `vllm serve` command.

  ```bash
  curl http://localhost:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3-omni",
          "messages": [
              {"role": "user", "content": "Give me a short introduction to large language models."}
          ],
          "temperature": 0.6,
          "top_p": 0.95,
          "max_tokens": 512
      }'
  ```

  Expected result: HTTP 200 with a JSON body containing a non-empty `choices` field.

evaluation:
  accuracy:
    content: |-
      ### Using EvalScope

      EvalScope supports OpenAI-compatible endpoints and the OmniBench dataset:

      ```bash
      python3 -m venv /root/eval-venv
      /root/eval-venv/bin/pip install -U "numpy>=2.0" evalscope
      /root/eval-venv/bin/evalscope eval \
          --model qwen3-omni \
          --api-url http://127.0.0.1:8000/v1 \
          --api-key EMPTY \
          --eval-type openai_api \
          --datasets omni_bench gsm8k bbh \
          --dataset-args '{"omni_bench": {"extra_params": {"use_image": true, "use_audio": false}}}' \
          --limit 100 \
          --eval-batch-size 4 \
          --generation-config '{"max_tokens": 10000, "temperature": 0.6}'
      ```

      **Accuracy results (Atlas 800I A3, vLLM-Ascend v0.30.0, W8A8, 100 samples per dataset):**

      | Dataset | Metric | Score |
      | --- | --- | --- |
      | OmniBench (image) | accuracy | 49.00% |
      | GSM8K | accuracy | 99.00% |
      | BBH | accuracy | not completed |

      The two completed datasets match the upstream tutorial reference (v0.22.1rc, W8A8):
      OmniBench 0.44 and GSM8K 0.98. BBH was not completed because EvalScope expands
      --limit 100 to 100 samples per BBH subtask (2700 total), which exceeded the
      validation time budget; the tutorial reference is 0.9148.

performance:
  accuracy: |-
    ### Using EvalScope

    See the evaluation section for the command. The accuracy table below is an optional W8A8 reference measured against the TP1 W8A8 service. The default BF16 configuration was validated functionally and for performance in this cycle; its accuracy was not re-measured.

  benchmark: |-
    ### Measured Results

    All numbers below were collected on one Atlas 800I A3 node (16 chips available; at most 4 used) with `quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler`.

    | Scenario | TP | Requests | Concurrency | Output tok/s | Mean TTFT (ms) | Mean TPOT (ms) |
    | --- | --- | --- | --- | --- | --- | --- |
    | High Throughput | 2 | 200/200 | 32 | 960.72 | 293.05 | 30.60 |
    | Low Latency | 4 | 200/200 | 1 QPS | 126.89 | 168.74 | 15.92 |
    | Long Context | 4 | 20/20 | 4 | 201.30 | 864.92 | 16.54 |

    Benchmark shapes: 200 input / 512 output tokens at concurrency 32 for high throughput; 200 input / 128 output tokens at 1 request per second for low latency; 8192 input / 256 output tokens at concurrency 4 for long context, plus a 70,025-token functional request. All numbers use the official BF16 checkpoint.

    ### Scenario Overview

    | Scenario | Deployment Mode | Total NPUs | Weight Version | Key Considerations |
    | --- | --- | --- | --- | --- |
    | High Throughput | Single-Node (TP2) | 2 (A3) | BF16 | Two-chip TP keeps the official weights resident while maximizing concurrent request processing |
    | Low Latency | Single-Node (TP4) | 2 (A3) | BF16 | Multi-chip TP with expert parallelism reduces per-token latency |
    | Long Context | Single-Node (TP4) | 2 (A3) | BF16 | Fewer concurrent sequences leave room for a 131072-token context |

    > On Atlas 800I A3 each NPU contains two dies (chips), so TP4 uses 4 chips = 2 NPUs.

tuning: |-
  ### Tuning Guidelines

  - Increase `--max-num-seqs` for throughput until NPU memory or the scheduler becomes the bottleneck.
  - Decrease `--max-num-seqs` and `--max-model-len` when multimodal requests time out.
  - Prefix caching is disabled in the validated scenarios; enable it for workloads with repeated media or prompt prefixes and measure the hit rate first.
  - Refer to the [Performance Tuning Guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) for additional options.

faq: |-
  **Why is `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1` required?** The checkpoint declares 65536 positions. vLLM-Ascend v0.30.0 refuses to start with a larger `--max-model-len` unless this variable is set. The long-context scenario uses it together with the YaRN overrides.

  **Is a public W8A8 checkpoint available?** No. Quantize the official BF16 checkpoint with msmodelslim; the resulting directory can be loaded with `--quantization ascend`. W8A8 is an optional path for memory-constrained deployments and is not part of the CI-verified scenarios.

  **Which precision does CI verify?** BF16. All three scenarios load the public official BF16 checkpoint and need no local weight conversion.

  **Is Eagle3 speculative decoding supported?** Yes. The optional draft model is exposed as an off-by-default `spec_decoding` feature and was functionally validated on Atlas 800I A3 at TP1 (4/4 HTTP 200 responses, no ERROR/Traceback in the logs). Replace `your_eagle3_model_path` with the local draft-model directory before enabling it. The performance tables above remain the non-Eagle3 baseline.

  **Does the Thinking variant return reasoning content?** Yes. The server returns the reasoning trace in the response message; set `max_tokens` high enough to cover both the reasoning and the final answer.

