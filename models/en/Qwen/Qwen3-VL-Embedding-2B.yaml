meta:
  title: 'Qwen3-VL-Embedding-2B'
  slug: 'qwen3-vl-embedding-2b'
  provider: 'Qwen'
  description: 'A 2B vision-language embedding model in the Qwen3 series, producing vector representations for text and multimodal inputs for retrieval and similarity tasks, with single-card deployment on Ascend NPUs.'
  date_added: 2026-10-14
  difficulty: beginner
  performance_headline: 'Single-node single-card pooling deployment on Atlas 800I A2 / Atlas 300I DUO with vLLM-Ascend'
  hardware:
    atlas_800_a2: verified

model:
  model_id: 'Qwen/Qwen3-VL-Embedding-2B'
  min_vllm_version: '0.9.2rc1'
  architecture: dense
  parameter_count: '2B'
  active_parameters: null
  context_length: 32768
  modality: multimodal
  base_args:
    - '--runner'
    - 'pooling'
  docker_image:
    atlas_800_a2: 'quay.io/ascend/vllm-ascend:v0.30.0rc2'
    atlas_800_a3: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-a3'
    ascend_950dt: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-a5'
    atlas_300i_duo: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-310p'
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: 'docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.30.0rc2 bash'
      note: 'Official Ascend image; full device/driver mounts are covered in env_setup.container.'

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_A5
  - single_node_310p

# —— Configurable value params (defaults = tutorial baseline) ——
config_params:
  max_model_len:
    default: 1024
    type: number
    description: 'Maximum context length (input + output tokens). Keep an explicit conservative value, otherwise the attention mask (O(max_model_len^2)) may exceed NPU memory.'

overview: |-
  Qwen3-VL-Embedding-2B is a vision-language embedding model in the Qwen3 series. It produces vector representations for text and multimodal inputs, supporting retrieval, clustering, and similarity ranking across text, image, video, and mixed-modality content. vLLM Ascend 0.9.2rc1 and higher supports this model.
weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Qwen/Qwen3-VL-Embedding-2B
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3-VL-Embedding-2B
          ```
      - source: HuggingFace
        url: https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B
        command: |-
          ```bash
          pip install -U huggingface_hub
          huggingface-cli download Qwen/Qwen3-VL-Embedding-2B
          ```
      - source: Modelers
        url: ''
        command: ''
      - source: GitCode
        url: ''
        command: ''
prerequisites:
  - title: Model Weight
    content: |-
      It is recommended to download the model weight to a shared directory, such as `/root/.cache/`.

      | Weight Version | Download Links |
      | -------------- | -------------- |
      | Qwen3-VL-Embedding-2B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-Embedding-2B) / [HuggingFace](https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B) |
env_setup:
  container:
    A2:
      content: |-
        You can use the official all-in-one Docker image to run `Qwen3-VL-Embedding-2B` directly.

        **Docker Pull:**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
        ```

        **Docker Run:**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        After a successful docker run, you can verify the running container service by executing the `docker ps` command.
    A3:
      content: |-
        You can use the official all-in-one Docker image to run `Qwen3-VL-Embedding-2B` directly.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2-a3

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```
    A5:
      content: |-
        The following command uses the Ubuntu image for Ascend 950DT&950PR Products to start the container.

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2-a5

        docker run --rm \
            --name vllm-ascend \
            --net=host \
            --shm-size=1g \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
