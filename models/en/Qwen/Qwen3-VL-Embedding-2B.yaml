meta:
  title: "Qwen3-VL-Embedding-2B"
  slug: "qwen3-vl-embedding-2b"
  provider: "Qwen"
  description: "A 2B vision-language embedding model for text and multimodal retrieval. Verified single-card pooling on Atlas A3 and Atlas 300I DUO (310P) with vLLM Ascend 0.23.0."
  date_added: "2026-10-19"
  date_updated: "2026-10-19"
  difficulty: beginner
  tasks:
    - multimodal
  performance_headline: "Atlas A3 single-card pooling: LeCaRDv2 0.65931, embeddings bench 153.13 req/s / 30626 tok/s (vLLM Ascend 0.23.0)"
  related_recipes: []
  hardware:
    atlas_800_a3: verified
    atlas_300i_duo: verified
    atlas_800_a2: experimental

model:
  model_id: "Qwen/Qwen3-VL-Embedding-2B"
  min_vllm_version: "0.19.0"
  architecture: dense
  parameter_count: "2B"
  active_parameters: null
  context_length: 1024
  modality: multimodal
  base_args:
    - "--served-model-name"
    - "Qwen/Qwen3-VL-Embedding-2B"
    - "--runner"
    - "pooling"
    - "--max-model-len"
    - "1024"
  base_env:
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    VLLM_USE_MODELSCOPE: "1"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0-310p"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.23.0-310p bash"
      note: "Official Ascend 310P image; full device and driver mounts are in env_setup.container."

features: {}

opt_in_features: []

variants:
  default:
    precision: fp16
    vram_minimum_gb: 8
    description: "BF16 checkpoint. Atlas A3 serve uses default bfloat16 with --enforce-eager; Atlas 300I DUO uses float16."

compatible_strategies:
  - single_node_A3
  - single_node_310p
  - single_node_A2

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: ""

config_params:
  max_model_len:
    default: 1024
    type: number
    description: "Maximum context length. On Atlas 300I DUO set this explicitly; an auto-detected large context allocates an O(max_model_len^2) attention mask and can OOM."

overview: |-
  Qwen3-VL-Embedding-2B is a 2B-parameter vision-language embedding model in the Qwen3 series. It produces vectors for text and mixed multimodal inputs used in retrieval, clustering, and similarity ranking. This recipe migrates the official vLLM Ascend tutorial into structured YAML. Verified end-to-end on Atlas A3 (Ascend910, single die) and Atlas 300I DUO (310P3) with vLLM 0.23.0 / vLLM Ascend 0.23.0. Serve with `--runner pooling`. On Atlas A3 use `--enforce-eager` with the 0.23.0 stack used here; on Atlas 300I DUO also pass `--dtype float16`.

weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Qwen/Qwen3-VL-Embedding-2B
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3-VL-Embedding-2B
          ```
      - source: HuggingFace
        url: https://huggingface.co/Qwen/Qwen3-VL-Embedding-2B
        command: |-
          ```bash
          pip install -U huggingface_hub
          huggingface-cli download Qwen/Qwen3-VL-Embedding-2B
          ```
      - source: Modelers
        url: ""
        command: ""
      - source: GitCode
        url: ""
        command: ""

prerequisites:
  - title: Model Weight
    content: |-
      | Weight Version | Hardware Requirements | Download Links |
      |----------------|------------------------|----------------|
      | BF16 | one Ascend Atlas A3 / Ascend910 64 GB die, one Atlas 300I DUO 48 GB NPU, or one Atlas 800I A2 64 GB NPU | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-Embedding-2B) |

      Download weights to a directory the server can read (for example `/root/.cache/`).

      > **Path description**: Record the local path and pass the same directory to `vllm serve`, or pass the model id with the cache enabled.

env_setup:
  container:
    A3:
      content: |-
        Use the official Ascend image matching vLLM / vLLM Ascend 0.23.0 (this recipe's A3 run used a 0.23.0 venv on Ascend910):

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64 \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        > On this 0.23.0 stack, graph compile failed without `--enforce-eager`. Keep `--enforce-eager` for A3 serve and for MTEB `VllmEncoderWrapper`.
    300I DUO:
      content: |-
        Use the official `-310p` image (this recipe was verified with vLLM / vLLM Ascend 0.23.0):

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-310p

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64 \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        > On Atlas 300I DUO, uninstall `triton-ascend` and `triton` if they are installed: `pip uninstall -y triton-ascend triton`.
    A2:
      content: |-
        Atlas A2 image from the tutorial (experimental here; this recipe's hardware smoke is on 310P):

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64 \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      If you prefer not to use Docker, install `vllm-ascend` from source following the [Installation Guide](https://docs.vllm.ai/projects/ascend/en/latest/installation.html).

scenarios:
  - npu: Atlas A3
    precision: bf16
    deployment: Single-Node
    case: A3 (pooling, TP1, enforce-eager)
    tags: [a3-single]
    strategy: single_node_A3
    steps:
      - title: Start the server
        content: |-
          Atlas A3 single-die pooling (verified on Ascend910 with vLLM / vLLM Ascend 0.23.0). Default dtype is bfloat16.

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve your_model_path \
              --served-model-name Qwen/Qwen3-VL-Embedding-2B \
              --runner pooling \
              --max-model-len {{max_model_len}} \
              --enforce-eager \
              --host 0.0.0.0 \
              --port 8000
          ```

          > - Replace `your_model_path` with the local weight directory or `Qwen/Qwen3-VL-Embedding-2B`.
          > - `--runner pooling` is required. Startup should log `Supported tasks: ['token_embed', 'embed']`.
          > - `--enforce-eager` is required on the verified 0.23.0 stack: without it, engine init failed during torch.compile / custom-op import.
          > - Tutorial A3/A2 command omits `--enforce-eager`; keep this flag when reproducing the numbers below.
      - title: Service Verification
        content: |-
          After startup, send the `/v1/embeddings` request in the verification section.
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: Single-Node
    case: 300I DUO (pooling, TP1)
    tags: [310p-single]
    strategy: single_node_310p
    steps:
      - title: Start the server
        content: |-
          Atlas 300I DUO single-card pooling (verified). One 310P3 die is enough; weights plus runtime used about 21 GB.

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve your_model_path \
              --served-model-name Qwen/Qwen3-VL-Embedding-2B \
              --runner pooling \
              --dtype float16 \
              --max-model-len {{max_model_len}} \
              --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
              --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
              --host 0.0.0.0 \
              --port 8000
          ```

          > - Replace `your_model_path` with the local weight directory or `Qwen/Qwen3-VL-Embedding-2B`.
          > - `--runner pooling` is required. The API advertises tasks `embed` and `token_embed`.
          > - On Atlas 300I DUO, keep `--max-model-len` explicit (tutorial baseline `1024`) and pass `--dtype float16`.
          > - Expect `Application startup complete`. A `No module named 'triton'` warning is expected on 310P.
          > - `--compilation-config` limits cudagraph capture sizes because 310P has fewer hardware streams.
      - title: Service Verification
        content: |-
          After startup, send the `/v1/embeddings` request in the verification section.
  - npu: Atlas 800I A2
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card (A2)
    tags: [a2-single]
    strategy: single_node_A2
    steps:
      - title: Start the server
        content: |-
          Atlas A2 single-card pooling from the official tutorial (experimental in this recipe).

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve your_model_path \
              --served-model-name Qwen/Qwen3-VL-Embedding-2B \
              --runner pooling \
              --max-model-len {{max_model_len}} \
              --port 8000
          ```
      - title: Service Verification
        content: |-
          After startup, send the `/v1/embeddings` request in the verification section.

verification: |-
  After the service is started, request embeddings for the tutorial sentences.

  ```bash
  curl -sS http://localhost:8000/v1/embeddings \
      -H "Content-Type: application/json" \
      -d '{
          "model": "Qwen/Qwen3-VL-Embedding-2B",
          "input": [
              "The capital of China is Beijing.",
              "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."
          ]
      }'
  ```

  Expected result: HTTP 200, `object` is `list`, `data` has two embedding objects, and `usage.prompt_tokens` is 39.

  Verified on Atlas 300I DUO (310P3, float16) with vLLM 0.23.0 / vLLM Ascend 0.23.0: both vectors were returned with dimension 2048. The first two values of each vector match the tutorial sample (`-0.028474265709519386`, `-0.02678542211651802` and `-0.016785264015197754`, `-0.003787524998188019`).

  Verified on Atlas A3 (Ascend910, single die, default bfloat16, `--enforce-eager`, `--max-model-len 1024`): HTTP 200, dimension 2048, `prompt_tokens` 39. Leading values are close to the float16 sample (`-0.028049791231751442`, `-0.026741769164800644` and `-0.016862617805600166`, `-0.0035251593217253685`) and are not bit-identical.

evaluation:
  accuracy:
    content: |-
      The official tutorial evaluates retrieval with MTEB (`VllmEncoderWrapper`, task `LeCaRDv2`, `revision="norm"`, `dtype="float16"`, `max_model_len=10240`). The tutorial does not publish a numeric target.

      Measured on Atlas A3 (Ascend910, single die, vLLM / vLLM Ascend 0.23.0): **LeCaRDv2 0.65931**. The wrapper was started with `enforce_eager=True`, `enable_chunked_prefill=False`, and `encode_kwargs={"batch_size": 1}`. The first attempt with default chunked prefill stalled at 151/159 prompts (AICore idle). Queries 159 and corpus 3795 then finished in about 6.4 minutes.

      ```python
      model = VllmEncoderWrapper(
          model_path,
          revision="norm",
          dtype="float16",
          max_model_len=10240,
          enforce_eager=True,
          enable_chunked_prefill=False,
          max_num_seqs=2,
      )
      tasks = mteb.get_tasks(tasks=["LeCaRDv2"])
      results = mteb.evaluate(model, tasks=tasks, encode_kwargs={"batch_size": 1}, overwrite_strategy="always")
      ```
  performance:
    content: |-
      Measure pooling throughput with the embeddings benchmark:

      ```bash
      vllm bench serve \
          --model Qwen/Qwen3-VL-Embedding-2B \
          --backend openai-embeddings \
          --port 8000 \
          --dataset-name random \
          --endpoint /v1/embeddings \
          --random-input 200 \
          --save-result \
          --result-dir ./
      ```

      | Scenario | Settings | Result |
      | -------- | -------- | ------ |
      | Atlas A3 embeddings bench | `--runner pooling`, `--enforce-eager`, `--max-model-len 1024`, `--backend openai-embeddings`, `--random-input 200`, 1000 requests, no `--request-rate` | 1000/1000 success, 6.53 s, 153.13 req/s, 30626.58 tok/s, mean E2E 4644.98 ms, P99 6426.33 ms |
      | Atlas 300I DUO smoke | `--dtype float16`, `--max-model-len 1024` | One 310P3 die; about 21 GB used |

      The A3 latency is the unlimited-concurrency tutorial command: all 1000 requests are issued together, so they queue. It is not a fixed-rate latency number.

performance:
  accuracy: |-
    Atlas A3 (Ascend910, single die, vLLM Ascend 0.23.0): MTEB LeCaRDv2 0.65931 with float16, max_model_len 10240, enforce_eager, and chunked prefill disabled. Atlas 300I DUO float16 smoke matched the tutorial embedding prefix (dimension 2048).
  benchmark: |-
    Atlas A3 embeddings bench (tutorial command, unlimited request rate, random input 200): 1000/1000 success, 153.13 req/s, 30626.58 tok/s, mean E2E 4644.98 ms, P99 6426.33 ms. Serve flags: pooling, max-model-len 1024, enforce-eager, default bfloat16.

tuning: |-
  ### Tuning Guidelines

  Refer to the [Public Performance Tuning Documentation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html).

faq: |-
  For common environment and installation issues, see the [Public FAQs](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html).

  ### Atlas 300I DUO: startup OOM

  **Cause:** Automatic context length builds an oversized attention mask.

  **Solution:** Set `--max-model-len` explicitly (tutorial baseline `1024`) and serve with `--dtype float16`.

  ### Atlas A3: engine init fails during compile

  **Cause:** On the verified vLLM Ascend 0.23.0 stack, torch.compile / custom-op import failed without eager mode.

  **Solution:** Add `--enforce-eager`. Pass `enforce_eager=True` to `VllmEncoderWrapper` as well.

  ### Atlas A3: MTEB stalls before the corpus finishes

  **Cause:** Default chunked prefill left the engine idle (AICore 0%) around 151/159 prompts.

  **Solution:** Start the wrapper with `enable_chunked_prefill=False` and `max_num_seqs=2`.

  ### Request is not an embedding

  **Cause:** The server was started without `--runner pooling`.

  **Solution:** Restart with `--runner pooling`. Startup should log `Supported tasks: ['token_embed', 'embed']`.

