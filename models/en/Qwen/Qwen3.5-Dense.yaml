meta:
  title: Qwen3.5-Dense (2B / 4B / 9B)
  slug: qwen3.5-dense
  provider: Qwen
  description: Qwen3.5 Dense FP16 deployment on Atlas 300I DUO and Atlas 200I Pro, migrated from the official tutorial.
  date_added: '2026-11-18'
  difficulty: intermediate
  tasks:
    - text
    - multimodal
  hardware:
    atlas_300i_duo: experimental
    atlas_200i_pro: experimental
model:
  model_id: Qwen/Qwen3.5-2B
  architecture: dense
  parameter_count: 2B
  active_parameters: null
  context_length: 262144
  modality: text, image, video
  base_args:
    - --host
    - 127.0.0.1
    - --port
    - '8080'
    - --tensor-parallel-size
    - '1'
    - --served-model-name
    - qwen3.5
    - --max-num-seqs
    - '32'
    - --max-model-len
    - '16384'
    - --trust-remote-code
    - --gpu-memory-utilization
    - '0.90'
    - --mamba-ssm-cache-dtype
    - float16
    - --dtype
    - float16
    - --compilation-config
    - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}'
    - --additional-config
    - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
  base_env:
    VLLM_USE_MODELSCOPE: 'True'
  docker_image:
    atlas_300i_duo: quay.io/ascend/vllm-ascend:main-310p
    atlas_200i_pro: quay.io/ascend/vllm-ascend:main-310p
  install:
    pip: false
features:
  spec_decoding:
    label: MTP speculative decoding
    description: 'Tutorial baseline: one speculative token using qwen3_5_mtp.'
    args:
      - --speculative-config
      - '{"method": "qwen3_5_mtp","num_speculative_tokens":1}'
variants:
  default:
    precision: fp16
    vram_minimum_gb: 5
  4b:
    model_id: Qwen/Qwen3.5-4B
    precision: fp16
    vram_minimum_gb: 10
  9b:
    model_id: Qwen/Qwen3.5-9B
    precision: fp16
    vram_minimum_gb: 22
compatible_strategies:
  - single_node_310p
config_params:
  max_model_len:
    default: 16384
    type: number
    description: Input plus output context length; lower if memory is insufficient.
  max_num_seqs:
    default: 32
    type: number
    description: Maximum concurrent requests; lower if memory is insufficient.
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: Fraction of device memory allocated to vLLM.
overview:
  Qwen3.5-2B, 4B and 9B are dense multimodal models with gated delta networks and full attention. This recipe
  preserves the official single-node TP deployment on Atlas 300I DUO and Atlas 200I Pro. The checkpoint context
  is 262144 tokens; the tutorial deployment uses only 16384. Target-hardware inference, MTP, accuracy and performance
  have not been independently verified for this contribution. Both hardware entries remain experimental.
weight_download:
  - weight_version: FP16 (Qwen3.5-2B)
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/Qwen/Qwen3.5-2B
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3.5-2B
          ```
      - source: HuggingFace
        url: https://huggingface.co/Qwen/Qwen3.5-2B
        command: |-
          ```bash
          pip install -U huggingface_hub
          hf download Qwen/Qwen3.5-2B
          ```
  - weight_version: W8A8 (Qwen3.5-2B, download reference)
    sources:
