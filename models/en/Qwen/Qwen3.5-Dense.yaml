prerequisites:
- title: Hardware
  content: |-
    - **Atlas 300I DUO**: single-node only; TP scenario supported (TP=1 or TP=2 according to available devices).
    - **Atlas 200I Pro**: single-node only; with a single visible NPU use TP=1.
    - min_version requirement: support for Qwen3.5-2B/4B/9B on Atlas 300I DUO and Atlas 200I Pro starts from `vllm-ascend:v0.23.0rc1`. It is strongly recommended to use the latest release candidate (rc) or the latest official version.

- title: Model weight path
  content: |-
    Download the model weights to a local directory such as `/root/.cache/` or `/home/data/` and record the path. Ensure the model path in the subsequent deployment command matches this directory.

env_setup:
  pip:
    content: |-
      ```bash
      git clone https://github.com/vllm-project/vllm-ascend.git
      cd vllm-ascend
      pip install -e .
      ```

      Verify:
      ```bash
      pip show vllm-ascend
      ```

      > **On Atlas 300I DUO and Atlas 200I Pro**, you may need to uninstall `triton-ascend` and `triton` to avoid dependency conflicts.

      ```bash
      pip uninstall -y triton-ascend triton
      ```

  container:
    "Atlas 300I DUO":
      content: |-
        ```bash
        export IMAGE=m.daocloud.io/quay.io/ascend/vllm-ascend:v0.23.0rc1-310p
        docker run --rm \
            --name vllm-ascend \
            --shm-size=10g \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -p 8080:8080 \
            -it $IMAGE bash
        ```

        After a successful `docker run`, verify with `docker ps` — the container `vllm-ascend` should be listed with status `Up`.
    "Atlas 200I Pro":
      content: |-
        Adjust `--device=/dev/davinci0` according to the NPU ID you want to use.

        **Ubuntu 24.04:**
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1-310p

        docker run --rm \
        --privileged \
        --name vllm-ascend \
        --shm-size=10g \
        --device=/dev/davinci0:/dev/davinci0 \
        --device=/dev/davinci_manager \
        --device=/dev/ascend_manager \
        --device=/dev/user_config \
        -v /etc/sys_version.conf:/etc/sys_version.conf \
        -v /etc/ld.so.conf.d/mind_so.conf:/etc/ld.so.conf.d/mind_so.conf \
        -v /etc/hdcBasic.cfg:/etc/hdcBasic.cfg \
        -v /var/dmp_daemon:/var/dmp_daemon \
        -v /usr/lib64/libmmpa.so:/usr/lib64/libmmpa.so \
        -v /usr/lib64/libcrypto.so.1.1:/usr/lib64/libcrypto.so.1.1 \
        -v /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi \
        -v /usr/lib64/libstackcore.so:/usr/lib64/libstackcore.so \
        -v /usr/lib/aarch64-linux-gnu/libyaml-0.so.2:/usr/lib64/libyaml-0.so.2 \
        -v /etc/slog.conf:/etc/slog.conf \
        -v /var/slogd:/var/slogd \
        -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64 \
        -v /usr/lib64/libtensorflow.so:/usr/lib64/libtensorflow.so \
        -v /root/.cache:/root/.cache \
        -p 8080:8080 \
        -it $IMAGE bash
        ```

        **openEuler 24.03:** use the matching `-310p-openeuler` image.
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1-310p-openeuler

        docker run --rm \
        --privileged \
        --name vllm-ascend \
        --shm-size=10g \
        --device=/dev/davinci0:/dev/davinci0 \
        --device=/dev/davinci_manager \
        --device=/dev/ascend_manager \
        --device=/dev/user_config \
        -v /etc/sys_version.conf:/etc/sys_version.conf \
        -v /etc/ld.so.conf.d/mind_so.conf:/etc/ld.so.conf.d/mind_so.conf \
        -v /etc/hdcBasic.cfg:/etc/hdcBasic.cfg \
        -v /var/dmp_daemon:/var/dmp_daemon \
        -v /usr/lib64/libsemanage.so.2:/usr/lib64/libsemanage.so.2 \
        -v /usr/lib64/libmmpa.so:/usr/lib64/libmmpa.so \
        -v /usr/lib64/libcrypto.so.1.1:/usr/lib64/libcrypto.so.1.1 \
        -v /usr/lib64/libyaml-0.so.2.0.9:/usr/lib64/libyaml-0.so.2 \
        -v /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi \
        -v /usr/lib64/libstackcore.so:/usr/lib64/libstackcore.so \
        -v /etc/slog.conf:/etc/slog.conf \
        -v /var/slogd:/var/slogd \
        -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64 \
        -v /usr/lib64/libtensorflow.so:/usr/lib64/libtensorflow.so \
        -v /root/.cache:/root/.cache \
