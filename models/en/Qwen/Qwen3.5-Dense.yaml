meta:
  title: "Qwen3.5-Dense (2B/4B/9B)"
  slug: "qwen3.5-dense"
  provider: "Qwen"
  description: "Qwen3.5-2B/4B/9B dense hybrid Mamba-Transformer models. Single-node serving on Atlas 300I DUO / Atlas 200I Pro (310P) with vLLM Ascend ≥ v0.23.0rc1."
  date_added: "2026-10-28"
  date_updated: "2026-10-30"
  difficulty: beginner
  tasks:
    - text
  performance_headline: "Atlas 300I DUO / 200I Pro (310P) single-node Dense with MTP (tutorial migration)"
  related_recipes:
    - "Qwen/Qwen3.5-27B-Qwen3.6-27B"
  hardware:
    atlas_300i_duo: verified
    # Verified: function smoke + AISBench gsm8k on 310P3 (~21GB) image v0.30.0rc1-310p (2026-10-29). textvqa/perf still open.

model:
  model_id: "Qwen/Qwen3.5-4B"
  min_vllm_version: "0.23.0rc1"
  architecture: dense
  parameter_count: "2B / 4B / 9B"
  active_parameters: null
  context_length: 16384
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--served-model-name"
    - "qwen3.5"
    - "--tensor-parallel-size"
    - "1"
    - "--max-model-len"
    - "8192"
    - "--max-num-seqs"
    - "16"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--dtype"
    - "float16"
    - "--mamba-ssm-cache-dtype"
    - "float16"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    # Smoke-verified on 310P3 (~21GB): v0.30.0rc1-310p (2026-10-29). Floor still ≥ v0.23.0rc1; v0.23.0-310p also passed earlier.
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.30.0rc1-310p"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=10g --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -p 8080:8080 -it quay.io/ascend/vllm-ascend:v0.30.0rc1-310p bash"
      note: "Smoke-verified tag: `v0.30.0rc1-310p` (2026-10-29 on ~21GB 310P3; also passed on `v0.23.0-310p`). Floor ≥ v0.23.0rc1. Full mounts in env_setup. On 310P uninstall triton-ascend/triton if present."

features:
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "qwen3_5_mtp with num_speculative_tokens=1 — measured OK for FP16 2B/4B on ~21GB 310P3. Do NOT enable for 9B W8A8 on single ~21GB chip (OOM)."
    args:
      - "--speculative-config"
      - '{"method": "qwen3_5_mtp","num_speculative_tokens":1}'
  compilation_config:
    label: "Compilation Config"
    description: "FULL_DECODE_ONLY ACL graph; with MTP use capture sizes like [2,16]; for 9B W8A8 no-MTP use [1,8]"
    args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}'
  disable_npugraph_ex:
    label: "Disable npugraph_ex"
    description: "enable_npugraph_ex is not supported on 300I DUO / 200I Pro — must stay false"
    args:
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
  w8a8_additional_config:
    label: "W8A8 additional-config (9B)"
    description: "On ~21GB 310P3 W8A8 9B: enable_npugraph_ex must be false. On v0.30.0rc1 DO NOT pass fuse_norm_quant (VllmConfig ValidationError). On v0.23.0-310p fuse_norm_quant=false was OK if needed."
    args:
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'

opt_in_features: []

variants:
  default:
    model_id: "Qwen/Qwen3.5-4B"
    precision: fp16
    vram_minimum_gb: 12
    description: "FP16 Qwen3.5-4B — on v0.30.0rc1-310p ~21GB use MTP + len=8192 + seqs=16 (16384/32 failed); v0.23 OK at 16384/32"
  qwen35_2b_fp16:
    model_id: "Qwen/Qwen3.5-2B"
    precision: fp16
    vram_minimum_gb: 8
    description: "FP16 2B — comfortable on ~21 GB 310P3"
  qwen35_9b_fp16:
    model_id: "Qwen/Qwen3.5-9B"
    precision: fp16
    vram_minimum_gb: 20
    description: "FP16 9B — tight on ~21 GB; may need lower max-model-len / max-num-seqs"
  qwen35_9b_w8a8:
    model_id: "Eco-Tech/Qwen3.5-9B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 16
    description: "W8A8-310P 9B — measured PASS on ~21GB 310P3 (v0.23+v0.30): text-only, no MTP, len=8192, seqs=8, util=0.90; on v0.30 omit fuse_norm_quant (~19.8/21.5 GB)"

compatible_strategies:
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}
dependencies: []
guide: ""

config_params:
  max_model_len:
    default: 8192
    type: number
    description: "Context length (input+output). Defaults match measured 4B floor on ~21GB v0.30. 2B@v0.30 can raise to 16384; 9B W8A8 keep 8192. Tutorial 16384/32 may OOM on 4B/9B."
  max_num_seqs:
    default: 16
    type: number
    description: "Max concurrent sequences. Default 16 = measured 4B floor on ~21GB v0.30. 2B can use 32; 9B W8A8 use 8."
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "Fraction of NPU HBM for model + KV cache."

overview: |-
  Qwen3.5-2B, Qwen3.5-4B, and Qwen3.5-9B are dense hybrid Mamba-Transformer language models in the Qwen3.5 family (GDN + full attention). This recipe migrates the official vLLM Ascend tutorial into structured YAML for Atlas 300I DUO and Atlas 200I Pro (310P images ≥ v0.23.0rc1). Single-node TP=1 (or TP=2 on DUO with multiple visible NPUs). MTP via qwen3_5_mtp (1 token). enable_npugraph_ex must remain false.

