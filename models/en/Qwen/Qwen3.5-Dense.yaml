verification: |-
  Startup must reach `Application startup complete`. Run the checks below in the serving container, replacing `<server_ip>` with `127.0.0.1` and `<port>` with `8080`. Readiness alone does not prove inference: both requests must return HTTP 200 and generated text in `choices`. The tutorial binds loopback; for host clients explicitly choose a reachable bind address. Completions uses its `max_tokens` field; Chat Completions uses `max_completion_tokens`.

  ```bash
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/health
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/v1/models
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/v1/completions \
    -H 'Content-Type: application/json' \
    -d '{"model":"qwen3.5","prompt":"The future of AI is","max_tokens":50,"temperature":0}'
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/v1/chat/completions \
    -H 'Content-Type: application/json' \
    -d '{"model":"qwen3.5","messages":[{"role":"user","content":"The future of AI is"}],"max_completion_tokens":1024,"temperature":0.7,"top_p":0.95}'
  ```
evaluation:
  accuracy:
    content: |-
      The following numbers are copied from the official tutorial on Atlas 300I DUO, not measured in this contribution. Do not use them to mark this recipe verified. Replace `your_model_path` in the AISBench configuration with the checkpoint used by the server. Follow the [AISBench guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html) to prepare gsm8k and textvqa and run each model separately. TextVQA requires the visual dataset and multimodal requests; a text chat smoke does not verify it.

      ```python
      # Example configuration: benchmarks/ais_bench/benchmark/configs/models/vllm_api/vllm_api_general_chat.py
      from ais_bench.benchmark.models import VLLMCustomAPIChat
      from ais_bench.benchmark.utils.model_postprocessors import extract_non_reasoning_content

      models = [
          dict(
              attr="service",
              type=VLLMCustomAPIChat,
              abbr="vllm-api-general-chat",
              path="your_model_path",
              model="qwen3.5",
              request_rate=0,
              retry=2,
              host_ip="127.0.0.1",
              host_port=8080,
              max_out_len=4096,
              batch_size=16,
              trust_remote_code=False,
              generation_kwargs=dict(
                  temperature=0.0,
                  ignore_eos=False,
                  chat_template_kwargs = {"enable_thinking": False},
              ),
              pred_postprocessor=dict(type=extract_non_reasoning_content)
          )
      ]
      ```

      | Model | dataset | version | metric | mode | vllm-api-general-chat |
      |-------|---------|---------|--------|------|------------------------|
      | Qwen3.5-2B | gsm8k | - | accuracy | gen | 77.71 |
      | Qwen3.5-2B | textvqa | - | accuracy | gen | 76.09 |
      | Qwen3.5-4B | gsm8k | - | accuracy | gen | 93.18 |
      | Qwen3.5-4B | textvqa | - | accuracy | gen | 79.08 |
      | Qwen3.5-9B | gsm8k | - | accuracy | gen | 95.30 |
      | Qwen3.5-9B | textvqa | - | accuracy | gen | 82.33 |
  performance:
    content:
      Use the [AISBench performance guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation).
      Record checkpoint/revision, hardware, image digest, launch arguments, input/output lengths, concurrency, request
      count, failures, throughput and latency. The source tutorial publishes no numerical performance baseline for
      these models. No measured throughput or latency is claimed here.
tuning:
  'Only TP is covered: use TP=1 on a single visible Atlas 200I Pro NPU; Atlas 300I DUO may use TP=1 or TP=2.
  Keep dtype and Mamba SSM cache float16, disable enable_npugraph_ex, and use FULL_DECODE_ONLY. With TP, hardware
  event IDs permit at most two capture sizes; [2,16] is the tutorial MTP baseline. For one speculative token each
  capture size is twice its non-MTP value. Lower context, concurrent sequences and memory utilization if startup
  runs out of memory. No DP or PD scenario is claimed. See the [tuning guide](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html).'
faq:
  'See the [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html). A successful 910B run cannot
  establish 310P / Atlas 200I Pro compatibility. Quantized checkpoints listed below are download references only:
  the tutorial provides FP16 launch commands and no W8A8 serving baseline.'
