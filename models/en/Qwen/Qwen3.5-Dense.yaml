meta:
  title: "Qwen3.5-Dense (Qwen3.5-2B/4B/9B)"
  slug: "qwen3.5-dense"
  provider: "Qwen"
  description: "Qwen3.5-2B, Qwen3.5-4B, and Qwen3.5-9B are dense hybrid Mamba-Transformer language models in the Qwen3.5 family. They share the same hybrid attention design (GDN + full attention) and the same deployment pattern on Ascend 310P inference products, suitable for general-purpose text generation tasks such as dialogue, content creation, and code generation."
  date_added: 2026-11-04
  tasks:
    - text
  performance_headline: "Single-node deployment on Atlas 300I DUO / Atlas 200I Pro (310P) with TP=1 / TP=2"
  difficulty: beginner
  related_recipes:
    - "Qwen/Qwen3.5-27B-Qwen3.6-27B"
  hardware:
    atlas_300i_duo: verified
    atlas_200i_pro: experimental

model:
  model_id: "Qwen/Qwen3.5-9B"
  min_vllm_version: "0.23.0rc1"
  architecture: dense
  parameter_count: "2B/4B/9B"
  active_parameters: null
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
  docker_image:
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
    atlas_200i_pro: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=10g --device /dev/davinci0 ... --device /dev/davinci7 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -p 8080:8080 -it quay.io/ascend/vllm-ascend:v0.23.0rc1-310p bash"
      note: "Official Ascend image; full device/driver mounts are covered in env_setup.container."

# —— Upstream alignment: features / variants / strategies / overrides / guide ——
features:
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP speculative decoding for Qwen3.5 Dense models with an MTP head (qwen3_5_mtp); num_speculative_tokens 1 is recommended"
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 1}']
  compilation_config:
    label: "Compilation Config"
    description: "ACL-graph execution in decode (--compilation-config cudagraph_mode=FULL_DECODE_ONLY); capture sizes n * (num_speculative_tokens + 1)"
    args: ["--compilation-config", '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2, 16]}']

opt_in_features: []

variants:
  default:
    precision: fp16
    vram_minimum_gb: 22
    description: "FP16 weights (Qwen/Qwen3.5-9B); the 2B and 4B checkpoints need ~5 GB and ~10 GB respectively"
  fp16_2b:
    model_id: "Qwen/Qwen3.5-2B"
    precision: fp16
    vram_minimum_gb: 5
    description: "FP16 weights of Qwen3.5-2B"
  fp16_4b:
    model_id: "Qwen/Qwen3.5-4B"
    precision: fp16
    vram_minimum_gb: 10
    description: "FP16 weights of Qwen3.5-4B"
  w8a8_310p_2b:
    model_id: "Eco-Tech/Qwen3.5-2B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 3
    description: "INT8 (W8A8) weights of Qwen3.5-2B targeting the 310P execution path"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]
  w8a8_310p_4b:
    model_id: "Eco-Tech/Qwen3.5-4B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 5
    description: "INT8 (W8A8) weights of Qwen3.5-4B targeting the 310P execution path"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]
  w8a8_310p_9b:
    model_id: "Eco-Tech/Qwen3.5-9B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 11
    description: "INT8 (W8A8) weights of Qwen3.5-9B targeting the 310P execution path"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]

compatible_strategies:
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: ""

# —— Configurable value params (page/CI extension; defaults = tutorial baseline) ——
config_params:
  model_path:
    default: "Qwen/Qwen3.5-2B"
    type: string
    description: "Model weight id or local directory: Qwen/Qwen3.5-2B / 4B / 9B (or the Eco-Tech W8A8-310P checkpoints); must match the directory recorded during download"
  tensor_parallel_size:
    default: 1
    type: number
    description: "Tensor parallel size: TP=1 or TP=2 on Atlas 300I DUO; TP=1 on Atlas 200I Pro"
  max_model_len:
    default: 16384
    type: number
    description: "Maximum context length (input + output tokens); set according to actual device memory — too high may cause OOM"
  max_num_seqs:
    default: 32
    type: number
    description: "Maximum number of concurrent sequences; set according to actual device memory — too high may cause OOM"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "Fraction of HBM used for actual inference; set according to actual device memory — too high may cause OOM"

overview: |-
  Qwen3.5-2B, Qwen3.5-4B, and Qwen3.5-9B are dense hybrid Mamba-Transformer language models in the Qwen3.5 family. They share the same hybrid attention design (GDN + full attention) and are suitable for general-purpose text generation tasks such as dialogue, content creation, and code generation.

