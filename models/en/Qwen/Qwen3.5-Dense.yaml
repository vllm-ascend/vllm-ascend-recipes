  pip:
    content:
      For source builds follow the [installation guide](https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html).
      Clone main and install with `pip install -e .` only after satisfying that guide. The tutorial notes that `triton-ascend`
      and `triton` may need removal to avoid conflicts on these platforms. Check `pip show vllm-ascend` afterwards.
scenarios:
  - npu: Atlas 300I DUO
    precision: FP16 (Qwen3.5-2B)
    deployment: Single-Node
    case: TP=1
    tags:
      - 310p-single
    strategy: single_node_310p
    steps:
      - title: Start the server
        content: |-
          Set `your_model_path` to `Qwen/Qwen3.5-2B` or the corresponding local download. Run inside the container.

          ```bash
          export VLLM_USE_MODELSCOPE=True
          vllm serve your_model_path \
          --host 127.0.0.1 \
          --port 8080 \
          --tensor-parallel-size 1 \
          --served-model-name qwen3.5 \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --trust-remote-code \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --mamba-ssm-cache-dtype float16 \
          --dtype float16 \
          {{spec_decoding}} \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}' \
          --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
          ```
      - title: Verify inference
        content:
          Follow the Verification section below. Keep the logs and both inference responses; startup alone is
