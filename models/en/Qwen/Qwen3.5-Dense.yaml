scenarios:
# ===== Atlas 300I DUO single-node FP16 =====
- npu: Atlas 300I DUO
  precision: FP16
  deployment: Single-Node
  case: TP (1~2 Cards)
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: Start the server
    content: |-
      Single-node deployment completes both Prefill and Decode within the same node. The platform currently supports the **TP** scenario — choose **TP=1** or **TP=2** according to the available devices.

      ```bash
      #!/bin/sh
      # Load model from ModelScope to speed up download
      export VLLM_USE_MODELSCOPE=True

      # Model weight path; can be a ModelScope model id or a local directory path
      # Ensure the model path matches the directory recorded during download
      export MODEL_PATH={{model_path}}

      vllm serve $MODEL_PATH \
      --host 127.0.0.1 \
      --port 8080 \
      --tensor-parallel-size {{tensor_parallel_size}} \
      --served-model-name qwen3.5 \
      --max-num-seqs {{max_num_seqs}} \
      --max-model-len {{max_model_len}} \
      --trust-remote-code \
      --gpu-memory-utilization {{gpu_memory_utilization}} \
      --mamba-ssm-cache-dtype float16 \
      --dtype float16 \
      --speculative-config '{"method": "qwen3_5_mtp","num_speculative_tokens":1}' \
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}' \
      --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
      ```

      > - `--dtype float16` is required on Atlas 300I DUO and Atlas 200I Pro — these devices only support the FP16 data type.
      > - `--mamba-ssm-cache-dtype float16` — only `float16` is supported for the Mamba SSM cache on these platforms.
      > - `--max-model-len`, `--max-num-seqs`, `--gpu-memory-utilization` — set according to actual device memory; setting them too high may cause OOM.
      > - `--compilation-config`: with TP, hardware event-id constraints allow at most two capture sizes. With MTP, each capture size is `n * (num_speculative_tokens + 1)` — e.g. non-MTP `[1,2,4,8]` becomes `[2,4,8,16]` for `num_speculative_tokens: 1`.
      > - `--additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'` is required because `enable_npugraph_ex` is not supported on these platforms.
  - title: Service verification
    content: |-
      If the service starts successfully, the startup log shows:
      ```text
      (APIServer pid=<pid>) INFO:     Application startup complete.
      ```

      Then verify with a real request — see the verification section below.

# ===== Atlas 200I Pro single-node FP16 =====
- npu: Atlas 200I Pro
  precision: FP16
  deployment: Single-Node
  case: Single Card (TP=1)
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: Start the server
    content: |-
      With a single visible NPU on Atlas 200I Pro, use **TP=1**. The same command baseline as Atlas 300I DUO applies:

      ```bash
      #!/bin/sh
      export VLLM_USE_MODELSCOPE=True
      export MODEL_PATH={{model_path}}

      vllm serve $MODEL_PATH \
      --host 127.0.0.1 \
      --port 8080 \
      --tensor-parallel-size 1 \
      --served-model-name qwen3.5 \
      --max-num-seqs {{max_num_seqs}} \
      --max-model-len {{max_model_len}} \
      --trust-remote-code \
      --gpu-memory-utilization {{gpu_memory_utilization}} \
      --mamba-ssm-cache-dtype float16 \
      --dtype float16 \
      --speculative-config '{"method": "qwen3_5_mtp","num_speculative_tokens":1}' \
      --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}' \
      --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
      ```
  - title: Service verification
    content: |-
      Same as the Atlas 300I DUO scenario — verify via the logs and a real request as described in the verification section below.

verification: |-
  After the service is started, the model can be invoked by sending a prompt. Two API interfaces are supported: `completions` and `chat.completions`. Use the `--served-model-name` you configured (`qwen3.5`). If you used `--port 8080` or `-p 8080:8080`, adjust the URL accordingly.

  **Completions API:**
  ```bash
  curl http://127.0.0.1:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.5",
          "prompt": "The future of AI is",
          "max_completion_tokens": 50,
          "temperature": 0
      }'
  ```

  **Chat Completions API:**
  ```bash
  curl http://127.0.0.1:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.5",
          "messages": [
              {"role": "user", "content": "The future of AI is"}
          ],
          "max_completion_tokens": 1024,
          "temperature": 0.7,
          "top_p": 0.95
      }'
  ```

  Expected: HTTP 200 OK. The JSON response contains the `choices` field with generated text.

performance:
  accuracy: |-
    ### Using AISBench

    Refer to the vllm-ascend AISBench guide for details. After execution, you get the accuracy result. Here are the accuracy results of `Qwen3.5-2B`, `Qwen3.5-4B`, and `Qwen3.5-9B` on Atlas 300I DUO for reference only.

    Config file: `benchmarks/ais_bench/benchmark/configs/models/vllm_api/vllm_api_general_chat.py`
    ```python
    from ais_bench.benchmark.models import VLLMCustomAPIChat
    from ais_bench.benchmark.utils.model_postprocessors import extract_non_reasoning_content

    models = [
        dict(
            attr="service",
            type=VLLMCustomAPIChat,
            abbr="vllm-api-general-chat",
            path="your_model_path",
            model="qwen3.5",
            request_rate=0,
            retry=2,
            host_ip="127.0.0.1",
            host_port=8080,
            max_out_len=4096,
            batch_size=16,
            trust_remote_code=False,
            generation_kwargs=dict(
                temperature=0.0,
                ignore_eos=False,
                chat_template_kwargs = {"enable_thinking": False},
            ),
            pred_postprocessor=dict(type=extract_non_reasoning_content)
        )
    ]
    ```

    | Model | dataset | version | metric | mode | vllm-api-general-chat |
    |-------|---------|---------|--------|------|------------------------|
    | Qwen3.5-2B | gsm8k | - | accuracy | gen | 77.71 |
    | Qwen3.5-2B | textvqa | - | accuracy | gen | 76.09 |
    | Qwen3.5-4B | gsm8k | - | accuracy | gen | 93.18 |
    | Qwen3.5-4B | textvqa | - | accuracy | gen | 79.08 |
    | Qwen3.5-9B | gsm8k | - | accuracy | gen | 95.30 |
    | Qwen3.5-9B | textvqa | - | accuracy | gen | 82.33 |
  performance: |-
    ### Using AISBench

    Refer to the vllm-ascend AISBench performance-evaluation guide for details.

tuning: |-
  ### Recommended configurations

  > The following configurations are for reference only. The optimal configuration depends on model size, maximum input/output length, and actual device memory.
  >
  > **Atlas 300I DUO / Atlas 200I Pro**: Currently only the TP scenario is supported. Prefer **TP=1** on Atlas 200I Pro. On Atlas 300I DUO, **TP=1** and **TP=2** are both supported; choose according to the available devices. Configure `--max-model-len`, `--max-num-seqs`, and `--gpu-memory-utilization` based on the actual device memory; setting them too high may cause OOM.

  ### Key parameter descriptions

  - `--tensor-parallel-size`: prefer **TP=1** on Atlas 200I Pro; on Atlas 300I DUO, **TP=1** and **TP=2** are both supported — choose according to available devices.
  - `--max-model-len`: context length (input plus output for a single request); set according to actual device memory — too high may cause OOM.
  - `--max-num-seqs`: maximum number of requests processed concurrently; set according to actual device memory.
  - `--gpu-memory-utilization`: proportion of HBM used for actual inference (default `0.9`).
  - `--dtype float16` and `--mamba-ssm-cache-dtype float16`: only FP16 is supported on Atlas 300I DUO and Atlas 200I Pro.
  - `--speculative-config` with `qwen3_5_mtp`: for Qwen3.5 Dense models with an MTP head; `num_speculative_tokens: 1` recommended (values 1~5 trade latency vs. throughput/acceptance rate).
  - `--compilation-config`: `cudagraph_mode: FULL_DECODE_ONLY` recommended; with TP, at most two capture sizes are allowed (hardware event-id constraints); with MTP, compute sizes as `n * (num_speculative_tokens + 1)`.
  - `--additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'`: required — `enable_npugraph_ex` is not supported on these platforms.

  ### Tuning guidelines

  Refer to the vllm-ascend performance tuning documentation and feature matrix for detailed feature descriptions.

