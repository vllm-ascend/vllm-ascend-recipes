meta:
  title: 'Minitron-8B-Base'
  slug: 'minitron-8b-base'
  provider: 'NVIDIA'
  description: 'A compact 8B dense language model pruned and distilled from NVIDIA Nemotron-4 15B, designed for general-purpose text generation and reasoning with efficient single-card deployment.'
  date_added: 2026-10-14
  difficulty: beginner
  performance_headline: 'Single-node single-card deployment on Atlas 800I A2 with BF16 precision'
  hardware:
    atlas_800_a2: verified

model:
  model_id: 'nv-community/Minitron-8B-Base'
  architecture: dense
  parameter_count: '8B'
  active_parameters: null
  context_length: 4096
  modality: text
  docker_image:
    atlas_800_a2: 'quay.io/ascend/vllm-ascend:v0.30.0rc2'
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires source build (no official wheel), so the pip tab is hidden.
    pip: false
    docker:
      command: 'docker run --rm --name vllm-ascend --shm-size=1g --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.30.0rc2 bash'
      note: 'Official Ascend image; full device/driver mounts are covered in env_setup.container.'

compatible_strategies:
  - single_node_A2

# —— Configurable value params (defaults = tutorial baseline) ——
config_params:
  max_model_len:
    default: 4096
    type: number
    description: 'Maximum context length (input + output tokens)'
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: 'Fraction of NPU memory available for the model and KV cache'

overview: |-
  Minitron-8B-Base is a lightweight, efficient large language model developed by NVIDIA. It was produced by pruning and distilling the Nemotron-4 15B model down to 8B parameters, and is designed for general-purpose text generation and reasoning tasks. The model uses the Nemotron architecture (32 layers, GQA attention with partial rotary embeddings) and is released in BF16 precision.

  Minitron-8B-Base fits on a single 64GB Ascend 910B NPU, making it a convenient baseline for functional verification, accuracy evaluation, and small-scale online serving on vLLM-Ascend.
weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/nv-community/Minitron-8B-Base
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model nv-community/Minitron-8B-Base
          ```
      - source: HuggingFace
        url: https://huggingface.co/nvidia/Minitron-8B-Base
        command: |-
          ```bash
          pip install -U huggingface_hub
          huggingface-cli download nvidia/Minitron-8B-Base
          ```
      - source: Modelers
        url: ''
        command: |-
          ```bash
          pip install modelers
          modelers download --model nv-community/Minitron-8B-Base
          ```
      - source: GitCode
        url: ''
        command: |-
          ```bash
          git clone https://gitcode.com/nv-community/Minitron-8B-Base.git
          ```
prerequisites:
  - title: Model Weight
    content: |-
      The BF16 model requires 1 Ascend 910B NPU (64GB). It is recommended to download the model weight to a local model path, such as `/root/.cache/` or `/data/vllm-workspace/models/Minitron-8B-Base`.

      | Model                | Hardware Requirement              | Download                                                                        |
      | -------------------- | --------------------------------- | ------------------------------------------------------------------------------- |
      | Minitron-8B-Base (BF16) | 1 x 64GB NPU (Ascend 910B)    | [Download](https://www.modelscope.cn/models/nv-community/Minitron-8B-Base)      |

      > **Path description**: Download the model weights to a directory of your choice and record it. Ensure the model path in the subsequent deployment command matches this directory.
env_setup:
  container:
    A2:
      content: |-
        You can use the official all-in-one Docker image to run `Minitron-8B-Base` directly.

        **Docker Pull:**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.30.0rc2
        ```

        **Docker Run:**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc2

        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -v /data/vllm-workspace/models:/data/vllm-workspace/models \
            -p 8000:8000 \
            -it $IMAGE bash
        ```

        After a successful docker run, you can verify the running container service by executing the `docker ps` command.
  pip:
    content: |-
      If you do not want to use the Docker image, you can also build all from source:

      - Install `vllm-ascend` from source, refer to the [installation guide](https://docs.vllm.ai/projects/ascend/en/latest/installation.html).

      If you want to deploy a multi-node environment, you need to set up the environment on each node.
scenarios:
  - npu: Atlas 800I A2
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card
    tags: [a2-single]
    strategy: single_node_A2
    steps:
      - title: Start the server
        content: |-
          Single-card deployment completes both Prefill and Decode within the same NPU, suitable for functional verification, accuracy evaluation, and small-scale inference scenarios.

          The following command is an example configuration. Adjust the parameters based on your actual scenario.

          ```bash
          vllm serve "nv-community/Minitron-8B-Base" \
              --served-model-name minitron-8b-base \
              --tensor-parallel-size 1 \
              --max-model-len {{max_model_len}} \
              --gpu-memory-utilization {{gpu_memory_utilization}} \
              --enforce-eager \
              --port 8000
          ```

          > - `--served-model-name`: the name clients use in requests; must match the `model` field of the verification request below.
          > - `--tensor-parallel-size 1`: the BF16 model fits on a single 64GB NPU.
          > - `--enforce-eager`: runs in eager mode; recommended baseline for this model.
          > - Model path: replace `nv-community/Minitron-8B-Base` with your local weight directory if you pre-downloaded the model.
      - title: Service Verification
        content: |-
          After the service is started, verify it is running by sending a prompt. Refer to the verification section below for a usage example.
verification: |-
  Once your server is started, you can query the model with a simple prompt:

  ```bash
  curl http://localhost:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "minitron-8b-base",
          "prompt": "Question: If a train travels 60 miles in 2 hours, what is its average speed in miles per hour?\nAnswer:",
          "max_tokens": 64,
          "temperature": 1.0
      }'
  ```

  > - **URL**: Replace `localhost` with your server IP and use the port from the `vllm serve` command.
  > - **`model`**: Must match the `--served-model-name` value from the `vllm serve` command (e.g., `minitron-8b-base`).

  Expected result: A valid response indicates that the model is deployed correctly and can generate text outputs.
evaluation:
  accuracy:
    content: |-
      The GSM8K dataset was used to evaluate the reasoning capability of `Minitron-8B-Base`.

      The evaluation setting is:

      - Dataset: `gsm8k`
      - Split: `test`
      - Number of samples: `1000`
      - Few-shot setting: `5-shot`
      - `apply_chat_template`: `False`
      - `fewshot_as_multiturn`: `False`

      For evaluation tool setup on Ascend, refer to [Using lm_eval](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_lm_eval.html). Example command:

      ```bash
      lm_eval --model vllm \
          --model_args pretrained=/data/vllm-workspace/models/Minitron-8B-Base,tensor_parallel_size=1,distributed_executor_backend=mp \
          --tasks gsm8k \
          --num_fewshot 5 \
          --limit 1000 \
          --batch_size auto
      ```

      The evaluation results are:

      | Category | Dataset | Metric | Result |
      |----------|---------|--------|--------|
      | Accuracy | gsm8k / test | Total Samples | 1000 |
      | Accuracy | gsm8k / test | exact_match,strict-match | 0.5436 |
      | Accuracy | gsm8k / test | exact_match,flexible-extract | 0.5451 |

      Remarks on metrics:

      - **exact_match,strict-match**: Only predictions that strictly match the expected final-answer extraction format are counted as correct.
      - **exact_match,flexible-extract**: Predictions are evaluated with a more flexible answer extraction rule, which tolerates minor formatting differences as long as the final numeric answer is correct.
  performance:
    content: |-
      ### Using vLLM Benchmark

      `Minitron-8B-Base` can be deployed through `vllm-ascend` for online inference and benchmark evaluation. Refer to [vLLM benchmark](https://docs.vllm.ai/en/latest/benchmarking/) for more details.

      Take the `serve` subcommand as an example:

      ```bash
      vllm bench serve \
          --model /data/vllm-workspace/models/Minitron-8B-Base \
          --served-model-name minitron-8b-base \
          --port 8000 \
          --dataset-name random \
          --random-input 128 \
          --random-output-len 64 \
          --num-prompts 100 \
          --request-rate 10 \
          --save-result \
          --result-dir ./
      ```

      > Actual throughput and latency depend on hardware resources, prompt length, output length, concurrency, and runtime configuration. This recipe focuses on functional verification and benchmark accuracy on GSM8K; further benchmarking is recommended for request latency, throughput under concurrency, long-context inference, memory utilization, and stability under continuous serving workloads.
performance:
  accuracy: |-
    **GSM8K (5-shot, 1000 test samples):**

    | Category | Dataset | Metric | Result |
    |----------|---------|--------|--------|
    | Accuracy | gsm8k / test | Total Samples | 1000 |
    | Accuracy | gsm8k / test | exact_match,strict-match | 0.5436 |
    | Accuracy | gsm8k / test | exact_match,flexible-extract | 0.5451 |
  benchmark: |-
    No fixed throughput/latency numbers are published for this model; results depend on hardware resources, prompt length, output length, concurrency, and runtime configuration.

    Use the reproducible command in the "More Info" tab (`vllm bench serve`) to measure throughput and latency on your own deployment.
