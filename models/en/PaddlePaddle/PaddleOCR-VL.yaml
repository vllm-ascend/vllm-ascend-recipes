meta:
  title: PaddleOCR-VL
  slug: paddleocr-vl
  provider: PaddlePaddle
  description: Original PaddleOCR-VL-0.9B document recognition on Ascend, with single-NPU serving and PP-DocLayoutV2
    document parsing.
  date_added: '2026-10-12'
  date_updated: '2026-10-13'
  difficulty: intermediate
  hardware:
    atlas_800_a2: verified
    atlas_300i_duo: verified
model:
  model_id: PaddlePaddle/PaddleOCR-VL
  min_vllm_version: 0.11.1
  architecture: dense
  parameter_count: 0.9B
  active_parameters: null
  context_length: 131072
  modality: multimodal
  base_args:
  - --trust-remote-code
  - --served-model-name
  - PaddlePaddle/PaddleOCR-VL
  - PaddleOCR-VL-0.9B
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  base_env:
    VLLM_USE_MODELSCOPE: 'True'
    ASCEND_RT_VISIBLE_DEVICES: '0'
    TASK_QUEUE_ENABLE: '1'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  docker_image:
    atlas_800_a2: quay.io/ascend/vllm-ascend:nightly-main@sha256:6d2aa300863a4145249822c625affbe98ed4f231605789b9118ae137370250f3
    atlas_300i_duo: quay.io/ascend/vllm-ascend:nightly-main-310p@sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723
  nightly_required: false
  install:
    pip: false
    docker:
      note: Official main images resolved on2026-10-12 and pinned by digest. A2 BF16 graph/native Paddle layout
        and310P graph/eager/OM were manually run via complete image payload/original entrypoint under PRoot5.5.0
        on actual NPUs. Normal Docker and nightly CI are untested. The original platform package baselines and independent
        source build are preserved separately.
features:
  cpu_binding:
    label: CPU Binding
    description: Request CPU binding; containers may skip it when NUMA affinity conflicts with their CPU quota.
    args:
    - --additional-config
    - '{"enable_cpu_binding":true}'
variants:
  default:
    precision: bf16
    vram_minimum_gb: 3
    description: Original 0.9B checkpoint on A2; model-card context is 131072, deployment limits are scenario-specific.
    supported_hardware:
    - atlas_800_a2
  fp16:
    precision: fp16
    vram_minimum_gb: 3
    description: Original checkpoint cast to FP16; required on Atlas 300I DUO.
    supported_hardware:
    - atlas_300i_duo
    extra_args:
    - --dtype
    - float16
compatible_strategies:
- single_node_A2
- single_node_310p
hardware_overrides:
  atlas_300i_duo:
    extra_args:
    - --dtype
    - float16
    - --max-model-len
    - '16384'
  atlas_800_a2:
    extra_args:
    - --max-num-batched-tokens
    - '16384'
    - --gpu-memory-utilization
    - '0.80'
    extra_env:
      CPU_AFFINITY_CONF: '1'
      TASK_QUEUE_ENABLE: '0'
strategy_overrides: {}
dependencies: []
guide: ''
overview: PaddleOCR-VL-0.9B combines a NaViT-style dynamic-resolution vision encoder with ERNIE-4.5-0.3B. It recognizes
  text, tables, formulas and charts. PP-DocLayoutV2 supplies region detection and reading order for full document
  parsing. This recipe preserves the original PaddlePaddle/PaddleOCR-VL checkpoint; VL-1.5 and VL-1.6 are separate
  models.
weight_download:
- weight_version: Original PaddleOCR-VL-0.9B
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/PaddlePaddle/PaddleOCR-VL
    command: |-
      ```bash
      modelscope download --model PaddlePaddle/PaddleOCR-VL --local_dir PaddleOCR-VL
      sha256sum PaddleOCR-VL/model.safetensors
      ```
  - source: HuggingFace
    url: https://huggingface.co/PaddlePaddle/PaddleOCR-VL
    command: |-
      ```bash
      hf download PaddlePaddle/PaddleOCR-VL --revision 7fa00a8c55b735ba51ba49a9058f3f9c57a99a11 --local-dir PaddleOCR-VL
      ```
prerequisites:
- title: Hardware and precision
  content: Use one logical NPU on Atlas 800I A2 or Atlas 300I DUO. The measured HiDevLab card is Ascend 310P3 with
    about 44 GB per visible device; 64 GB in the environment selector is host RAM. Only FP16 is supported on 310P.
    A2 BF16 graph and Paddle custom-NPU document parsing were manually tested on910B3/64GiB HBM.
- title: Runtime versions
  content: The source tutorial introduction records v0.21.0rc1 and its documentation macro currently resolves v0.23.0.
    For this migration, main was inspected at 0830899b4e3f55ea6ed9f3518385e9d81192ae29 and the latest published
    main images were pinned separately. CANN >= 9.0.0 is required for 310P FULL_DECODE_ONLY; use the eager scenario
    below on older supported CANN. Do not replace the host driver to match an image.
- title: Exact checkpoint
  content: The verified original model.safetensors is 1917255968 bytes with SHA256 3085f1042e184f68f8a412aa0f64f2c4b8562989598bbfba326aaa11fc685de8.
    The declared 131072-token model context is not a validated 310P serving context; the tutorial uses 16384.
- title: Serving and parsing environments
  content: Keep vLLM and the Paddle layout pipeline in separate environments. The 310P path uses OM/ACL for layout
    inference and CPU Paddle preprocessing, not Paddle custom-NPU. Disable document orientation and unwarping when
    reproducing the ModelZoo path.
- title: A2 tested settings
  content: 'Validated on910B3/64GiB HBM with driver26.1.1/CANN9.1.0: TASK_QUEUE_ENABLE=0 and gpu-memory-utilization=0.80
    passed BF16 graph four-task inference with both aliases. The tutorial defaults produced a visual-position indexing
    failure and insufficient sampler headroom. These are measured task settings, not an accepted throughput target;
    normal Docker and nightly CI are untested.'
- title: Paddle NPU compiler environment
  content: The separate CANN8.0/Paddle3.2 layout container needs genuine NumPy<2/compiler dependencies, ATB ABI0
    and standard-library precedence for CANN worker processes. The commands below preserve all checks; full Paddle
    run_check and native NPU document inference passed. This is distinct from the vLLM CANN9.1 environment.
env_setup:
  container:
    A2:
      content: |-
        ```bash
        export IMAGE='quay.io/ascend/vllm-ascend:nightly-main@sha256:6d2aa300863a4145249822c625affbe98ed4f231605789b9118ae137370250f3'
        docker run --rm --name paddleocr-vl --shm-size=1g --net=host \
            --device /dev/davinci0 --device /dev/davinci_manager \
            --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            -v "$PWD":/work -v "$HOME/.cache":/root/.cache \
            -w /work -it "$IMAGE" bash
        ```
    300I DUO:
      content: |-
        ```bash
        export IMAGE='quay.io/ascend/vllm-ascend:nightly-main-310p@sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723'
        docker run --rm --name paddleocr-vl --shm-size=1g --net=host \
            --device /dev/davinci0 --device /dev/davinci_manager \
            --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            -v "$PWD":/work -v "$HOME/.cache":/root/.cache \
            -w /work -it "$IMAGE" bash
        ```
scenarios:
- npu: Atlas 800I A2
  precision: BF16
  deployment: Single-Node
  case: High Throughput (Graph)
  tags:
  - a2-single
  strategy: single_node_A2
  steps:
  - title: Start the single-NPU server
    content: |-
      ```bash
      export VLLM_USE_MODELSCOPE=True
      export ASCEND_RT_VISIBLE_DEVICES=0
      export TASK_QUEUE_ENABLE=0
      export CPU_AFFINITY_CONF=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve PaddlePaddle/PaddleOCR-VL \
          --max-num-batched-tokens 16384 \
          --gpu-memory-utilization 0.80 \
          --served-model-name PaddlePaddle/PaddleOCR-VL PaddleOCR-VL-0.9B \
          --trust-remote-code \
          --no-enable-prefix-caching \
          --mm-processor-cache-gb 0 \
          --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
          --additional-config '{"enable_cpu_binding":true}' \
          --host 127.0.0.1 --port 8000
      ```
  - title: Verify real recognition
    content: Run the four-task functional verification below after /health succeeds. Inspect raw outputs, finish
      reasons and server errors. For 310P graph mode require CANN >= 9.0.0; eager is the documented fallback.
- npu: Atlas 300I DUO
