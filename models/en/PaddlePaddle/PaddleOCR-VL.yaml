tuning: |-
  ### Recommended Configurations

  > **Note**: The following configurations are validated in specific test environments and are for reference only. The optimal configuration depends on factors such as maximum input/output length, precision requirements, and actual hardware specifications.

  PaddleOCR-VL is a lightweight model that runs on a single NPU. The key tuning parameters differ between hardware platforms.

  #### Scenario Overview

  | Scenario | Hardware | Total NPUs | Weight Version | Key Considerations |
  |----------|----------|------------|----------------|-------------------|
  | High Throughput | A2 series | 1 | PaddleOCR-VL-0.9B | - |
  | High Throughput | Atlas 300I DUO | 1 | PaddleOCR-VL-0.9B | Graph compilation requires **CANN >= 9.0.0** |

  > `Total NPUs` indicates the total number of NPUs used across all nodes.

  #### Detailed Node Configuration

  | Scenario | Configuration | NPUs | TP | DP | Max Model Len | Max Num Batched Tokens | Graph Compilation | dtype |
  |----------|-------------|------|----|----|---------------|------------------------|--------------------|-------|
  | High Throughput | A2 series / Single Machine | 1 | — | — | — | — | FULL_DECODE_ONLY | bfloat16 (default) |
  | High Throughput | Atlas 300I DUO / Single Machine | 1 | — | — | — | — | FULL_DECODE_ONLY; otherwise enforce-eager | float16 |

  ### Tuning Guidelines

  Please refer to the [Public Performance Tuning Documentation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) for general tuning methods, including OS optimization (tcmalloc), `torch_npu` optimization (memory and scheduling), and CANN optimization.

  Please refer to the [Feature Matrix](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html) for detailed feature descriptions.

faq: |-
  For common environment, installation, and general parameter issues, please refer to the [Public FAQs](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html). This chapter only covers model-specific issues.

  - **Q: What are the deployment requirements for Atlas 300I DUO?**

    A: On Atlas 300I DUO, only `float16` dtype is supported. Graph compilation (`--compilation-config`) requires **CANN version >= 9.0.0**; if your CANN version is lower, use `--enforce-eager` instead.

  - **Q: What should I do if I encounter dependency conflicts during installation on Atlas 300I DUO?**

    A: You may need to uninstall `triton-ascend` and `triton` to avoid dependency conflicts.

