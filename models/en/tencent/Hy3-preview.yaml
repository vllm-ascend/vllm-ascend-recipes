meta:
  title: Hy3-preview
  slug: hy3-preview
  provider: tencent
  description: >-
    For Ascend A3 BF16 TP16, EP and MTP, follow the [Deployment Guide](#scenarios)
    for the validated Docker and Serve commands.
  date_added: 2026-10-20
  difficulty: advanced
  hardware:
    atlas_800_a3: verified
model:
  model_id: tencent/Hy3-preview
  architecture: moe
  parameter_count: 295B
  active_parameters: 21B
  context_length: 262144
  modality: text
  base_args:
    - --served-model-name
    - hy3-preview
    - --tensor-parallel-size
    - "16"
    - --speculative-config.method
    - mtp
    - --speculative-config.num_speculative_tokens
    - "1"
    - --speculative-config.enforce_eager
    - "true"
    - --enable-expert-parallel
    - --enable-ep-weight-filter
    - --tool-call-parser
    - hy_v3
    - --reasoning-parser
    - hy_v3
    - --enable-auto-tool-choice
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "8"
    - --host
    - 127.0.0.1
    - --port
    - "8000"
  base_env:
    HCCL_OP_EXPANSION_MODE: AIV
    VLLM_USE_RUST_FRONTEND: "0"
  docker_image:
    atlas_800_a3: quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
  install:
    pip: false
    docker:
      command: docker pull quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
variants:
  default:
    precision: bf16
    description: BF16 checkpoint with TP16, EP and one MTP draft token.
    vram_minimum_gb: 718
compatible_strategies:
  - single_node_A3
hardware_overrides: {}
strategy_overrides: {}
guide: ""
overview: |-
  Hy3-preview is Tencent's sparse MoE model for reasoning, coding and tool use. It has 295B total parameters, 21B active parameters and 3.8B parameters in the MTP layer.

  The A3 setup uses one 16-device node with BF16 weights, TP16, expert parallelism and one MTP draft token, with a serving limit of 32,768 tokens. It was tested with the vLLM Ascend v0.30.0 release image. The official release page points to the historical tutorial for deployment details.
weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/Tencent-Hunyuan/Hy3-preview
        command: |-
          ```bash
          CHECKPOINT=/models/tencent/Hy3-preview
          REVISION=bc124022a73e3556246dd5c15ffc2da8250225f7
          mkdir -p /models/tencent &&
          GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout \
            https://www.modelscope.cn/Tencent-Hunyuan/Hy3-preview.git "$CHECKPOINT" &&
          git -C "$CHECKPOINT" lfs install --local &&
          GIT_LFS_SKIP_SMUDGE=1 git -C "$CHECKPOINT" checkout --detach "$REVISION" &&
          git -C "$CHECKPOINT" lfs pull origin &&
          git -C "$CHECKPOINT" lfs fsck --objects HEAD
          ```
prerequisites:
  - title: MTP and ACLGraph
    content: The MTP draft step runs eagerly because full decode graph capture failed in an earlier run. The target model still uses ACLGraph. Follow the Serve command in the deployment guide.
  - title: Image evidence
    content: The tested image digest was
      `sha256:0b8bf5b484d49c667ceab717347eb3a8695388429aebd9084b79fa0f57a545c0`.
      The host used Ascend driver 26.2.rc1 and the container used CANN 9.2.1.
  - title: Checkpoint evidence
    content: The test used ModelScope `Tencent-Hunyuan/Hy3-preview` at commit
      `bc124022a73e3556246dd5c15ffc2da8250225f7`. SHA-256 verification covered
      the index, tokenizer, configuration and all 112 weight shards.
  - title: Host preparation
    content: Use one Atlas A3 node with 16 visible 64 GB logical devices. Confirm
      driver, CANN, HCCL and container compatibility.
  - title: Download the pinned BF16 checkpoint
    content: |-
      Run on the A3 host with Git and Git LFS. Start with an empty destination and about 1.2 TB free under /models for the LFS cache and checkout. If LFS download is interrupted after checkout, repeat the last two commands.

      ```bash
      CHECKPOINT=/models/tencent/Hy3-preview
      REVISION=bc124022a73e3556246dd5c15ffc2da8250225f7
      mkdir -p /models/tencent &&
      GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout \
        https://www.modelscope.cn/Tencent-Hunyuan/Hy3-preview.git "$CHECKPOINT" &&
      git -C "$CHECKPOINT" lfs install --local &&
      GIT_LFS_SKIP_SMUDGE=1 git -C "$CHECKPOINT" checkout --detach "$REVISION" &&
      git -C "$CHECKPOINT" lfs pull origin &&
      git -C "$CHECKPOINT" lfs fsck --objects HEAD
      ```
  - title: Set up AISBench and GSM8K-lite on the A3 host
    content: |-
      Use a second A3 host terminal with writable space under `/models` and access to GitHub, PyPI and ModelScope. The Linux arm64 release image supplies CPU Torch. This step installs [AISBench](https://github.com/AISBench/benchmark/tree/e968d1bd7f48404bd913b95560f33938072336fa) and stages [GSM8K-lite](https://modelscope.cn/datasets/vllm-ascend/gsm8k-lite) at revision `622a6f3dba062a8e5fe057254c5f02f702d0f39e`. The setup verifies both JSONL files and the 32 scored rows.

      ```bash
      (
        set -euo pipefail
        IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
        BENCH=/models/tools/hy3-recipe/aisbench
        COMMIT=e968d1bd7f48404bd913b95560f33938072336fa
        ARCHIVE="benchmark-$COMMIT.tar.gz"
        mkdir -p "$BENCH"
        cd "$BENCH"
        curl -fSL --retry 2 --connect-timeout 10 --max-time 180 \
          "https://codeload.github.com/AISBench/benchmark/tar.gz/e968d1bd7f48404bd913b95560f33938072336fa" -o "$ARCHIVE"
        printf '%s  %s\n' 93715c21b94c3ba86d9f660dc3cfdf25be670dc2b7aca035750ca832a26e3680 \
          "$ARCHIVE" | sha256sum --check --strict
        tar -xzf "$ARCHIVE" --no-same-owner --no-same-permissions
        docker run --rm -i -v /models:/models -w "$BENCH" \
          "$IMAGE" bash -s -- "$COMMIT" <<'BASH'
      set -euo pipefail
      test "$(uname -m)" = aarch64
      SOURCE="$PWD/benchmark-$1"
      VENV="$PWD/venv-v023-post1"
      python3 -m venv --system-site-packages "$VENV"
      printf '%s\n' 'torch==2.10.0+cpu' 'datasets==3.6.0' 'mmengine-lite==0.10.7' > aisbench-v023-post1.constraints.txt
      "$VENV/bin/python" -m pip --disable-pip-version-check --timeout 30 --retries 2 install \
        --constraint aisbench-v023-post1.constraints.txt -e "$SOURCE" -r "$SOURCE/requirements/api.txt"
      "$VENV/bin/python" - <<'PY'
      from importlib.metadata import distributions, version
      from pathlib import Path
      from modelscope.hub.snapshot_download import dataset_snapshot_download
      assert version("ais_bench_benchmark") == "3.1.0"
      assert version("torch") == "2.10.0+cpu"
      assert not any(
          (item.metadata["Name"] or "").lower().startswith(("cuda-", "nvidia-"))
          for item in distributions()
      )
      dataset_id = "vllm-ascend/gsm8k-lite"
      revision = "622a6f3dba062a8e5fe057254c5f02f702d0f39e"
      splits = ["test.jsonl", "train.jsonl"]
      target = str(Path("gsm8k-lite").resolve())
      dataset_snapshot_download(dataset_id, revision=revision, allow_patterns=splits, local_dir=target)
      PY
      for split in train test; do
        printf '%s  %s\n' 6b1b25e3c772d87e36c01839e3b91e910793caae412785024700e2c270176bb9 \
          "gsm8k-lite/$split.jsonl" | sha256sum --check --strict
      done
      test "$(wc -l < gsm8k-lite/test.jsonl)" -eq 32
      "$VENV/bin/ais_bench" --help >/dev/null
      BASH
      )
      ```
env_setup:
  container:
    A3:
      content: >-
        Run on the A3 host with 16 visible devices, port 8000 free and the
        verified BF16 checkpoint under `/models/tencent/Hy3-preview`. Docker
        opens a shell using the release image entrypoint.


        ```bash

        IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a3

        CHECKPOINT=/models/tencent/Hy3-preview

        CONTAINER_NAME=${HY3_CONTAINER_NAME:-hy3-preview-a3-release}

        test -s "$CHECKPOINT/config.json" &&

        docker run --rm -it --name "$CONTAINER_NAME" --net=host --ipc=host \
          --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 \
          --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 \
          --device /dev/davinci8 --device /dev/davinci9 --device /dev/davinci10 --device /dev/davinci11 \
          --device /dev/davinci12 --device /dev/davinci13 --device /dev/davinci14 --device /dev/davinci15 \
          --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /models:/models -v "$CHECKPOINT:$CHECKPOINT:ro" -w /models \
          "$IMAGE" bash
        ```
scenarios:
  - npu: Atlas 800I A3
    precision: BF16
    deployment: Single-Node
    case: TP16 EP MTP
    tags:
      - a3-single
    strategy: single_node_A3
    steps:
      - title: Open the release container on the A3 host
        content: >-
          Run on the A3 host with 16 visible devices, port 8000 free and the
          verified BF16 checkpoint under `/models/tencent/Hy3-preview`. Docker
          opens a shell using the release image entrypoint.


          ```bash

          IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a3

          CHECKPOINT=/models/tencent/Hy3-preview

          CONTAINER_NAME=${HY3_CONTAINER_NAME:-hy3-preview-a3-release}

          test -s "$CHECKPOINT/config.json" &&

          docker run --rm -it --name "$CONTAINER_NAME" --net=host --ipc=host \
            --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 \
            --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 \
            --device /dev/davinci8 --device /dev/davinci9 --device /dev/davinci10 --device /dev/davinci11 \
            --device /dev/davinci12 --device /dev/davinci13 --device /dev/davinci14 --device /dev/davinci15 \
            --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /models:/models -v "$CHECKPOINT:$CHECKPOINT:ro" -w /models \
            "$IMAGE" bash
          ```
      - title: Start the server in the container
        content: >-
          Run in the release container. The service binds to loopback. Wait for
          the server to report that startup has completed.


          ```bash

          export VLLM_USE_RUST_FRONTEND=0

          export HCCL_OP_EXPANSION_MODE=AIV

          vllm serve tencent/Hy3-preview \
            --served-model-name hy3-preview \
            --tensor-parallel-size 16 \
            --speculative-config.method mtp \
            --speculative-config.num_speculative_tokens 1 \
            --speculative-config.enforce_eager true \
            --enable-expert-parallel \
            --enable-ep-weight-filter \
            --tool-call-parser hy_v3 \
            --reasoning-parser hy_v3 \
            --enable-auto-tool-choice \
            --max-model-len 32768 \
            --max-num-seqs 8 \
            --host 127.0.0.1 \
            --port 8000
          ```
      - title: Check readiness and run inference in a second A3 host terminal
        content: |-
          Leave the service running. After it is ready, run the following in a
          second terminal on the same A3 host. The model list should include `hy3-preview` and the no-think request should return
          `Hi`.

          ```python
          from urllib.request import ProxyHandler, Request, build_opener, install_opener, urlopen
          import json

          install_opener(build_opener(ProxyHandler({})))
          api = "http://127.0.0.1:8000/v1/"
          with urlopen(api + "models", timeout=15) as response:
              models = json.load(response)
          assert any(item["id"] == "hy3-preview" for item in models["data"]), models
          print(json.dumps(models, ensure_ascii=False))

          payload = b'{"model":"hy3-preview","max_tokens":16,"temperature":0,"messages":[{"role":"user","content":"Say hi in one word."}],"top_p":1,"chat_template_kwargs":{"reasoning_effort":"no_think"}}'
          endpoint = "/".join(("chat", "completions"))
          request = Request(api + endpoint, data=payload, headers={"Content-Type": "application/json"})
          with urlopen(request, timeout=120) as response:
              result = json.load(response)
          assert result["model"] == "hy3-preview", result
          assert (result["choices"][0]["message"].get("content") or "").strip(), result
          print(json.dumps(result, ensure_ascii=False, indent=2))
          ```
      - title: Evaluate GSM8K-lite accuracy
        content: |-
          After the setup above, run in the second A3 host terminal while the service stays up. Set and export `HY3_EVIDENCE_DIR` as a fresh absolute directory under `/models`. The test uses 32 scored rows, a four-shot chat prompt, batch size 8, temperature 0.6 and at most 4096 generated tokens.

          ```bash
          IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a3
          BENCH=/models/tools/hy3-recipe/aisbench
          COMMIT=e968d1bd7f48404bd913b95560f33938072336fa
          SOURCE="$BENCH/benchmark-$COMMIT"
          VENV="$BENCH/venv-v023-post1"
          OUT=${HY3_EVIDENCE_DIR:-}
          [[ "$OUT" == /models/* ]] &&
          mkdir -p "$OUT" &&
          printf '%s  %s\n' 6b1b25e3c772d87e36c01839e3b91e910793caae412785024700e2c270176bb9 \
            "$BENCH/gsm8k-lite/test.jsonl" | sha256sum --check --strict &&
          test "$(wc -l < "$BENCH/gsm8k-lite/test.jsonl")" -eq 32 &&
          cat > "$OUT/08-gsm8k-lite.py" <<PY &&
          from mmengine.config import read_base
          with read_base():
              from ais_bench.benchmark.configs.datasets.gsm8k.gsm8k_gen_4_shot_cot_chat_prompt import gsm8k_datasets as datasets
              from ais_bench.benchmark.configs.models.vllm_api.vllm_api_general_chat import models
          datasets[0]["path"] = "$BENCH/gsm8k-lite"
          models[0]["model"] = "hy3-preview"
          models[0]["host_ip"] = "127.0.0.1"
          models[0]["host_port"] = 8000
          models[0]["batch_size"] = 8
          models[0]["max_out_len"] = 4096
          models[0]["trust_remote_code"] = True
          models[0]["generation_kwargs"]["temperature"] = 0.6
          work_dir = "$OUT/08-aisbench-results"
          PY
          docker run --rm --net=host -v /models:/models -w "$SOURCE" \
            -e NO_PROXY=127.0.0.1,localhost -e no_proxy=127.0.0.1,localhost \
            "$IMAGE" "$VENV/bin/ais_bench" "$OUT/08-gsm8k-lite.py" --debug --dump-eval-details
          ```
      - title: Measure lightweight online performance
        content: >-
          Set `HY3_EVIDENCE_DIR` to a fresh absolute directory under `/models`
          and export it before running this step on the same host. [vLLM
          Benchmark](https://docs.vllm.ai/en/latest/benchmarking/) sends four
          requests per input length (1024, 4096 and 16384 tokens), 128 output
          tokens, concurrency 1 and seed 0. The command saves per-request JSON
          for each input length.


          ```bash

          IMAGE=quay.io/ascend/vllm-ascend:v0.23.0.post1-a3

          OUT=${HY3_EVIDENCE_DIR:-}

          RESULTS="$OUT/07-vllm-bench"

          [[ "$OUT" == /models/* ]] &&

          mkdir -p "$RESULTS" &&

          (
            for input_length in 1024 4096 16384; do
              docker run --rm --net=host -v /models:/models -w /models "$IMAGE" \
                vllm bench serve \
                  --backend openai-chat --base-url http://127.0.0.1:8000 \
                  --endpoint /v1/chat/completions --model /models/tencent/Hy3-preview \
                  --served-model-name hy3-preview --dataset-name random \
                  --random-input-len "$input_length" --random-output-len 128 \
                  --num-prompts 4 --request-rate inf --max-concurrency 1 \
                  --temperature 0 --top-p 1 --seed 0 \
                  --save-result --save-detailed --result-dir "$RESULTS" \
                  --result-filename "random-$input_length.json" || exit $?
            done
          )

          ```
verification: The hardware run passed the greeting, parsed reasoning, automatic
  tool calling, and MTP draft and acceptance counter checks.
performance:
  accuracy: The Nov 21, 2026 A3 run answered 32/32 GSM8K-lite questions correctly.
    In the Nov 22, 2026 remediation retest, all 32/32 requests returned and
    31/32 answers were correct (96.875% accuracy). Both runs used a temperature
    of 0.6. The [official test
    case](https://github.com/vllm-project/vllm-ascend/blob/128f35ed1461ecb34bc8b87583a67a66bc4bd1d6/tests/e2e/cases/models/configs/Hunyuan/Hy3-preview.yaml)
    gives a reference score of 93.07 and a 10-point tolerance. The historical
    tutorial lists reference scores for GSM8K and C-Eval.
  benchmark: Each input setting (1024, 4096 and 16384 tokens) completed 4/4
    requests, with 128 output tokens per request.
references:
  - title: Pinned tutorial baseline
    url: https://github.com/vllm-project/vllm-ascend/blob/5cb98caaadeff42b5b62b996e34bb2aaa29d20fd/docs/source/tutorials/models/Hy3-preview.md
  - title: Current upstream tutorial / support status
    url: https://docs.vllm.ai/projects/ascend/en/v0.30.0/tutorials/models/Hy3-preview.html
  - title: Official model card
    url: https://huggingface.co/tencent/Hy3-preview
  - title: Public image registry
    url: https://quay.io/repository/ascend/vllm-ascend?tab=tags
features:
  spec_decoding:
    label: MTP
    args:
      - --speculative-config.method
      - mtp
      - --speculative-config.num_speculative_tokens
      - "1"
      - --speculative-config.enforce_eager
      - "true"
  expert_parallel:
    label: EP
    args:
      - --enable-expert-parallel
tuning: The tested serving limit is 32768 tokens with up to 8 concurrent
  sequences. MTP drafts one token. Keep EP weight filtering and both hy_v3
  parsers enabled. The formula `ceil((295 + 3.8) × 2 × 1.2) = 718 GB` estimates
  BF16 weight memory, including the separate 3.8B MTP layer and excluding KV
  cache and runtime allocation.
