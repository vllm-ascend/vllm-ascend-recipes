  performance:
    content: |-
      ### Using AISBench

      Refer to [Using AISBench for performance evaluation](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation) for details.

      ### Using vLLM Benchmark

      Run performance evaluation of `Kimi-K2.6-w4a8` as an example. Refer to [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/) for more details.

      There are three `vllm bench` subcommands:

      - `latency`: Benchmark the latency of a single batch of requests.
      - `serve`: Benchmark the online serving throughput.
      - `throughput`: Benchmark offline inference throughput.

      Take the `serve` as an example. Run the code as follows.

      ```shell
      vllm bench serve --model Eco-Tech/Kimi-K2.6-w4a8 --dataset-name random --random-input 1024 --num-prompts 200 --request-rate 1 --save-result --result-dir ./
      ```

      After about several minutes, you can get the performance evaluation result.

