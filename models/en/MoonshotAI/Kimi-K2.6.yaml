  benchmark: |-
    ### Recommended Configurations

    > **Note**: The following configurations are validated in specific test environments and are for reference only. The optimal configuration depends on factors such as maximum input/output length, prefix cache hit rate, precision requirements, and deployment machine ratios. It is recommended to refer to the tuning guidelines based on actual conditions.

    #### Table 1: Scenario Overview

    > `*Total NPUs` indicates the total number of NPUs used across all nodes. 1 node = 1 Atlas 800 A3 server (64G × 16 NPUs).

    | Scenario | Deployment Mode | *Total NPUs | Weight Version | Key Considerations |
    | --- | --- | --- | --- | --- |
    | High Throughput (16k input) | Single-Node Mixed | 16 (A3) | kimi-k2.6-w4a8 | Use dp2 tp8 to balance memory capacity and compute efficiency |
    | High Throughput (16k input) | 1P1D deployment | 32 (A3) | kimi-k2.6-w4a8 | dp2 tp8 on both P and D nodes; balanced latency and throughput |
    | High Throughput (16k input) | 2P1D deployment | 64 (A3) | kimi-k2.6-w4a8 | Scale from dp4 tp4 to dp8 tp4 across nodes |
    | Long Context (128k, no prefix cache) | Single-Node Mixed | 16 (A3) | kimi-k2.6-w4a8 | dp1 tp16 to maximize TP, accommodate extreme context lengths |
    | Long Context (128k, with prefix cache) | Single-Node Mixed | 16 (A3) | kimi-k2.6-w4a8 | dp2 tp8 to optimize memory bandwidth and improve cache utilization |
    | Multimodal (1080P) | Single-Node Mixed | 16 (A3) | kimi-k2.6-w4a8 | dp1 tp16 for high-resolution visual inputs |
    | Multimodal (1080P) | 1P1D deployment | 32 (A3) | kimi-k2.6-w4a8 | dp2 tp8 or dp16 tp1, depending on memory and concurrency |
    | Multimodal (1080P) | 2P1D deployment | 64 (A3) | kimi-k2.6-w4a8 | dp8 tp2 to dp32 tp1, maximize throughput for heavy multimodal workloads |

    #### Table 2: Detailed Node Configuration

    | Scenario | Configuration | NPUs | TP | DP | Max Model Len | MTP Speculation Num |
    | --- | --- | --- | --- | --- | --- | --- |
    | High Throughput / Low Latency (16k) | Server / Single Machine | 16 | 8 | 2 | 17k | 15 |
    | High Throughput / Low Latency (16k) | Server-P Node | 16 | 8 | 2 | 17k | 3 |
    | High Throughput / Low Latency (16k) | Server-D Node | 16 | 8 | 2 | 17k | 3 |
    | Long Context (128k, no cache) | Server / Single Machine | 16 | 16 | 1 | 130k | 15 |
    | Long Context (128k, with cache) | Server / Single Machine | 16 | 8 | 2 | 130k | 15 |
    | Multimodal (1080P) | Server / Single Machine | 16 | 16 | 1 | 17k | 15 |
    | Multimodal (1080P) | Server-P Node | 16 | 8 | 2 | 17k | 3 |
    | Multimodal (1080P) | Server-D Node | 16 | 1 | 16 | 17k | 3 |

    > For complete startup commands and parameter descriptions, please refer to the deployment examples in the deployment chapter.

    **Notice:**

    `max-model-len` and `max-num-seqs` need to be set according to the actual usage scenario. For other settings, please refer to the deployment chapter.

