meta:
  title: "Kimi-K2.6"
  slug: "kimi-k2-6"
  provider: "Moonshot AI"
  description: "Native multimodal agentic model built through continual pretraining on ~15T mixed visual and text tokens atop Kimi-K2-Base, with instant and thinking modes plus conversational and agentic paradigms."
  date_added: 2026-08-13
  date_updated: 2026-08-13
  difficulty: advanced
  tasks:
    - text
    - image
    - video
  related_recipes:
    - "moonshotai/Kimi-K2.5"
  performance_headline: "1T/32B MoE multimodal agentic model — single-node and multi-node PD serving with W4A8 weights"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "moonshotai/Kimi-K2.6"
  performance_model_names:
    - "Kimi-K2.6"
  min_vllm_version: "v0.20.0rc1"
  architecture: moe
  parameter_count: "1T"
  active_parameters: "32B"
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--quantization"
    - "ascend"
    - "--tool-call-parser"
    - "kimi_k2"
    - "--reasoning-parser"
    - "kimi_k2"
    - "--served-model-name"
    - "kimi_k26"
    - "--enable-expert-parallel"
    - "--mm-encoder-tp-mode"
    - "data"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.20.0rc1"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.20.0rc1-a3"
  nightly_required: false
  install:
    # Ascend recommends Docker; pip requires a source build, so the pip tab is hidden.
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci8 --device /dev/davinci9 --device /dev/davinci10 --device /dev/davinci11 --device /dev/davinci12 --device /dev/davinci13 --device /dev/davinci14 --device /dev/davinci15 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -it quay.io/ascend/vllm-ascend:v0.20.0rc1-a3 bash"
      note: "Official Ascend image; the complete device/driver mount set is covered in env_setup.container."

features:
  tool_calling:
    description: "Kimi-K2 native tool calling"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "kimi_k2"]
  reasoning:
    description: "Kimi-K2 thinking mode"
    args: ["--reasoning-parser", "kimi_k2"]
  expert_parallel:
    description: "MoE expert parallelism across DP ranks"
    args: ["--enable-expert-parallel"]
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm communication optimization for prefill nodes"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  mlapo:
    label: "MLAPO"
    description: "MLAPO fusion operator for decode nodes"
    env:
      VLLM_ASCEND_ENABLE_MLAPO: "1"
  prefix_caching:
    label: "Prefix Caching"
    description: "KV-cache prefix caching (--enable-prefix-caching / --no-enable-prefix-caching)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

opt_in_features:
  - prefix_caching

variants:
  default:
    model_id: "Eco-Tech/Kimi-K2.6-W4A8"
    precision: W4A8
    vram_minimum_gb: 600
    description: "W4A8 weights on Atlas 800 A3 (or 2× A2) — single-node or multi-node PD"
    supported_hardware: [atlas_800_a2, atlas_800_a3]

compatible_strategies:
  - single_node_A3
  - pd_cluster

# Upstream-aligned declarative PD-cluster topology. The site renders this as
# node selection (prefill/decode nodes) + "Cluster env", then generates the
# per-node scripts. The imperative `scenarios` below remain the CI source of
# truth for the Ascend runner.
strategy_overrides:
  pd_cluster:
    env:
      HCCL_OP_EXPANSION_MODE: "AIV"
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      ASCEND_BUFFER_POOL: "4:8"
      VLLM_RPC_TIMEOUT: "3600000"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
      HCCL_EXEC_TIMEOUT: "204"
      HCCL_CONNECT_TIMEOUT: "120"
      LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH"
    prefill:
      nodes:
        default: 2
      parallelism: dep
      vllm_args:
        - "--enforce-eager"
        - "--max-num-seqs"
        - "1"
        - "--max-model-len"
        - "133120"
        - "--max-num-batched-tokens"
        - "16384"
        - "--gpu-memory-utilization"
        - "0.92"
        - "--additional-config"
        - '{"recompute_scheduler_enable":true,"enable_shared_expert_dp": true}'
        - "--kv-transfer-config"
        - '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_producer","kv_port":"30000","engine_id":"0","kv_connector_extra_config":{"use_ascend_direct":true,"prefill":{"dp_size":4,"tp_size":4},"decode":{"dp_size":8,"tp_size":4}}}'
      env:
        HCCL_BUFFSIZE: "1536"
        VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
    decode:
      nodes:
        default: 2
      parallelism: dep
      vllm_args:
        - "--max-num-seqs"
        - "8"
        - "--max-model-len"
        - "133720"
        - "--max-num-batched-tokens"
        - "32"
        - "--gpu-memory-utilization"
        - "0.91"
        - "--compilation-config"
        - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
        - "--additional-config"
        - '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert": true}'
        - "--speculative-config"
        - '{"method": "eagle3", "model":"lightseekorg/kimi-k2.6-eagle3", "num_speculative_tokens": 3}'
        - "--kv-transfer-config"
        - '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_consumer","kv_port":"30200","engine_id":"2","kv_connector_extra_config":{"prefill":{"dp_size":4,"tp_size":4},"decode":{"dp_size":8,"tp_size":4}}}'
      env:
        HCCL_BUFFSIZE: "800"
        VLLM_ASCEND_ENABLE_MLAPO: "1"

dependencies:
  - note: "ModelScope is used to download the W4A8 weights"
    command: "pip install modelscope"

guide: ""

overview: |-
  Kimi-K2.6 is an open-source, native multimodal agentic model built through continual
  pretraining on approximately 15 trillion mixed visual and text tokens atop
  Kimi-K2-Base. It integrates vision and language understanding with advanced agentic
  capabilities, instant and thinking modes, as well as conversational and agentic
  paradigms.

  The Ascend recipe uses the W4A8 checkpoint `Eco-Tech/Kimi-K2.6-W4A8`, a 4-bit weight /
  8-bit activation quantized variant optimized for Atlas NPUs. This document shows the
  main verification steps of the model, including supported features, feature
  configuration, environment preparation, single-node and multi-node deployment,
  accuracy and performance evaluation.

  This document is validated and written based on **vLLM-Ascend v0.20.0rc1**. The
  current model (Kimi-K2.6) is first supported in this version.

weight_download:
- weight_version: W4A8 (Pre-quantized)
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Eco-Tech/Kimi-K2.6-W4A8
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model Eco-Tech/Kimi-K2.6-W4A8
      ```
- weight_version: Eagle3 MTP (draft model)
  sources:
  - source: HuggingFace
    url: https://huggingface.co/lightseekorg/kimi-k2.6-eagle3
    command: |-
      ```bash
      huggingface-cli download lightseekorg/kimi-k2.6-eagle3
      ```
- weight_version: DFlash (speculative decoding)
  sources:
  - source: HuggingFace
    url: https://huggingface.co/z-lab/Kimi-K2.5-DFlash
    command: |-
      ```bash
      huggingface-cli download z-lab/Kimi-K2.5-DFlash
      ```

prerequisites:
- title: Model Weight
  content: |-
    - `Kimi-K2.6-w4a8` (Quantized version for w4a8): requires 1 Atlas 800 A3 (64GB × 16) node or 2 Atlas 800 A2 (64GB × 8) nodes. [Download model weight](https://www.modelscope.cn/models/Eco-Tech/Kimi-K2.6-W4A8).
    - `kimi-k2.6-eagle3` (Eagle3 MTP draft model for accelerating inference of Kimi-K2.6): [Download model weight](https://huggingface.co/lightseekorg/kimi-k2.6-eagle3).
    - `Kimi-K2.5-DFlash` (a speculative decoding framework that leverages a lightweight block diffusion model for parallel drafting): [Download model weight](https://huggingface.co/z-lab/Kimi-K2.5-DFlash).

    It is recommended to download the model weight to the shared directory of multiple nodes, such as `/root/.cache/`.
- title: Verify Multi-node Communication
  content: |-
    If you want to deploy a multi-node environment, you need to verify multi-node communication according to [verify multi-node communication environment](https://docs.vllm.ai/projects/ascend/en/latest/installation.html#verify-multi-node-communication).

