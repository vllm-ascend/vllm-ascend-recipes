      To use the tool_calls feature, please ensure that your transformers version is 4.57.6 or lower. If vllm-ascend has been upgraded to v0.21 or later, this requirement no longer applies.

scenarios:
- npu: Atlas 800I A3
  precision: W4A8
  deployment: Single-Node
  case: High Throughput
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: Start the server
    content: |-
      Single-node deployment completes both Prefill and Decode within the same node. The quantized model `Kimi-K2.6-w4a8` can be deployed on 1 Atlas 800 A3 (64G × 16).

      While a single-node setup supports all input/output scenarios, consider deploying multi-nodes for optimal performance.

      ```shell
      export HCCL_OP_EXPANSION_MODE="AIV"
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1
      export VLLM_ASCEND_ENABLE_MLAPO=1
      # [Optional] jemalloc
      # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
      export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD
      echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
      sysctl -w vm.swappiness=0
      sysctl -w kernel.numa_balancing=0
      sysctl -w kernel.sched_migration_cost_ns=50000
      export HCCL_BUFFSIZE=600
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
      export VLLM_ASCEND_BALANCE_SCHEDULING=0

      vllm serve Eco-Tech/Kimi-K2.6-W4A8 \
          --quantization ascend \
          --tool-call-parser kimi_k2 \
          --reasoning-parser kimi_k2 \
          --allowed-local-media-path / \
          --served-model-name kimi_k26 \
          --trust-remote-code \
          --tensor-parallel-size 4 \
          --data-parallel-size 4 \
          --no-enable-prefix-caching \
          --enable-expert-parallel \
          --port 8000 \
          --max-num-seqs 4 \
          --max-model-len 34816 \
          --max-num-batched-tokens 16384 \
          --gpu-memory-utilization 0.87 \
          --seed 42 \
          --async-scheduling \
          --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
          --profiler-config '{"profiler": "torch", "torch_profiler_dir": "./vllm_profile", "torch_profiler_with_stack": true}' \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --additional-config '{"enable_balance_scheduling": true}' \
          --speculative-config '{"method": "dflash","model": "z-lab/Kimi-K2.5-DFlash", "num_speculative_tokens": 15}'
      ```

      Key Parameter Descriptions:

      - Setting the environment variable `VLLM_ASCEND_BALANCE_SCHEDULING=1` enables balance scheduling. This may help increase output throughput and reduce TPOT in the v1 scheduler. However, TTFT may degrade in some scenarios. Furthermore, enabling this feature is not recommended in scenarios where PD is separated.
      - `--max-model-len` specifies the maximum context length — the sum of input and output tokens for a single request. For performance testing with an input length of 3.5K and output length of 1.5K, a value of `16384` is sufficient; for precision testing, set it to at least `35000`.
      - `--no-enable-prefix-caching` indicates that prefix caching is disabled. To enable it, remove this option.
      - `--mm-encoder-tp-mode` indicates how to optimize multi-modal encoder inference using tensor parallelism (TP). For multimodal inputs, `data` is recommended.
      - If you use the w4a8 weight, more memory will be allocated to KV cache, and you can try increasing `--max-num-seqs` to improve system throughput.

      Common Issues Tip: If you encounter issues, please refer to the [Public FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html) for troubleshooting.
  - title: Service Verification
    content: |-
      ```shell
      curl http://<node_ip>:8000/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "kimi_k26",
              "messages": [{
                  "role": "user",
                  "content": [
                  {
                      "type": "text",
                      "text": "The future of AI is"
                  }]
              }],
              "max_tokens": 1024,
              "temperature": 1.0,
              "top_p": 0.95
          }'
      ```

      Expected Result:

      The service returns HTTP 200 OK with a JSON response containing the `choices` field.
- npu: Atlas 800I A3
  precision: W4A8
  deployment: Multi-Node PD Separation
  case: PD Separation
  tags: [pd-multinode]
  strategy: pd_cluster
  steps:
  - title: Overview
    content: |-
      We recommend using Mooncake for deployment: [Mooncake](https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html).

      In the standard single-node deployment mode, Prefill (prompt processing) and Decode (token generation) tasks run on the same set of NPUs. This can lead to two issues:

      1. **Prefill preemption interrupts Decode**: Prefill is a compute-intensive task that processes the entire input context at once, while Decode generates tokens one by one. When a new user request arrives, its Prefill phase can preempt and interrupt ongoing Decode tasks, causing jitter and higher time-per-output-token (TPOT) latency.
      2. **Inflexible resource allocation**: Prefill and Decode have fundamentally different computational characteristics — Prefill is compute-bound and memory-bandwidth-intensive, while Decode is memory-bandwidth-bound. Running them on the same hardware forces a compromise that satisfies neither optimally.

      PD (Prefill-Decode) separation addresses these issues by running Prefill and Decode on dedicated node groups, each configured independently:

      - **Prefill nodes** focus on high-throughput prompt processing, optimized for compute and communication (e.g., enabling FlashComm for Allreduce acceleration).
      - **Decode nodes** focus on low-latency token generation, optimized for memory bandwidth (e.g., enabling MLAPO fusion operators).

      This architecture is recommended for production deployments with concurrent multi-user workloads, where stable latency and high throughput are both required.

      Take Atlas 800 A3 (64G × 16) for example, we recommend deploying 2P1D (4 nodes) rather than 1P1D (2 nodes), because there is not enough NPU memory to serve high concurrency in the 1P1D case.

      - `Kimi-K2.6-w4a8 2P1D`: requires 4 Atlas 800 A3 (64G × 16) nodes.
  - title: Prepare helper scripts
    content: |-
      To run the vllm-ascend Prefill-Decode Disaggregation service, deploy the `launch_online_dp.py` and `run_dp_template.sh` scripts on each node, and deploy the proxy script on the prefill master node to forward requests.

      - [launch_online_dp.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/external_online_dp/launch_online_dp.py)
      - [load_balance_proxy_server_example.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py)

      Parameter descriptions for `launch_online_dp.py`:

      | Parameter | Type | Required | Default | Description |
      | --- | --- | --- | --- | --- |
      | `--dp-size` | int | Yes | - | Data parallel size (total number of DP ranks across all nodes). |
      | `--tp-size` | int | No | 1 | Tensor parallel size within each DP rank. |
      | `--dp-size-local` | int | No | (same as `--dp-size`) | Number of DP ranks on the current node. |
      | `--dp-rank-start` | int | No | 0 | Starting rank offset for data parallel ranks on this node. |
      | `--dp-address` | str | Yes | - | IP address of the data parallel master node (node 0). |
      | `--dp-rpc-port` | str | No | 12345 | RPC port for data parallel master communication. |
      | `--vllm-start-port` | int | No | 9000 | Starting port for each vLLM engine instance on this node. |
  - title: Configure Prefill nodes
    content: |-
      On each prefill node, set the network interface and IP, then start the vLLM engine with the `kv_producer` role. The following shows Node 0 (Prefill); Node 1 (Prefill) is identical except for `local_ip`, `engine_id`, and `kv_port`.

      ```shell
      # this obtained through ifconfig
      # nic_name is the network interface name corresponding to local_ip of the current node
      nic_name="xxx"
      local_ip="141.xx.xx.1"

      # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
      node0_ip="xxxx"

      export HCCL_IF_IP=$local_ip
      export GLOO_SOCKET_IFNAME=$nic_name
      export TP_SOCKET_IFNAME=$nic_name
      export HCCL_SOCKET_IFNAME=$nic_name
      export VLLM_RPC_TIMEOUT=3600000
      export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=30000
      export HCCL_EXEC_TIMEOUT=204
      export HCCL_CONNECT_TIMEOUT=120
      export HCCL_OP_EXPANSION_MODE="AIV"
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1
      export ASCEND_BUFFER_POOL=4:8
      export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
      export HCCL_BUFFSIZE=1536
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
      export ASCEND_RT_VISIBLE_DEVICES=$1

      vllm serve Eco-Tech/Kimi-K2.6-W4A8 \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --seed 1024 \
          --quantization ascend \
          --served-model-name kimi_k26 \
          --trust-remote-code \
          --max-num-seqs 1 \
          --max-model-len 133120 \
          --max-num-batched-tokens 16384 \
          --no-enable-prefix-caching \
          --gpu-memory-utilization 0.92 \
          --enforce-eager \
          --enable-auto-tool-choice \
          --tool-call-parser kimi_k2 \
          --reasoning-parser kimi_k2 \
          --additional-config '{"recompute_scheduler_enable":true,"enable_shared_expert_dp": true}' \
          --mm-encoder-tp-mode data \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_producer",
          "kv_port": "30000",
          "engine_id": "0",
          "kv_connector_extra_config": {
                  "use_ascend_direct": true,
                  "prefill": {
                          "dp_size": 4,
                          "tp_size": 4
                  },
                  "decode": {
                          "dp_size": 8,
                          "tp_size": 4
                  }
              }
          }'
      ```
  - title: Configure Decode nodes
    content: |-
      On each decode node, start the vLLM engine with the `kv_consumer` role. The following shows Node 0 (Decode); Node 1 (Decode) is identical except for `local_ip`, `engine_id`, and `kv_port`.

      ```shell
      nic_name="xxx"
      local_ip="141.xx.xx.3"
      node0_ip="xxxx"

      export HCCL_IF_IP=$local_ip
      export GLOO_SOCKET_IFNAME=$nic_name
      export TP_SOCKET_IFNAME=$nic_name
      export HCCL_SOCKET_IFNAME=$nic_name
      export VLLM_RPC_TIMEOUT=3600000
      export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=30000
      export HCCL_EXEC_TIMEOUT=204
      export HCCL_CONNECT_TIMEOUT=120
      export HCCL_OP_EXPANSION_MODE="AIV"
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1
      export ASCEND_BUFFER_POOL=4:8
      export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
      export HCCL_BUFFSIZE=800
      export VLLM_ASCEND_ENABLE_MLAPO=1
      export ASCEND_RT_VISIBLE_DEVICES=$1

      vllm serve Eco-Tech/Kimi-K2.6-W4A8 \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --seed 1024 \
          --quantization ascend \
          --served-model-name kimi_k26 \
          --trust-remote-code \
          --max-num-seqs 8 \
          --max-model-len 133720 \
          --max-num-batched-tokens 32 \
          --no-enable-prefix-caching \
          --gpu-memory-utilization 0.91 \
          --enable-auto-tool-choice \
          --tool-call-parser kimi_k2 \
          --reasoning-parser kimi_k2 \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
          --additional-config '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert": true}' \
          --speculative-config '{"method": "eagle3", "model":"lightseekorg/kimi-k2.6-eagle3", "num_speculative_tokens": 3}' \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_consumer",
          "kv_port": "30200",
          "engine_id": "2",
          "kv_connector_extra_config": {
                  "prefill": {
                          "dp_size": 4,
                          "tp_size": 4
                  },
                  "decode": {
                          "dp_size": 8,
                          "tp_size": 4
                  }
              }
          }'
      ```

      Key Parameter Descriptions:

      - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1` enables the communication optimization function on the prefill nodes.
      - `VLLM_ASCEND_ENABLE_MLAPO=1` enables the fusion operator, which can significantly improve performance but consumes more NPU memory. In the PD separation scenario, enable MLAPO only on decode nodes.
      - `recompute_scheduler_enable: true` enables the recomputation scheduler. When the KV Cache of the decode node is insufficient, requests will be sent to the prefill node to recompute the KV Cache. In the PD separation scenario, it is recommended to enable this configuration on both prefill and decode nodes simultaneously.
      - `multistream_overlap_shared_expert: true` enables an additional stream to overlap the computation process of shared experts when TP size is 1 or `enable_shared_expert_dp: true`.
  - title: Launch servers on each node
    content: |-
      ```shell
      # Prefill — each prefill node is its own DP master (dp-address = node IP)
      python launch_online_dp.py --dp-size 4 --tp-size 4 --dp-size-local 4 --dp-rank-start 0 --dp-address xx.xx.xx.1 --dp-rpc-port 12321 --vllm-start-port 7100
      # Decode — one DP group across nodes (dp-rank-start increments per node)
      python launch_online_dp.py --dp-size 8 --tp-size 4 --dp-size-local 4 --dp-rank-start 0 --dp-address xx.xx.xx.3 --dp-rpc-port 12321 --vllm-start-port 7100
      ```
  - title: Run the proxy on the prefill master node
    content: |-
      Run a proxy server on the same node as the prefill service instance.

      ```shell
      python load_balance_proxy_server_example.py \
        --port 1999 \
        --host 141.xx.xx.1 \
        --prefiller-hosts \
          141.xx.xx.1 \
          141.xx.xx.1 \
          141.xx.xx.1 \
          141.xx.xx.1 \
          141.xx.xx.2 \
          141.xx.xx.2 \
          141.xx.xx.2 \
          141.xx.xx.2 \
        --prefiller-ports \
          7100 7101 7102 7103 7100 7101 7102 7103 \
        --decoder-hosts \
          141.xx.xx.3 \
          141.xx.xx.3 \
          141.xx.xx.3 \
          141.xx.xx.3 \
          141.xx.xx.4 \
          141.xx.xx.4 \
          141.xx.xx.4 \
          141.xx.xx.4 \
        --decoder-ports \
          7100 7101 7102 7103 \
          7100 7101 7102 7103 \
      ```

      ```shell
      cd vllm-ascend/examples/disaggregated_prefill_v1/
      bash proxy.sh
      ```
  - title: Deployment Verification
    content: |-
      After the PD separation service is fully started, send a request through the proxy port on the prefill master node to verify that Prefill and Decode nodes are working correctly together:

      ```shell
      curl http://141.xx.xx.1:1999/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "kimi_k26",
              "messages": [{
                  "role": "user",
                  "content": [
                  {
                      "type": "text",
                      "text": "The future of AI is"
                  }]
              }],
              "max_tokens": 1024,
              "temperature": 1.0,
              "top_p": 0.95
          }'
      ```

      Expected Result:

      The proxy returns HTTP 200 OK. The JSON response contains the `choices` field with the generated text, confirming that Prefill nodes have successfully processed the prompt and Decode nodes have generated the response.

