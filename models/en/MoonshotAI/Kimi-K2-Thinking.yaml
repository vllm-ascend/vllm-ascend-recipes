  - title: "Official tutorial"
    url: "https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/Kimi-K2-Thinking.html"
  - title: "Nightly verification config"
    url: "https://github.com/vllm-project/vllm-ascend/blob/v0.23.0rc1/tests/e2e/nightly/single_node/models/configs/Kimi-K2-Thinking.yaml"
  - title: "Model weights (HuggingFace)"
    url: "https://huggingface.co/moonshotai/Kimi-K2-Thinking"
