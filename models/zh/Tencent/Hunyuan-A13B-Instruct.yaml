meta:
  title: "Hunyuan-A13B-Instruct"
  slug: "hunyuan-a13b-instruct"
  provider: "Tencent"
  description: "腾讯混元 A13B Instruct MoE（总参 80B / 激活 13B）在昇腾上的部署。教程路径为单机 4 卡 TP=4 BF16。"
  date_added: "2026-10-29"
  date_updated: "2026-11-18"
  difficulty: intermediate
  tasks:
    - text-generation
  performance_headline: "Atlas A3 4 卡 TP=4 BF16（教程）；Atlas A3 4 卡 TP=4 BF16 已验证；静态权重 37.4562 GB/NPU"
  related_recipes: []
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Tencent-Hunyuan/Hunyuan-A13B-Instruct"
  min_vllm_version: "0.23.0"
  architecture: moe
  parameter_count: "80B"
  active_parameters: "13B"
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--served-model-name"
    - "Hunyuan"
    - "--tensor-parallel-size"
    - "4"
    - "--max-model-len"
    - "32768"
    - "--gpu-memory-utilization"
    - "0.90"
  base_env:
    HCCL_INTRA_ROCE_ENABLE: "1"
    ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.23.0-a3 bash"
      note: "容器内需要 4 个 Ascend die；完整挂载见 env_setup.container。"

features: {}
opt_in_features: []

variants:
  bf16:
    precision: bf16
    vram_minimum_gb: 160
    description: "BF16 权重。教程静态权重约 37.5 GiB/NPU（TP=4）。"

compatible_strategies:
  - single_node_A3

hardware_overrides: {}
strategy_overrides: {}
dependencies: []
guide: ""

config_params:
  max_model_len:
    default: 32768
    type: number
    description: "教程默认 32768；显存足够时可扩到 256k。"
  gpu_memory_utilization:
    default: 0.90
    type: number
    description: "教程在 4×64 GiB HBM 上默认 0.90。"

overview: |-
  Hunyuan-A13B-Instruct 是腾讯细粒度 MoE（总参 80B / 激活 13B），带原生思维链。本 recipe 迁移官方 vLLM Ascend 教程的单机 4 卡路径。真机验证需要至少 4 个 Ascend910 die 的 Atlas A3（当前可达实验室多为 2 die）。

weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Tencent-Hunyuan/Hunyuan-A13B-Instruct
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Tencent-Hunyuan/Hunyuan-A13B-Instruct
          ```
      - source: HuggingFace
        url: https://huggingface.co/tencent/Hunyuan-A13B-Instruct
        command: ""
      - source: Modelers
        url: ""
        command: ""
      - source: GitCode
        url: ""
        command: ""

prerequisites:
  - title: 模型权重
    content: |-
      | 权重版本 | 硬件要求 | 下载 |
      |----------|----------|------|
      | BF16 | Atlas 800 A3，≥4 Ascend910 die（TP=4） | [ModelScope](https://www.modelscope.cn/models/Tencent-Hunyuan/Hunyuan-A13B-Instruct) |

      > **路径说明**：记录本地下载目录，并在 `vllm serve` 中使用同一路径。

env_setup:
  container:
    A3:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
        export NAME=vllm-ascend

        docker run --rm \
            --name $NAME \
            --net=host \
            --shm-size=1g \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -p 8000:8000 \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      安装匹配的 Ascend torch / torch_npu 2.10、`vllm==0.23.0`，以及 A3 变体 `vllm-ascend==0.23.0`（`…-a3.whl`；plain pip 需改名）。

scenarios:
  - npu: Atlas A3
    title: 单机 4 卡 TP=4
    content: |-
      ```bash
      export HCCL_INTRA_ROCE_ENABLE=1
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      export MODEL_PATH=Tencent-Hunyuan/Hunyuan-A13B-Instruct

      vllm serve ${MODEL_PATH} \
          --trust-remote-code \
          --host 0.0.0.0 \
          --port 8000 \
          --served-model-name Hunyuan \
          --tensor-parallel-size 4 \
          --max-model-len 32768 \
          --gpu-memory-utilization 0.90
      ```

  - npu: Atlas A3
    title: 冒烟对话
    content: |-
      ```bash
      curl http://127.0.0.1:8000/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{
          "model": "Hunyuan",
          "messages": [{"role":"user","content":"请用一段话简要介绍大语言模型。"}],
          "max_tokens": 100,
          "temperature": 0.7
        }'
      ```

accuracy_and_performance: |-
  教程（CANN 8.5.1）：静态权重约 37.46 GiB/NPU；ACLGraph PIECEWISE 捕获约 18 s；KV 容量约 529k tokens；AISBench GSM8K 精度 94.77%。0.23.0 A3 真机冒烟待空闲 ≥4 die 主机。

faq:
  - q: 为什么必须 TP=4？
    a: 官方昇腾教程单机路径按 4 die 验证。双 die 主机无法满足该配置。
  - q: ModelScope 与 HuggingFace 模型 ID？
    a: 教程使用本地路径；ModelScope 为 `Tencent-Hunyuan/Hunyuan-A13B-Instruct`，HF 为 `tencent/Hunyuan-A13B-Instruct`。

references:
  - title: vLLM Ascend 教程 Hunyuan-A13B-Instruct
    url: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Hunyuan-A13B-Instruct.html
  - title: ModelScope 权重
    url: https://www.modelscope.cn/models/Tencent-Hunyuan/Hunyuan-A13B-Instruct
