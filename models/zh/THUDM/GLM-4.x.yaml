meta:
  title: "GLM-4.5/4.6/4.7"
  slug: "glm-4.x"
  provider: "THUDM"
  description: "GLM-4.x 系列是智谱 AI 推出的混合专家（MoE）基础模型，专为智能体应用设计。GLM-4.7 包含最新改进，支持 MTP 投机解码、专家并行和 PD 分离部署于昇腾 NPU。"
  date_added: 2026-07-13
  performance_headline: "Atlas 800 A3（128G × 8）单节点部署，支持 W8A8 精度"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "ZhipuAI/GLM-4.7"
  min_vllm_version: "0.10.0rc1"
  architecture: moe
  parameter_count: "31B"
  active_parameters: null
  context_length: 133000
  modality: text

# Upstream-aligned weight variants (vllm-project/recipes schema). VRAM = minimum to load.
variants:
  default:
    precision: W8A8
    vram_minimum_gb: 426
    description: "W8A8 量化权重（GLM-4.7-W8A8-floatmtp 含 MTP 头）—— 1 台 Atlas 800I A2（64G×8）或 1 台 Atlas 800I A3"
  bf16:
    model_id: "ZhipuAI/GLM-4.7"
    precision: BF16
    vram_minimum_gb: 852
    description: "BF16 全精度权重 —— 1 台 Atlas 800I A3（64G×16）"

features:
  expert_parallel:
    description: "跨 DP rank 的 MoE 专家并行"
    args: ["--enable-expert-parallel"]
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "配置 MTP（多 Token 预测）投机解码以加速推理"
    args: ["--speculative-config", '{"num_speculative_tokens": 3, "method": "mtp"}']
  compilation_config:
    label: "Compilation Config"
    description: "decode 阶段全 ACL 图执行，降低调度时延"
    args: ["--compilation-config", '{"cudagraph_capture_sizes": [1,2,4,8,16,32,64,128,256,512], "cudagraph_mode": "FULL_DECODE_ONLY"}']
  tool_calling:
    label: "Tool Calling"
    description: "GLM-4.7 函数调用解析器"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "glm47"]
  reasoning:
    label: "Reasoning Parser"
    description: "GLM-4.x 推理解析器"
    args: ["--reasoning-parser", "glm45"]
  topk_optimize:
    label: "TopK Optimize"
    description: "GLM-4.x 推荐开启的 TopK 优化"
    env:
      VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE: "1"
  balance_scheduling:
    label: "Balance Scheduling"
    description: "昇腾均衡调度优化"
    env:
      VLLM_ASCEND_BALANCE_SCHEDULING: "1"

extra_config:
- key: fusion_ops_gmmswigluquant
  label: "fusion_ops_gmmswigluquant=false"

config_params:
  max_model_len:
    default: 133000
    type: number
    description: "最大上下文长度（输入 + 输出 token 之和），需要根据实际场景设置"
  max_num_seqs:
    default: 16
    type: number
    description: "最大并发序列数；长上下文低并发场景建议不超过 4"
  max_num_batched_tokens:
    default: 8192
    type: number
    description: "每轮调度允许的最大 batch token 数"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "KV cache 可用的显存比例"

guide: ""
performance_model_names:
  - "GLM-4.5"
  - "GLM-4.6"
  - "GLM-4.7"
