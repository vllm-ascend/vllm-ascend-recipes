  benchmark: |-
    ### 推荐配置

    > **注意**：以下配置在特定测试环境中验证，仅供参考。

    #### 最佳实践

    | 场景 | 推荐配置 | 说明 |
    |------|---------|------|
    | 长上下文低并发（<=4） | dp1 tp16 | 最大化上下文容量 |
    | 长上下文高并发（>4） | dp2 tp8 | 平衡吞吐和上下文 |
    | 低延迟短序列 | dp2 tp8 | 降低每 token 延迟 |
    | 高吞吐短序列 | dp2 tp8 | 最大化并发请求处理 |

    > `max-model-len` 和 `max-num-seqs` 应根据场景调优。
tuning: |-
  ### 调优指南

  请参考 [公开性能调优文档](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) 了解调优方法。
  请参考 [功能指南](https://docs.vllm.ai/projects/ascend/zh-cn/latest/user_guide/support_matrix/feature_matrix.html) 了解详细功能描述。

  **GLM-4.x 关键调优说明：**

  - `fusion_ops_gmmswigluquant` 在 NPU 总数 <= 16 时应设为 `false`，以避免性能下降。
  - `VLLM_ASCEND_ENABLE_FLASHCOMM1`：在长序列（>=16k）和低并发（<=8 batch size）场景下应禁用。
  - `VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE=1` 推荐 GLM-4.x 模型使用。
faq: |-
  常见环境、安装和通用参数问题请参考 [公开 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)。本章仅涵盖模型特定问题。

  **Q：HCCL 端口冲突？**

  运行 `pkill -f VLLM*` 清理旧进程。

  **Q：OOM 或启动不稳定？**

  降低 `--max-num-seqs` 和 `--max-model-len`，减少并发和压测压力。

  **Q：如何启用函数调用？**

  在 `vllm serve` 命令中添加以下参数：

  ```bash
  --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
  ```
