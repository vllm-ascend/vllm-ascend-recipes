verification: |-
  服务启动后，可以通过发送提示词调用模型。

  **Chat Completions API：**

  ```shell
  curl http://localhost:8000/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "glm",
          "messages": [
              {"role": "user", "content": "请简要介绍大语言模型。"}
          ],
          "max_tokens": 256,
          "temperature": 0
      }'
  ```

  > - **URL**（`http://localhost:8000`）：将 `localhost` 和 `8000` 替换为服务器 IP 和 `vllm serve` 命令中的 `--port` 值。
  > - **`model`**：必须与 `vllm serve` 命令中的 `--served-model-name` 值匹配（如 `glm`）。

  **函数调用：**

  要启用函数调用，请在 `vllm serve` 命令中添加以下参数：

  ```bash
  --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
  ```

  预期结果：HTTP 200，返回包含 `choices` 字段的 JSON 响应及生成文本。
performance:
