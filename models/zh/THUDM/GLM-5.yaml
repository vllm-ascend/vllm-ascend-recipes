meta:
  title: "GLM-5"
  slug: "glm-5"
  provider: "THUDM"
  description: "GLM-5 和 GLM-5.1 是智谱 AI 推出的混合专家（MoE）模型，面向复杂系统工程和长周期智能体任务。GLM-5 拥有 744B 总参数量，支持 MTP 投机解码、专家并行和 PD 分离部署于昇腾 NPU。"
  date_added: 2026-07-13
  date_updated: 2026-07-13
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - "zai-org/GLM-5.1"
  performance_headline: "Atlas 800 A3（128G × 8）多节点部署，支持 W4A8/W8A8 精度"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "zai-org/GLM-5"
  min_vllm_version: "0.17.0rc1"
  architecture: moe
  parameter_count: "744B"
  active_parameters: null
  context_length: 131072
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    HCCL_BUFFSIZE: "200"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    VLLM_ASCEND_BALANCE_SCHEDULING: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.22.1rc"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.22.1rc-a3"
  nightly_required: false
  install:
    # Ascend 推荐 Docker 方式;pip 需源码编译,不提供官方 wheel,隐藏 pip 标签。
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g --device /dev/davinci0 --device /dev/davinci1 ... --device /dev/davinci15 -it quay.io/ascend/vllm-ascend:v0.22.1rc bash"
      note: "Ascend 官方镜像;完整设备/驱动挂载见 env_setup.container。"

# —— 上游对齐:features / variants / strategies / overrides / guide ——
features:
  expert_parallel:
    description: "跨 DP rank 的 MoE 专家并行(GLM-5 MoE 必需)"
    args: ["--enable-expert-parallel"]
  tool_calling:
    description: "GLM 函数调用"
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "glm47"]
  reasoning:
    description: "GLM 推理解析器"
    args: ["--reasoning-parser", "glm45"]
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP 投机解码(deepseek_mtp,3 个投机 token),加速推理"
    args: ["--speculative-config", '{"num_speculative_tokens": 3, "method": "deepseek_mtp", "enforce_eager": true}']
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm 通信优化(长序列/低并发场景建议关闭)"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  prefix_caching:
    label: "Prefix Caching"
    description: "KV 缓存前缀缓存(长上下文推荐开启)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  compilation_config:
    label: "Compilation Config"
    description: "decode 阶段全 ACL 图执行(--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  multistream_overlap:
    label: "Multi-stream Overlap"
    description: "MoE 共享专家多流重叠"
    args: ["--additional-config", '{"multistream_overlap_shared_expert": true}']

opt_in_features: []

variants:
  default:
    precision: W4A8
    vram_minimum_gb: 447
    description: "W4A8 量化权重,适用于 Atlas 800 A2/A3"
  w8a8:
    model_id: "Eco-Tech/GLM-5-w8a8"
    precision: W8A8
    vram_minimum_gb: 893
    description: "W8A8 量化权重(需要 VLLM_ASCEND_ENABLE_MLAPO=1)"
  bf16:
    model_id: "ZhipuAI/GLM-5"
    precision: bf16
    vram_minimum_gb: 1786
    description: "BF16 权重 — 需要 2× Atlas 800 A3(各 16 芯片)"

compatible_strategies:
  - single_node_A3
  - single_node_A2
  - multi_node_dp
  - pd_cluster

hardware_overrides: {}
strategy_overrides:
  pd_cluster:
    prefill:
      nodes: { default: 2 }
    decode:
      nodes: { default: 4 }

dependencies:
  - note: "GLM-5 tokenizer 需要 transformers >= 5.2.0"
    command: "pip install 'transformers>=5.2.0'"

guide: ""
performance_model_names:
  - "GLM-5"
  - "GLM-5.1"

# —— 可配置数值参数(页面/CI 扩展;默认值 = tutorial 基线)——
config_params:
  gpu_memory_utilization:
    default: 0.95
    type: number
    description: "KV cache 可用的显存比例"

