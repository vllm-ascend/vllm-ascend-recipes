      content: "unset http_proxy\nunset https_proxy\n\npython \"$MULTI_NODE_VLLM_ASCEND_ROOT/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py\" \\\n    --port 8000 \\\n    --host \"$GATEWAY_NODE_0_IP\" \\\n    --prefiller-hosts $PREFILL_NODE_0_IP $PREFILL_NODE_1_IP \\\n    --prefiller-ports 6700 6700 \\\n    --decoder-hosts $DECODE_NODE_0_IP $DECODE_NODE_0_IP $DECODE_NODE_0_IP $DECODE_NODE_0_IP $DECODE_NODE_1_IP $DECODE_NODE_1_IP $DECODE_NODE_1_IP $DECODE_NODE_1_IP $DECODE_NODE_2_IP $DECODE_NODE_2_IP $DECODE_NODE_2_IP $DECODE_NODE_2_IP $DECODE_NODE_3_IP $DECODE_NODE_3_IP $DECODE_NODE_3_IP $DECODE_NODE_3_IP \\\n    --decoder-ports 6721 6722 6723 6724 6721 6722 6723 6724 6721 6722 6723 6724 6721 6722 6723 6724"
    service-check:
      language: bash
      content: "response=$(curl --fail --silent --show-error \\\n  \"http://${GATEWAY_NODE_0_IP}:8000/v1/completions\" \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"model\":\"glm-5\",\"prompt\":\"The future of AI is\",\"max_tokens\":50,\"temperature\":0}')\n\npython3 -c 'import json, sys; assert json.load(sys.stdin)[\"choices\"]' <<<\"$response\""
  steps:
  - title: 拓扑与变量
    content: '`PD 分离` 使用 2 个 Prefill 节点和 4 个 Decode 节点。每个 Prefill 节点

      在 16 张 NPU 上承载 1 个 rank（`DP=2`、`TP=16`）；每个 Decode 节点在

      16 张 NPU 上承载 4 个 rank（`DP=16`、`TP=4`），通过 Mooncake KV 传输连接。

      设置节点地址：


      ```bash

      export PREFILL_NODE_0_IP="${PREFILL_NODE_0_IP:-<prefill_node_0_ip>}"

      export PREFILL_NODE_1_IP="${PREFILL_NODE_1_IP:-<prefill_node_1_ip>}"

      export DECODE_NODE_0_IP="${DECODE_NODE_0_IP:-<decode_node_0_ip>}"

      export DECODE_NODE_1_IP="${DECODE_NODE_1_IP:-<decode_node_1_ip>}"

      export DECODE_NODE_2_IP="${DECODE_NODE_2_IP:-<decode_node_2_ip>}"

      export DECODE_NODE_3_IP="${DECODE_NODE_3_IP:-<decode_node_3_ip>}"

      export GATEWAY_NODE_0_IP="${GATEWAY_NODE_0_IP:-$PREFILL_NODE_0_IP}"

      ```'
