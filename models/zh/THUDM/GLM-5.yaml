    #### 表 1：场景概览

    | 场景 | 部署模式 | *总 NPU 数 | 权重版本 | 关键考虑 |
    |------|---------|-----------|---------|---------|
    | 高吞吐 | 单节点（A3） | 16（A3） | W4A8 | dp1 tp16 启用专家并行，最大化吞吐 |
    | 低延迟 | 单节点（A3） | 16（A3） | W4A8 | dp1 tp16 禁用专家并行，降低延迟 |
    | 长上下文 | 多节点（A3） | 32（A3） | W4A8 | 2 节点，dp2 tp16 扩展上下文 |
    | PD 分离 | 多节点（A3） | 32（A3） | W4A8 | 1P1D 部署，适用于生产工作负载 |

