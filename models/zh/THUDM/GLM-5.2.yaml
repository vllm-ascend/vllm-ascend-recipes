    ### 推荐配置

    推荐配置已迁移到上方“部署指南”的选项中。请选择 NPU 型号、量化、序列和场景查看对应命令。

    > **注意**：这些配置在特定测试环境中验证，仅供参考。最优配置取决于最大输入/输出长度、前缀缓存命中率、精度要求和部署机器配比等因素。
tuning: |-
  ### 调优指南

  请参考 [公开性能调优文档](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/performance_and_debug/optimization_and_tuning.html) 了解调优方法。
  请参考 [功能指南](https://docs.vllm.ai/projects/ascend/zh-cn/latest/user_guide/support_matrix/feature_matrix.html) 了解详细功能描述。

  **GLM-5.2 关键调优说明：**

  - 单节点低延迟场景推荐 `dp1 tp16` 并禁用专家并行。
  - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1` 在长序列（>=16k）和低并发（<=8 batch size）场景下应禁用。
  - `VLLM_ASCEND_ENABLE_MLAPO=1` 在 W8A8 量化模型的 Decode 端必需。
  - `DYNAMIC_EPLB=1` 在 Decode 节点启用动态专家并行负载均衡。
  - 200k 上下文窗口请使用共置 4 节点配置，dp4 tp8。
faq: |-
  常见环境、安装和通用参数问题请参考 [公开 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)。本章仅涵盖模型特定问题。

  **Q：如何启用函数调用？**

  在 `vllm serve` 命令中添加以下参数：

  ```bash
  --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
  ```

  **Q：如何优化单节点低延迟？**

  使用 `dp1 tp16` 配置并禁用专家并行。

  **Q：如何部署 200k 上下文窗口？**

  使用共置 4 节点配置，dp4 tp8，`--max-model-len 200000`。
