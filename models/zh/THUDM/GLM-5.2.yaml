      vllm serve your_w4a8c8_model_path \
          --served-model-name glm-52-prefill \
          --trust-remote-code \
          --port 8100 \
          --max-model-len 135000 \
          --data-parallel-size 1 \
          --tensor-parallel-size 8 \
          --enable-expert-parallel \
          --quantization ascend \
          --speculative-config '{"num_speculative_tokens": 5, "method": "deepseek_mtp"}' \
          --kv-transfer-config '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30400"}'

      # Decode 节点
      vllm serve your_w4a8c8_model_path \
          --served-model-name glm-52 \
          --trust-remote-code \
          --port 8000 \
          --max-model-len 135000 \
          --data-parallel-size 1 \
          --tensor-parallel-size 8 \
          --enable-expert-parallel \
          --quantization ascend \
          --speculative-config '{"num_speculative_tokens": 5, "method": "deepseek_mtp"}' \
          --kv-transfer-config '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30400"}'
      ```
  - title: 服务验证
    content: |-
      PD 分离服务完全启动后，通过 proxy 入口验证 Prefill 和 Decode 节点是否正常协同工作。
verification: |-
  服务启动后，可以通过发送提示词调用模型。

  **Completions API：**

  ```shell
  curl http://localhost:8000/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "glm-52",
          "prompt": "请简要介绍大语言模型。",
          "max_tokens": 256,
          "temperature": 0
      }'
  ```

  > - **URL**（`http://localhost:8000`）：将 `localhost` 和 `8000` 替换为服务器 IP 和 `vllm serve` 命令中的 `--port` 值。
  > - **`model`**：必须与 `vllm serve` 命令中的 `--served-model-name` 值匹配（如 `glm-52`）。

  **函数调用：**

  要启用函数调用，请在 `vllm serve` 命令中添加以下参数：

  ```bash
  --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
  ```

  预期结果：HTTP 200，返回包含 `choices` 字段的 JSON 响应及生成文本。
