meta:
  title: "GLM-5.2"
  slug: "glm-5.2"
  provider: "THUDM"
  description: "GLM-5.2 是智谱 AI 推出的混合专家（MoE）模型，总参数量 753B，面向复杂系统工程和长周期智能体任务。支持最多 5 个投机 Token 的 MTP 投机解码、异步调度和 PD 分离部署于昇腾 NPU。"
  date_added: 2026-07-13
  performance_headline: "Atlas 800 A2/A3 多节点部署，支持 W8A8 与 W4A8C8 精度"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified

model:
  model_id: "zai-org/GLM-5.2"
  min_vllm_version: "0.22.1rc"
  architecture: moe
  parameter_count: "753B"
  active_parameters: null
  context_length: 131072
  modality: text

# Upstream-aligned weight variants (vllm-project/recipes schema). VRAM = minimum to load.
variants:
  default:
    model_id: "Eco-Tech/GLM-5.2-w8a8"
    precision: W8A8
    vram_minimum_gb: 904
    description: "W8A8 预量化权重 —— 1 台 Atlas 800I A3 或 2 台 Atlas 800I A2"
  w4a8c8:
    model_id: "Eco-Tech/GLM-5.2-w4a8c8"
    precision: W4A8C8
    vram_minimum_gb: 452
    description: "W4A8C8 压缩权重 —— 1 台 Atlas 800I A3 或 2 台 Atlas 800I A2"
  bf16:
    model_id: "ZhipuAI/GLM-5.2"
    precision: BF16
    vram_minimum_gb: 1807
    description: "BF16 全精度权重 —— 2 台 Atlas 800I A3 或 4 台 Atlas 800I A2"


guide: ""
performance_model_names:
  - "GLM-5.2"
overview: |-
  GLM-5.2 是智谱AI（THUDM）推出的混合专家（MoE）模型，总参数量为753B，面向复杂系统工程和长周期智能体任务。
weight_download:
- weight_version: BF16
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/ZhipuAI/GLM-5.2
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model ZhipuAI/GLM-5.2
      ```
  - source: HuggingFace
    url: https://huggingface.co/zai-org/GLM-5.2
    command: |-
      ```bash
      pip install -U huggingface_hub
      huggingface-cli download zai-org/GLM-5.2
      ```
- weight_version: W8A8（预量化）
  sources:
