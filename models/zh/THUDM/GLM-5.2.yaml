    ### 推荐配置

    推荐配置已迁移到上方“部署指南”的选项中。请选择 NPU 型号、量化、序列和场景查看对应命令。

    > **注意**：这些配置在特定测试环境中验证，仅供参考。最优配置取决于最大输入/输出长度、前缀缓存命中率、精度要求和部署机器配比等因素。
tuning: |-
  ### 调优指南

  调优方法请参考[公共性能调优文档](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)。
  详细功能描述请参考[功能指南](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html)。

  **GLM-5.2 关键调优说明：**

  |参数|低延迟|高吞吐|长上下文|描述|
  |---------|-----------|---------------|------------|-----------|
  |`--max-num-batched-tokens`|较低（4096-8192）|预填充较高（8192）|预填充较高（16384）|控制每步批大小。较低的值降低每步延迟；较高的值提升预填充吞吐。|
  |`--gpu-memory-utilization`|0.92-0.95|0.90-0.95|0.75-0.93|NPU 内存比例。1M 场景必须为大型 KV 缓存预留内存，因此预填充/共置节点使用较低值（0.75-0.80）。|
  |`num_speculative_tokens`（MTP）|3-5|3-5|1（预填充）/ 3（解码）|MTP 投机令牌数。较高的值提升解码吞吐，但消耗草稿模型 KV 缓存内存；PD 预填充节点使用 1。|
  |`enable_dsa_cp`|可选|启用（预填充节点）|启用（预填充节点）|DSA 上下文并行加速长上下文预填充，自 v0.21.0 起已与 FlashComm1 解耦。|
  |`enable_sparse_sfa_c8` / `enable_sparse_li_c8`|false / true|true / true（PD）|false / true|`enable_sparse_sfa_c8` 是针对 C8 量化模型的实验性 SFA 优化；在 v0.23.0 中不要与 DCP 结合使用。`enable_sparse_li_c8` 独立且仍推荐启用。|
  |`enable_balance_scheduling`|启用（单节点）|启用|PD 禁用|在 v1 调度器中提升输出吞吐并降低 TPOT。某些场景下 TTFT 可能回退；不建议用于预填充-解码分离。|
  |`VLLM_ASCEND_ENABLE_FLASHCOMM1`|1|1（预填充节点）|1（预填充节点）|通信优化。与包含 `o_proj` 的 `layer_sharding` 冲突。|
  |`VLLM_ASCEND_ENABLE_MLAPO`|-|1（A2 P/D 节点）|-|融合算子，可显著提升性能但消耗更多 NPU 内存；在 A3 上仅用于解码节点。|
  |`cudagraph_mode`|FULL_DECODE_ONLY|FULL_DECODE_ONLY（解码）|FULL_DECODE_ONLY（解码）|仅捕获解码阶段。PD 预填充节点使用 `--enforce-eager` 代替。|
faq: |-
  常见环境、安装和通用参数问题请参考 [公开 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)。本章仅涵盖模型特定问题。

  **Q：如何启用函数调用？**

  在 `vllm serve` 命令中添加以下参数：

  ```bash
  --tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice
  ```

  **Q：如何优化单节点低延迟？**

  使用 `dp1 tp16` 配置并禁用专家并行。

  **Q：如何部署 200k 上下文窗口？**

  使用共置 4 节点配置，dp4 tp8，`--max-model-len 200000`。
