- npu: Atlas 800I A2
  precision: BF16
  deployment: 离线文档解析
  case: PP-DocLayoutV2
  strategy: single_node_A2
  steps:
  - title: 准备独立版面环境
    content: |-
      ```bash
      export IMAGE=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/device/paddle-npu:cann800-ubuntu20-npu-910b-base-aarch64-gcc84@sha256:9bbc08c1bed9c064f0775da4a7bd1c857fa33d0d51bcd705e6829f4cbcf86911
      docker run --rm -it --name paddleocr-layout-a2 --net=host --shm-size=1g \
          --device /dev/davinci0 --device /dev/davinci_manager \
          --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/dcmi:/usr/local/dcmi -v "$PWD":/work -w /work \
          -e ASCEND_RT_VISIBLE_DEVICES=0 "$IMAGE" bash
      # Inside the Paddle container (Python 3.10, aarch64):
      source /usr/local/Ascend/ascend-toolkit/set_env.sh
      source /usr/local/Ascend/nnal/atb/set_env.sh --cxx_abi=0
      python -m pip install 'numpy<2' 'setuptools<81' 'protobuf==3.20.3' decorator sympy scipy attrs psutil paddlepaddle==3.2.0
      python -m pip install https://paddle-whl.bj.bcebos.com/stable/npu/paddle-custom-npu/paddle_custom_npu-3.2.0-cp310-cp310-linux_aarch64.whl
      python -m pip install 'paddleocr[doc-parser]==3.3.2' safetensors modelscope
      python - <<'PY'
      import sys
      import sysconfig
      import paddle

      sys.path.insert(0, sysconfig.get_path('stdlib'))
      assert 'npu' in paddle.device.get_all_custom_device_type()
      paddle.utils.run_check()
      PY
      modelscope download --model PaddlePaddle/PP-DocLayoutV2 --local_dir PP-DocLayoutV2
      ```
  - title: 通过识别服务解析文档
    content: |-
      在线 vLLM 服务继续运行在独立环境中。将以下脚本保存为版面环境中的 parse_document.py。310P 由补丁后的版面预测器执行 OM 模型，Paddle 预处理仍在 CPU 上。

      ```python
      import argparse
      import json
      import time
      from pathlib import Path

      from paddleocr import PaddleOCRVL

      parser = argparse.ArgumentParser()
      parser.add_argument('--input', required=True)
      parser.add_argument('--layout-model', type=Path, required=True)
      parser.add_argument('--output', type=Path, default=Path('document-output'))
      parser.add_argument('--server-url', default='http://127.0.0.1:8000/v1')
      parser.add_argument('--layout-device', choices=['cpu', 'npu'], default='cpu')
      parser.add_argument('--page-batch-size', type=int, default=16)
      args = parser.parse_args()
      if args.layout_device == 'npu':
          # OpenCV adds its package directory; CANN compiler workers need stdlib first.
          import sys
          import sysconfig
          sys.path.insert(0, sysconfig.get_path('stdlib'))
      if args.layout_device == 'cpu':
          # CPU Paddle preprocessing + the ModelZoo-patched ACL InferSession(0).
          # PP-DocLayoutV2 still runs on NPU; Paddle custom-NPU is not used on 310P.
          assert (args.layout_model / 'inference_linux_aarch64.om').is_file(), 'Compile the aarch64 OM model first'
      # Bound queued page images on the tested 32 GiB A2 host.
      # Preserve every other official pipeline setting, including layout batches.
      from paddlex.inference import load_pipeline_config
      assert args.page_batch_size > 0
      config = load_pipeline_config('PaddleOCR-VL')
      config['batch_size'] = args.page_batch_size
      config['use_queues'] = False
      pipeline = PaddleOCRVL(
          paddlex_config=config,
          vl_rec_backend='vllm-server',
          vl_rec_server_url=args.server_url,
          layout_detection_model_name='PP-DocLayoutV2',
          layout_detection_model_dir=str(args.layout_model),
          use_doc_orientation_classify=False,
          use_doc_unwarping=False,
          device=args.layout_device,
      )
      args.output.mkdir(parents=True, exist_ok=True)
      start = time.perf_counter()
      count = 0
      try:
          for result in pipeline.predict_iter(args.input):
              result.save_to_json(str(args.output))
              result.save_to_markdown(str(args.output))
              count += 1
          elapsed = time.perf_counter() - start
      finally:
          pipeline.close()
          if args.layout_device == 'cpu':
              from ais_bench.infer.interface import InferSession
              pipeline.paddlex_pipeline.layout_det_model.om_sess.free_resource()
              InferSession.finalize()
      assert count > 0, 'No pages parsed'
      assert list(args.output.glob('*.md')), 'No Markdown output'
      assert list(args.output.glob('*.json')), 'No JSON output'
      (args.output / 'timing.json').write_text(json.dumps({'pages': count, 'seconds': elapsed, 'seconds_per_page': elapsed / count, 'scope': 'pipeline prediction only; excludes pipeline initialization', 'layout_device': args.layout_device, 'page_batch_size': args.page_batch_size, 'use_queues': config['use_queues']}, indent=2) + '\n')
      print(f'Parsed {count} page(s) in {elapsed:.3f}s')
      ```

      实测的32 GiB A2主机采用16页批次，并关闭预处理队列。开启队列时，64页和16页批次均触及主机内存限额，因为版面队列会独立缓存最多64批数据。对比内存和耗时时须明确这两个设置。

      ```bash
      python parse_document.py --input https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png --layout-model PP-DocLayoutV2 --layout-device npu --page-batch-size 16 --server-url http://127.0.0.1:8000/v1 --output document-output
      ```
- npu: Atlas 300I DUO
  precision: FP16
  deployment: 离线文档解析
  case: PP-DocLayoutV2
  strategy: single_node_310p
  steps:
  - title: 准备独立版面环境
    content: |-
      ```bash
      python3 -m venv layout-venv
      source layout-venv/bin/activate
      python -m pip install --upgrade pip uv
      git clone https://gitcode.com/Ascend/ModelZoo-PyTorch.git modelzoo
      git -C modelzoo checkout e779117e8cfeba296a7105e26adac0741ab04768
      export MODELZOO_DIR="$PWD/modelzoo/ACL_PyTorch/built-in/ocr/PP-DocLayoutV2"
      python -m pip install -r "$MODELZOO_DIR/requirements.txt"
      # The reference includes overlapping cv2 wheels; PaddleX requires contrib.
      # Extract Ubuntu runtime libraries locally if the base image lacks libGL.
      # This avoids changing the selected container's system package inventory.
      mkdir -p layout-libs
      (cd layout-libs && apt-get update && apt-get download \
          libgl1 libglx0 libglvnd0 libglib2.0-0 libpcre3 \
          libx11-6 libxcb1 libxau6 libxdmcp6 libxext6 libbsd0 libmd0 && \
          for package in *.deb; do dpkg-deb -x "$package" .; done)
      export LD_LIBRARY_PATH="$PWD/layout-libs/usr/lib/aarch64-linux-gnu:$PWD/layout-libs/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH"
      python -m pip install --force-reinstall --no-deps opencv-contrib-python==4.11.0.86
      python -m pip install \
          https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/ais_bench-0.0.2-py3-none-any.whl \
          https://aisbench.obs.myhuaweicloud.com/packet/ais_bench_infer/0.0.2/ait/aclruntime-0.0.2-cp312-cp312-linux_aarch64.whl
      export PADDLEX_PACKAGE_DIR="$(python -c 'import importlib.util,pathlib; print(pathlib.Path(importlib.util.find_spec("paddlex").origin).parent)')"
      (cd "$PADDLEX_PACKAGE_DIR" && patch --dry-run -p1 < "$MODELZOO_DIR/paddlex.patch")
      (cd "$PADDLEX_PACKAGE_DIR" && patch -p1 < "$MODELZOO_DIR/paddlex.patch")
      modelscope download --model PaddlePaddle/PP-DocLayoutV2 --local_dir PP-DocLayoutV2
      ```
  - title: 导出并编译 OM 版面模型
    content: |-
      以下为固定版本的 ModelZoo 转换流程。核实 Python/ACL 轮子兼容性及实际芯片。参考环境编译约需 1.5 小时，请保存日志。

      ```bash
      source /usr/local/Ascend/ascend-toolkit/set_env.sh
      export DISABLE_MODEL_SOURCE_CHECK=True
      # Activate layout-venv so PaddleX finds the pinned paddle2onnx executable.
      source layout-venv/bin/activate
      paddlex --paddle2onnx --paddle_model_dir PP-DocLayoutV2 --onnx_model_dir PP-DocLayoutV2
      deactivate
      # Surgeon requires ONNX Runtime wheels that are unavailable for Python 3.12.
      # Use a separate Python 3.10 tool environment; keep the serving/layout environments.
      layout-venv/bin/uv venv --python python3.10 --seed optimizer-venv
      source optimizer-venv/bin/activate
      python -m pip install --upgrade pip 'setuptools<81'
      python -m pip install msit 'onnx==1.16.1' 'numpy<2' 'pandas<3'
      msit install surgeon
      python -m auto_optimizer optimize PP-DocLayoutV2/inference.onnx PP-DocLayoutV2/inference_opt.onnx
      deactivate
      # Confirm the chip with npu-smi; this example is for the tested 310P3.
      atc --model=PP-DocLayoutV2/inference_opt.onnx --framework=5 \
          --output=PP-DocLayoutV2/inference --soc_version=Ascend310P3 \
          --input_shape 'im_shape:-1,2;image:-1,3,800,800;scale_factor:-1,2'
      test -f PP-DocLayoutV2/inference_linux_aarch64.om
      source layout-venv/bin/activate
      ```
  - title: 通过识别服务解析文档
    content: |-
      在线 vLLM 服务继续运行在独立环境中。将以下脚本保存为版面环境中的 parse_document.py。310P 由补丁后的版面预测器执行 OM 模型，Paddle 预处理仍在 CPU 上。

      ```python
      import argparse
      import json
      import time
      from pathlib import Path

      from paddleocr import PaddleOCRVL

      parser = argparse.ArgumentParser()
      parser.add_argument('--input', required=True)
      parser.add_argument('--layout-model', type=Path, required=True)
      parser.add_argument('--output', type=Path, default=Path('document-output'))
      parser.add_argument('--server-url', default='http://127.0.0.1:8000/v1')
      parser.add_argument('--layout-device', choices=['cpu', 'npu'], default='cpu')
      args = parser.parse_args()
      if args.layout_device == 'npu':
          # OpenCV adds its package directory; CANN compiler workers need stdlib first.
          import sys
          import sysconfig
          sys.path.insert(0, sysconfig.get_path('stdlib'))
      if args.layout_device == 'cpu':
          # CPU Paddle preprocessing + the ModelZoo-patched ACL InferSession(0).
          # PP-DocLayoutV2 still runs on NPU; Paddle custom-NPU is not used on 310P.
          assert (args.layout_model / 'inference_linux_aarch64.om').is_file(), 'Compile the aarch64 OM model first'
      pipeline = PaddleOCRVL(
          vl_rec_backend='vllm-server',
          vl_rec_server_url=args.server_url,
          layout_detection_model_name='PP-DocLayoutV2',
          layout_detection_model_dir=str(args.layout_model),
          use_doc_orientation_classify=False,
          use_doc_unwarping=False,
          device=args.layout_device,
      )
      args.output.mkdir(parents=True, exist_ok=True)
      start = time.perf_counter()
      count = 0
      try:
          for result in pipeline.predict_iter(args.input):
              result.save_to_json(str(args.output))
              result.save_to_markdown(str(args.output))
              count += 1
          elapsed = time.perf_counter() - start
      finally:
          pipeline.close()
          if args.layout_device == 'cpu':
              from ais_bench.infer.interface import InferSession
              pipeline.paddlex_pipeline.layout_det_model.om_sess.free_resource()
              InferSession.finalize()
      assert count > 0, 'No pages parsed'
      assert list(args.output.glob('*.md')), 'No Markdown output'
      assert list(args.output.glob('*.json')), 'No JSON output'
      (args.output / 'timing.json').write_text(json.dumps({'pages': count, 'seconds': elapsed, 'seconds_per_page': elapsed / count, 'scope': 'pipeline prediction only; excludes pipeline initialization', 'layout_device': args.layout_device}, indent=2) + '\n')
      print(f'Parsed {count} page(s) in {elapsed:.3f}s')
      ```

      ```bash
      python parse_document.py --input https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png --layout-model PP-DocLayoutV2 --layout-device cpu --server-url http://127.0.0.1:8000/v1 --output document-output
      ```
verification: |-
  在空工作目录执行下面的完整代码块；它会写入样本准备和验证脚本，并检查两个服务模型别名。

  教程收据链接目前返回 HTTP 400，因此检查使用固定的官方演示图，仅裁剪输入区域，并记录来源、坐标及哈希。NPU 容器无法访问 Hugging Face 时，在客户端下载相同的四张原始图，并在执行本代码块前传入 samples/；脚本会再次检查哈希。这些是功能样例断言，不是 OmniDocBench 精度结果。表格原始输出为 OTSL，文档流水线将其转换为 HTML。

  ```bash
  set -euo pipefail
  cat > prepare_samples.py <<'PADDLE_SAMPLES_PY'
  import argparse
  import hashlib
  import json
  import urllib.request
  from pathlib import Path

  from PIL import Image

  REVISION = '702b96b0a06740b0ed3d41ba382a5bf69986dcae'
  SAMPLES = {
      'ocr': ('text_english_arabic.jpg', (45, 159, 607, 449), 'f670627f3afa2e7ea312c71ce5c3c7b77a42938f9a1e62e5ba2505e19f5dede7'),
      'table': ('table_01.jpg', (713, 81, 1302, 424), 'ca798601c74d70cbb34a3a0b91161d21b79513bb049791c96dfed14bb087ceaf'),
      'formula': ('formula_EN.jpg', (126, 1328, 594, 1570), 'b9a96b4be44896a45df21103ba1b06af18621381b563707a42fa6cdf21f837d1'),
      'chart': ('chart_01.jpg', (27, 81, 614, 400), 'd77acb00585d16f978123bc8288c41e7a589083df51e18076a20853892c0d4a9'),
  }
  parser = argparse.ArgumentParser()
  parser.add_argument('--output', type=Path, default=Path('samples'))
  parser.add_argument('--source-dir', type=Path)
  args = parser.parse_args()
  args.output.mkdir(parents=True, exist_ok=True)
  manifest = []
  for task, (filename, box, expected_hash) in SAMPLES.items():
      source = (args.source_dir or args.output) / filename
      url = f'https://huggingface.co/datasets/PaddlePaddle/PaddleOCR-VL_demo/resolve/{REVISION}/imgs/{filename}'
      if not source.exists():
          with urllib.request.urlopen(url, timeout=90) as response:
              source.write_bytes(response.read())
      data = source.read_bytes()
      assert hashlib.sha256(data).hexdigest() == expected_hash, f'Source mismatch: {filename}'
      # The official demo collages contain input and expected output panels.
      # Crop only the input element; record coordinates in original pixels.
      with Image.open(source) as image:
          sx, sy = image.width / 1335, image.height / 1888
          coordinates = tuple(round(value * (sx if index % 2 == 0 else sy)) for index, value in enumerate(box))
          crop = image.crop(coordinates)
          crop.thumbnail((1536, 1536))
          target = args.output / f'{task}-crop.png'
          crop.save(target)
      manifest.append({'task': task, 'source_url': url, 'source_sha256': expected_hash, 'crop_coordinates': coordinates, 'crop_sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
  (args.output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
  PADDLE_SAMPLES_PY
  cat > verify.py <<'PADDLE_VERIFY_PY'
  import argparse
  import base64
  import hashlib
  import json
  import re
  import time
  import urllib.request
  from pathlib import Path

  TASKS = {'ocr': 'OCR:', 'table': 'Table Recognition:', 'formula': 'Formula Recognition:', 'chart': 'Chart Recognition:'}


  def get_json(url):
      with urllib.request.urlopen(url, timeout=15) as response:
          return json.load(response)


  def check_content(task, content):
      normalized = re.sub(r'\s+', '', content).lower()
      if task == 'ocr':
          expected = ['paddleocr', 'opensource', '2020', 'recognition']
          normalized = re.sub(r'[^a-z0-9]', '', content.lower())
      elif task == 'table':
          expected = ['<fcel>', '<nl>', 'regularhours', 'monday'] + [f'11/{day}/2013' for day in range(1, 15)]
      elif task == 'formula':
          expected = ['f(x)', '2x', 'f(3)', '=27']
          normalized = normalized.replace('\\left', '').replace('\\right', '').replace('{', '').replace('}', '')
      else:
          expected = ['2017', '2024', '37', '22']
      missing = [value for value in expected if value not in normalized]
      return {'expected_fragments': expected, 'missing_fragments': missing, 'otsl_row_count': content.count('<nl>') if task == 'table' else None, 'passed': not missing and (task != 'table' or content.count('<nl>') == 15)}


  def main():
      parser = argparse.ArgumentParser()
      parser.add_argument('--base-url', required=True)
      parser.add_argument('--model', default='PaddleOCR-VL-0.9B')
      parser.add_argument('--samples', type=Path, required=True)
      parser.add_argument('--output', type=Path, required=True)
      parser.add_argument('--repeats', type=int, default=1)
      parser.add_argument('--warmup', type=int, default=0)
      args = parser.parse_args()
      args.output.mkdir(parents=True, exist_ok=True)
      with urllib.request.urlopen(args.base_url + '/health', timeout=15) as response:
          assert response.status == 200
      models = get_json(args.base_url + '/v1/models')
      (args.output / 'models.json').write_text(json.dumps(models, indent=2))
      assert any(item['id'] == args.model for item in models['data'])
      results = []
      for repeat in range(-args.warmup, args.repeats):
          for task, prompt in TASKS.items():
              data = (args.samples / (task + '-crop.png')).read_bytes()
              payload = {'model': args.model, 'messages': [{'role': 'user', 'content': [
                  {'type': 'image_url', 'image_url': {'url': 'data:image/png;base64,' + base64.b64encode(data).decode()}},
                  {'type': 'text', 'text': prompt}]}], 'temperature': 0.0, 'max_tokens': 2048, 'seed': 0}
              request = urllib.request.Request(args.base_url + '/v1/chat/completions', data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
              start = time.perf_counter()
              with urllib.request.urlopen(request, timeout=300) as response:
                  result = json.load(response)
              latency = time.perf_counter() - start
              (args.output / f'{task}-{repeat}.json').write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n')
              choice = result['choices'][0]
              check = check_content(task, choice['message']['content'])
              check['finish_reason'] = choice['finish_reason']
              check['passed'] = check['passed'] and choice['finish_reason'] == 'stop'
              row = {'task': task, 'repeat': repeat, 'warmup': repeat < 0, 'input_sha256': hashlib.sha256(data).hexdigest(), 'latency_seconds': latency, 'usage': result.get('usage'), 'validation': check}
              results.append(row)
              (args.output / 'summary.json').write_text(json.dumps({'definition': 'functional sample checks; not a dataset accuracy score', 'concurrency': 1, 'temperature': 0.0, 'seed': 0, 'max_tokens': 2048, 'warmup_rounds': args.warmup, 'repeats': args.repeats, 'results': results}, indent=2, ensure_ascii=False) + '\n')
              print(json.dumps(row, ensure_ascii=False), flush=True)
      if not all(row['validation']['passed'] for row in results):
          raise SystemExit('Functional sample validation failed; inspect raw outputs')


  if __name__ == '__main__':
      main()
  PADDLE_VERIFY_PY
  python prepare_samples.py --output samples
  python verify.py --base-url 'http://<server_ip>:<port>' --model PaddlePaddle/PaddleOCR-VL --samples samples --output request-results-canonical --warmup 0 --repeats 1
  python verify.py --base-url 'http://<server_ip>:<port>' --model PaddleOCR-VL-0.9B --samples samples --output request-results-alias --warmup 0 --repeats 1
  ```

  功能检查后，可重复请求记录观测数据：

  ```bash
  python verify.py --base-url 'http://<server_ip>:<port>' --samples samples --output request-results-repeated --warmup 1 --repeats 3
  ```
evaluation:
  accuracy:
    content: |-
      使用 ModelZoo PP-DocLayoutV2 的端到端方法、原版 PaddleOCR-VL-0.9B、OmniDocBench v1.5（1355 页）及评估器提交 523fd1d529c3e9d0088c662e983aa70fb9585c9a。公开数据集 v1_5 修订为 91fe284bbfacfa687959ae3eb00846ca852aa907，不能使用新版 main 标注。每个标注页面生成一个 Markdown，保留页面名和阅读顺序。在 configs/end2end.yaml 使用绝对路径指定精确标注及预测目录，安装官方 CDM 依赖后启用 CDM。

      每套预测使用全新的结果目录：CDM 按样本序号缓存渲染结果，复用演示或旧运行目录会污染得分。官方 CDM 默认使用 32 个 worker；根据主机可用内存降低 max_workers（本次使用两个），并将占用内存较多的评测与站点构建分开运行。

      ```bash
      git clone https://github.com/opendatalab/OmniDocBench.git
      git -C OmniDocBench checkout 523fd1d529c3e9d0088c662e983aa70fb9585c9a
      # In a separate Python 3.10 evaluation environment:
      python -m pip install -r OmniDocBench/requirements.txt
      # Install Node.js, ImageMagick, XeLaTeX and Source Han Sans SC for CDM.
      python -m pip install -r OmniDocBench/metrics/cdm/requirements.txt
      cd OmniDocBench
      PADDLE_EVAL_SOURCE="$(pwd)"
      PADDLE_EVAL_DIR="$(mktemp -d "$PADDLE_EVAL_SOURCE/evaluation-run.XXXXXX")"
      mkdir "$PADDLE_EVAL_DIR/result"
      cd "$PADDLE_EVAL_DIR"
      PYTHONPATH="$PADDLE_EVAL_SOURCE${PYTHONPATH:+:$PYTHONPATH}" PADDLE_EVAL_SOURCE="$PADDLE_EVAL_SOURCE" python - <<'PY_EVAL'
      import functools, logging, os, runpy, sys
      from metrics.cal_metric import call_CDM
      call_CDM.evaluate = functools.partialmethod(call_CDM.evaluate, max_workers=2)
      logging.basicConfig(filename='renderer.log', level=logging.INFO)
      source = os.environ['PADDLE_EVAL_SOURCE']
      sys.argv = ['pdf_validation.py', '--config', source + '/configs/end2end.yaml']
      runpy.run_path(source + '/pdf_validation.py', run_name='__main__')
      PY_EVAL
      ```

      Overall = ((1 - 文字编辑距离) * 100 + 表格 TEDS * 100 + 公式 CDM * 100) / 3。缺少 CDM 时 Overall 不完整，不能填零或宣称通过。ModelZoo 单芯 300I DUO 参考值为 92.43%，其引用的官方值为 92.86%；这些是已发布参考数值，不是本配方声明的实测结果。
  performance:
    content: |-
      ModelZoo 单芯 300I DUO 报告每个输入文件 12.10 秒。test.py 在流水线初始化后计时整个预测循环，并关闭方向分类和去畸变，但未说明预热、并发、图像缩放及输出长度限制。比较前记录这些条件及 PDF/图像输入方式。verify.py 的样例时间为 API 端到端延迟：并发 1、预热一轮、测量三轮、temperature=0、seed=0、max_tokens=2048，不代表 ModelZoo 完整文档基准。使用 npu-smi 和 Torch 分配器日志记录显存，将启动激活峰值与运行时采样分开。

      ```bash
      npu-smi info
      python verify.py --base-url 'http://127.0.0.1:8000' --samples samples --output benchmark-results --warmup 1 --repeats 3
      npu-smi info
      ```

      通用服务基准参见 [vLLM 基准测试](https://docs.vllm.ai/en/latest/cli/bench/serve/) 和 [AISBench](https://github.com/aisbench/benchmark)。使用模型专用图像和预期输出，纯文字随机数据不能验证 PaddleOCR 精度。
