meta:
  title: "PaddleOCR-VL"
  slug: "paddleocr-vl"
  provider: "PaddlePaddle"
  description: "面向文档解析的 SOTA、资源高效的视觉语言模型。其核心组件 PaddleOCR-VL-0.9B 将 NaViT 风格的动态分辨率视觉编码器与 ERNIE-4.5-0.3B 语言模型相结合，为 OCR、表格、公式与图表识别任务提供精准的元素识别能力。"
  date_added: 2026-10-17
  performance_headline: "Atlas 800 A2 与 Atlas 300I DUO 单节点单卡部署，支持 BF16/FP16 精度"
  date_updated: 2026-10-17
  difficulty: intermediate
  hardware:
    atlas_800_a2: verified
    atlas_300i_duo: verified

model:
  model_id: "PaddlePaddle/PaddleOCR-VL"
  min_vllm_version: "0.21.0rc1"
  architecture: dense
  parameter_count: "0.9B"
  active_parameters: null
  context_length: 16384
  modality: ocr
  base_args:
    - "--trust-remote-code"
    - "--no-enable-prefix-caching"
    - "--mm-processor-cache-gb"
    - "0"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    TASK_QUEUE_ENABLE: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0rc1"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info -v /etc/ascend_install.info:/etc/ascend_install.info -v /root/.cache:/root/.cache -it $IMAGE bash"
      note: "按机型选择 $IMAGE（上方 atlas_800_a2 或 atlas_300i_duo 对应镜像）。启动后可执行 `docker ps` 验证容器服务运行状态。"

# —— Upstream alignment: features ——
overview: "PaddleOCR-VL 是面向文档解析的 SOTA、资源高效的视觉语言模型。其核心组件 PaddleOCR-VL-0.9B 将 NaViT 风格的动态分辨率视觉编码器与 ERNIE-4.5-0.3B 语言模型相结合，为 OCR、表格识别、公式识别与图表识别任务提供精准的元素识别能力，并可与 PP-DocLayoutV2 结合构建完整文档解析流水线。"

weight_download:
- weight_version: "BF16"
  sources:
  - source: "ModelScope"
    url: "https://www.modelscope.cn/models/PaddlePaddle/PaddleOCR-VL"
    command: "```bash\npip install modelscope\nmodelscope download --model PaddlePaddle/PaddleOCR-VL\n```"
  - source: "HuggingFace"
    url: "https://huggingface.co/PaddlePaddle/PaddleOCR-VL"
    command: "```bash\npip install -U huggingface_hub\nhuggingface-cli download PaddlePaddle/PaddleOCR-VL\n```"

prerequisites:
- title: "模型权重"
  content: |-
    硬件要求如下。推荐将模型权重下载至缓存目录并设置 `VLLM_USE_MODELSCOPE=True` 自动加载；若权重已下载至本地目录，请相应更新部署脚本中的 `MODEL_PATH` 变量。

    | 权重版本 | 硬件要求 | 下载链接 |
    |----------|----------|----------|
    | `PaddleOCR-VL-0.9B` | 1 台 Atlas 800 A3（128GB × 8）节点 或 1 台 Atlas 800 A2（64GB × 8）节点 或 1 台 Atlas 300I DUO（48GB × 8）节点 | [ModelScope](https://www.modelscope.cn/models/PaddlePaddle/PaddleOCR-VL) \| [Hugging Face](https://huggingface.co/PaddlePaddle/PaddleOCR-VL) |

env_setup:
  container:
    atlas_800_a2:
      content: |-
        可使用官方 docker 镜像直接运行 `PaddleOCR-VL`。

        **拉取镜像：**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.23.0rc1
        ```

        **启动容器：**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1
        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        容器启动成功后，可执行 `docker ps` 命令验证容器服务运行状态。
    atlas_300i_duo:
      content: |-
        Atlas 300I DUO 请使用 310p 镜像。

        **拉取镜像：**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.23.0rc1-310p
        ```

        **启动容器：**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1-310p
        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -it $IMAGE bash
        ```

        容器启动成功后，可执行 `docker ps` 命令验证容器服务运行状态。

        > 若不使用 docker 镜像，也可从源码构建：安装 `vllm-ascend` 请参考[安装指南](https://docs.vllm.ai/projects/ascend/zh-cn/latest/getting_started/installation.html)。

features:
  compilation_config:
    label: "图编译模式"
    description: "通过 --compilation-config '{\"cudagraph_mode\":\"FULL_DECODE_ONLY\"}' 开启全 decode 图编译。Atlas 300I DUO 上要求 CANN >= 9.0.0；CANN 版本较低时请将该参数替换为 --enforce-eager 回退 eager 模式。"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  prefix_caching:
    label: "前缀缓存"
    description: "本模型默认关闭前缀缓存。若你的负载下前缀缓存有效，可移除 --no-enable-prefix-caching 开启。"
    args: ["--no-enable-prefix-caching"]
    flag_when_false: ""

scenarios:

- npu: Atlas 800I A2
  precision: BF16
  deployment: Single-Node
  case: Single NPU
  tags: [a2-single-npu]
  strategy: single_node_a2
  steps:
  - title: 启动推理服务
    content: |-
      PaddleOCR-VL 支持 A2 系列单节点单卡部署。单节点部署在同一个节点内完成 Prefill 与 Decode，适用于开发测试与中小规模推理场景。

      1. 准备模型权重：设置 `VLLM_USE_MODELSCOPE=True` 后模型将从 ModelScope 自动加载。若权重已下载到本地，请将 `MODEL_PATH` 指向本地模型目录。
      2. 创建并执行部署脚本（保存为 `deploy.sh`）：

      **Atlas 800 A2 系列：**

      ```bash
      #!/bin/sh
      export VLLM_USE_MODELSCOPE=True
      export MODEL_PATH="PaddlePaddle/PaddleOCR-VL"
      export TASK_QUEUE_ENABLE=1
      export CPU_AFFINITY_CONF=1
      export PYTORCH_NPU_ALLOC_CONF="expandable_segments:True"

      vllm serve ${MODEL_PATH} \
                --max-num-batched-tokens 16384 \
                --served-model-name PaddleOCR-VL-0.9B \
                --trust-remote-code \
                --no-enable-prefix-caching \
                --mm-processor-cache-gb 0 \
                --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
                --additional_config '{"enable_cpu_binding":true}' \
                --port 8000
      ```

      关键参数说明：

      - `--max-num-batched-tokens` 指定单次前向的最大批处理 token 数，可根据吞吐优化需求调整。
      - `--no-enable-prefix-caching` 表示关闭前缀缓存，如需开启请移除该选项。
      - `--mm-processor-cache-gb` 设置多模态处理器缓存大小（GB），取值 `0` 表示关闭缓存。
      - `--compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'` 开启全 decode 图编译以提升性能。
      - `--additional_config '{"enable_cpu_binding":true}'` 开启 CPU 绑核以提升性能。

      如遇启动问题，请参考[公共 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html) 进行排查。
  - title: 服务验证
    content: |-
      服务启动成功后，可通过发送请求进行验证，用法参见下方功能验证章节。

- npu: Atlas 300I DUO
  precision: FP16
  deployment: Single-Node
  case: Single NPU
  tags: [300i-duo-single-npu]
  strategy: single_node_300i_duo
  steps:
  - title: 启动推理服务
    content: |-
      PaddleOCR-VL 支持 Atlas 300I DUO 平台单节点单卡部署。

      > Atlas 300I DUO 上：
      > - 仅支持 `float16` 精度。
      > - 图编译（`--compilation-config`）要求 **CANN 版本 >= 9.0.0**；CANN 版本较低时，请将该参数替换为 `--enforce-eager` 回退 eager 模式。

      **Atlas 300I DUO：**

      ```bash
      #!/bin/sh
      export VLLM_USE_MODELSCOPE=True
      export MODEL_PATH="PaddlePaddle/PaddleOCR-VL"
      export TASK_QUEUE_ENABLE=1
      export PYTORCH_NPU_ALLOC_CONF="expandable_segments:True"

      vllm serve ${MODEL_PATH} \
                --max_model_len 16384 \
                --served-model-name PaddleOCR-VL-0.9B \
                --trust-remote-code \
                --no-enable-prefix-caching \
                --mm-processor-cache-gb 0 \
                --dtype float16 \
                --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
                --additional_config '{"enable_cpu_binding":true}' \
                --port 8000
      ```

      关键参数说明：

      - `--max_model_len` 指定最大上下文长度，即单请求输入与输出 token 数之和。
      - `--no-enable-prefix-caching` 表示关闭前缀缓存，如需开启请移除该选项。
      - `--mm-processor-cache-gb` 设置多模态处理器缓存大小（GB），取值 `0` 表示关闭缓存。
      - `--dtype float16` 指定模型精度，Atlas 300I DUO 上仅支持 `float16`。
      - `--compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'` 开启全 decode 图编译以提升性能。
      - `--additional_config '{"enable_cpu_binding":true}'` 开启 CPU 绑核以提升性能。

      如遇启动问题，请参考[公共 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html) 进行排查。
  - title: 服务验证
    content: |-
      服务启动成功后，可通过发送请求进行验证，用法参见下方功能验证章节。

- npu: Atlas 800I A2
  precision: BF16
  deployment: Single-Node
  case: Standard
  tags: [a2-offline-doc-parsing]
  strategy: offline_doc_parsing_a2
  steps:
  - title: 结合 PP-DocLayoutV2 的离线推理
    content: |-
      除在线服务外，通常还需集成 PP-DocLayoutV2 模型，以完整释放 PaddleOCR-VL 的能力，使其更贴近 PaddlePaddle 官方文档提供的示例。

      > vLLM 与 PP-DocLayoutV2 请使用独立虚拟环境，避免依赖冲突。

      **A2 系列（PaddlePaddle 框架推理）：**

      1. 拉取 PaddlePaddle 兼容的 CANN 镜像：

      ```bash
      docker pull ccr-2vdh3abv-pub.cnc.bj.baidubce.com/device/paddle-npu:cann800-ubuntu20-npu-910b-base-aarch64-gcc84
      ```

      启动容器：

      ```bash
      docker run -it --name paddle-npu-dev -v $(pwd):/work \
          --privileged --network=host --shm-size=128G -w=/work \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -e ASCEND_RT_VISIBLE_DEVICES="0,1,2,3,4,5,6,7" \
          ccr-2vdh3abv-pub.cnc.bj.baidubce.com/device/paddle-npu:cann800-ubuntu20-npu-910b-base-$(uname -m)-gcc84 /bin/bash
      ```

      2. 安装 PaddlePaddle 与 PaddleOCR：

      ```bash
      python -m pip install paddlepaddle==3.2.0
      wget https://paddle-whl.bj.bcebos.com/stable/npu/paddle-custom-npu/paddle_custom_npu-3.2.0-cp310-cp310-linux_aarch64.whl
      pip install paddle_custom_npu-3.2.0-cp310-cp310-linux_aarch64.whl
      python -m pip install -U "paddleocr[doc-parser]"
      pip install safetensors
      ```

      > 可能缺失 OpenCV 组件：
      >
      > ```bash
      > apt-get update
      > apt-get install -y libgl1 libglib2.0-0
      > ```
      >
      > CANN-8.0.0 不支持部分版本的 NumPy 与 OpenCV，建议安装指定版本：
      >
      > ```bash
      > python -m pip install numpy==1.26.4
      > python -m pip install opencv-python==3.4.18.65
      > ```

      3. 以 vLLM 为后端，结合 PP-DocLayoutV2 进行离线推理：

      ```python
      from paddleocr import PaddleOCRVL

      doclayout_model_path = "/path/to/your/PP-DocLayoutV2/"

      pipeline = PaddleOCRVL(vl_rec_backend="vllm-server",
                             vl_rec_server_url="http://localhost:8000/v1",
                             layout_detection_model_name="PP-DocLayoutV2",
                             layout_detection_model_dir=doclayout_model_path,
                             device="npu")

      output = pipeline.predict("https://paddle-model-ecology.bj.bcebos.com/paddlex/imgs/demo_image/paddleocr_vl_demo.png")

      for i, res in enumerate(output):
          res.save_to_json(save_path=f"output_{i}.json")
          res.save_to_markdown(save_path=f"output_{i}.md")
      ```

      > Atlas 300I DUO 上 PP-DocLayoutV2 仅支持 OM 模型推理，具体流程参见 [ModelZoo 指南](https://gitcode.com/Ascend/ModelZoo-PyTorch/tree/master/ACL_PyTorch/built-in/ocr/PP-DocLayoutV2)。

verification: |-
  服务启动成功后，可以看到如下日志输出：

  ```bash
  INFO:     Started server process [87471]
  INFO:     Waiting for application startup.
  INFO:     Application startup complete.
  ```

  服务启动后，可使用 OpenAI API 客户端发起请求。

  ```python
  from openai import OpenAI

  client = OpenAI(
      api_key="EMPTY",
      base_url="http://localhost:8000/v1",
      timeout=3600
  )

  # 各任务的基础提示词
  TASKS = {
      "ocr": "OCR:",
      "table": "Table Recognition:",
      "formula": "Formula Recognition:",
      "chart": "Chart Recognition:"
  }

  messages = [
      {
          "role": "user",
          "content": [
              {
                  "type": "image_url",
                  "image_url": {
                      "url": "https://ofasys-multimodal-wlcb-3-toshanghai.oss-accelerate.aliyuncs.com/wpf272043/keepme/image/receipt.png"
                  }
              },
              {
                  "type": "text",
                  "text": TASKS["ocr"]
              }
          ]
      }
  ]

  response = client.chat.completions.create(
      model="PaddleOCR-VL-0.9B",
      messages=messages,
      temperature=0.0,
  )
  print(f"Generated text: {response.choices[0].message.content}")
  ```

  预期结果：

  ```bash
  Generated text: CINNAMON SUGAR
  1 x 17,000
  17,000
  SUB TOTAL
  17,000
  GRAND TOTAL
  17,000
  CASH IDR
  20,000
  CHANGE DUE
  3,000
  ```

performance:
  accuracy: |-
    PaddleOCR-VL 的精度评测请参考官方 [ModelZoo](https://gitcode.com/Ascend/ModelZoo-PyTorch/tree/master/ACL_PyTorch/built-in/ocr/PP-DocLayoutV2) 提供的评测流程与结果。
  benchmark: |-
    PaddleOCR-VL 的性能评测请参考官方 [ModelZoo](https://gitcode.com/Ascend/ModelZoo-PyTorch/tree/master/ACL_PyTorch/built-in/ocr/PP-DocLayoutV2) 提供的测试方法与结果。

tuning: |-
  ### 推荐配置

  > **注意**：以下配置在特定测试环境中验证，仅供参考。最优配置取决于最大输入/输出长度、精度要求与实际硬件规格等因素，建议结合 9.2 节的调优方法按实际情况调整。

  PaddleOCR-VL 是轻量模型，单 NPU 即可运行，不同硬件平台的关键调优参数有所差异。

  #### 场景总览

  | 场景 | 硬件 | NPU 总数 | 权重版本 | 关键注意事项 |
  |------|------|----------|----------|--------------|
  | High Throughput | A2 系列 | 1 | PaddleOCR-VL-0.9B | - |
  | High Throughput | Atlas 300I DUO | 1 | PaddleOCR-VL-0.9B | 图编译要求 **CANN >= 9.0.0** |

  > `NPU 总数` 指所有节点使用的 NPU 总数。

  #### 节点详细配置

  | 场景 | 配置 | NPU | TP | DP | Max Model Len | Max Num Batched Tokens | 图编译 | dtype |
  |------|------|-----|----|----|---------------|------------------------|--------|-------|
  | High Throughput | A2 系列 / 单机 | 1 | — | — | — | — | FULL_DECODE_ONLY | bfloat16（默认） |
  | High Throughput | Atlas 300I DUO / 单机 | 1 | — | — | — | — | FULL_DECODE_ONLY；否则 enforce-eager | float16 |

  ### 调优指南

  通用调优方法（含 OS 优化 tcmalloc、`torch_npu` 优化（内存与调度）、CANN 优化）请参考[公共性能调优文档](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)。

  特性详细说明请参考[特性矩阵](https://docs.vllm.ai/projects/ascend/zh-cn/latest/user_guide/support_matrix/feature_matrix.html)。

faq: |-
  环境、安装与通用参数类常见问题请参考[公共 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)，本章仅覆盖模型专属问题。

  - **问：Atlas 300I DUO 的部署要求是什么？**

    答：Atlas 300I DUO 上仅支持 `float16` 精度。图编译（`--compilation-config`）要求 **CANN 版本 >= 9.0.0**；CANN 版本较低时，请改用 `--enforce-eager`。

  - **问：Atlas 300I DUO 上安装遇到依赖冲突怎么办？**

    答：可能需要卸载 `triton-ascend` 与 `triton` 以避免依赖冲突。

