meta:
  title: PaddleOCR-VL
  slug: paddleocr-vl
  provider: PaddlePaddle
  description: 在昇腾上部署原版 PaddleOCR-VL-0.9B，涵盖单 NPU 服务和结合 PP-DocLayoutV2 的文档解析。
  date_added: '2026-10-12'
  date_updated: '2026-10-13'
  difficulty: intermediate
  hardware:
    atlas_800_a2: verified
    atlas_300i_duo: verified
model:
  model_id: PaddlePaddle/PaddleOCR-VL
  min_vllm_version: 0.11.1
  architecture: dense
  parameter_count: 0.9B
  active_parameters: null
  context_length: 131072
  modality: multimodal
  base_args:
  - --trust-remote-code
  - --served-model-name
  - PaddlePaddle/PaddleOCR-VL
  - PaddleOCR-VL-0.9B
  - --no-enable-prefix-caching
  - --mm-processor-cache-gb
  - '0'
  base_env:
    VLLM_USE_MODELSCOPE: 'True'
    ASCEND_RT_VISIBLE_DEVICES: '0'
    TASK_QUEUE_ENABLE: '1'
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
  docker_image:
    atlas_800_a2: quay.io/ascend/vllm-ascend:nightly-main@sha256:6d2aa300863a4145249822c625affbe98ed4f231605789b9118ae137370250f3
    atlas_300i_duo: quay.io/ascend/vllm-ascend:nightly-main-310p@sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723
  nightly_required: false
  install:
    pip: false
    docker:
      note: 2026-10-12 解析并固定官方 main 镜像摘要。A2 的 BF16 图模式及原生 Paddle 版面推理、310P 的 graph/eager/OM 已在真实 NPU 上经完整镜像内容及原始入口、PRoot5.5.0
        人工实测。原生 Docker 和 nightly CI 未验证。平台原始包环境及独立源码构建分别保留。
features:
  cpu_binding:
    label: CPU 绑定
    description: 请求 CPU 绑定；容器 CPU 配额与 NUMA 亲和性冲突时可能跳过绑定。
    args:
    - --additional-config
    - '{"enable_cpu_binding":true}'
variants:
  default:
    precision: bf16
    vram_minimum_gb: 3
    description: A2 上的原版 0.9B 权重；模型配置上下文为 131072，各部署场景限制单独列出。
    supported_hardware:
    - atlas_800_a2
  fp16:
    precision: fp16
    vram_minimum_gb: 3
    description: 将原版权重转换为 FP16；Atlas 300I DUO 必须使用此精度。
    supported_hardware:
    - atlas_300i_duo
    extra_args:
    - --dtype
    - float16
compatible_strategies:
- single_node_A2
- single_node_310p
hardware_overrides:
  atlas_300i_duo:
    extra_args:
    - --dtype
    - float16
    - --max-model-len
    - '16384'
  atlas_800_a2:
    extra_args:
    - --max-num-batched-tokens
    - '16384'
    - --gpu-memory-utilization
    - '0.80'
    extra_env:
      CPU_AFFINITY_CONF: '1'
      TASK_QUEUE_ENABLE: '0'
strategy_overrides: {}
dependencies: []
guide: ''
overview: PaddleOCR-VL-0.9B 将 NaViT 风格的动态分辨率视觉编码器与 ERNIE-4.5-0.3B 结合，用于识别文字、表格、公式和图表。PP-DocLayoutV2 提供区域检测和阅读顺序预测，组成完整文档解析流程。本配方保留原版
  PaddlePaddle/PaddleOCR-VL 权重；VL-1.5 和 VL-1.6 属于其他模型。
weight_download:
- weight_version: 原版 PaddleOCR-VL-0.9B
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/PaddlePaddle/PaddleOCR-VL
    command: |-
      ```bash
      modelscope download --model PaddlePaddle/PaddleOCR-VL --local_dir PaddleOCR-VL
      sha256sum PaddleOCR-VL/model.safetensors
      ```
  - source: HuggingFace
    url: https://huggingface.co/PaddlePaddle/PaddleOCR-VL
    command: |-
      ```bash
      hf download PaddlePaddle/PaddleOCR-VL --revision 7fa00a8c55b735ba51ba49a9058f3f9c57a99a11 --local-dir PaddleOCR-VL
      ```
prerequisites:
- title: 硬件与精度
  content: 在 Atlas 800I A2 或 Atlas 300I DUO 上使用一个逻辑 NPU。实测 HiDevLab 卡为 Ascend 310P3，每个可见设备约 44 GB 显存；环境选择器中的 64
    GB 为主机内存。310P 仅支持 FP16。A2 的 BF16 图模式和 Paddle custom-NPU 文档解析已在910B3/64GiB HBM 上人工实测。
- title: 运行时版本
  content: 源教程开头记录 v0.21.0rc1，文档宏目前解析为 v0.23.0。本次迁移检查的 main 为 0830899b4e3f55ea6ed9f3518385e9d81192ae29，并独立固定最新发布的
    main 镜像。310P 的 FULL_DECODE_ONLY 需要 CANN >= 9.0.0；较旧且受支持的 CANN 使用下方 eager 场景。不要为匹配镜像而更换主机驱动。
- title: 固定权重身份
  content: 已核验的原版 model.safetensors 大小为 1917255968 字节，SHA256 为 3085f1042e184f68f8a412aa0f64f2c4b8562989598bbfba326aaa11fc685de8。模型声明的
    131072 上下文不代表已经验证的 310P 服务长度；教程使用 16384。
- title: 隔离服务与解析环境
  content: vLLM 与 Paddle 版面解析使用独立环境。310P 通过 OM/ACL 执行版面推理，Paddle 仅做 CPU 预处理，不能套用 Paddle custom-NPU 路径。复现 ModelZoo
    路径时关闭文档方向分类和去畸变。
- title: A2 实测配置
  content: 910B3/64GiB HBM、驱动26.1.1/CANN9.1.0 实测：TASK_QUEUE_ENABLE=0 与 gpu-memory-utilization=0.80 的 BF16 图模式通过两种别名的四类识别。教程默认设置出现视觉位置索引错误和采样阶段内存不足。这些是本任务实测配置，不代表达到吞吐验收目标；原生
    Docker 和 nightly CI 仍未验证。
- title: Paddle NPU 编译环境
  content: 独立的 CANN8.0/Paddle3.2 版面容器需要兼容的 NumPy<2 和编译依赖、ATB ABI0，以及 CANN 子进程中的标准库路径优先级。下方命令保留全部检查，完整 Paddle run_check
    和原生 NPU 文档推理均已通过；它与 vLLM 的 CANN9.1 环境不同。
env_setup:
  container:
    A2:
      content: |-
        ```bash
        export IMAGE='quay.io/ascend/vllm-ascend:nightly-main@sha256:6d2aa300863a4145249822c625affbe98ed4f231605789b9118ae137370250f3'
        docker run --rm --name paddleocr-vl --shm-size=1g --net=host \
            --device /dev/davinci0 --device /dev/davinci_manager \
            --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            -v "$PWD":/work -v "$HOME/.cache":/root/.cache \
            -w /work -it "$IMAGE" bash
        ```
    300I DUO:
      content: |-
        ```bash
        export IMAGE='quay.io/ascend/vllm-ascend:nightly-main-310p@sha256:3706317b3a91fda5b7b53174d65d97aeb5c762068c8edf96387f0e9f462f9723'
        docker run --rm --name paddleocr-vl --shm-size=1g --net=host \
            --device /dev/davinci0 --device /dev/davinci_manager \
            --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            -v "$PWD":/work -v "$HOME/.cache":/root/.cache \
            -w /work -it "$IMAGE" bash
        ```
