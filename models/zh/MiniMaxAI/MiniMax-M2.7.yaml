      - title: 4. 检查后端并启动网关
        content: |-
          在 Prefill 宿主机另开终端，加载「环境准备」输出的 `session.env`，再执行「准备双机启动器」的第一段命令进入容器。四个后端都返回 minimax 后启动网关。

          ```bash
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 "http://${PREFILL_NODE_0_IP}:7000/v1/models" &&
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 "http://${PREFILL_NODE_0_IP}:7001/v1/models" &&
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 "http://${DECODE_NODE_0_IP}:7100/v1/models" &&
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 "http://${DECODE_NODE_0_IP}:7101/v1/models"
          ```

          ```bash
          unset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY
          export NO_PROXY='*' no_proxy='*'
          python /workspace/recipe-helpers/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py \
            --host "$GATEWAY_NODE_0_IP" --port 8009 \
            --prefiller-hosts "$PREFILL_NODE_0_IP" "$PREFILL_NODE_0_IP" --prefiller-ports 7000 7001 \
            --decoder-hosts "$DECODE_NODE_0_IP" "$DECODE_NODE_0_IP" --decoder-ports 7100 7101
          ```
      - title: 5. 验证推理和跨机 KV
        content: >-
          在 Prefill 宿主机执行，确认模型返回正常且 Decode 的外部 KV token 计数增加。


          ```bash

          (
            : "${PD_OUT:?Load the session.env from Environment Setup}" "${DECODE_NODE_0_IP:?Missing Decode IP}" "${GATEWAY_NODE_0_IP:?Missing gateway IP}"
            kv_metrics() {
              local rank
              for rank in 7100 7101; do
                curl --noproxy '*' -fsS --max-time 15 "http://$DECODE_NODE_0_IP:$rank/metrics" \
                  -o "$PD_OUT/08-decode-$rank.$1.prom" || return
              done
            }
            curl --noproxy '*' -fsS --max-time 15 "http://$GATEWAY_NODE_0_IP:8009/healthcheck" -o "$PD_OUT/08-health.json" || exit 1
            cat "$PD_OUT/08-health.json"
            python3 -c 'import json,sys; h=json.load(open(sys.argv[1])); assert h["prefill_instances"] == h["decode_instances"] == 2, h' "$PD_OUT/08-health.json" || exit 1
            kv_metrics before || exit 1
            id="release-pd-$(date -u +%s)-$$"
            printf '%s\n' "$id" > "$PD_OUT/08-request-id.txt" || exit 1
            cat "$PD_OUT/08-request-id.txt"
            python3 - <<'PY' > "$PD_OUT/08-request.json" || exit 1
          import json

          context = 'This context is a geography reference. Tokyo is the capital
          of Japan.\n' * 128

          prompt = context + '\nQuestion: What is the capital of Japan? Answer
          in a complete sentence.\nAnswer: The capital of Japan is'

          print(json.dumps(dict(model='minimax', temperature=0, max_tokens=96,
          prompt=prompt)))

          PY
            curl --noproxy '*' -fsS --max-time 180 "http://$GATEWAY_NODE_0_IP:8009/v1/completions" \
              -H 'Content-Type: application/json' -H "X-Request-Id: $id" \
              --data-binary "@$PD_OUT/08-request.json" -o "$PD_OUT/08-response.json" || exit 1
            cat "$PD_OUT/08-response.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["model"] == "minimax"; assert "tokyo" in r["choices"][0]["text"].lower(); assert r["usage"]["prompt_tokens"] > 1024' "$PD_OUT/08-response.json" || exit 1
            kv_metrics after || exit 1
            awk '/^vllm:prompt_tokens_by_source_total\{/ && /source="external_kv_transfer"/ {print FILENAME, $0}' "$PD_OUT"/08-decode-*.prom
          )

          ```
  - npu: Atlas 800I A3
    precision: W8A8
    deployment: Single-Node
    case: 单机短上下文 TP4 DP4 EP
    tags:
      - a3-single
    strategy: single_node_A3
    steps:
      - title: 1. 启动 MiniMax
        content: >-
          进入容器，在容器内执行启动命令。


          ```bash

          docker exec -it "$MINIMAX_CONTAINER" bash

          ```


          ```bash

          export HCCL_OP_EXPANSION_MODE=AIV

          export HCCL_BUFFSIZE=1024

          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          export OMP_NUM_THREADS=1

          export TASK_QUEUE_ENABLE=1

          MODEL_PATH=vllm-ascend/MiniMax-M2.7-w8a8-QuaRot

          case "$MODEL_PATH" in
            /*) ;;
            *) MODEL_PATH="/models/$MODEL_PATH" ;;
          esac

          vllm serve "$MODEL_PATH" \
            --served-model-name MiniMax-M2.7 \
            --host 127.0.0.1 \
            --port 8000 \
            --trust-remote-code \
            --quantization ascend \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --async-scheduling \
            --additional-config '{"enable_cpu_binding":true,"enable_fused_mc2":1,"enable_flashcomm1":true,"weight_nz_mode":1}' \
            --enable-expert-parallel \
            --tensor-parallel-size 4 \
            --data-parallel-size 4 \
            --max-num-seqs 48 \
            --max-model-len 40690 \
            --max-num-batched-tokens 16384 \
            --gpu-memory-utilization 0.85 \
            --speculative-config '{"enforce_eager":true,"method":"eagle3","model":"/models/Eco-Tech/MiniMax-M2.7-eagle-model-short","num_speculative_tokens":3}' \
            --enable-auto-tool-choice \
            --tool-call-parser minimax_m2 \
            --reasoning-parser minimax_m2_append_think
          ```
      - title: 2. 验证文本和工具调用
        content: |-
          在第二个 A3 宿主机终端检查模型列表，并各发出一次文本和工具调用请求。

          ```bash
          (
          set -eo pipefail

          check_request_count() {
            if [[ -n ${CI_REQUEST_PROOF_FILE:-} ]]; then
              test "$(wc -l < "$CI_REQUEST_PROOF_FILE")" -eq "$1"
            fi
          }

          check_request_count 0
          curl --noproxy '*' --fail --silent --show-error --connect-timeout 5 --max-time 15 http://127.0.0.1:8000/v1/models |
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(json.dumps(data)); assert any(m["id"] == "MiniMax-M2.7" for m in data["data"])'
          response=$(curl --noproxy '*' --fail-with-body --silent --show-error --connect-timeout 5 --max-time 120 http://127.0.0.1:8000/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"MiniMax-M2.7","max_tokens":512,"temperature":0,"messages":[{"role":"user","content":"Say hi in one word."}]}')
          python3 -c 'import json,sys; r=json.load(sys.stdin); print(json.dumps(r, ensure_ascii=False, indent=2)); assert r["model"] == "MiniMax-M2.7"; c=(r["choices"][0]["message"].get("content") or "").strip(); assert not c.startswith("<think>") or "</think>" in c; assert c.rsplit("</think>",1)[-1].strip().casefold().strip(".!") in {"hello","hi"}' <<<"$response"
          check_request_count 1

          response=$(curl --noproxy '*' --fail-with-body --silent --show-error --connect-timeout 5 --max-time 120 http://127.0.0.1:8000/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"MiniMax-M2.7","messages":[{"role":"user","content":"请查询上海的天气。"}],"tools":[{"type":"function","function":{"name":"get_current_weather","description":"Get weather by city","parameters":{"type":"object","properties":{"city":{"type":"string"},"unit":{"type":"string","enum":["celsius","fahrenheit"]}},"required":["city"]}}}],"tool_choice":"auto","temperature":0,"max_tokens":512}')
          python3 -c 'import json,sys; r=json.load(sys.stdin); print(json.dumps(r, ensure_ascii=False, indent=2)); assert r["model"] == "MiniMax-M2.7"; calls=r["choices"][0]["message"]["tool_calls"]; fn=next(c["function"] for c in calls if c["function"]["name"] == "get_current_weather"); city=json.loads(fn["arguments"])["city"].casefold(); assert "shanghai" in city or "上海" in city' <<<"$response"
          check_request_count 2
          )
          ```
