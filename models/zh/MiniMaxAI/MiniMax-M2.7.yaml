            --trust-remote-code \
            --gpu-memory-utilization 0.75 \
            --quantization ascend \
            --enforce-eager \
            --speculative-config '{"method":"eagle3","model":"/models/Eco-Tech/MiniMax-M2.7-eagle-model-short","num_speculative_tokens":1}' \
            --additional-config '{"enable_cpu_binding":true,"enable_fused_mc2":1,"enable_flashcomm1":true}' \
            --enable-request-id-headers \
            --kv-transfer-config '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_producer","kv_port":"55880","engine_id":"0","kv_connector_extra_config":{"prefill":{"dp_size":2,"tp_size":8},"decode":{"dp_size":2,"tp_size":8}}}'
