meta:
  title: MiniMax-M2.7
  slug: minimax-m2.7
  provider: MiniMaxAI
  description: 在 Atlas 800I A3 上部署 MiniMax-M2.7 W8A8-QuaRot。
  date_added: 2026-10-20
  difficulty: advanced
  hardware:
    atlas_800_a3: verified
model:
  model_id: MiniMaxAI/MiniMax-M2.7
  architecture: moe
  parameter_count: 230B
  active_parameters: 10B
  context_length: 204800
  modality: text
  base_args:
    - --trust-remote-code
  base_env: {}
  docker_image:
    atlas_800_a3: quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
  install:
    pip: false
    docker:
      command: docker pull quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
variants:
  default:
    precision: W8A8
    description: W8A8-QuaRot 主模型搭配 EAGLE3 草稿模型。
    model_id: vllm-ascend/MiniMax-M2.7-w8a8-QuaRot
    vram_minimum_gb: 276
compatible_strategies:
  - single_node_A3
  - pd_cluster
hardware_overrides: {}
strategy_overrides:
  pd_cluster:
    prefill:
      nodes:
        default: 1
    decode:
      nodes:
        default: 1
guide: ""
overview: |-
  MiniMax-M2.7 是稀疏 MoE 语言模型，可用于代码生成、推理和工具调用。本文的部署示例使用 W8A8-QuaRot 权重和 EAGLE3 草稿模型。

  单台 A3 可选择短上下文或长上下文配置。双机 1P1D 将预填充和解码分别放在两台 A3 上。三种 A3 配置都用 vLLM Ascend v0.30.0 镜像实测过。该版本的官方文档将部署说明指向历史教程。
weight_download:
  - weight_version: W8A8
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/vllm-ascend/MiniMax-M2.7-w8a8-QuaRot
        command: 经校验的 release 下载命令见前置条件中的「准备本地权重」。
  - weight_version: EAGLE3
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/Eco-Tech/MiniMax-M2.7-eagle-model-short
        command: 经校验的 release 下载命令见前置条件中的「准备本地权重」。
prerequisites:
  - title: 选择部署场景
    content: 短输入可先用单机短上下文配置。评测 128K 输入时选择单机长上下文配置。双机 1P1D 需要在两台宿主机上分别准备权重，并使用同一版本的镜像。
  - title: 准备本地权重
    content: |-
      在每台服务宿主机上使用 Linux、Bash、curl 和 Python 3.11 或 3.12。使用有写权限、至少剩余 300 GB 的权重根目录。若宿主机权重根目录不同于 `/models`，先设置 `WEIGHTS_ROOT`，启动场景容器时也输入同一目录。[W8A8 主模型](https://modelscope.cn/models/vllm-ascend/MiniMax-M2.7-w8a8-QuaRot) 有 54 个分片，[EAGLE3 草稿模型](https://modelscope.cn/models/Eco-Tech/MiniMax-M2.7-eagle-model-short) 有 1 个分片。下载使用 ModelScope `master`，通过实测记录的排序 SHA-256 清单固定全部 70 和 6 个文件（含配置和分词器文件）。两份清单均匹配后再部署。校验范围为清单所列的 76 个文件。若提供方修改了文件，从获准的镜像获取已校验的 release 文件，再运行同一检查。

      ```bash
      (
      set -euo pipefail
      export WEIGHTS_ROOT=${WEIGHTS_ROOT:-/models}
      mkdir -p "$WEIGHTS_ROOT"
      python3 - "$WEIGHTS_ROOT" <<'PY'
      import hashlib
      from pathlib import Path
      import subprocess
      import sys
      from urllib.parse import urlencode, urlunsplit

      root = Path(sys.argv[1])
      main_files = [
          ".gitattributes",
          "MiniMax-M2.7_best_practice.yaml",
          "README.md",
          "chat_template.jinja",
          "config.json",
          "configuration.json",
          "configuration_minimax_m2.py",
          "generation_config.json",
          "merges.txt",
          "modeling_minimax_m2.py",
          "optional/quarot.safetensors",
          "quant_model_description.json",
          "quant_model_weights.safetensors.index.json",
          "tokenizer.json",
          "tokenizer_config.json",
          "vocab.json",
      ]
      main_files += [f"quant_model_weights-{i:05d}-of-00054.safetensors" for i in range(1, 55)]
      models = (
          ("vllm-ascend/MiniMax-M2.7-w8a8-QuaRot", main_files, "78f17fbd07840d914d27ed135c2762c155795859d5dc69e12ba5e57ab2611416"),
          ("Eco-Tech/MiniMax-M2.7-eagle-model-short", [".gitattributes", "README.md", "config.json", "config.py", "generation_config.json", "model.safetensors"], "8e059415e636df34d8347717b5ac67ae8f86e93c2825e5765402e49dd624e17f"),
      )

      for repo, files, expected in models:
          target = root / repo
          target.mkdir(parents=True, exist_ok=True)
          entries = []
          for name in files:
              local = target / name
              if not local.is_file():
                  local.parent.mkdir(parents=True, exist_ok=True)
                  query = urlencode({"Revision": "master", "FilePath": name})
                  url = urlunsplit(("https", "www.modelscope.cn", f"/api/v1/models/{repo}/repo", query, ""))
                  part = local.with_name(local.name + ".part")
                  subprocess.run(
                      ["curl", "-fLSs", "--retry", "3", "-C", "-", "-o", str(part), url], check=True
                  )
                  part.replace(local)
              with local.open("rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              entries.append(f"{digest}  {name}\n")
          actual = hashlib.sha256("".join(sorted(entries)).encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f"{repo}: checkpoint differs (list SHA-256 {actual}); use verified release files")
          print(f"{repo}: {len(files)} files verified (list SHA-256 {actual})")
      PY
      )
      ```
  - title: 使用 AISBench 评测
    content: |-
      在评测端使用 Linux、Bash、Git、curl 和 Python 3.11 或 3.12，按记录的提交安装 [AISBench](https://github.com/AISBench/benchmark)。单机场景在服务宿主机执行，PD 场景在能访问 Prefill 网关且已准备主模型分词器的机器执行。以下命令按完整提交号各取一份指定的 ModelScope 文件，并逐件校验 SHA-256，同时校验 [OpenCompass GSM8K demo 数据](https://opencompass.oss-cn-shanghai.aliyuncs.com/datasets/data/gsm8k.zip) 。三份 ModelScope 文件分别来自 [AIME2025](https://modelscope.cn/datasets/vllm-ascend/aime2025)、[短档 GSM8K 性能](https://modelscope.cn/datasets/vllm-ascend/GSM8K_in3500_bs4000_minimax)、[128K GSM8K 性能](https://modelscope.cn/datasets/vllm-ascend/GSM8K_prefix90_in131072_bs1000_Minimax)。

      ```bash
      (
      set -euo pipefail
      bench=${BENCH_ROOT:-/models/minimax-aisbench}
      mkdir -p "$bench/datasets"
      bench=$(realpath "$bench")
      python3 -m venv "$bench/venv"
      python="$bench/venv/bin/python"
      "$python" -m pip install 'modelscope==1.37.1'
      commit=e968d1bd7f48404bd913b95560f33938072336fa
      if [[ ! -d "$bench/benchmark/.git" ]]; then
        git clone https://github.com/AISBench/benchmark.git "$bench/benchmark"
      fi
      git -C "$bench/benchmark" checkout --detach "$commit"
      test "$(git -C "$bench/benchmark" rev-parse HEAD)" = "$commit"
      cd "$bench/benchmark"
      "$python" -m pip install -e . --use-pep517 -r requirements/api.txt -r requirements/extra.txt
      mkdir -p ais_bench/datasets
      curl -fLSs --retry 3 https://opencompass.oss-cn-shanghai.aliyuncs.com/datasets/data/gsm8k.zip \
        -o "$bench/gsm8k.zip"
      "$python" -m zipfile -e "$bench/gsm8k.zip" ais_bench/datasets
      sha256sum -c <<<"3730d312f6e3440559ace48831e51066acaca737f6eabec99bccb9e4b3c39d14  ais_bench/datasets/gsm8k/test.jsonl"
      while read -r name revision file hash; do
        target="$bench/datasets/$name"
        "$bench/venv/bin/modelscope" download --dataset "vllm-ascend/$name" \
          --revision "$revision" --local_dir "$target" --include "$file"
        sha256sum -c <<<"$hash  $target/$file"
      done <<'DATA'
      aime2025 370b7322a9d6faecaa125c13217eed1c8b89983a aime2025.jsonl dee94372847a43a5eb6b0a439047efa82f3804db221a55dc640053425315dd4b
      GSM8K_in3500_bs4000_minimax 36996650780e218d838b7acbb6f157938e4b0376 test.jsonl 9f2e153c669141202b80762c2e3cfcccf53afd1235e4a0b021d15f43312c71b4
      GSM8K_prefix90_in131072_bs1000_Minimax 083449f8db030c93a9907d802b35436a358d4f5d test.jsonl 3ab40bcbb089448d2f3e68a6d2446a13930c2b22bdc3895ddac85b069de19192
      DATA
      "$bench/venv/bin/ais_bench" --help >/dev/null
      )
      ```

      默认 `short-demo` 评测 GSM8K 的 8 题。设置 `PROFILE=aime` 评测 AIME2025 的 30 题。性能配置为 `short-perf20`、`short-perf50`（192、760 请求）、`long-perf`（80）和 `pd-perf`（160）。命令发起正式测量请求，预热应在测量前单独完成。`BENCH_ROOT`、`WEIGHTS_ROOT` 须与准备阶段一致。两个单机场景均使用 8000 端口和服务名 `MiniMax-M2.7`。PD 请将 `HOST` 设为 Prefill 网关地址，设置 `PORT=8009` 和 `MODEL=minimax`。

      ```bash
      (
      set -euo pipefail
      export BENCH_ROOT=$(realpath "${BENCH_ROOT:-/models/minimax-aisbench}")
      export WEIGHTS_ROOT=$(realpath "${WEIGHTS_ROOT:-/models}")
      export HOST=${HOST:-127.0.0.1} PORT=${PORT:-8000} MODEL=${MODEL:-MiniMax-M2.7}
      export NO_PROXY='*' no_proxy='*'
      profile=${PROFILE:-short-demo}
      request=vllm_api_general_chat
      datasets_name=gsm8k_datasets
      opts=(--dump-eval-details)
      case "$profile" in
        short-demo)
          dataset=demo.demo_gsm8k_gen_4_shot_cot_chat_prompt
          data="$BENCH_ROOT/benchmark/ais_bench/datasets/gsm8k"
          batch=1; tokens=1024; generation='temperature=0, ignore_eos=False'
          ;;
        aime)
          dataset=aime2025.aime2025_gen_0_shot_chat_prompt
          datasets_name=aime2025_datasets
          data="$BENCH_ROOT/datasets/aime2025/aime2025.jsonl"
          batch=32; tokens=65536; generation='temperature=1, top_p=1, top_k=40, ignore_eos=False'
          ;;
        short-perf20|short-perf50|long-perf|pd-perf)
          dataset=gsm8k.gsm8k_gen_0_shot_cot_str_perf
          request=vllm_api_stream_chat
          generation='temperature=0, ignore_eos=True'
          case "$profile" in
            short-perf20) name=GSM8K_in3500_bs4000_minimax; batch=48; prompts=192; tokens=1500 ;;
            short-perf50) name=GSM8K_in3500_bs4000_minimax; batch=190; prompts=760; tokens=1500 ;;
            long-perf) name=GSM8K_prefix90_in131072_bs1000_Minimax; batch=20; prompts=80; tokens=1024 ;;
            pd-perf) name=GSM8K_prefix90_in131072_bs1000_Minimax; batch=40; prompts=160; tokens=1024 ;;
          esac
          data="$BENCH_ROOT/datasets/$name"
          opts=(--mode perf --num-prompts "$prompts")
          ;;
        *) printf '%s\n' "Unknown profile: $profile" >&2; exit 2 ;;
      esac
      export AIS_MINIMAX_DATA="$data" AIS_MINIMAX_OUTPUT="$BENCH_ROOT/results/$profile"
      cd "$BENCH_ROOT/benchmark"
      config=$(mktemp "$BENCH_ROOT/minimax-$profile.XXXXXX.py")
      trap 'rm -f -- "$config"' EXIT
      cat >"$config" <<PY
      import os
      from mmengine.config import read_base

      with read_base():
          from ais_bench.benchmark.configs.datasets.$dataset import $datasets_name as datasets
          from ais_bench.benchmark.configs.models.vllm_api.$request import models

      datasets[0]['path'] = os.environ['AIS_MINIMAX_DATA']
      models[0]['model'] = os.environ['MODEL']
      models[0]['host_ip'] = os.environ['HOST']
      models[0]['host_port'] = int(os.environ['PORT'])
      models[0]['path'] = os.path.join(os.environ['WEIGHTS_ROOT'], 'vllm-ascend/MiniMax-M2.7-w8a8-QuaRot')
      models[0]['batch_size'] = $batch
      models[0]['request_rate'] = 0
      models[0]['max_out_len'] = $tokens
      models[0]['generation_kwargs'].update($generation)
      work_dir = os.environ['AIS_MINIMAX_OUTPUT']
      PY
      "$BENCH_ROOT/venv/bin/ais_bench" "$config" "${opts[@]}"
      )
      ```
env_setup:
  container:
    A3:
      content: >-
          ### 单机（短上下文或长上下文）


          在 A3 宿主机执行。如果权重放在其他位置，先把 WEIGHTS_ROOT 设为两个权重目录的共同父目录。配置完成后，在同一个终端继续执行部署步骤。


          ```bash

          export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler

          export MINIMAX_CONTAINER=${MINIMAX_CONTAINER:-minimax-single-a3}

          export WEIGHTS_ROOT=${WEIGHTS_ROOT:-/models}

          devices=()

          for id in {0..15}; do devices+=(--device "/dev/davinci$id"); done

          docker run -d --name "$MINIMAX_CONTAINER" --network host --ipc host \
            "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /usr/local/dcmi:/usr/local/dcmi:ro \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            -v /etc/hccn.conf:/etc/hccn.conf:ro \
            -v "$WEIGHTS_ROOT:/models:ro" -w /models --entrypoint bash "$IMAGE" -lc 'exec sleep infinity'
          ```


          ### 双机（1P1D）


          两台 A3 宿主机依次执行两段。按提示填角色、主机 IP 和存放 W8A8、EAGLE3 权重的根目录。配置完成后，在各自的终端继续执行部署步骤。


          使用 `ip route get "$peer" from "$self"` 所选网卡上可互通的宿主机 IPv4 地址。Gloo、TP、HCCL 使用该路由网卡。另行检查 A3 设备侧互联及对端 NPU vNIC 连通性。网关需访问 Prefill 的 HTTP 7000–7001 和 Decode 的 7100–7101，客户端需访问 Prefill 网关的 TCP 8009。两台宿主机各自预留 DP RPC 12321。双向检查对端 TCP 能访问 Mooncake 控制端点（Prefill 起始端口 55880、Decode 起始端口 56900）及各 rank 的 AscendDirect/HIXL 监听端口。启动后用对应容器的进程、日志和 `ss -lntp` 确认实际监听端口，临时放行仅限对应端口和对端地址。HTTP 后端检查完成后，通过网关请求和 Decode 计数验证跨机 KV 传输。


          ```bash

          {
            read -r -p 'Role (prefill or decode): ' PD_ROLE
            read -r -p 'Prefill host IP: ' PREFILL_NODE_0_IP
            read -r -p 'Decode host IP: ' DECODE_NODE_0_IP
            read -r -p 'Host directory containing both checkpoint repositories [/models]: ' WEIGHTS_ROOT
            export WEIGHTS_ROOT=${WEIGHTS_ROOT:-/models}
            export PD_ROLE PREFILL_NODE_0_IP DECODE_NODE_0_IP
            export GATEWAY_NODE_0_IP=$PREFILL_NODE_0_IP
            export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
            export PD_OUT="/models/evidence/minimax-m27-w8a8-a3/release-pd-$(date -u +%Y%m%dT%H%M%SZ)-$PD_ROLE"
            export PD_CONTAINER="minimax-${PD_OUT##*/}"
            case "$PD_ROLE" in
              prefill) self=$PREFILL_NODE_0_IP; peer=$DECODE_NODE_0_IP ;;
              decode) self=$DECODE_NODE_0_IP; peer=$PREFILL_NODE_0_IP ;;
              *) printf 'Invalid role\n' >&2; self=; peer= ;;
            esac
            (
              test -n "$self" && test -n "$peer" && test "$self" != "$peer" || exit 1
              route=$(ip -o route get "$peer") || exit 1
              awk -v ip="$self" '{for(i=1;i<NF;i++) if($i=="src" && $(i+1)==ip) found=1} END {exit !found}' <<<"$route" || exit 1
              IFACE_NAME=$(awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' <<<"$route")
              test -n "$IFACE_NAME" && mkdir -p "$PD_OUT" || exit 1
              printf 'export %s=%q\n' PD_ROLE "$PD_ROLE" PREFILL_NODE_0_IP "$PREFILL_NODE_0_IP" \
                DECODE_NODE_0_IP "$DECODE_NODE_0_IP" GATEWAY_NODE_0_IP "$GATEWAY_NODE_0_IP" \
                WEIGHTS_ROOT "$WEIGHTS_ROOT" IMAGE "$IMAGE" PD_OUT "$PD_OUT" PD_CONTAINER "$PD_CONTAINER" \
                self "$self" peer "$peer" IFACE_NAME "$IFACE_NAME" > "$PD_OUT/session.env" || exit 1
              printf 'Session file: %s/session.env\n' "$PD_OUT"
            )
            if [[ $? == 0 ]]; then source "$PD_OUT/session.env"; else false; fi
          }

          ```


          ```bash

          devices=()

          for i in {0..15}; do devices+=(--device "/dev/davinci$i"); done

          docker image inspect "$IMAGE" >/dev/null 2>&1 || docker pull "$IMAGE"

          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$IMAGE"
          &&

          docker run -d --name "$PD_CONTAINER" --net=host --ipc=host
          --entrypoint bash \
            "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro \
            -v /usr/local/dcmi:/usr/local/dcmi:ro -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro -v /etc/hccn.conf:/etc/hccn.conf:ro \
            -v "$WEIGHTS_ROOT:/models:ro" -v "$PD_OUT:/evidence" \
            -e PREFILL_NODE_0_IP -e DECODE_NODE_0_IP -e GATEWAY_NODE_0_IP -e IFACE_NAME \
            "$IMAGE" -lc 'exec sleep infinity'
          ```
scenarios:
  - test_id: minimax-long-1p1d
    npu: Atlas 800I A3
    precision: W8A8
    deployment: 多节点 PD 分离
    case: long-1p1d
    npu_per_node: 16
    steps:
      - title: 1. 准备双机启动器
        content: |-
          两台机器都先执行第一段进入容器，再在容器内执行第二段。

          ```bash
          docker exec -it "$PD_CONTAINER" bash
          ```

          ```bash
          mkdir -p /workspace/recipe-helpers/examples/external_online_dp /workspace/recipe-helpers/examples/disaggregated_prefill_v1
          cat > /workspace/recipe-helpers/examples/external_online_dp/launch_online_dp.py <<'PY'
          import argparse
          import os
          import signal
          import subprocess
          import time
          parser = argparse.ArgumentParser()
          for key in ("dp-size", "tp-size", "dp-size-local", "dp-rank-start", "dp-rpc-port", "vllm-start-port"):
              parser.add_argument("--" + key, type=int, required=True)
          parser.add_argument("--dp-address", required=True)
          args = parser.parse_args()
          assert args.dp_size_local > 0 and args.tp_size > 0
          assert args.dp_rank_start + args.dp_size_local <= args.dp_size
          processes = []
          def stop(signum, frame):
              raise SystemExit(128 + signum)
          signal.signal(signal.SIGTERM, stop)
          signal.signal(signal.SIGINT, stop)
          try:
              for i in range(args.dp_size_local):
                  devices = ",".join(str(x) for x in range(i * args.tp_size, (i + 1) * args.tp_size))
                  template = os.environ.get("MINIMAX_PD_TEMPLATE", "./run_dp_template.sh")
                  command = ["bash", template, devices, str(args.vllm_start_port + i)]
                  command.extend([str(args.dp_size), str(args.dp_rank_start + i), args.dp_address])
                  command.extend([str(args.dp_rpc_port), str(args.tp_size)])
                  processes.append(subprocess.Popen(command, start_new_session=True))
              while True:
                  codes = [process.poll() for process in processes]
                  failure = next((code for code in codes if code not in (None, 0)), None)
                  if failure is not None:
                      raise SystemExit(failure if failure > 0 else 1)
                  if all(code is not None for code in codes):
                      break
                  time.sleep(0.1)
              codes = [process.wait() for process in processes]
              raise SystemExit(next((code if code > 0 else 1 for code in codes if code), 0))
          finally:
              # Ignore repeated termination while cleaning up only groups created above.
              signal.signal(signal.SIGTERM, signal.SIG_IGN)
              signal.signal(signal.SIGINT, signal.SIG_IGN)
              for process in processes:
                  try:
                      os.killpg(process.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
              deadline = time.monotonic() + 10
              for process in processes:
                  try:
                      process.wait(timeout=max(0, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      pass
              for process in processes:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
              for process in processes:
                  if process.poll() is None:
                      process.wait()
          PY
          cp /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py \
            /workspace/recipe-helpers/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py &&
            python /workspace/recipe-helpers/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py --help >/dev/null
          ```
      - title: 2. 启动 Prefill
        content: |-
          在 Prefill 容器中依次执行两段，保留终端运行。

          ```bash
          cat > /workspace/recipe-helpers/run_dp_template.sh <<'BASH'
          #!/usr/bin/env bash
          unset http_proxy https_proxy ftp_proxy all_proxy HTTP_PROXY HTTPS_PROXY FTP_PROXY ALL_PROXY
