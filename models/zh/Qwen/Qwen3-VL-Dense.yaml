prerequisites:
  - title: 模型权重
    content: |-
      | Weight Version | Hardware | Download |
      |----------------|----------|----------|
      | `Qwen3-VL-8B-Instruct` | 1 card A2 / A3 / 300I DUO | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-8B-Instruct) |
      | `Qwen3-VL-8B-Instruct-W8A8` | 1 card 950DT | [ModelScope](https://www.modelscope.cn/models/vllm-ascend/Qwen3-VL-8B-Instruct-W8A8) |
      | `Qwen3-VL-32B-Instruct` | 2 cards A2 / A3 | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-VL-32B-Instruct) |
      | `Qwen3-VL-32B-Instruct-w8a8-QuaRot` | 1 card 950DT | [ModelScope](https://www.modelscope.cn/models/Eco-Tech/Qwen3-VL-32B-Instruct-w8a8-QuaRot) |

      教程中的 `Eco-Tech/...-w8a8-mxfp8` 在 ModelScope 上当前 404。请改用上表 W8A8 替代权重。

env_setup:
  container:
    A3:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
        docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true \
          --device /dev/davinci0 --device /dev/davinci1 \
          --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    A2:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0
        docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true \
          --device /dev/davinci0 --device /dev/davinci_manager \
          --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    300I DUO:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-310p
        docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true \
          --device /dev/davinci0 --device /dev/davinci_manager \
          --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    A5:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a5
        docker run --rm --name vllm-ascend --net=host --shm-size=1g --privileged=true \
          --device /dev/davinci0 --device /dev/davinci_manager --device /dev/hisi_hdc \
          --device /dev/ummu --device /dev/uburma \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -itd $IMAGE bash
        ```
  pip:
    content: |-
      优先使用预编译 Ascend 镜像。源码安装见 [Installation Guide](https://docs.vllm.ai/projects/ascend/en/latest/installation.html)。A3 请使用 A3 镜像或 wheel。

scenarios:
  - npu: Atlas 800I A3
    precision: bf16
    deployment: Single-Node
    case: 8B 单卡
    tags: [a3-8b]
    strategy: single_node_A3
    steps:
      - title: 启动服务
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-8B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype bfloat16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --data-parallel-size 1 \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens {{max_num_batched_tokens}} \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --async-scheduling \
            --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1,2,4,8,16,32]}' \
            --mm-processor-cache-gb 0
          ```

          快速冒烟可改用 `--enforce-eager`，并将 `--max-model-len` 设为 8192、`--max-num-batched-tokens` 设为 4096、`--max-num-seqs` 设为 4、`--gpu-memory-utilization` 设为 0.6。
      - title: 服务验证
        content: |-
          使用验证章节中的图像对话请求。期望 HTTP 200，回复包含 `TONGYI Qwen`。
  - npu: Atlas 800I A3
    precision: bf16
    deployment: Single-Node
    case: 32B 双卡
    tags: [a3-32b]
    strategy: single_node_A3
    steps:
      - title: 启动服务
        content: |-
          Qwen3-VL-32B-Instruct 在 A2/A3 / Atlas 推理产品上需要双卡（TP=2）。

          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0,1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-32B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype bfloat16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 2 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.8 \
            --enforce-eager \
            --mm-processor-cache-gb 0
          ```
      - title: 服务验证
        content: |-
          使用验证章节中的图像对话请求。
  - npu: Atlas 800I A2
    precision: bf16
    deployment: Single-Node
    case: 8B 单卡 (A2)
    tags: [a2-8b]
    strategy: single_node_A2
    steps:
      - title: 启动服务
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-8B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype bfloat16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens {{max_num_batched_tokens}} \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --async-scheduling \
            --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1,2,4,8,16,32]}' \
            --mm-processor-cache-gb 0
          ```
      - title: 服务验证
        content: |-
          使用验证章节中的图像对话请求。
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: Single-Node
    case: 8B 单卡
    tags: [310p-8b]
    strategy: single_node_310p
    steps:
      - title: 启动服务
        content: |-
          Atlas 300I DUO 仅支持 `float16`，并需关闭 `enable_npugraph_ex`。CANN 低于 9.0.0 时请改用 `--enforce-eager`。

          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-VL-8B-Instruct \
            --host 0.0.0.0 \
            --port {{port}} \
            --dtype float16 \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.7 \
            --enforce-eager \
            --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}' \
            --mm-processor-cache-gb 0
          ```

          教程 32B 行是 A2/A3 / Atlas 推理产品双卡，不是 300I DUO。在单张 300I DUO 上做双 die TP=2 曾观察到加载后挂起。
      - title: 服务验证
        content: |-
          使用验证章节中的图像对话请求。
  - npu: Ascend 950DT
    precision: W8A8
    deployment: Single-Node
    case: 8B W8A8 单卡
    tags: [a5-8b-w8a8]
    strategy: single_node_A5
    steps:
      - title: 启动服务
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve vllm-ascend/Qwen3-VL-8B-Instruct-W8A8 \
            --host 0.0.0.0 \
            --port {{port}} \
            --quantization ascend \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.8 \
            --enforce-eager \
            --mm-processor-cache-gb 0
          ```
      - title: 服务验证
        content: |-
          使用验证章节中的图像对话请求。
  - npu: Ascend 950DT
    precision: W8A8
    deployment: Single-Node
    case: 32B W8A8 单卡
    tags: [a5-32b-w8a8]
    strategy: single_node_A5
    steps:
      - title: 启动服务
        content: |-
          ```bash
          export HCCL_OP_EXPANSION_MODE="AIV"
          export ASCEND_RT_VISIBLE_DEVICES=0
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Eco-Tech/Qwen3-VL-32B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port {{port}} \
            --quantization ascend \
            --served-model-name qwen3vl \
            --no-enable-prefix-caching \
            --tensor-parallel-size 1 \
            --trust-remote-code \
            --max-num-seqs 4 \
            --max-model-len 4096 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.8 \
            --enforce-eager \
            --mm-processor-cache-gb 0
          ```
      - title: 服务验证
        content: |-
          使用验证章节中的图像对话请求。

verification: |-
  服务启动后执行：

  ```bash
  curl http://127.0.0.1:8000/v1/chat/completions \
    -H "Content-Type: application/json" \
    -d '{
      "model": "qwen3vl",
      "messages": [
        {"role": "system", "content": "You are a helpful assistant."},
        {"role": "user", "content": [
          {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
          {"type": "text", "text": "What is the text in the illustration?"}
        ]}
      ],
      "max_completion_tokens": 100,
      "temperature": 0
    }'
  ```

  期望：HTTP 200，助手回复包含 `TONGYI Qwen`。

evaluation:
  accuracy:
    content: |-
      A2 / A3 使用 lm_eval 跑 `mmmu_val`（教程在 vllm-ascend 0.11.0rc3 上的参考值约 0.5389）：

      ```bash
      lm_eval --model vllm-vlm \
        --model_args pretrained=Qwen/Qwen3-VL-8B-Instruct,max_model_len=8192,gpu_memory_utilization=0.7 \
        --tasks mmmu_val --batch_size 32 --apply_chat_template --trust_remote_code \
        --output_path ./results
      ```

      Atlas 300I DUO 使用 AISBench 跑 `text_vqa`（教程在 v0.23.0rc1 上的参考值约 80.57）：

      ```bash
      ais_bench --models vllm_api_general_chat --datasets textvqa_gen_base64 --mode all --debug
      ```

performance:
  benchmark: |-
    ```bash
    vllm bench serve \
      --backend openai-chat \
      --model Qwen/Qwen3-VL-8B-Instruct \
      --endpoint /v1/chat/completions \
      --dataset-name random \
      --num-prompts 100 \
      --request-rate 1 \
      --save-result \
      --result-dir ./
    ```

tuning: |-
  KV cache OOM 时降低 `--max-model-len`。300I DUO 上 8B 保持 TP=1。950PR 上 Triton `target_info` 警告不阻断 `--enforce-eager` W8A8 服务。ACLGraph 不可用时，用 `--enforce-eager` 替换 `--compilation-config` 与 `--async-scheduling`。

faq: |-
  环境与安装问题见 [Public FAQs](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。

