meta:
  title: "Qwen3-VL-Dense"
  slug: "qwen3-vl-dense"
  provider: "Qwen"
  description: "Qwen3-VL 稠密视觉语言模型（8B / 32B），用于图文理解。自 vLLM-Ascend 官方 tutorial 迁移，覆盖 Atlas 800 A2/A3、Atlas 300I DUO 与 Ascend 950DT W8A8 单机部署。"
  date_added: "2026-10-19"
  date_updated: "2026-10-19"
  difficulty: intermediate
  tasks:
    - multimodal
  performance_headline: "在 A2/A3、300I DUO 与 950DT W8A8 上的单机稠密 VL 服务"
  related_recipes:
    - "qwen3-vl-30b-a3b-instruct"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    atlas_300i_duo: verified
    ascend_950dt: verified

model:
  model_id: "Qwen/Qwen3-VL-8B-Instruct"
  min_vllm_version: "0.18.0"
  architecture: dense
  parameter_count: "8B"
  active_parameters: null
  context_length: 256000
  modality: multimodal
  base_args:
    - "--served-model-name"
    - "qwen3vl"
    - "--trust-remote-code"
    - "--no-enable-prefix-caching"
    - "--mm-processor-cache-gb"
    - "0"
  base_env:
    HCCL_OP_EXPANSION_MODE: "AIV"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    VLLM_USE_MODELSCOPE: "True"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0-310p"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=1g -v /root/.cache:/root/.cache --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -it quay.io/ascend/vllm-ascend:v0.23.0-a3 bash"
      note: "按硬件选择镜像标签（A2 / A3 / 310p / a5）。完整设备挂载见 env_setup.container。"

features:
  prefix_caching:
    label: "前缀缓存"
    description: "教程图像基线默认关闭。"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  compilation_config:
    label: "编译配置"
    description: "教程中的 FULL_DECODE_ONLY ACLGraph。旧 CANN 或图不可用时改用 --enforce-eager。"
    args:
      - "--compilation-config"
      - "{\"cudagraph_mode\": \"FULL_DECODE_ONLY\", \"cudagraph_capture_sizes\": [1,2,4,8,16,32]}"
  async_scheduling:
    label: "异步调度"
    description: "教程在 A2/A3/950DT 基线中的吞吐选项。"
    args: ["--async-scheduling"]

opt_in_features: [prefix_caching]

variants:
  default:
    precision: bf16
    vram_minimum_gb: 20
    description: "BF16 Qwen3-VL-8B-Instruct（A2/A3/300I DUO 单卡）"
  vl_8b_w8a8:
    model_id: "vllm-ascend/Qwen3-VL-8B-Instruct-W8A8"
    precision: W8A8
    vram_minimum_gb: 16
    description: "W8A8 Qwen3-VL-8B（950DT 单卡）。教程 Eco-Tech mxfp8 链接 404，改用该 ascend W8A8 权重。"
  vl_32b:
    model_id: "Qwen/Qwen3-VL-32B-Instruct"
    precision: bf16
    vram_minimum_gb: 64
    description: "BF16 Qwen3-VL-32B-Instruct（A2/A3 双卡）"
  vl_32b_w8a8:
    model_id: "Eco-Tech/Qwen3-VL-32B-Instruct-w8a8-QuaRot"
    precision: W8A8
    vram_minimum_gb: 48
    description: "W8A8 Qwen3-VL-32B（950DT 单卡）。教程 Eco-Tech mxfp8 链接 404，改用公开 QuaRot W8A8 权重。"

compatible_strategies:
  - single_node_A3
  - single_node_A2
  - single_node_310p
  - single_node_A5

hardware_overrides: {}
strategy_overrides: {}
dependencies: []
guide: ""

config_params:
  max_model_len:
    default: 32768
    type: number
    description: "最大上下文长度。显存紧张的冒烟可将此值降到例如 4096。"
  max_num_seqs:
    default: 128
    type: number
    description: "最大并发序列数。"
  max_num_batched_tokens:
    default: 16384
    type: number
    description: "每步最大批处理 token 数。"
  gpu_memory_utilization:
    default: 0.91
    type: number
    description: "引擎预留的 NPU HBM 比例。"
  port:
    default: 8000
    type: number
    description: "HTTP 监听端口。"

overview: |-
  Qwen3-VL Dense 是 Qwen3-VL 稠密视觉语言系列（8B / 32B Instruct）。本 recipe 将官方 vLLM-Ascend tutorial 迁移为中英文配置：A2/A3 与 Atlas 300I DUO 上的 BF16 单卡 8B、A2/A3 上的 BF16 双卡 32B，以及 950DT 上的 W8A8 单卡 8B/32B。Atlas 推理产品需要 vLLM-Ascend 0.18.0+；950DT 需要 v0.23.0rc1+。

