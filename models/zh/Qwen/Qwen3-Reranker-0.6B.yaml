scenarios:
  - npu: Atlas 800I A2
    precision: bf16
    deployment: 单节点
    case: 单节点单卡
    tags: [a2-single]
    strategy: single_node_A2
    steps:
      - title: 启动服务
        content: |-
          单卡 pooling 部署，适合开发、测试与中小规模重排序场景。

          以下命令为示例配置，请根据实际场景调整参数。

          ```bash
          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - `--max-model-len` 表示上下文长度，即单条请求输入与输出的最大 token 数。若自动解析得到较大的上下文长度，分配该掩码（O(max_model_len^2)）可能超出 NPU 显存并触发 OOM。请务必显式设置保守值，例如 1024。
          > - 如已提前下载权重，请将 `Qwen/Qwen3-Reranker-0.6B` 替换为本地权重目录。
      - title: 服务验证
        content: |-
          服务启动后，发送一条重排序请求进行验证。用法示例参见下方"服务验证"部分。
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: 单节点
    case: 300I DUO (TP1)
    tags: [310p-single]
    strategy: single_node_310p
    steps:
      - title: 启动服务
        content: |-
          Atlas 300I DUO 单节点 pooling 部署（TP=1）。

          ```bash
          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
              --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
              --dtype float16 \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - `--compilation-config`：Atlas 300I DUO 受硬件流数量限制，需要限制 `cudagraph_capture_sizes` 的规模。
          > - `--dtype float16`：与 Atlas 300I DUO 推理执行路径一致。
          > - `--max-model-len`：若自动解析得到较大的上下文长度，分配该掩码（O(max_model_len^2)）可能超出 NPU 显存并触发 OOM。请务必显式设置保守值，例如 1024。
      - title: 服务验证
        content: |-
          服务启动后，发送一条重排序请求进行验证。用法示例参见下方"服务验证"部分。
verification: |-
  服务启动后，可通过以下命令进行验证：

  ```python
  import requests

  url = "http://127.0.0.1:<port>/v1/rerank"

  # 请使用 query_template 和 document_template 格式化查询与文档，以获得更好的重排序效果。

  prefix = '<|im_start|>system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be "yes" or "no".<|im_end|>\n<|im_start|>user\n'
  suffix = "<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n"

  query_template = "{prefix}<Instruct>: {instruction}\n<Query>: {query}\n"
  document_template = "<Document>: {doc}{suffix}"

  instruction = (
      "Given a web search query, retrieve relevant passages that answer the query"
  )

  query = "What is the capital of China?"

  documents = [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
  ]

  documents = [
      document_template.format(doc=doc, suffix=suffix) for doc in documents
  ]

  response = requests.post(url,
                           json={
                               "query": query_template.format(prefix=prefix, instruction=instruction, query=query),
                               "documents": documents,
                           }).json()

  print(response)
  ```

  预期结果：服务返回 HTTP 200 OK，JSON 响应包含 `relevance_score` 字段，北京文档的相关性分数应显著高于重力文档。示例输出：

  ```json
  {
      "id": "score-xxx",
      "model": "Qwen/Qwen3-Reranker-0.6B",
      "usage": {
          "prompt_tokens": 193,
          "total_tokens": 193
      },
      "results": [
          {
              "index": 0,
              "document": {
                  "text": "<Document>: The capital of China is Beijing.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n",
                  "multi_modal": null
              },
              "relevance_score": 0.9994981288909912
          },
          {
              "index": 1,
              "document": {
                  "text": "<Document>: Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n",
                  "multi_modal": null
              },
              "relevance_score": 0.00000506485957885161
          }
      ]
  }
  ```

  更多用法示例请参考[打分示例](https://github.com/vllm-project/vllm/tree/main/examples/pooling/score)。
evaluation:
  accuracy:
    content: |-
      ### 使用 MTEB

      详见 [MTEB](https://docs.mteb.org/)。

      运行以下代码执行精度评测：

      ```python
      import os
      import mteb

      from mteb.models.vllm_wrapper import VllmEncoderWrapper

      if __name__ == "__main__":
          data_path = "/home/data/mteb_data"
          os.environ["HF_DATASETS_CACHE"] = data_path
          os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

          model = VllmEncoderWrapper("/root/.cache/Qwen3-Reranker-0.6B",
                                      revision="norm",
                                      dtype="float16",
                                      max_model_len=10240,
                                      hf_overrides={"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": True})

          cache = mteb.ResultCache(data_path)
          tasks = mteb.get_tasks(tasks=["LeCaRDv2"])
          results = mteb.evaluate(model, tasks=tasks, cache=cache, encode_kwargs={"batch_size": 2}, overwrite_strategy="always")
          df = results.to_dataframe()
          print(df)
      ```

      执行完成后即可得到评测结果。
  performance:
    content: |-
      ### 使用 vLLM Benchmark

      以 `Qwen3-Reranker-0.6B` 的性能评测为例，详见 [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/cli/)。

      以 `serve` 子命令为例，运行以下命令：

      ```bash
      vllm bench serve \
          --model Qwen/Qwen3-Reranker-0.6B \
          --backend vllm-rerank \
          --port 8000 \
          --dataset-name random-rerank \
          --endpoint /v1/rerank \
          --random-input 200 \
          --save-result \
          --result-dir ./
      ```

      等待数分钟即可获得性能评测结果。
performance:
  accuracy: |-
    官方教程未发布该模型的固定精度数据。请使用"更多信息"页签中的 MTEB 评测在自己的部署环境实测检索精度。
  benchmark: |-
    官方未发布该模型的固定吞吐/延迟数据；实际结果取决于硬件资源、输入长度、并发数与运行时配置。

    请使用"更多信息"页签中可复现的 `vllm bench serve --backend vllm-rerank` 命令，在自己的部署环境实测重排序吞吐与延迟。
