meta:
  title: 'Qwen3-Reranker-0.6B'
  slug: 'qwen3-reranker-0.6b'
  provider: 'Qwen'
  description: 'Qwen3 Reranker 系列最小成员，面向查询-文档相关性打分的 0.6B 稠密模型，支持昇腾 NPU 单卡高效部署。'
  date_added: 2026-10-14
  difficulty: beginner
  performance_headline: 'Atlas 800I A2 / Atlas 300I DUO 单节点单卡 pooling 部署'
  hardware:
    atlas_800_a2: verified

model:
  model_id: 'Qwen/Qwen3-Reranker-0.6B'
  min_vllm_version: '0.9.2rc1'
  architecture: dense
  parameter_count: '0.6B'
  active_parameters: null
  context_length: 32768
  modality: reranker
  base_args:
    - '--runner'
    - 'pooling'
    - '--hf_overrides'
    - '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}'
  docker_image:
    atlas_800_a2: 'quay.io/ascend/vllm-ascend:v0.30.0rc2'
    atlas_800_a3: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-a3'
    ascend_950dt: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-a5'
    atlas_300i_duo: 'quay.io/ascend/vllm-ascend:v0.30.0rc2-310p'
  nightly_required: false
  install:
    # Ascend 推荐使用 Docker；pip 需要源码编译（无官方 wheel），因此隐藏 pip 页签。
    pip: false
    docker:
      command: 'docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.30.0rc2 bash'
      note: '官方昇腾镜像；完整设备/驱动挂载见环境准备中的容器配置。'

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_A5
  - single_node_310p

# —— 可配置参数（默认值 = 教程基线） ——
config_params:
  max_model_len:
    default: 1024
    type: number
    description: '最大上下文长度（输入 + 输出 token 数）。请显式设置保守值，否则注意力掩码（O(max_model_len^2)）可能超出 NPU 显存。'

overview: |-
  Qwen3 Reranker 系列是 Qwen 家族最新的专有模型，专为文本嵌入与排序任务设计。该系列基于 Qwen3 稠密基座模型构建，提供多种规格（0.6B、4B、8B）的文本嵌入与重排序模型。Qwen3-Reranker-0.6B 是该系列最小规格，为每个查询-文档对输出相关性分数。

  仅 vLLM Ascend 0.9.2rc1 及以上版本支持该模型。
