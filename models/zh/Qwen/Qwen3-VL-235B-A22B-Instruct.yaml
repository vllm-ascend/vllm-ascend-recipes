meta:
  title: "Qwen3-VL-235B-A22B-Instruct"
  slug: "qwen3-vl-235b-a22b-instruct"
  provider: "Qwen"
  description: "Qwen3-VL 旗舰 MoE 视觉语言模型，总参数量 235B、激活参数 22B，可在 Atlas 800 A3、Atlas 800 A2 多节点 MP 和 Ascend 950DT 上以 W8A8 权重提供图像与文本服务。"
  date_added: 2026-11-10
  difficulty: advanced
  tasks: [multimodal, text]
  performance_headline: "单 Atlas 800 A3 节点（DP4 + TP4 + EP）、单 Ascend 950DT 节点（TP8），或两个 Atlas 800 A2 节点的多节点 MP 上运行 W8A8"
  related_recipes:
    - "Qwen/Qwen3-VL-30B-A3B-Instruct"
  hardware:
    atlas_800_a3: experimental
    atlas_800_a2: experimental
    ascend_950dt: experimental

model:
  model_id: "Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot"
  min_vllm_version: "0.12.0"
  architecture: moe
  parameter_count: "235B"
  active_parameters: "22B"
  context_length: 262144
  modality: multimodal
  base_args:
    - "--quantization"
    - "ascend"
    - "--served-model-name"
    - "qwen3-vl-235b"
    - "--seed"
    - "1024"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
  nightly_required: false
  # 该模型在 vLLM-Ascend v0.30.0 中已停止维护。本 recipe 中的所有命令来自
  # v0.23.0 教程标签；main 分支上的教程仅为 329 字节的废弃声明。在 recipe
  # 下线前请继续使用 v0.23.0 镜像标签。
  install:
    pip: false

features:
  expert_parallel:
    label: "专家并行"
    description: "在 NPU rank 间分布 MoE 专家；教程所有基线均启用。"
    args: ["--enable-expert-parallel"]
  flashcomm1:
    label: "FlashComm1"
    description: "Ascend 通信优化，教程基线在大 TP 与高并发场景启用。"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  fused_mc2:
    label: "Fused MC2"
    description: "Atlas 800 A3 单节点基线使用的 MoE 融合算子。"
    env:
      VLLM_ASCEND_ENABLE_FUSED_MC2: "1"
  prefix_caching:
    label: "前缀缓存"
    description: "教程所有基线均关闭；仅在重复前缀工作负载中开启。"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  compilation_config:
    label: "编译配置"
    description: "教程基线使用的全量 Decode ACLGraph 重放。"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']

opt_in_features: [prefix_caching]

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 282
    description: "用于单节点 Atlas 800 A3 与双节点 MP 场景的 W8A8 QuaRot 权重。"
  bf16:
    model_id: "Qwen/Qwen3-VL-235B-A22B-Instruct"
    precision: BF16
    vram_minimum_gb: 564
    description: "原始 BF16 权重；教程给出 1 个 Atlas 800 A3 节点或 2 个 Atlas 800 A2 节点的资源要求，但未提供 BF16 启动命令。"
  mxfp8:
    model_id: "Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8"
    precision: W8A8
    vram_minimum_gb: 282
    description: "用于单 Ascend 950DT 节点、张量并行 8 的 W8A8 MXFP8 权重。"
    supported_hardware: [ascend_950dt]

compatible_strategies: [single_node_A3, single_node_A5, multi_node_dp]
hardware_overrides: {}
strategy_overrides: {}
guide: ""

config_params:
  max_model_len:
    default: 32768
    type: number
    description: "单条请求输入与输出的最大 token 数。"
  max_num_seqs:
    default: 32
    type: number
    description: "每个 DP 组调度的最大活跃请求数。"
  max_num_batched_tokens:
    default: 16384
    type: number
    description: "单个调度步骤处理的最大 token 数。"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "模型执行与 KV 缓存可使用的 NPU 显存比例。"

overview: |-
  Qwen3-VL-235B-A22B-Instruct 是 Qwen3-VL 系列的稀疏 MoE 视觉语言模型，总参数量 235B，每 token 激活 22B 参数。它支持多模态对话、图像理解、多图推理、类 OCR 的视觉问答以及长上下文生成，262K 上下文可用于长文档和视频场景。

  **已废弃。** vLLM-Ascend 在 v0.30.0 中停止了该模型的教程维护。下文的部署命令复现自 v0.23.0 教程，仅面向该历史版本（v0.23.0 镜像）；`main` 分支上的教程已只剩废弃声明。请把本 recipe 视为复现 v0.23.0 验证结果的参考，而不是当前版本支持的配置。

  教程验证过的部署方式包括：1 个 Atlas 800 A3 节点（16 张 64G NPU）使用 W8A8 权重、DP4 + TP4 + 专家并行；1 个 Ascend 950DT 节点（8 张 96G NPU）使用 W8A8 MXFP8 权重、TP8 + 专家并行；以及节点间数据并行、节点内张量并行的双节点多机部署。BF16 权重需要 1 个 Atlas 800 A3 节点或 2 个 Atlas 800 A2 节点，但教程只给出了量化权重的启动命令。

weight_download:
  - weight_version: BF16
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Qwen/Qwen3-VL-235B-A22B-Instruct
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3-VL-235B-A22B-Instruct
          ```
  - weight_version: W8A8 QuaRot
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
          ```
  - weight_version: W8A8 MXFP8（Ascend 950DT）
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8
          ```

prerequisites:
  - title: 模型权重
    content: |-
      BF16 权重需要 1 个 Atlas 800 A3（64G x 16）节点或 2 个 Atlas 800 A2（64G x 8）节点。单节点与 MP 验证使用的 W8A8 QuaRot 权重需要 1 个 Atlas 800 A3（64G x 16）节点。W8A8 MXFP8 权重需要 1 个 Ascend 950DT（96G x 8）节点。多节点部署时，请把权重下载到各节点共享的目录。
  - title: 多节点通信
    content: |-
      仅双节点 MP 场景需要。请先按照 vLLM-Ascend 安装指南中的多节点通信验证步骤检查通信环境。各节点的网卡名称、IP 地址、DP rank 和 DP RPC 端口必须保持一致。

env_setup:
  container:
    A3:
      content: |-
        部署 Atlas 800 A3 时在每个节点启动该镜像。教程中的版本占位符替换为 v0.23.0 A3 镜像。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
        docker run --rm \
            --name vllm-ascend \
            --shm-size=512g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci8 \
            --device /dev/davinci9 \
            --device /dev/davinci10 \
            --device /dev/davinci11 \
            --device /dev/davinci12 \
            --device /dev/davinci13 \
            --device /dev/davinci14 \
            --device /dev/davinci15 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
    A2:
      content: |-
        部署两个 Atlas 800 A2 节点时在每个节点启动该镜像。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0
        docker run --rm \
            --name vllm-ascend \
            --shm-size=512g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
    Ascend 950DT:
      content: |-
        部署 Ascend 950DT 时在每个节点启动该镜像。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a5
        export NAME=vllm-ascend

        docker run --rm \
          --name $NAME \
          --net=host \
          --shm-size=1g \
          --device /dev/davinci0 \
          --device /dev/davinci1 \
          --device /dev/davinci2 \
          --device /dev/davinci3 \
          --device /dev/davinci4 \
          --device /dev/davinci5 \
          --device /dev/davinci6 \
          --device /dev/davinci7 \
          --device /dev/davinci_manager \
          --device /dev/hisi_hdc \
          --device /dev/ummu \
          --device /dev/uburma \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /etc/hccl_rootinfo.json:/etc/hccl_rootinfo.json \
          -v /etc/hixlep/:/etc/hixlep/ \
          -v /root/.cache:/root/.cache \
          -v /usr/local/sbin:/usr/local/sbin \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi \
          -v /usr/lib64:/usr/lib64 \
          -itd $IMAGE bash
        ```

scenarios:
  - npu: Ascend 950DT
    precision: W8A8
    deployment: 单节点
    case: 图像在线服务（950DT）
    tags: [a5-single]
    strategy: single_node_A5
    steps:
      - title: 启动服务
        content: |-
          该场景在 1 个 Ascend 950DT 节点（8 张 96G NPU）上运行 W8A8 MXFP8 权重，使用张量并行 8、专家并行，并限制为仅接受图像输入。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export HCCL_OP_EXPANSION_MODE="AIV"
          export HCCL_BUFFSIZE=400
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=100
          export TASK_QUEUE_ENABLE=1
          export VLLM_ASCEND_ENABLE_FLASHCOMM1=1

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-mxfp8 \
            --host 0.0.0.0 \
            --port 8000 \
            --distributed-executor-backend mp \
            --data-parallel-size 1 \
            --tensor-parallel-size 8 \
            --enable-expert-parallel \
            --seed 1024 \
            --quantization ascend \
            --served-model-name qwen3-vl-235b \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens 8192 \
            --trust-remote-code \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
          ```
      - title: 推理验证
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                  "model": "qwen3-vl-235b",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Who are you?"
                      }
                  ],
                  "max_tokens": 256,
                  "temperature": 0
              }'
          ```

          服务返回 HTTP 200 OK，并在 JSON 响应中包含 `choices` 字段。
      - title: 图像理解验证
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3-vl-235b",
              "messages": [
                {"role": "system", "content": "You are a helpful assistant."},
                {"role": "user", "content": [
                  {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
                  {"type": "text", "text": "What is the text in the illustration?"}
                ]}
              ],
              "max_completion_tokens": 100,
              "temperature": 0
            }'
          ```

          HTTP 状态码为 200，JSON 响应包含带生成文本的 `choices` 字段，例如与 `TONGYI Qwen` 类似的文本。
  - npu: Atlas 800 A3
    precision: W8A8
    deployment: 单节点
    case: 图像在线服务（A3）
    tags: [a3-single]
    strategy: single_node_A3
    steps:
      - title: 启动服务
        content: |-
          该场景在 1 个 Atlas 800 A3 节点（16 张 64G NPU）上运行 W8A8 QuaRot 权重。数据并行 4 与张量并行 4 把 16 张 NPU 划分为 4 个 DP 组、每组 TP4，并在 MoE 层启用专家并行。请勿在同一 MoE 层中混用 MoE 张量并行与专家并行。教程说明该 W8A8 示例适用于功能验证和仅图像在线服务。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export HCCL_OP_EXPANSION_MODE="AIV"
          export HCCL_BUFFSIZE=1536
          export OMP_NUM_THREADS=1
          export OMP_PROC_BIND=false
          export TASK_QUEUE_ENABLE=1
          export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
          export VLLM_ASCEND_ENABLE_FUSED_MC2=1
          export VLLM_ASCEND_BALANCE_SCHEDULING=1

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port 8000 \
            --served-model-name qwen3-vl-235b \
            --quantization ascend \
            --data-parallel-size 4 \
            --tensor-parallel-size 4 \
            --enable-expert-parallel \
            --seed 1024 \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --max-num-batched-tokens {{max_num_batched_tokens}} \
            --trust-remote-code \
            --gpu-memory-utilization 0.92 \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,2,4,8,16,24,32]}'
          ```
      - title: 推理验证
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                  "model": "qwen3-vl-235b",
                  "messages": [
                      {
                          "role": "user",
                          "content": "Who are you?"
                      }
                  ],
                  "max_tokens": 256,
                  "temperature": 0
              }'
          ```

          服务返回 HTTP 200 OK，并在 JSON 响应中包含 `choices` 字段。
      - title: 图像理解验证
        content: |-
          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3-vl-235b",
              "messages": [
                {"role": "system", "content": "You are a helpful assistant."},
                {"role": "user", "content": [
                  {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
                  {"type": "text", "text": "What is the text in the illustration?"}
                ]}
              ],
              "max_completion_tokens": 100,
              "temperature": 0
            }'
          ```

          HTTP 状态码为 200，JSON 响应包含带生成文本的 `choices` 字段。
  - npu: Atlas 800 A2
    precision: W8A8
    deployment: 多节点
    case: 双节点 MP（DP2 TP8）
    tags: [a2-multi]
    strategy: multi_node_dp
    steps:
      - title: 收集网络参数
        content: |-
          教程假设有 2 个 Atlas 800 A2（64G x 8）节点，把 W8A8 QuaRot 权重跨节点以数据并行、节点内以张量并行部署。请通过 `ifconfig` 获取网卡名称和 IP 地址，并在两个节点的脚本中替换：`nic_name` 是承载 `local_ip` 的网卡名，`node0_ip` 必须与节点 0 的 `local_ip` 一致。教程把这些值保留为占位符，因此本 recipe 不固定任何地址。
      - title: 启动节点 0
        content: |-
          ```bash
          #!/bin/sh

          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          # Get these values through ifconfig.
          # nic_name is the network interface name corresponding to local_ip.
          nic_name="<nic_name>"
          local_ip="<local_ip>"

          export HCCL_IF_IP=$local_ip
          export GLOO_SOCKET_IFNAME=$nic_name
          export TP_SOCKET_IFNAME=$nic_name
          export HCCL_SOCKET_IFNAME=$nic_name
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export HCCL_BUFFSIZE=1024
          export TASK_QUEUE_ENABLE=1
          export HCCL_OP_EXPANSION_MODE="AIV"

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port 8000 \
            --quantization ascend \
            --data-parallel-size 2 \
            --api-server-count 2 \
            --data-parallel-size-local 1 \
            --data-parallel-address $local_ip \
            --data-parallel-rpc-port 13389 \
            --seed 1024 \
            --served-model-name qwen3-vl-235b \
            --tensor-parallel-size 8 \
            --enable-expert-parallel \
            --max-num-seqs 16 \
            --max-model-len 262144 \
            --max-num-batched-tokens 4096 \
            --trust-remote-code \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
          ```
      - title: 启动节点 1
        content: |-
          ```bash
          #!/bin/sh

          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          # Get these values through ifconfig.
          # nic_name is the network interface name corresponding to local_ip.
          nic_name="<nic_name>"
          local_ip="<local_ip>"

          # The value of node0_ip must be consistent with local_ip on node 0.
          node0_ip="<node0_ip>"

          export HCCL_IF_IP=$local_ip
          export GLOO_SOCKET_IFNAME=$nic_name
          export TP_SOCKET_IFNAME=$nic_name
          export HCCL_SOCKET_IFNAME=$nic_name
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export HCCL_BUFFSIZE=1024
          export TASK_QUEUE_ENABLE=1
          export HCCL_OP_EXPANSION_MODE="AIV"

          vllm serve Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
            --host 0.0.0.0 \
            --port 8000 \
            --quantization ascend \
            --headless \
            --data-parallel-size 2 \
            --data-parallel-size-local 1 \
            --data-parallel-start-rank 1 \
            --data-parallel-address $node0_ip \
            --data-parallel-rpc-port 13389 \
            --seed 1024 \
            --tensor-parallel-size 8 \
            --served-model-name qwen3-vl-235b \
            --max-num-seqs 16 \
            --max-model-len 262144 \
            --max-num-batched-tokens 4096 \
            --enable-expert-parallel \
            --trust-remote-code \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --no-enable-prefix-caching \
            --mm-processor-cache-gb 0 \
            --limit-mm-per-prompt.image 1 \
            --limit-mm-per-prompt.video 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --additional-config '{"enable_cpu_binding":true,"enable_flashcomm1":true}'
          ```
      - title: 服务验证
        content: |-
          服务启动成功后，节点 0 会打印两条 `Application startup complete.`，因为 `--api-server-count 2` 启动了两个 API server 进程。请向节点 0 发送请求：

          ```bash
          curl http://<server_ip>:<port>/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3-vl-235b",
              "messages": [
                {"role": "system", "content": "You are a helpful assistant."},
                {"role": "user", "content": [
                  {"type": "image_url", "image_url": {"url": "https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png"}},
                  {"type": "text", "text": "What is the text in the illustration?"}
                ]}
              ],
              "max_completion_tokens": 100,
              "temperature": 0
            }'
          ```

          HTTP 状态码为 200，JSON 响应包含带生成文本的 `choices` 字段。若节点 1 无法加入服务或 HCCL 初始化超时，请检查多节点通信环境，并确认两个节点的网卡名称、IP 地址和 DP RPC 端口一致。

verification: |-
  本 recipe 在迁移过程中未重新运行：命令复现自 v0.23.0 教程，该版本是最后记录该模型的教程（vLLM-Ascend 在 v0.30.0 中停止维护，`main` 分支只保留废弃声明）。教程给出的预期结果是：服务返回 HTTP 200 且 JSON 响应包含 `choices`；使用 `https://modelscope.oss-cn-beijing.aliyuncs.com/resource/qwen.png` 的图像请求返回类似 `TONGYI Qwen` 的文本；双节点 MP 服务在节点 0 打印 `Application startup complete.`。使用时请把 `<server_ip>` 与 `<port>` 替换为运行 API server 的节点地址，并先替换 MP 场景中的 `nic_name`、`local_ip` 和 `node0_ip` 占位符。

performance:
  accuracy: |-
    教程给出的 AISBench `vllm-api-general-chat` 生成模式结果为：textvqa-lite 准确率 83，aime2024 准确率 93。评测流程参见 [使用 AISBench](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html)。
  benchmark: |-
    教程没有发布服务时延或吞吐数字，因此本 recipe 不给出性能数值。教程只说明如何测量，使用随机文本提示运行 `vllm bench serve`：

    ```bash
    export VLLM_USE_MODELSCOPE=True

    vllm bench serve \
      --model Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot \
      --served-model-name qwen3-vl-235b \
      --dataset-name random \
      --random-input 200 \
      --num-prompts 200 \
      --request-rate 1 \
      --save-result \
      --result-dir ./
    ```

    多模态性能请使用 AISBench 或自定义图像数据集，而不是随机文本提示，因为随机提示只覆盖文本路径。

tuning: |-
  从上文场景出发，按教程推荐的顺序调优：

  1. 先确定部署拓扑。功能验证用单节点部署，简单的多节点服务用 MP 部署，prefill 与 decode 需要不同资源配比时使用 PD 分离。教程还记录了两个 Atlas 800 A3 节点的 Mooncake 1P1D 拓扑（prefill DP2 + TP8，decode DP4 + TP4），本 recipe 未复现该场景。
  2. 按业务选择 `--max-model-len`。多模态请求的 KV 缓存同时包含文本 token 和视觉 token；显存不足时请降低图像分辨率、图像数量、`--max-num-seqs` 或上下文长度。
  3. 调整多模态限制：`--limit-mm-per-prompt.image` 与 `--limit-mm-per-prompt.video`；教程所有基线都关闭视频并限制每条请求 1 张图像。
  4. 调整 `--max-num-batched-tokens`。更大的值通常提升 prefill 吞吐，但会增加激活显存；decode 为主的工作负载通常需要更小的值。
  5. 按目标并发调整 `--max-num-seqs`。压测时请保证 `--max-num-seqs` 乘以 `--data-parallel-size` 不小于测试并发，因为排队时间会计入 TTFT 与 TPOT。
  6. 调整 `--gpu-memory-utilization`。更高的值提供更多 KV 缓存，但为运行时波动、图像预处理和专家不均衡留出的余量更少。
  7. 调整 ACLGraph 捕获。decode 推荐 `FULL_DECODE_ONLY`；手动设置 `cudagraph_capture_sizes` 时请包含常见 decode batch size。

  教程给出的模型专属选项：`--mm-processor-cache-gb 0` 在显存受限的验证场景关闭多模态处理器缓存；`VLLM_ASCEND_ENABLE_FLASHCOMM1=1` 或 `--additional-config '{"enable_flashcomm1":true}'` 在大 TP、高并发场景降低通信开销，但低并发可能没有收益；`VLLM_ASCEND_ENABLE_FUSED_MC2=1` 启用 MoE 融合算子，若精度或性能回退请与关闭状态对比；`--async-scheduling` 可提升高并发吞吐，但对时延敏感业务应与关闭状态对比。教程所有基线都关闭前缀缓存，因为其提示词与图像不具备共享前缀；PD 部署请始终先关闭前缀缓存。

