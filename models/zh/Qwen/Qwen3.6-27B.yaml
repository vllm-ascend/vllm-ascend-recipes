meta:
  title: "Qwen3.6-27B"
  slug: "qwen3.6-27b"
  provider: "Qwen"
  description: "Qwen3.6-27B 是 Qwen3.6 系列的稠密混合 Mamba-Transformer 多模态模型（门控 delta 网络 + 全注意力，27B 参数，262144 token 上下文，带 MTP 头）。本配方覆盖其在 Atlas 800 A2/A3、Ascend 950DT 与 Atlas 300I DUO 上的 W8A8、W8A8 MXFP8、W8A8C8 MXFP8 与 BF16 部署。"
  date_added: 2026-07-27
  tasks:
    - text
    - multimodal
  performance_headline: "Atlas 800 A3/A2 上以 DP 优先的 W8A8（TP=2）；Ascend 950DT 上 TP=1 + DP=8；Atlas 300I DUO 上 FP16 TP"
  date_updated: 2026-11-18
  difficulty: advanced
  related_recipes:
    - "Qwen/Qwen3.5-27B"
  hardware:
    atlas_800_a2: verified
    atlas_800_a3: experimental
    ascend_950dt: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Qwen/Qwen3.6-27B"
  min_vllm_version: "0.30.0"
  architecture: dense
  parameter_count: "27B"
  active_parameters: null
  context_length: 262144
  modality: multimodal
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.30.0"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.30.0-a3"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.30.0-a5"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.30.0-310p"
  nightly_required: false
  install:
    # 昇腾侧 PyPI 没有 vllm-ascend 轮子，固定镜像就是唯一受支持的安装路径，因此隐藏 pip 页签。
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=1g --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info -v /etc/ascend_install.info:/etc/ascend_install.info -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.30.0 bash"
      note: "固定版本的昇腾镜像；各 SKU 完整的设备与驱动挂载见 env_setup。"

# —— 与上游对齐的扩展字段（features / variants / strategies） ——
features:
  spec_decoding:
    label: "MTP 投机解码"
    description: "MTP 投机解码（qwen3_5_mtp，3 个 token）—— Qwen3.5-27B 与 Qwen3.6-27B 共用同一套 MTP 头"
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3}']
  compilation_config:
    label: "编译配置"
    description: "decode 阶段全量 ACL Graph 执行（--compilation-config cudagraph_mode=FULL_DECODE_ONLY）"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "异步调度"
    description: "异步调度，让 CPU 调度与 NPU 计算重叠"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "前缀缓存"
    description: "KV cache 前缀缓存（--enable-prefix-caching / --no-enable-prefix-caching）"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  cpu_binding:
    label: "CPU 绑核"
    description: "把昇腾 worker 线程与 NPU 中断绑定到离所驱动 NPU 最近的 CPU 范围"
    args: ["--additional-config", '{"enable_cpu_binding":true}']

opt_in_features:
  - prefix_caching

variants:
  default:
    model_id: "Eco-Tech/Qwen3.6-27B-w8a8"
    precision: W8A8
    label: "W8A8"
    vram_minimum_gb: 33
    description: "ModelSlim W8A8 权重；Atlas 800 A2/A3 上的推荐默认项"
  bf16:
    model_id: "Qwen/Qwen3.6-27B"
    precision: bf16
    label: "BF16"
    vram_minimum_gb: 65
    description: "全精度 BF16 权重（约 55.6 GB）—— 在 64 GB 单 die 上需要 TP=2"
    supported_hardware: [atlas_800_a2, atlas_800_a3, ascend_950dt]
  a5_mxfp8:
    model_id: "Eco-Tech/Qwen3.6-27B-w8a8-mxfp8"
    precision: MXFP8
    label: "W8A8 MXFP8 (A5)"
    vram_minimum_gb: 33
    description: "不带 FP8 KV cache 的 W8A8 MXFP8 权重 —— Ascend 950DT 上的短序列场景"
    supported_hardware: [ascend_950dt]
  a5_c8_mxfp8:
    model_id: "Eco-Tech/Qwen3.6-27B-w8a8c8-mxfp8"
    precision: MXFP8
    label: "W8A8C8 MXFP8 (A5, FP8 KV)"
    vram_minimum_gb: 33
    description: "带 FP8 KV cache 的 W8A8C8 MXFP8 权重（--kv-cache-dtype mxfp8）—— Ascend 950DT 上的长序列场景"
    supported_hardware: [ascend_950dt]
  p310:
    model_id: "Eco-Tech/Qwen3.6-27B-W8A8-310P"
    precision: W8A8
    label: "W8A8 (300I DUO)"
    vram_minimum_gb: 33
    description: "面向 Atlas 300I DUO 的 310P 专用 W8A8 权重；该平台只支持 TP，且必须 FP16 运行"
    supported_hardware: [atlas_300i_duo]

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_310p
  - single_node_A5

hardware_overrides: {}

strategy_overrides: {}

dependencies: []

guide: ""

# —— 可调参数（页面/CI 扩展字段；默认值即教程基线） ——
config_params:
  max_model_len:
    default: 133120
    type: number
    description: "最大上下文长度（输入 + 输出 token）；模型上限为 262144"
  max_num_seqs:
    default: 32
    type: number
    description: "每个 DP 组允许的最大并发序列数"
  gpu_memory_utilization:
    default: 0.85
    type: number
    description: "NPU HBM 中用于 KV cache 的比例"

overview: |-
  Qwen3.6-27B 是 Qwen3.6 系列的旗舰稠密模型，与 Qwen3.5-27B 共用混合注意力设计：每四个 block 中有三层门控 delta 网络加一层全注意力。它支持文本与图像/视频输入，原生 262144 token 上下文，并带 `qwen3_5_mtp` 投机解码所用的 MTP 头。

  权重分两类。Atlas 800 A2/A3 上默认使用 ModelSlim W8A8 权重，部署原则是 **DP 优先**（单 die 约 30 GB 权重，TP=2，其余给 DP）。Ascend 950DT 上，长序列选带 FP8 KV cache 的 W8A8C8 MXFP8 权重，TP=1 + DP=8；不带 FP8 KV cache 的 W8A8 MXFP8 权重则覆盖较短序列。
