          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 8 \
          --tensor-parallel-size 2 \
          --quantization ascend \
          --served-model-name qwen3.6 \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens 16384 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --dtype bfloat16 \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          {{cpu_binding}} \
          {{async_scheduling}}
      ```
  - title: 服务验证
    content: |-
      见下方 `verification` 段落。

# ===== Atlas 800 A3，BF16，TP=2 =====
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: Multi Card
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      **状态：experimental。** 教程的权重表覆盖了 Atlas 800 A3/A2 上的 BF16，但只给出了 W8A8 的完整命令，因此这里的 BF16 布局由 W8A8 推导：去掉 `--quantization ascend` 并换成 BF16 权重。没有独立的 BF16 测量数据。

      ```bash
      #!/bin/sh
      export MODEL_PATH=Qwen/Qwen3.6-27B
      export VLLM_USE_MODELSCOPE=True
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 2 \
          --served-model-name qwen3.6 \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens 16384 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --dtype bfloat16 \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          {{cpu_binding}} \
          {{async_scheduling}}
      ```
  - title: 服务验证
    content: |-
      见下方 `verification` 段落。

# ===== Atlas 800 A3，W8A8，长上下文 TP=8 + DP=2 =====
- npu: Atlas 800I A3
  precision: W8A8
  deployment: Single-Node
  case: Long Context (256K+)
  tags: [a3-single, long-context]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      **状态：experimental。** 256K+ 上下文场景要把 KV cache 切分到 8 张 die（TP=8），同时保留 2 个 DP 组，并把 `--max-model-len` 提到模型上限 262144。

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.6-27B-w8a8
      export VLLM_USE_MODELSCOPE=True
      export HCCL_BUFFSIZE=512
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 2 \
          --tensor-parallel-size 8 \
          --quantization ascend \
          --served-model-name qwen3.6 \
          --max-num-seqs 8 \
          --max-model-len 262144 \
          --max-num-batched-tokens 8192 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --dtype bfloat16 \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization 0.90 \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          {{cpu_binding}} \
          {{async_scheduling}}
      ```
  - title: 服务验证
    content: |-
      见下方 `verification` 段落。

# ===== Ascend 950DT，W8A8C8 MXFP8（FP8 KV cache），TP=1 + DP=8 =====
- npu: Ascend 950DT
  precision: MXFP8 / BF16
  deployment: Single-Node
  case: Multi Card
  tags: [a5-single]
  strategy: single_node_A5
  steps:
  - title: 启动服务（W8A8C8 MXFP8，FP8 KV cache）
    content: |-
      **状态：experimental —— 无 950DT 硬件可测。** 这是教程的长序列路径：`--kv-cache-dtype mxfp8` 让全注意力层 KV 以 FP8 存放。短序列请改用 `Eco-Tech/Qwen3.6-27B-w8a8-mxfp8` 并去掉 `--kv-cache-dtype mxfp8`。该平台同样支持 BF16（把 `MODEL_PATH` 设为 `Qwen/Qwen3.6-27B` 并去掉 `--quantization ascend`）。

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.6-27B-w8a8c8-mxfp8
      export VLLM_USE_MODELSCOPE=True
      export HCCL_BUFFSIZE=1024
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --data-parallel-size 8 \
          --tensor-parallel-size 1 \
          --quantization ascend \
          --kv-cache-dtype mxfp8 \
          --served-model-name qwen3.6 \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len 153600 \
          --max-num-batched-tokens 16384 \
          --trust-remote-code \
          --allowed-local-media-path / \
          --reasoning-parser qwen3 \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --mm-processor-cache-type shm \
          --gpu-memory-utilization 0.90 \
          {{prefix_caching}} \
          {{spec_decoding}} \
          {{compilation_config}} \
          --additional-config '{"enable_cpu_binding": true, "enable_flashcomm1": true}'
      ```
  - title: 服务验证
    content: |-
      该平台使用服务名 `qwen3.6`：

      ```bash
      curl --fail-with-body --silent --show-error http://localhost:<port>/v1/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3.6","prompt":"The future of AI is","max_tokens":50,"temperature":0}'
      ```

      ```bash
      curl --fail-with-body --silent --show-error http://localhost:<port>/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3.6","messages":[{"role":"user","content":"The future of AI is"}],"max_completion_tokens":1024,"temperature":0.7,"top_p":0.95}'
      ```

# ===== Atlas 300I DUO，W8A8-310P，TP=4，FP16 =====
- npu: Atlas 300I DUO
  precision: W8A8
  deployment: Single-Node
  case: 300I DUO (TP)
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: 启动服务
    content: |-
      **状态：experimental —— 无 310P 硬件可测。** 使用 310P 专用权重（`Qwen3.6-27B-W8A8-310P`）。Atlas 300I DUO 只支持 TP（TP=2 或 TP=4），且只能 FP16 运行；该平台不支持 `enable_npugraph_ex`，因此显式关闭。

      ```bash
      #!/bin/sh
      export MODEL_PATH=Eco-Tech/Qwen3.6-27B-W8A8-310P
      export VLLM_USE_MODELSCOPE=True
      export OMP_NUM_THREADS=1

      vllm serve $MODEL_PATH \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 4 \
          --quantization ascend \
          --served-model-name qwen3.6 \
          --max-num-seqs 128 \
          --max-model-len 16384 \
          --trust-remote-code \
          --gpu-memory-utilization 0.90 \
          --mamba-ssm-cache-dtype float16 \
          --dtype float16 \
          --speculative-config '{"method": "qwen3_5_mtp", "num_speculative_tokens": 1}' \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2, 16]}' \
          --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
      ```
  - title: 服务验证
    content: |-
      见下方 `verification` 段落。使用 `--served-model-name qwen3.6`，上下文上限为 16384。

verification: |-
  服务启动后，日志应出现：
  ```text
  (APIServer pid=<pid>) INFO:     Started server process [<pid>]
  (APIServer pid=<pid>) INFO:     Waiting for application startup.
  (APIServer pid=<pid>) INFO:     Application startup complete.
  ```

  用 **Completions API** 做冒烟测试：
  ```bash
  curl http://localhost:<port>/v1/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.6",
          "prompt": "The future of AI is",
          "max_tokens": 50,
          "temperature": 0
      }'
  ```

  以及 **Chat Completions API**：
  ```bash
  curl http://localhost:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3.6",
          "messages": [{"role": "user", "content": "The future of AI is"}],
          "max_completion_tokens": 4096,
          "temperature": 0.7,
          "top_p": 0.95
      }'
  ```

  预期：返回 HTTP 200 OK，响应体含 `choices` 字段并生成文本。

evaluation:
  accuracy:
    content: |-
      ### 使用 AISBench（推荐）

      参考 vllm-ascend 的 AISBench 指南，并使用 `--served-model-name qwen3.6`。上游教程只发布了 Qwen3.5-27B-w8a8 的精度表（gsm8k 96.74），并注明 Qwen3.6-27B "可同法获得，此处不再列出" —— 也就是说上游没有 Qwen3.6-27B 的数字，本配方也不声称任何数字。

      ### 使用 Language Model Evaluation Harness（lm_eval）

      ```shell
      lm_eval \
        --model local-completions \
        --model_args model=qwen3.6,base_url=http://127.0.0.1:8000/v1/completions,tokenized_requests=False,trust_remote_code=True \
        --tasks gsm8k \
        --output_path ./
      ```
  performance:
    content: |-
      ### 使用 AISBench

      参考 vllm-ascend 的 AISBench 性能评测指南。

      ### 使用 vllm bench serve

      ```bash
      export VLLM_USE_MODELSCOPE=True
      vllm bench serve --model Eco-Tech/Qwen3.6-27B-w8a8 \
        --dataset-name random --random-input 200 --num-prompts 200 \
        --request-rate 1 --save-result --result-dir ./
      ```

      本配方未发布任何昇腾上的吞吐或时延数字。

tuning: |-
  ### 并行策略（DP 优先）

  `Qwen3.6-27B-w8a8` 约 30 GB，单张 64 GB HBM die 即可容纳。Atlas 800 A2/A3 上默认保持 **TP=2**，把其余 die 分给 DP。**TP=8 只用于 256K+ 上下文**——此时把 KV cache 切到 8 张 die 才是拿到该窗口的手段。Ascend 950DT 上 C8 权重可放进单张 96 GB die，因此吞吐默认是 **TP=1 + DP=8**。

  **Atlas 300I DUO**：只支持 TP —— TP=2 或 TP=4，FP16 运行；此处 `--max-model-len` 保守取 16384（确认 HBM 余量后再上调）。

  | 场景 | 部署 | NPU 数 | 权重 | 说明 |
  |------|------|--------|------|------|
  | 高吞吐（128K 上下文） | 单节点 A2 | 8 | Qwen3.6-27B-w8a8 | TP=2 + DP=4 —— 8 张 NPU 全部用于并行请求批次 |
  | 高吞吐（128K 上下文） | 单节点 A3 | 16 | Qwen3.6-27B-w8a8 | TP=2 + DP=8 —— 16 张 NPU 全部用于并行请求批次 |
  | 低时延（128K 上下文） | 单节点 A3 | 16 | Qwen3.6-27B-w8a8 | TP=2 + DP=8、`--max-num-seqs 4` —— 小批量交互场景下每层 Allreduce 开销更低 |
  | 长上下文（256K+） | 单节点 A3 | 16 | Qwen3.6-27B-w8a8 | TP=8 + DP=2 —— KV cache 切分到 8 张 NPU |
  | 高吞吐（128K 上下文） | 单节点 950DT | 8 | Qwen3.6-27B-w8a8c8-mxfp8 | TP=1 + DP=8，带 `--kv-cache-dtype mxfp8` |
  | 长上下文（256K+） | 单节点 950DT | 8 | Qwen3.6-27B-w8a8c8-mxfp8 | TP=1 + DP=8，`--max-model-len` 可上调到 262144 |
  | 短上下文、FP16 | 单节点 300I DUO | 2-8 | Qwen3.6-27B-W8A8-310P | TP=2 或 TP=4，`--dtype float16` |

  | 场景 | 配置 | TP | DP | Max Num Seqs | Max Num Batched Tokens | Max Model Len | MTP 数 | 异步调度 |
  |------|------|----|----|--------------|------------------------|---------------|--------|----------|
  | 高吞吐（128K） | 单节点 A2 | 2 | 4 | 32 | 16384 | 133000 | 3 | 开 |
  | 高吞吐（128K） | 单节点 A3 | 2 | 8 | 32 | 16384 | 133120 | 3 | 开 |
  | 低时延（128K） | 单节点 A3 | 2 | 8 | 4 | 4096 | 133120 | 3 | 开 |
  | 长上下文（256K+） | 单节点 A3 | 8 | 2 | 8 | 8192 | 262144 | 3 | 开 |
  | 高吞吐（128K） | 单节点 950DT | 1 | 8 | 32 | 16384 | 153600 | 3 | 开 |
  | 长上下文（256K+） | 单节点 950DT | 1 | 8 | 32 | 16384 | 262144 | 3 | 开 |
  | 短上下文 | 单节点 300I DUO | 2-4 | 1 | 128 | 8192 | 16384 | 1 | 关 |

  ### 关键调节项

  - `--gpu-memory-utilization`：调大以扩大 KV cache；过高会 OOM，因为预热阶段峰值与稳态占用并不相同。
  - `--max-num-batched-tokens`：调大降低时延，但激活值 HBM 压力上升。
  - `--kv-cache-dtype mxfp8`：W8A8C8 权重必需；仅 950PR/950DT 产品支持，且要求 `--block-size` 为 512 的倍数。
  - `--speculative-config`：Qwen3.5-27B 与 Qwen3.6-27B 都使用 `qwen3_5_mtp`；Atlas 300I DUO 上把 `num_speculative_tokens` 设为 1。
  - `--compilation-config cudagraph_mode=FULL_DECODE_ONLY`：推荐值，`PIECEWISE` 为备选。Atlas 300I DUO 上最多使用两个 capture size。
  - `--additional-config '{"enable_cpu_binding": true, "enable_flashcomm1": true}'`：CPU 绑核 + FlashComm1（把 TP AllReduce 拆成 Reduce-Scatter/All-Gather），用于 Ascend 950DT。

