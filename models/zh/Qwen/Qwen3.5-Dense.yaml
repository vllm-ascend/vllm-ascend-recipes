meta:
  title: "Qwen3.5-Dense (Qwen3.5-2B/4B/9B)"
  slug: "qwen3.5-dense"
  provider: "Qwen"
  description: "Qwen3.5-2B、Qwen3.5-4B、Qwen3.5-9B 是 Qwen3.5 系列的稠密混合 Mamba-Transformer 语言模型，共享相同的混合注意力设计（GDN + 全注意力），在昇腾 310P 推理产品上部署方式一致，适用于对话、内容创作、代码生成等通用文本生成任务。"
  date_added: 2026-11-04
  tasks:
    - text
  performance_headline: "Atlas 300I DUO / Atlas 200I Pro（310P）单节点部署，支持 TP=1 / TP=2"
  difficulty: beginner
  related_recipes:
    - "Qwen/Qwen3.5-27B-Qwen3.6-27B"
  hardware:
    atlas_300i_duo: verified
    atlas_200i_pro: experimental

model:
  model_id: "Qwen/Qwen3.5-9B"
  min_vllm_version: "0.23.0rc1"
  architecture: dense
  parameter_count: "2B/4B/9B"
  active_parameters: null
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
  docker_image:
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
    atlas_200i_pro: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
  nightly_required: false
  install:
    # 昇腾推荐 Docker 方式；pip 需源码编译，不提供官方 wheel，隐藏 pip 标签。
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=10g --device /dev/davinci0 ... --device /dev/davinci7 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -p 8080:8080 -it quay.io/ascend/vllm-ascend:v0.23.0rc1-310p bash"
      note: "昇腾官方镜像；完整设备/驱动挂载见 env_setup.container。"

# —— 上游对齐：features / variants / strategies / overrides / guide ——
features:
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "Qwen3.5 Dense 系列带 MTP 头的投机解码（qwen3_5_mtp），推荐 num_speculative_tokens 为 1"
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 1}']
  compilation_config:
    label: "Compilation Config"
    description: "decode 阶段 ACL 图执行（--compilation-config cudagraph_mode=FULL_DECODE_ONLY）；capture size 按 n * (num_speculative_tokens + 1) 推导"
    args: ["--compilation-config", '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2, 16]}']

opt_in_features: []

variants:
  default:
    precision: fp16
    vram_minimum_gb: 22
    description: "FP16 权重（Qwen/Qwen3.5-9B）；2B 与 4B 检查点分别约需 5 GB/10 GB"
  fp16_2b:
    model_id: "Qwen/Qwen3.5-2B"
    precision: fp16
    vram_minimum_gb: 5
    description: "Qwen3.5-2B 的 FP16 权重"
  fp16_4b:
    model_id: "Qwen/Qwen3.5-4B"
    precision: fp16
    vram_minimum_gb: 10
    description: "Qwen3.5-4B 的 FP16 权重"
  w8a8_310p_2b:
    model_id: "Eco-Tech/Qwen3.5-2B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 3
    description: "Qwen3.5-2B 的 INT8（W8A8）权重，面向 310P 执行路径"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]
  w8a8_310p_4b:
    model_id: "Eco-Tech/Qwen3.5-4B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 5
    description: "Qwen3.5-4B 的 INT8（W8A8）权重，面向 310P 执行路径"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]
  w8a8_310p_9b:
    model_id: "Eco-Tech/Qwen3.5-9B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 11
    description: "Qwen3.5-9B 的 INT8（W8A8）权重，面向 310P 执行路径"
    supported_hardware: [atlas_300i_duo, atlas_200i_pro]

compatible_strategies:
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: ""

# —— 可配置数值参数（页面/CI 扩展；默认值 = tutorial 基线）——
config_params:
  model_path:
    default: "Qwen/Qwen3.5-2B"
    type: string
    description: "权重路径或 ModelScope 模型 ID：Qwen/Qwen3.5-2B / 4B / 9B（或 Eco-Tech 的 W8A8-310P 权重）；需与下载时记录的目录一致"
  tensor_parallel_size:
    default: 1
    type: number
    description: "张量并行大小：Atlas 300I DUO 上 TP=1 或 TP=2；Atlas 200I Pro 上 TP=1"
  max_model_len:
    default: 16384
    type: number
    description: "最大上下文长度（单请求输入+输出 token 数之和）；按显存实际情况配置，设置过高可能导致 OOM"
  max_num_seqs:
    default: 32
    type: number
    description: "并发序列最大数量；按显存实际情况配置，设置过高可能导致 OOM"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "vLLM 实际推理使用的 HBM 显存比例；按显存实际情况配置，设置过高可能导致 OOM"

overview: |-
  Qwen3.5-2B、Qwen3.5-4B、Qwen3.5-9B 是 Qwen3.5 系列的稠密混合 Mamba-Transformer 语言模型，共享相同的混合注意力设计（GDN + 全注意力），适用于对话、内容创作、代码生成等通用文本生成任务。

