meta:
  title: "Qwen3.5-Dense（2B/4B/9B）"
  slug: "qwen3.5-dense"
  provider: "Qwen"
  description: "Qwen3.5-2B/4B/9B 稠密混合 Mamba-Transformer。Atlas 300I DUO / Atlas 200I Pro（310P）单机，vLLM Ascend ≥ v0.23.0rc1。"
  date_added: "2026-10-28"
  date_updated: "2026-10-29"
  difficulty: beginner
  tasks:
    - text
  performance_headline: "Atlas 300I DUO / 200I Pro（310P）单机 Dense + MTP（tutorial 迁移）"
  related_recipes:
    - "Qwen/Qwen3.5-27B-Qwen3.6-27B"
  hardware:
    atlas_300i_duo: verified

model:
  model_id: "Qwen/Qwen3.5-4B"
  min_vllm_version: "0.23.0rc1"
  architecture: dense
  parameter_count: "2B / 4B / 9B"
  active_parameters: null
  context_length: 16384
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--served-model-name"
    - "qwen3.5"
    - "--tensor-parallel-size"
    - "1"
    - "--max-model-len"
    - "16384"
    - "--max-num-seqs"
    - "32"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--dtype"
    - "float16"
    - "--mamba-ssm-cache-dtype"
    - "float16"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    # 冒烟实测（约 21GB 310P3）：v0.30.0rc1-310p（2026-10-29）。最低仍 ≥ v0.23.0rc1；v0.23.0-310p 亦曾 PASS。
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.30.0rc1-310p"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=10g --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -p 8080:8080 -it quay.io/ascend/vllm-ascend:v0.30.0rc1-310p bash"
      note: "冒烟实测 tag：`v0.30.0rc1-310p`（2026-10-29，约 21GB 310P3；`v0.23.0-310p` 亦 PASS）。最低 ≥ v0.23.0rc1。完整挂载见 env_setup。310P 上如有 triton-ascend/triton 请卸载。"

features:
  spec_decoding:
    label: "MTP 投机解码"
    description: "qwen3_5_mtp，num_speculative_tokens=1 — FP16 2B/4B 约 21GB 实测可用；单卡约 21GB 上 9B W8A8 勿开 MTP（会 OOM）"
    args:
      - "--speculative-config"
      - '{"method": "qwen3_5_mtp","num_speculative_tokens":1}'
  compilation_config:
    label: "编译配置"
    description: "FULL_DECODE_ONLY；开 MTP 时 capture sizes 如 [2,16]；9B W8A8 无 MTP 用 [1,8]"
    args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}'
  disable_npugraph_ex:
    label: "关闭 npugraph_ex"
    description: "300I DUO / 200I Pro 不支持 enable_npugraph_ex，必须为 false"
    args:
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
  w8a8_additional_config:
    label: "W8A8 additional-config（9B）"
    description: "约 21GB 310P3 上 9B W8A8：enable_npugraph_ex 必须为 false。v0.30.0rc1 勿传 fuse_norm_quant（VllmConfig ValidationError）；v0.23.0-310p 可设 fuse_norm_quant=false。"
    args:
      - "--additional-config"
      - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'

opt_in_features: []

variants:
  default:
    model_id: "Qwen/Qwen3.5-4B"
    precision: fp16
    vram_minimum_gb: 12
    description: "FP16 Qwen3.5-4B — v0.30.0rc1-310p 约 21GB 用 MTP + len=8192 + seqs=16（16384/32 失败）；v0.23 可用 16384/32"
  qwen35_2b_fp16:
    model_id: "Qwen/Qwen3.5-2B"
    precision: fp16
    vram_minimum_gb: 8
    description: "FP16 2B，约 21GB 310P3 较宽松"
  qwen35_9b_fp16:
    model_id: "Qwen/Qwen3.5-9B"
    precision: fp16
    vram_minimum_gb: 20
    description: "FP16 9B，约 21GB 偏紧"
  qwen35_9b_w8a8:
    model_id: "Eco-Tech/Qwen3.5-9B-W8A8-310P"
    precision: W8A8
    vram_minimum_gb: 16
    description: "W8A8-310P 9B — 约 21GB（v0.23+v0.30）实测 PASS：text-only、无 MTP、len=8192、seqs=8、util=0.90；v0.30 勿传 fuse_norm_quant（约 19.8/21.5 GB）"

compatible_strategies:
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}
dependencies: []
guide: ""

config_params:
  max_model_len:
    default: 16384
    type: number
    description: "上下文长度。约 21GB：2B@v0.30 可用 16384；4B@v0.30 地板 8192；9B W8A8 8192。tutorial 默认 16384 在 4B/9B 可能 OOM。"
  max_num_seqs:
    default: 32
    type: number
    description: "最大并发序列数。约 21GB v0.30：2B=32，4B 地板=16，9B W8A8=8。"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "模型与 KV cache 占用的 HBM 比例。"

overview: |-
  Qwen3.5-2B/4B/9B 为 Qwen3.5 系列稠密混合 Mamba-Transformer（GDN + 全注意力）。本 recipe 将官方 vLLM Ascend tutorial 迁为结构化 YAML，面向 Atlas 300I DUO 与 Atlas 200I Pro（310p 镜像 ≥ v0.23.0rc1）。单机 TP=1（DUO 多卡可见时可 TP=2）。MTP：qwen3_5_mtp（1 token）。enable_npugraph_ex 必须为 false。

