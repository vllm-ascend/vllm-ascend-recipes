quantization:
  content: |-
    Eco-Tech 提供 `Qwen3.5-{2B,4B,9B}-W8A8-310P`。ModelSlim W8A8 可能自动识别 quantization=`ascend`（9B 实测）；
    显式 `--quantization ascend` 可选。FP16 `Qwen/Qwen3.5-*` 不加该参数。约 21GB 单卡 9B 优先 W8A8。

prerequisites:
  - title: 硬件
    content: |-
      - Atlas 300I DUO 或 Atlas 200I Pro（310P）。
      - 单卡可见 → TP=1；DUO 多卡可 TP=2。
      - 部分 310P3 约 21GB HBM：9B FP16 可能 OOM，需降长/降并发或用 W8A8。
  - title: 软件
    content: |-
      - 镜像冒烟实测 `v0.30.0rc1-310p`（`v0.23.0-310p` 亦 PASS）。最低 `v0.23.0rc1-310p`。
      - 310P 上可能需要 `pip uninstall -y triton-ascend triton`（stub 会导致 serve 失败）。

env_setup:
  container:
    "Atlas 300I DUO":
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0rc1-310p
        # 回退：export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-310p
        docker run --rm \
            --name vllm-ascend \
            --shm-size=10g \
            --device /dev/davinci0 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -p 8080:8080 \
            -it $IMAGE bash
        ```
    "Atlas 200I Pro":
      content: |-
        按官方 tutorial 的 Ubuntu / openEuler 挂载（privileged 等）。镜像 `…-310p` 或 `…-310p-openeuler`。
  pip:
    content: |-
      ```bash
      git clone https://github.com/vllm-project/vllm-ascend.git
      cd vllm-ascend && pip install -e .
      pip uninstall -y triton-ascend triton
      ```

scenarios:
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: Single-Node
    case: 310P TP1（2B/4B/9B FP16）
    tags: [310p-single]
    strategy: single_node_310p
    steps:
      - title: 启动服务
        content: |-
          **v0.30.0rc1-310p 约 21GB 实测地板：** 2B = MTP + len=16384 + seqs=32；**4B = MTP + len=8192 + seqs=16**（16384/32 失败）。下方为 tutorial 基线模板，4B 请按地板改长/并发。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export MODEL_PATH=Qwen/Qwen3.5-4B

          vllm serve $MODEL_PATH \
            --host 127.0.0.1 \
            --port 8080 \
            --tensor-parallel-size 1 \
            --served-model-name qwen3.5 \
            --max-num-seqs {{max_num_seqs}} \
            --max-model-len {{max_model_len}} \
            --trust-remote-code \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --mamba-ssm-cache-dtype float16 \
            --dtype float16 \
            {{spec_decoding}} \
            {{compilation_config}} \
            {{disable_npugraph_ex}}
          ```
      - title: 服务验证
        content: |-
          见 verification；日志出现 Application startup complete 后 curl。

  - npu: Atlas 300I DUO
    precision: W8A8
    deployment: Single-Node
    case: 310P TP1（约 21GB 9B W8A8 text-only — 实测）
    tags: [310p-single, w8a8]
    strategy: single_node_310p
    steps:
      - title: 启动服务（W8A8-310P，实测可跑配置）
        content: |-
          约 21GB 310P3（`v0.30.0rc1-310p` 与早先 `v0.23.0-310p`）实测 PASS：**关 MTP**、text-only、
          `max-model-len=8192`、`max-num-seqs=8`、`gpu-memory-utilization=0.90`、
          cudagraph `[1,8]`；quant 自动=`ascend`。
          **v0.30：勿传 `fuse_norm_quant`**（ValidationError）。**v0.23：** 可设 `fuse_norm_quant=false`。
          默认 MTP + seqs=16 + 多模态 profile_run 会 OOM。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export MODEL_PATH=Eco-Tech/Qwen3.5-9B-W8A8-310P

          vllm serve $MODEL_PATH \
            --host 127.0.0.1 \
            --port 8080 \
            --tensor-parallel-size 1 \
            --served-model-name qwen3.5 \
            --max-num-seqs 8 \
            --max-model-len 8192 \
            --trust-remote-code \
            --gpu-memory-utilization 0.90 \
            --mamba-ssm-cache-dtype float16 \
            --dtype float16 \
            --limit-mm-per-prompt '{"image":0,"video":0}' \
            --mm-processor-cache-gb 0 \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,8]}' \
            --additional-config '{"ascend_compilation_config":{"enable_npugraph_ex":false}}'
          ```

          说明：不要套 `{{spec_decoding}}`；v0.30 勿传 `fuse_norm_quant`（仅 v0.23 需要时可加 false）；
          `--quantization ascend` 在自动识别成功时可省略；
          加载后约 19800–19905/21525 MB；weights ≈ 15.66 GiB；KV ≈ 0.78–0.81 GiB。

verification: |-
  Completions / Chat 见英文版同结构；model 名 `qwen3.5`，端口 8080，期望 HTTP 200。

evaluation:
  accuracy:
    content: |-
      本地 AISBench gsm8k（310P3 约 21GB，镜像 `v0.30.0rc1-310p`，2026-10-29 Asia/Shanghai）：
      2B FP16 **80.06**（FAIL=0；教程 77.71）；
      4B FP16 **93.56**（FAIL=0，干净重跑 2026-10-29 16:50 CST；教程 93.18）；
      9B W8A8 **95.15**（FAIL=0；教程 95.30）。
      textvqa 本机未跑。Tutorial 参考（300I DUO）：2B 77.71 / 4B 93.18 / 9B 95.30。
  performance:
    content: |-
      本机尚未测性能；勿编造数字。可用 AISBench perf 或 `vllm bench serve`。

tuning: |-
  仅 TP；单卡优先 TP=1。OOM 先降 max-model-len / max-num-seqs。保持 enable_npugraph_ex=false。
  FP16 2B/4B 可开 MTP（tokens=1）；约 21GB 上 9B W8A8 **关 MTP**，并设 text-only MM 限制。
  v0.30 约 21GB：4B 用 len=8192 seqs=16；9B **勿传** fuse_norm_quant（v0.23 可设 false）。

faq: |-
  见官方 FAQ。9B 约 21GB OOM → Eco-Tech W8A8-310P + 无 MTP + limit-mm image/video=0 + mm-cache=0 + len=8192 + seqs=8 + util=0.90（实测）。
  镜像必须 `*-310p` ≥ v0.23.0rc1；优先冒烟镜像 `v0.30.0rc1-310p`（`v0.23.0-310p` 亦可）。
  v0.30 传 fuse_norm_quant 会 ValidationError → 从 additional-config 去掉该键。

