tuning: |-
  ### 推荐配置

  > 以下配置仅供参考。最优配置取决于模型规格、最大输入/输出长度和实际显存大小。
  >
  > **Atlas 300I DUO / Atlas 200I Pro**：当前仅支持 TP 场景。Atlas 200I Pro 建议 **TP=1**；Atlas 300I DUO 支持 **TP=1** 和 **TP=2**，按可用设备选择。`--max-model-len`、`--max-num-seqs`、`--gpu-memory-utilization` 按实际显存配置，设置过高可能导致 OOM。

  ### 关键参数说明

  - `--tensor-parallel-size`：Atlas 200I Pro 建议 **TP=1**；Atlas 300I DUO 支持 **TP=1** 和 **TP=2**，按可用设备选择。
  - `--max-model-len`：上下文长度（单请求输入+输出之和）；按实际显存配置，过高可能导致 OOM。
  - `--max-num-seqs`：可并发处理的最大请求数；按实际显存配置。
  - `--gpu-memory-utilization`：vLLM 实际推理使用的 HBM 显存比例（默认 `0.9`）。
  - `--dtype float16` 和 `--mamba-ssm-cache-dtype float16`：Atlas 300I DUO 与 Atlas 200I Pro 仅支持 FP16。
  - `--speculative-config` 使用 `qwen3_5_mtp`：面向带 MTP 头的 Qwen3.5 Dense 模型；推荐 `num_speculative_tokens: 1`（1~5 之间在时延与吞吐/接受率之间权衡）。
  - `--compilation-config`：推荐 `cudagraph_mode: FULL_DECODE_ONLY`；开启 TP 时最多允许两个 capture sizes（硬件 event-id 约束）；带 MTP 时按 `n * (num_speculative_tokens + 1)` 推导。
  - `--additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'`：必须设置——这些平台不支持 `enable_npugraph_ex`。

  ### 调优指南

  参见 vllm-ascend 性能调优文档与功能矩阵，获取更详细的功能说明。

