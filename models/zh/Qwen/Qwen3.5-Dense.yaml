          vllm serve your_model_path \
          --host 127.0.0.1 \
          --port 8080 \
          --tensor-parallel-size 1 \
          --served-model-name qwen3.5 \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --trust-remote-code \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --mamba-ssm-cache-dtype float16 \
          --dtype float16 \
          {{spec_decoding}} \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}' \
          --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
          ```
      - title: 验证推理
        content: 执行下方“验证”部分的检查，保存日志及两次推理响应；仅启动成功不够。
verification: |-
  启动日志需出现 `Application startup complete`。在服务容器内执行下列检查，将 `<server_ip>` 替换为 `127.0.0.1`、`<port>` 替换为 `8080`。就绪不等于推理成功：两次推理请求均需返回 HTTP 200，且 `choices` 含生成文本。教程监听回环地址；宿主机访问时需显式设置可达的监听地址。Completions 使用 `max_tokens`，Chat Completions 使用 `max_completion_tokens`。

  ```bash
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/health
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/v1/models
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/v1/completions \
    -H 'Content-Type: application/json' \
    -d '{"model":"qwen3.5","prompt":"The future of AI is","max_tokens":50,"temperature":0}'
  curl --fail-with-body --silent --show-error http://<server_ip>:<port>/v1/chat/completions \
    -H 'Content-Type: application/json' \
    -d '{"model":"qwen3.5","messages":[{"role":"user","content":"The future of AI is"}],"max_completion_tokens":1024,"temperature":0.7,"top_p":0.95}'
  ```
evaluation:
  accuracy:
    content: |-
      下表来自官方教程的 Atlas 300I DUO 结果，并非本次贡献的实测结果，不能据此将本指南标为已验证。将 AISBench 配置中的 `your_model_path` 替换为服务使用的权重。遵循 [AISBench 指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html)准备 gsm8k 和 textvqa，并分别运行三个模型。TextVQA 需要图像数据集及多模态请求；纯文本对话冒烟测试不能验证它。

      ```python
      # Example configuration: benchmarks/ais_bench/benchmark/configs/models/vllm_api/vllm_api_general_chat.py
      from ais_bench.benchmark.models import VLLMCustomAPIChat
      from ais_bench.benchmark.utils.model_postprocessors import extract_non_reasoning_content

      models = [
          dict(
              attr="service",
              type=VLLMCustomAPIChat,
              abbr="vllm-api-general-chat",
              path="your_model_path",
              model="qwen3.5",
              request_rate=0,
              retry=2,
              host_ip="127.0.0.1",
              host_port=8080,
              max_out_len=4096,
              batch_size=16,
              trust_remote_code=False,
              generation_kwargs=dict(
                  temperature=0.0,
                  ignore_eos=False,
                  chat_template_kwargs = {"enable_thinking": False},
              ),
              pred_postprocessor=dict(type=extract_non_reasoning_content)
          )
      ]
      ```

      | Model | dataset | version | metric | mode | vllm-api-general-chat |
      |-------|---------|---------|--------|------|------------------------|
      | Qwen3.5-2B | gsm8k | - | accuracy | gen | 77.71 |
      | Qwen3.5-2B | textvqa | - | accuracy | gen | 76.09 |
      | Qwen3.5-4B | gsm8k | - | accuracy | gen | 93.18 |
      | Qwen3.5-4B | textvqa | - | accuracy | gen | 79.08 |
      | Qwen3.5-9B | gsm8k | - | accuracy | gen | 95.30 |
      | Qwen3.5-9B | textvqa | - | accuracy | gen | 82.33 |
  performance:
    content: 遵循 [AISBench 性能评测指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation)。记录权重及版本、硬件、镜像摘要、启动参数、输入输出长度、并发、请求数、失败数、吞吐和时延。原教程未公布这些模型的数值性能基线，本指南也不声称已测得吞吐或时延。
tuning:
  仅覆盖 TP：单个可见 Atlas 200I Pro NPU 使用 TP=1；Atlas 300I DUO 可使用 TP=1 或 TP=2。dtype 与 Mamba SSM 缓存均保持 float16，关闭
  enable_npugraph_ex，并使用 FULL_DECODE_ONLY。启用 TP 时，硬件 event ID 限制最多两个 capture size；教程 MTP 基线为 [2,16]。每步一个推测 token
  时，capture size 是非 MTP 值的两倍。启动内存不足时降低上下文、并发数和内存使用比例。本指南不声明支持 DP 或 PD 场景。参见[调优指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)。
faq:
  参见[公共 FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。910B 运行成功不能证明 310P 或 Atlas 200I Pro 兼容性。下列量化权重仅为下载参考：原教程提供
  FP16 启动命令，未提供 W8A8 部署基线。
