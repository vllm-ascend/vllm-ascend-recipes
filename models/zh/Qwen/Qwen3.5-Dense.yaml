meta:
  title: Qwen3.5-Dense (2B / 4B / 9B)
  slug: qwen3.5-dense
  provider: Qwen
  description: 将官方教程迁移为 Atlas 300I DUO 和 Atlas 200I Pro 上的 Qwen3.5 Dense FP16 部署指南。
  date_added: '2026-11-18'
  difficulty: intermediate
  tasks:
    - text
    - multimodal
  hardware:
    atlas_300i_duo: experimental
    atlas_200i_pro: experimental
model:
  model_id: Qwen/Qwen3.5-2B
  architecture: dense
  parameter_count: 2B
  active_parameters: null
  context_length: 262144
  modality: text, image, video
  base_args:
    - --host
    - 127.0.0.1
    - --port
    - '8080'
    - --tensor-parallel-size
    - '1'
    - --served-model-name
    - qwen3.5
    - --max-num-seqs
    - '32'
    - --max-model-len
    - '16384'
    - --trust-remote-code
    - --gpu-memory-utilization
    - '0.90'
    - --mamba-ssm-cache-dtype
    - float16
    - --dtype
    - float16
    - --compilation-config
    - '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [2,16]}'
    - --additional-config
    - '{"ascend_compilation_config": {"enable_npugraph_ex": false}}'
  base_env:
    VLLM_USE_MODELSCOPE: 'True'
  docker_image:
    atlas_300i_duo: quay.io/ascend/vllm-ascend:main-310p
    atlas_200i_pro: quay.io/ascend/vllm-ascend:main-310p
  install:
    pip: false
features:
  spec_decoding:
    label: MTP 推测解码
    description: 教程基线：qwen3_5_mtp，每步一个推测 token。
    args:
      - --speculative-config
      - '{"method": "qwen3_5_mtp","num_speculative_tokens":1}'
variants:
  default:
    precision: fp16
    vram_minimum_gb: 5
  4b:
    model_id: Qwen/Qwen3.5-4B
    precision: fp16
    vram_minimum_gb: 10
  9b:
    model_id: Qwen/Qwen3.5-9B
    precision: fp16
    vram_minimum_gb: 22
compatible_strategies:
  - single_node_310p
config_params:
  max_model_len:
    default: 16384
    type: number
    description: 输入与输出的总长度；显存不足时降低。
  max_num_seqs:
    default: 32
    type: number
    description: 最大并发请求数；显存不足时降低。
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: 供 vLLM 使用的设备内存比例。
overview:
  Qwen3.5-2B、4B 和 9B 是结合门控增量网络与全注意力的稠密多模态模型。本指南保留官方教程中 Atlas 300I DUO 和 Atlas 200I Pro 的单节点 TP 部署。模型原生上下文为
  262144 token，教程部署值为 16384。本次贡献尚未在目标硬件上独立验证推理、MTP、精度及性能，因此两个硬件均标记为 experimental。
weight_download:
  - weight_version: FP16 (Qwen3.5-2B)
    sources:
      - source: ModelScope
        url: https://modelscope.cn/models/Qwen/Qwen3.5-2B
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Qwen/Qwen3.5-2B
          ```
