prerequisites:
- title: 模型权重
  content: |-
    该系列包含三个检查点，下载你准备服务的那个并记录本地路径：

    | 模型 | 参数量 | 下载 |
    | --- | --- | --- |
    | Qwen3-Reranker-0.6B | 0.6B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-0.6B) |
    | Qwen3-Reranker-4B | 4B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-4B) |
    | Qwen3-Reranker-8B | 8B | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-8B) |

    建议将模型权重下载到多节点共享目录，例如 `/root/.cache/`。

    **路径说明**：将模型权重下载到你选择的目录并记录该路径。确保后续部署命令中的模型路径与此目录一致。
- title: 版本说明
  content: |-
    仅 vLLM Ascend 0.9.2rc1 及更高版本支持该模型，且教程已在 vLLM Ascend v0.30.0 中从文档集合移除（该版本起模型停止支持）。请固定使用下文列出的 `v0.23.0` 镜像线 —— 这是仍提供 Qwen3-Reranker 支持的最新发布线 —— 不要升级到最新发布的 tag。

env_setup:
  container:
    A3:
      content: |-
        使用 A3 系列的官方一体化镜像：

        **拉取镜像：**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.23.0-a3
        ```

        **启动容器：**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0-a3
        docker run --rm \
          --name vllm-ascend \
          --shm-size=1g \
          --net=host \
          --privileged=true \
          --device /dev/davinci0 \
          --device /dev/davinci_manager \
          --device /dev/devmm_svm \
          --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```

        Docker 启动成功后，可执行 `docker ps` 命令验证容器是否正常运行。
