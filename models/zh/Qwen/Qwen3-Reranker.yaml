overview: |-
  Qwen3 Reranker 系列面向文本排序任务。基于 Qwen3 稠密基础模型，提供 0.6B、4B、8B 多规格重排序模型。本 recipe 使用 pooling runner 拉起官方原始权重，并通过 `/v1/rerank` 接口验证。

  > **历史版本范围：**[Qwen3-Reranker 自 vLLM Ascend v0.30.0 起停止支持](https://github.com/vllm-project/vllm-ascend/blob/main/docs/source/tutorials/models/Qwen3-Reranker.md)。本 recipe 为 A2/A3/Atlas 300I DUO 保留固定的 `v0.23.0rc1` 系列镜像，为 Ascend 950DT&950PR 单独固定 `v0.23.0-a5` 镜像。A5 场景迁移自固定提交的源教程，尚未在 A5 硬件上验证。`min_vllm_version` 不代表当前版本仍支持该模型；未经支持性和运行验证，请勿将镜像替换为 `latest` 或 nightly。请参考 [v0.23.0 归档教程](https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/Qwen3-Reranker.html)。

