overview: |-
  Qwen3 Reranker 系列面向文本排序任务。基于 Qwen3 稠密基础模型，提供 0.6B、4B、8B 多规格重排序模型。本 recipe 展示如何用 vLLM Ascend 的 pooling runner 拉起官方原始权重，并通过 OpenAI 兼容的 `/v1/rerank` 接口验证。需要 vLLM Ascend 0.9.2rc1 及以上版本。

