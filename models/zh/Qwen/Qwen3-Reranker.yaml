          迁移自源教程的 Ascend 950DT&950PR Products 场景。该 A5 场景标记为 experimental，尚未在 A5 硬件上验证。请使用上方单独固定的 `v0.23.0-a5` 容器；服务参数与 A3/A2 共用。

