scenarios:

- npu: Atlas 800I A3
  precision: bf16
  deployment: 单节点
  case: 单卡
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      Qwen3-Reranker 通过 pooling runner 提供服务：`--runner pooling` 将服务切换到嵌入/重排序接口路径，`--hf_overrides` 从 `no`/`yes` 分类 token 加载 Qwen3 重排序分类头。

      ```bash
      vllm serve Qwen/Qwen3-Reranker-0.6B \
        --served-model-name Qwen/Qwen3-Reranker-0.6B \
        --runner pooling \
        --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
        --port 8000 \
        --max-model-len {{max_model_len}}
      ```

      > - `--max-model-len` 是上下文长度（单个请求的输入加输出）。请保留这个明确的保守值；在 Atlas 300I DUO 上较大的自动解析值会在分配掩码时 OOM。
      > - `--served-model-name` 是客户端请求体中传入的模型 id，请与下方请求保持一致。
      > - A2 系列使用同样的命令，仅镜像 tag 不同。
  - title: 服务验证
    content: |-
      服务启动后，向 `/v1/rerank` 发送重排序请求，确认每个结果都带有 `relevance_score`。完整示例见下方“功能验证”部分。
- npu: Atlas 800I A2
  precision: bf16
  deployment: 单节点
  case: 单卡（A2）
  tags: [a2-single]
  strategy: single_node_A2
  steps:
  - title: 启动服务
    content: |-
      A2 系列使用与 A3 系列相同的服务参数，请在 `v0.23.0` 镜像（不带 `-a3` 后缀）中运行。

      ```bash
      vllm serve Qwen/Qwen3-Reranker-0.6B \
        --served-model-name Qwen/Qwen3-Reranker-0.6B \
        --runner pooling \
        --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
        --port 8000 \
        --max-model-len {{max_model_len}}
      ```

      > - 可调整 `--port` 以避免与同机其它服务端口冲突。
  - title: 服务验证
    content: |-
      服务启动后，向 `/v1/rerank` 发送重排序请求。完整示例见下方“功能验证”部分。
- npu: Atlas 300I DUO
  precision: bf16
  deployment: 单节点
  case: 300I DUO
  tags: [310p-single]
  strategy: single_node_310p
  steps:
  - title: 启动服务
    content: |-
      Atlas 300I DUO 上需要限制图捕获尺寸并使用 float16，因此启动命令额外带上 `--compilation-config`、`--additional-config` 与 `--dtype`：

      ```bash
      vllm serve Qwen/Qwen3-Reranker-0.6B \
        --served-model-name Qwen/Qwen3-Reranker-0.6B \
        --runner pooling \
        --hf_overrides '{"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
        --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
        --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
        --dtype float16 \
        --port 8000 \
        --max-model-len {{max_model_len}}
      ```

      **必需参数说明：**

      - `--compilation-config`：对于 Atlas 300I DUO，由于硬件流有限，`cudagraph_capture_sizes` 的大小受到限制。

      **关键参数说明：**

      - `--max-model-len`：对于 Atlas 300I DUO，如果自动解析得到较大的上下文长度，分配该掩码（O(max_model_len^2)）可能超出 NPU 内存并触发 OOM。请务必设置明确且保守的值，例如 `--max-model-len 1024`。
  - title: 服务验证
    content: |-
      服务启动后，向 `/v1/rerank` 发送重排序请求。完整示例见下方“功能验证”部分。

verification: |-
  服务启动后，可用以下脚本验证。请使用查询与文档模板，使重排序模型收到其训练时的提示格式：

  ```python
  import requests

  url = "http://127.0.0.1:8000/v1/rerank"

  # 请使用 query_template 与 document_template 格式化查询和文档，以获得更好的重排序结果。

  prefix = '<|im_start|>system\nJudge whether the Document meets the requirements based on the Query and the Instruct provided. Note that the answer can only be "yes" or "no".<|im_end|>\n<|im_start|>user\n'
  suffix = "<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n"

  query_template = "{prefix}<Instruct>: {instruction}\n<Query>: {query}\n"
  document_template = "<Document>: {doc}{suffix}"

  instruction = (
      "Given a web search query, retrieve relevant passages that answer the query"
  )

  query = "What is the capital of China?"

  documents = [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.",
  ]

  documents = [
      document_template.format(doc=doc, suffix=suffix) for doc in documents
  ]

  response = requests.post(url,
                           json={
                               "query": query_template.format(prefix=prefix, instruction=instruction, query=query),
                               "documents": documents,
                           }).json()

  print(response)
  ```

  预期结果：服务返回 HTTP 200 OK，JSON 响应中包含 `relevance_score` 字段。示例输出：

  ```json
  {
      "id": "score-xxx",
      "model": "Qwen/Qwen3-Reranker-0.6B",
      "usage": {
          "prompt_tokens": 193,
          "total_tokens": 193
      },
      "results": [
          {
              "index": 0,
              "document": {
                  "text": "<Document>: The capital of China is Beijing.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n",
                  "multi_modal": null
              },
              "relevance_score": 0.9994981288909912
          },
          {
              "index": 1,
              "document": {
                  "text": "<Document>: Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun.<|im_end|>\n<|im_start|>assistant\n<think>\n\n</think>\n\n",
                  "multi_modal": null
              },
              "relevance_score": 0.00000506485957885161
          }
      ]
  }
  ```

  更多使用示例请参考 [vLLM pooling/score 示例](https://github.com/vllm-project/vllm/tree/main/examples/pooling/score)。

evaluation:
  accuracy:
    content: |-
      ### 使用 MTEB

      1. 详见 [MTEB](https://docs.mteb.org/)。
      2. 运行以下代码执行精度评估。

      ```python
      import os

      from mteb.models.vllm_wrapper import VllmCrossEncoderWrapper

      if __name__ == "__main__":
          import mteb

          data_path = "/home/data/mteb_data"
          os.environ["HF_DATASETS_CACHE"] = data_path
          os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

          model = VllmCrossEncoderWrapper(f"/home/data/Qwen3-Reranker-0.6B",
                                      revision="norm",
                                      dtype="float16",
                                      enforce_eager=True,
                                      max_model_len=10240,
                                      hf_overrides={"architectures": ["Qwen3VLForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": True})

          cache = mteb.ResultCache("/home/data/mteb_data")
          tasks = mteb.get_tasks(
              task_types=["Reranking"],
              languages=["zho"]
          )
          tasks = mteb.get_tasks(tasks=["MultiLongDocReranking"])
          results = mteb.evaluate(model, tasks=tasks, cache=cache, overwrite_strategy="always")
          print(results)
      ```

      3. 执行后即可获得结果。
performance:
  accuracy: |-
    精度通过 MTEB 的重排序任务（`MultiLongDocReranking` 以及 `Reranking` 任务类型）衡量。可运行脚本见“精度评估”部分，指标定义见 [MTEB](https://docs.mteb.org/)。

    教程未公布 Qwen3-Reranker 在昇腾上的参考分数，因此此处不声明精度数值。
  benchmark: |-
    ### 使用 vLLM Benchmark

    `Qwen3-Reranker-0.6B` 的性能通过 `vllm bench serve` 的 rerank 后端测量。更多细节请参考 [vLLM benchmark](https://docs.vllm.ai/en/latest/benchmarking/cli/)。

    ```bash
    vllm bench serve --model Qwen/Qwen3-Reranker-0.6B --backend vllm-rerank  --port 8000 --dataset-name random-rerank --endpoint /v1/rerank --random-input 200  --save-result --result-dir ./
    ```

    大约几分钟后，即可获得性能评估结果。
tuning: |-
  ### 调优指南

  调优方法请参考[公共性能调优文档](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)，特性说明请参考[特性指南](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html)。

  重排序模型专属说明：教程中唯一按场景固定的调优参数是 `--max-model-len`。提高它会放大注意力掩码（O(max_model_len^2)），在 Atlas 300I DUO 上可能 OOM —— 该硬件保持 1024，只有在 A2/A3 上测出显存余量后再提升。
faq: |-
  **问：Atlas 300I DUO 上启动即 OOM。**

  答：设置明确且保守的 `--max-model-len`（例如 1024）。较大的自动解析上下文长度会分配 O(max_model_len^2) 的掩码并超出 NPU 内存。

  **问：该模型无法使用 `/v1/chat/completions`。**

  答：Qwen3-Reranker 是 pooling 模型。`--runner pooling` 暴露的是 `/v1/rerank`、`/v1/score` 与 `/v1/embeddings`，而不是对话接口。

  **问：应该使用哪个镜像？**

  答：`v0.23.0` 镜像线（`-a3`、无后缀、`-310p`）。该模型自 vLLM Ascend v0.30.0 起停止支持，更新的 tag 不再提供该模型。

  有关常见环境、安装和一般参数问题，请参阅[公共 FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。

