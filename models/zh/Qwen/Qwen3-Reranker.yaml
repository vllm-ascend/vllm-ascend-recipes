meta:
  title: "Qwen3-Reranker"
  slug: "qwen3-reranker"
  provider: "Qwen"
  description: "Qwen3 Reranker 文本排序历史版本 recipe（0.6B / 4B / 8B），使用固定 vLLM-Ascend 镜像和 /v1/rerank API。该模型自 vLLM Ascend v0.30.0 起停止支持。"
  date_added: "2026-10-15"
  date_updated: "2026-11-04"
  difficulty: beginner
  tasks:
    - embedding
  performance_headline: "A2/A3、Atlas 300I DUO 与 Ascend 950DT&950PR 历史版本单节点 pooling 部署（A5 未实测）"
  related_recipes: []
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    ascend_950dt: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Qwen/Qwen3-Reranker-0.6B"
  min_vllm_version: "0.9.2rc1"
  architecture: dense
  parameter_count: "0.6B"
  active_parameters: null
  context_length: 40960
  modality: reranker
  base_args:
    - "--runner"
    - "pooling"
    - "--hf_overrides"
    - '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}'
  base_env:
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0rc1"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0rc1-a3"
    ascend_950dt: "quay.io/ascend/vllm-ascend:v0.23.0-a5"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=1g -v /root/.cache:/root/.cache --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -it quay.io/ascend/vllm-ascend:v0.23.0rc1-a3 bash"
      note: "Ascend 官方镜像；完整设备/驱动挂载见 env_setup.container。"

