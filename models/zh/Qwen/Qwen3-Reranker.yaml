prerequisites:
  - title: 模型权重
    content: |-
      | 权重版本              | 下载链接 |
      |-----------------------|----------|
      | `Qwen3-Reranker-8B`   | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-8B) |
      | `Qwen3-Reranker-4B`   | [ModelScope](https://www.modelscope.cn/models/Qwen/Qwen3-Reranker-4B) |
