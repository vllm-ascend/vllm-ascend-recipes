meta:
  title: "Qwen3-Reranker"
  slug: "qwen3-reranker"
  provider: "Qwen"
  description: "Qwen3 Reranker 模型系列是 Qwen 家族的专有重排序模型，基于 Qwen3 系列的稠密基础模型构建，提供 0.6B、4B、8B 三种尺寸。在昇腾 NPU 上由 vLLM Ascend 通过 pooling runner 提供服务，并以 /v1/rerank 相关性打分接口对外暴露。"
  date_added: 2026-10-29
  date_updated: 2026-10-29
  difficulty: beginner
  tasks:
    - embedding
  performance_headline: "在 Atlas 800I A2/A3 与 Atlas 300I DUO 上单节点 pooling 部署，通过 /v1/rerank 打分"
  related_recipes: []
  # 教程覆盖三个硬件 SKU。本 Recipe 由 v0.23.0 教程静态迁移而来、尚未在硬件上重新端到端验证，
  # 因此统一标注 experimental。
  hardware:
    atlas_800_a3: experimental
    atlas_800_a2: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Qwen/Qwen3-Reranker-0.6B"
  min_vllm_version: "0.23.0"
  architecture: dense
  parameter_count: "0.6B"
  active_parameters: null
  context_length: 40960
  modality: text
  base_args:
    - "--runner"
    - "pooling"
    - "--hf_overrides"
    - '{"architectures": ["Qwen3VLForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
  base_env: {}
  # Qwen3-Reranker 自 vLLM Ascend v0.30.0 起停止支持，因此镜像固定在仍提供该模型的
  # v0.23.0 发布线，而不是最新发布的 tag。
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0-a3"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0-310p"
  nightly_required: false
  install:
    # 昇腾推荐使用 Docker，且没有官方 wheel，因此隐藏 pip 页签。
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --privileged=true --device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info -v /etc/ascend_install.info:/etc/ascend_install.info -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.23.0 bash"
      note: "官方昇腾镜像；各 SKU 的设备挂载与 -a3 / -310p 标签见 env_setup.container。"

features: {}

opt_in_features: []

variants:
  default:
    precision: bf16
    vram_minimum_gb: 2
    description: "Qwen3-Reranker-0.6B 的 BF16 权重 —— 教程中所有命令使用的检查点。"
  reranker_4b:
    model_id: "Qwen/Qwen3-Reranker-4B"
    precision: bf16
    vram_minimum_gb: 10
    description: "该系列 4B 成员的 BF16 权重；服务参数与 0.6B 基线一致。"
  reranker_8b:
    model_id: "Qwen/Qwen3-Reranker-8B"
    precision: bf16
    vram_minimum_gb: 20
    description: "该系列 8B 成员的 BF16 权重；服务参数与 0.6B 基线一致。"

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_310p

hardware_overrides: {}
strategy_overrides: {}

guide: ""

config_params:
  max_model_len:
    default: 1024
    type: number
    description: "上下文长度，即单个请求输入加输出的最大 token 数。教程在所有场景都取 1024；在 Atlas 300I DUO 上更大的自动解析值会分配 O(max_model_len^2) 的掩码并可能 OOM。"

overview: |-
  Qwen3 Reranker 模型系列是 Qwen 家族最新的专有模型，专为文本嵌入和排序任务设计。它基于 Qwen3 系列的稠密基础模型构建，提供 0.6B、4B 和 8B 多种尺寸的文本嵌入与重排序模型。

  在 vLLM Ascend 上，检查点通过 pooling runner 与 Qwen3 重排序头覆盖加载，随后通过 `/v1/rerank` 接口访问，逐文档返回 `relevance_score`。

