scenarios:
  - npu: Atlas 800I A3
    precision: bf16
    deployment: Single-Node
    case: Single Node Single Card
    tags: [a3-single]
    strategy: single_node_A3
    steps:
      - title: 启动服务
        content: |-
          使用 pooling runner 拉起官方原始 Qwen3-Reranker 权重。`hf_overrides` 会将模型路由到 `Qwen3ForSequenceClassification`，并从 `lm_head` 提取 yes/no 分类向量。

          ```bash
          export ASCEND_RT_VISIBLE_DEVICES=0
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

          vllm serve Qwen/Qwen3-Reranker-0.6B \
              --served-model-name Qwen/Qwen3-Reranker-0.6B \
              --runner pooling \
              --hf_overrides '{"architectures": ["Qwen3ForSequenceClassification"],"classifier_from_token": ["no", "yes"],"is_original_qwen3_reranker": true}' \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - 可按需将 `Qwen/Qwen3-Reranker-0.6B` 替换为 `Qwen/Qwen3-Reranker-4B` 或 `Qwen/Qwen3-Reranker-8B`。
          > - `--max-model-len` 表示单请求输入+输出的最大长度。当自动解析出的上下文过大时，请显式设置保守值（例如 `1024`），避免注意力 mask 显存爆炸。
      - title: 服务验证
        content: |-
          服务启动后，使用下方 verification 章节中的 `/v1/rerank` 请求进行验证。
