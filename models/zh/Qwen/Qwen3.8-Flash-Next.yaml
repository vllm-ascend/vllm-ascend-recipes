meta:
  title: "Qwen3.8-Flash-Next"
  slug: "qwen3.8-flash-next"
  provider: "Qwen"
  description: "Qwen4 架构预览 MoE（总参 176B / 激活 6B），支持多模态。昇腾 Atlas 800 A3 上 W8A8-MTP DP1×TP8，已在 vLLM Ascend 0.32.0rc1 验证。"
  date_added: "2026-11-18"
  date_updated: "2026-11-18"
  difficulty: advanced
  tasks:
    - text
    - multimodal
  performance_headline: "A3 DP1×TP8 W8A8-MTP；v0.32.0rc1-a3 上 ACLGraph FULL_DECODE_ONLY 通过；AISBench GSM8K 96.51"
  related_recipes:
    - "Qwen/Qwen3-Next-80B-A3B-Instruct"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: experimental
    atlas_300i_duo: experimental

model:
  model_id: "Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp"
  min_vllm_version: "0.32.0"
  architecture: moe
  parameter_count: "176B"
  active_parameters: "6B"
  context_length: 262144
  modality: multimodal
  base_args:
    - "--trust-remote-code"
    - "--quantization"
    - "ascend"
    - "--served-model-name"
    - "qwen3.8-flash-next"
    - "--tensor-parallel-size"
    - "8"
    - "--data-parallel-size"
    - "1"
    - "--enable-expert-parallel"
    - "--max-model-len"
    - "8192"
    - "--gpu-memory-utilization"
    - "0.90"
  base_env:
    VLLM_ASCEND_ENABLE_QSA_LIGHTNING_INDEXER: "1"
    VLLM_ASCEND_ENABLE_QSA_E3V: "1"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.32.0rc1-a3"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --name vllm-ascend --shm-size=1g --net=host --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /root/.cache:/root/.cache -it quay.io/ascend/vllm-ascend:v0.32.0rc1-a3 bash"
      note: "Needs eight Ascend dies for DP1×TP8; full driver mounts follow env_setup.container."

features:
  speculative_decoding:
    description: "Multi-Token Prediction (MTP) with 3 speculative tokens"
    args:
      - "--speculative-config"
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"method_extra":{"enforce_eager":false}}'
  enforce_eager_fallback:
    description: "Disable ACLGraph capture if the host image hits Conv2D capture failures"
    args:
      - "--enforce-eager"

opt_in_features:
  - speculative_decoding
  - enforce_eager_fallback

variants:
  w8a8_mtp_a3:
    precision: W8A8
    vram_minimum_gb: 512
    description: "Ascend W8A8-MTP checkpoint for A3 DP1×TP8 (verified)"

compatible_strategies:
  - single_node_A3

config_params:
  max_model_len:
    default: 8192
    type: number
    description: "Verified smoke/AIS used 8192; raise carefully with KV headroom."
  gpu_memory_utilization:
    default: 0.90
    type: number
    description: "Tutorial-style 0.90 on 8×64 GiB HBM."

overview: |-
  Qwen3.8-Flash-Next 为 Qwen4 架构预览 MoE，支持多模态。
  本 recipe 迁移官方 vLLM Ascend A3 教程路径（DP1×TP8 W8A8），
  并记录在 Atlas 800 A3 + `v0.32.0rc1-a3` + W8A8-MTP 上的验证结果：
  教程默认 FULL_DECODE_ONLY ACLGraph 拉起与文本对话通过；同部署多模态 OCR 通过；AISBench GSM8K 96.51。

weight_download:
  - weight_version: W8A8-MTP
    sources:
      - source: ModelScope
        url: https://www.modelscope.cn/models/Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp
        command: |-
          ```bash
          pip install modelscope
          modelscope download --model Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp
          ```
      - source: HuggingFace
        url: ""
        command: ""

prerequisites:
  - title: Model Weight
    content: |-
      | Weight Version | Hardware Requirements | Download Links |
      |----------------|------------------------|----------------|
      | W8A8-MTP | Atlas 800 A3 with ≥8 Ascend910 dies (DP1×TP8) | [ModelScope Eco-Tech W8A8-MTP](https://www.modelscope.cn/models/Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp) |

      > Record the local path and pass it to `vllm serve`. Public tutorial also documents a W4A8 line; this recipe verifies the available W8A8-MTP checkpoint on v0.32.0rc1-a3.

env_setup:
  container:
    A3:
      content: |-
        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.32.0rc1-a3
        export NAME=vllm-ascend-flash

        docker run --rm \
            --name $NAME \
            --net=host \
            --shm-size=1g \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /root/.cache:/root/.cache \
            -p 8088:8088 \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      Prefer the official A3 container image `v0.32.0rc1-a3`. Matching torch / torch_npu / vllm / vllm-ascend wheels are required if installing outside Docker.

scenarios:
  - npu: Atlas A3
    title: DP1×TP8 W8A8 ACLGraph (verified)
    content: |-
      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      export VLLM_ASCEND_ENABLE_QSA_LIGHTNING_INDEXER=1
      export VLLM_ASCEND_ENABLE_QSA_E3V=1
      export VLLM_USE_V2_MODEL_RUNNER=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export MODEL_PATH=Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp

      vllm serve ${MODEL_PATH} \
          --trust-remote-code \
          --quantization ascend \
          --served-model-name qwen3.8-flash-next \
          --tensor-parallel-size 8 \
          --data-parallel-size 1 \
          --enable-expert-parallel \
          --max-model-len 8192 \
          --gpu-memory-utilization 0.90 \
          --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
          --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3,"method_extra":{"enforce_eager":false}}' \
          --host 0.0.0.0 \
          --port 8088
      ```

  - npu: Atlas A3
    title: Text chat smoke
    content: |-
      ```bash
      curl http://127.0.0.1:8088/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{
          "model": "qwen3.8-flash-next",
          "messages": [{"role":"user","content":"Who are you?"}],
          "max_tokens": 128,
          "temperature": 0
        }'
      ```

  - npu: Atlas A3
    title: Multimodal image OCR smoke
    content: |-
      ```bash
      # Replace IMAGE_URL with a publicly reachable image (e.g. Qwen logo)
      curl http://127.0.0.1:8088/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{
          "model": "qwen3.8-flash-next",
          "messages": [{"role":"user","content":[
            {"type":"text","text":"Read the text in the image."},
            {"type":"image_url","image_url":{"url":"IMAGE_URL"}}
          ]}],
          "max_tokens": 128,
          "temperature": 0
        }'
      ```

  - npu: Atlas A3
    title: enforce-eager fallback (older images)
    content: |-
      On older images such as `qwen3.8-next-a3` / `v0.30.0-a3`, default ACLGraph may fail Conv2D capture.
      Add `--enforce-eager` (and drop MTP enforce_eager=false) as a workaround. Prefer `v0.32.0rc1-a3` where ACLGraph PASS was verified.

accuracy_and_performance: |-
  Verified on Atlas 800 A3 (8 dies) with `v0.32.0rc1-a3` + W8A8-MTP:
  - Serve + `/v1/models` HTTP 200; log shows ACL graph replay active for V2 target model.
  - Text chat "Who are you?" returns Qwen identity.
  - Multimodal OCR returns `TONGYI` / `Qwen` on the sample logo image.
  - AISBench GSM8K accuracy **96.51**.
  Older `qwen3.8-next-a3` / `v0.30.0-a3` stacks: ACLGraph Conv2D / PLE failures — use `--enforce-eager` or upgrade.

faq:
  - q: Why v0.32.0rc1-a3 instead of the older qwen3.8-next-a3 tag?
    a: On the older image, FULL_DECODE_ONLY ACLGraph hit Conv2D capture failure. v0.32.0rc1-a3 closes the tutorial ACLGraph path for W8A8-MTP.
  - q: Is language-model-only required?
    a: No. Multimodal image chat PASS was verified with vision enabled on the eager and ACLGraph paths used in lab runs.
  - q: W8A8-MTP vs W4A8?
    a: This recipe verifies Eco-Tech W8A8-MTP available in lab. Follow the public tutorial if you standardize on W4A8 weights once downloaded.

references:
  - title: vLLM Ascend tutorials (Flash / Qwen3.8 family)
    url: https://docs.vllm.ai/projects/ascend/en/latest/
  - title: ModelScope Eco-Tech W8A8-MTP
    url: https://www.modelscope.cn/models/Eco-Tech/Qwen3.8-Flash-Next-w8a8-mtp
  - title: Upstream NVIDIA/AMD recipe
    url: https://github.com/vllm-project/recipes/blob/main/models/Qwen/Qwen3.8-Flash-Next.yaml
