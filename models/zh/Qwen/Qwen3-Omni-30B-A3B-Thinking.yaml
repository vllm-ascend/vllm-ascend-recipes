meta:
  title: "Qwen3-Omni-30B-A3B-Thinking"
  slug: "qwen3-omni-30b-a3b-thinking"
  provider: "Qwen"
  description: "30.5B 总参、3.3B 激活的全模态 MoE 模型，支持文本、图像、音频、视频输入，输出文本并带思维链推理。"
  date_added: 2026-11-19
  performance_headline: "Atlas 800I A3 单节点 BF16 部署，覆盖高吞吐、低时延与 128K 长上下文场景"
  difficulty: advanced
  hardware:
    atlas_800_a3: verified

model:
  model_id: "Qwen/Qwen3-Omni-30B-A3B-Thinking"
  min_vllm_version: "0.30.0"
  architecture: moe
  parameter_count: "30.5B"
  active_parameters: "3.3B"
  context_length: 65536
  modality: "text, image, audio, video"
  base_args:
    - "--trust-remote-code"
  base_env:
    HCCL_BUFFSIZE: "1024"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g -v /models:/models --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 -it quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler bash"
      note: "昇腾官方镜像；完整设备与驱动挂载见 env_setup.container。"

features:
  expert_parallel:
    description: "MoE 专家并行，适用于 TP4 场景"
    args: ["--enable-expert-parallel"]
  compilation_config:
    label: "Compilation Config"
    description: "Decode 阶段使用完整 ACL 图（--compilation-config cudagraph_mode=FULL_DECODE_ONLY）"
    args: ["--compilation-config", '{"cudagraph_mode": "FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "异步调度，重叠 CPU 调度与 NPU 计算"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV Cache 前缀缓存（验证场景默认关闭）"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

  spec_decoding:
    label: "Eagle3 投机解码"
    description: "可选的 Eagle3 投机解码；请将 your_eagle3_model_path 替换为已下载的草稿模型路径"
    args: ["--speculative-config", '{"method": "eagle3", "model": "your_eagle3_model_path", "num_speculative_tokens": 3}']

opt_in_features:
  - prefix_caching
  - spec_decoding

variants:
  default:
    model_id: "Qwen/Qwen3-Omni-30B-A3B-Thinking"
    precision: BF16
    vram_minimum_gb: 64
    description: "官方 BF16 权重，Atlas 800I A3 上的默认配置，也是 CI 可验证的配置"
  w8a8:
    precision: W8A8
    vram_minimum_gb: 32
    description: "可选的 W8A8 权重，由官方 BF16 权重经 msmodelslim 本地量化得到"

compatible_strategies:
  - single_node_A3

hardware_overrides: {}
strategy_overrides: {}

dependencies:
  - note: "可选的 Eagle3 投机解码草稿模型（请替换 your_eagle3_model_path）"
    command: "pip install modelscope && modelscope download --model AngelSlim/Qwen3-a3B_eagle3"
    optional: true

guide: ""

config_params:
  max_model_len:
    default: 37364
    type: number
    description: "最大上下文长度（输入与输出 token 之和）"
  max_num_seqs:
    default: 100
    type: number
    description: "最大并发序列数"
  gpu_memory_utilization:
    default: 0.95
    type: number
    description: "可用于 KV Cache 的 NPU 显存比例"

overview: |-
  Qwen3-Omni-30B-A3B-Thinking 是 Qwen3-Omni 的 thinker 版本：原生端到端全模态 MoE 模型，总参 30.5B、每 token 激活 3.3B。它支持文本、图像、音频、视频输入，输出文本并带思维链推理。本 recipe 覆盖上游教程的三个单节点场景：高吞吐（TP2）、低时延（TP4 + 专家并行）与 131072 tokens 长上下文（TP4 + YaRN）。所有验证场景均使用公开的官方 BF16 权重，无需本地转换权重。

weight_download:
- weight_version: BF16
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Qwen/Qwen3-Omni-30B-A3B-Thinking
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model Qwen/Qwen3-Omni-30B-A3B-Thinking
      ```
  - source: HuggingFace
    url: https://huggingface.co/Qwen/Qwen3-Omni-30B-A3B-Thinking
    command: |-
      ```bash
      pip install -U huggingface_hub
      huggingface-cli download Qwen/Qwen3-Omni-30B-A3B-Thinking
      ```
  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''
- weight_version: W8A8（使用 msmodelslim 本地量化）
  sources:
  - source: msmodelslim
    url: https://gitcode.com/Ascend/msmodelslim
    command: |-
      ```bash
      git clone https://gitcode.com/Ascend/msmodelslim.git
      # 按下方量化章节将 BF16 权重量化为 W8A8。
      ```
  - source: HuggingFace
    url: ''
    command: ''
  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''
- weight_version: Eagle3 草稿模型（可选）
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/AngelSlim/Qwen3-a3B_eagle3
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model AngelSlim/Qwen3-a3B_eagle3
      ```
  - source: HuggingFace
    url: https://huggingface.co/AngelSlim/Qwen3-a3B_eagle3
    command: |-
      ```bash
      pip install -U huggingface_hub
      huggingface-cli download AngelSlim/Qwen3-a3B_eagle3
      ```
  - source: Modelers
    url: ''
    command: ''
  - source: GitCode
    url: ''
    command: ''

quantization:
  content: |-
    该模型没有公开的 W8A8 权重，本 recipe 验证的 W8A8 权重由官方 BF16 权重经 **msmodelslim** 量化得到，保持以下混合布局：

    - **Embedding 层**：BF16，不量化
    - **Q/K 归一化**（`q_norm`、`k_norm`）：BF16
    - **Attention 投影**（`q/k/v/o_proj`）：静态 W8A8，per-tensor scale，bias 保持 BF16
    - **MoE 路由 gate**（`mlp.gate`）：BF16
    - **MoE 专家投影**（`gate/up/down_proj`）：动态 W8A8

    请按[量化指南](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/feature_guide/quantization.html)操作，并保持生成目录结构不变，以便 `--quantization ascend` 加载。

prerequisites:
- title: 模型权重
  content: |-
    | 模型 | 硬件要求 | 下载 |
    | --- | --- | --- |
    | Qwen3-Omni-30B-A3B-Thinking（BF16） | Atlas 800I A3（64GB，1~2 卡） | [下载](https://www.modelscope.cn/models/Qwen/Qwen3-Omni-30B-A3B-Thinking) |
    | Qwen3-Omni-30B-A3B-Thinking-W8A8 | Atlas 800I A3（64GB，1~2 卡） | 使用 msmodelslim 本地量化 |
    | Eagle3 草稿模型（可选） | Atlas 800I A3 | [下载](https://www.modelscope.cn/models/AngelSlim/Qwen3-a3B_eagle3) |

    卡数为推荐值。请将权重放在容器可访问的共享目录。
- title: 驱动与固件
  content: |-
    启动容器前需在宿主机安装昇腾驱动与固件，并在容器内安装匹配的 Ascend HDK 工具包。版本请参考 [Ascend HDK 安装文档](https://www.hiascend.com/document)。

env_setup:
  container:
    A3:
      content: |-
        使用本 recipe 验证过的 vLLM-Ascend 官方一体化镜像。

        **拉取镜像：**

        ```bash
        docker pull quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
        ```

        **启动容器：**

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler

        docker run \
            --name vllm-ascend-env \
            --shm-size=128g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /models:/models \
            -it -d $IMAGE bash
        ```

        > **说明**：Atlas 800I A3 有 8 个 NPU、双 die 设计，共 16 个芯片。本 recipe 最多使用 4 个芯片（`/dev/davinci0` 至 `/dev/davinci3`），如需暴露其余芯片可继续添加 `--device`。

scenarios:
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: High Throughput
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      两芯片张量并行（TP2）部署可在保持官方 BF16 权重常驻的同时最大化并发请求的聚合吞吐。

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=1024
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve your_model_path \
          --served-model-name qwen3-omni \
          --trust-remote-code \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens 16384 \
          --tensor-parallel-size 2 \
          --distributed_executor_backend "mp" \
          {{prefix_caching}} \
          {{async_scheduling}} \
          {{compilation_config}} \
          --additional-config '{"enable_flashcomm1": false}' \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --port 8000 \
          {{spec_decoding}}
      ```

      > - 无需 `--quantization` 参数：官方 BF16 权重会按浮点权重加载。
      > - 验证配置默认关闭前缀缓存。
      > - 全模态输入复用同一个 OpenAI 兼容接口，无需额外服务端参数。
  - title: 验证服务
    content: |-
      ```bash
      curl http://localhost:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "qwen3-omni",
              "messages": [
                  {"role": "user", "content": "Reply with exactly one word: OK"}
              ],
              "temperature": 0,
              "max_tokens": 64
          }'
      ```

      预期结果：HTTP 200，`choices` 非空。

      全模态输入可在同一 message 中传入 `image_url`、`input_audio` 或 `video_url` 内容块。已验证在单次请求中同时提交一张图片、一段音频和一段视频，模型能给出连贯描述。
  - title: 性能基准
    content: |-
      ```bash
      vllm bench serve \
          --model your_model_path \
          --served-model-name qwen3-omni \
          --host 127.0.0.1 \
          --port 8000 \
          --dataset-name random \
          --random-input-len 200 \
          --random-output-len 512 \
          --num-prompts 200 \
          --max-concurrency 32 \
          --seed 1234 \
          --ignore-eos \
          --save-result \
          --result-dir ./
      ```

      Atlas 800I A3 + v0.30.0 镜像 + 官方 BF16 权重实测：200/200 成功，输出吞吐 960.72 tok/s，平均 TTFT 293.05 ms，平均 TPOT 30.60 ms。
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: Low Latency
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      四芯片张量并行并开启专家并行，可降低单 token 时延。该模型按上游教程关闭 FlashComm1。

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=1024
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True

      vllm serve your_model_path \
          --served-model-name qwen3-omni \
          --trust-remote-code \
          --max-num-seqs {{max_num_seqs}} \
          --max-model-len {{max_model_len}} \
          --max-num-batched-tokens 16384 \
          --tensor-parallel-size 4 \
          --enable-expert-parallel \
          --distributed_executor_backend "mp" \
          {{prefix_caching}} \
          {{async_scheduling}} \
          {{compilation_config}} \
          --additional-config '{"enable_flashcomm1": false}' \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --port 8000 \
          {{spec_decoding}}
      ```

      > - `ASCEND_RT_VISIBLE_DEVICES` 需指定 4 个芯片，TP4 会为每个芯片分配一个 rank。
      > - `--enable-expert-parallel` 将 MoE 专家分布到 4 个 rank。
  - title: 验证服务
    content: |-
      ```bash
      curl http://localhost:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "qwen3-omni",
              "messages": [
                  {"role": "user", "content": "Describe the color red in one short sentence."}
              ],
              "temperature": 0,
              "max_tokens": 128
          }'
      ```

      预期结果：HTTP 200，`choices` 非空。
  - title: 性能基准
    content: |-
      ```bash
      vllm bench serve \
          --model your_model_path \
          --served-model-name qwen3-omni \
          --host 127.0.0.1 \
          --port 8000 \
          --dataset-name random \
          --random-input-len 200 \
          --random-output-len 128 \
          --num-prompts 200 \
          --request-rate 1 \
          --seed 1234 \
          --ignore-eos \
          --save-result \
          --result-dir ./
      ```

      Atlas 800I A3 + v0.30.0 镜像 + 官方 BF16 权重实测：200/200 成功，输出吞吐 126.89 tok/s，平均 TTFT 168.74 ms，平均 TPOT 15.92 ms。
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: Long Context
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      长上下文场景保持 TP4 与专家并行，通过 YaRN 将上下文提升到 131072 tokens，并把 `--max-num-seqs` 降到 14。vLLM-Ascend v0.30.0 会严格校验 `max_position_embeddings`，当请求长度超过 checkpoint 声明值时需要设置 `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1`。

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      export HCCL_OP_EXPANSION_MODE="AIV"
      export HCCL_BUFFSIZE=1024
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

      vllm serve your_model_path \
          --served-model-name qwen3-omni \
          --trust-remote-code \
          --max-num-seqs 14 \
          --max-model-len 131072 \
          --max-num-batched-tokens 16384 \
          --tensor-parallel-size 4 \
          --enable-expert-parallel \
          --distributed_executor_backend "mp" \
          {{prefix_caching}} \
          {{async_scheduling}} \
          {{compilation_config}} \
          --additional-config '{"enable_flashcomm1": false}' \
          --gpu-memory-utilization {{gpu_memory_utilization}} \
          --port 8000 \
          --hf-overrides '{"rope_parameters": {"rope_type": "yarn", "factor": 2, "original_max_position_embeddings": 65536}}' \
          {{spec_decoding}}
      ```

      > - checkpoint 声明 65536 个位置，而场景请求 131072，因此需要 `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1`。
      > - KV Cache 接近 NPU 显存上限时，可继续降低 `--max-num-seqs`。
  - title: 验证服务
    content: |-
      发送超过 65536 tokens 的请求，确认返回内容正常、无超时。

      ```bash
      curl http://localhost:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "qwen3-omni",
              "messages": [
                  {"role": "user", "content": "Summarize the main idea of the text above in one sentence."}
              ],
              "temperature": 0,
              "max_tokens": 128
          }'
      ```

      预期结果：HTTP 200，`choices` 非空。
  - title: 性能基准
    content: |-
      ```bash
      vllm bench serve \
          --model your_model_path \
          --served-model-name qwen3-omni \
          --host 127.0.0.1 \
          --port 8000 \
          --dataset-name random \
          --random-input-len 8192 \
          --random-output-len 256 \
          --num-prompts 20 \
          --max-concurrency 4 \
          --seed 1234 \
          --ignore-eos \
          --save-result \
          --result-dir ./
      ```

      上述基准 20/20 请求成功，输出吞吐 201.30 tok/s，平均 TTFT 864.92 ms，平均 TPOT 16.54 ms。单条 70025 tokens 请求在 5.93 s 内返回正确动物名称（`fox`），无报错、无超时。

verification: |-
  服务启动后发送对话请求，`<port>` 替换为 `vllm serve` 中使用的端口。

  ```bash
  curl http://localhost:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "qwen3-omni",
          "messages": [
              {"role": "user", "content": "Give me a short introduction to large language models."}
          ],
          "temperature": 0.6,
          "top_p": 0.95,
          "max_tokens": 512
      }'
  ```

  预期结果：HTTP 200，返回 JSON 中的 `choices` 非空。

evaluation:
  accuracy:
    content: |-
      ### 使用 EvalScope

      EvalScope 支持 OpenAI 兼容接口与 OmniBench 数据集：

      ```bash
      python3 -m venv /root/eval-venv
      /root/eval-venv/bin/pip install -U "numpy>=2.0" evalscope
      /root/eval-venv/bin/evalscope eval \
          --model qwen3-omni \
          --api-url http://127.0.0.1:8000/v1 \
          --api-key EMPTY \
          --eval-type openai_api \
          --datasets omni_bench gsm8k bbh \
          --dataset-args '{"omni_bench": {"extra_params": {"use_image": true, "use_audio": false}}}' \
          --limit 100 \
          --eval-batch-size 4 \
          --generation-config '{"max_tokens": 10000, "temperature": 0.6}'
      ```

      **精度结果（Atlas 800I A3，vLLM-Ascend v0.30.0，W8A8，每个数据集 100 题）：**

      | 数据集 | 指标 | 分数 |
      | --- | --- | --- |
      | OmniBench（图像） | accuracy | 49.00% |
      | GSM8K | accuracy | 99.00% |
      | BBH | accuracy | 未完成 |

      已完成的两项与上游教程参考值（v0.22.1rc，W8A8）一致：OmniBench 0.44、GSM8K 0.98。
      BBH 未完成：EvalScope 会把 --limit 100 展开为每个 BBH 子任务 100 题（共 2700 题），
      超出本次验证时间预算；教程参考值为 0.9148。

performance:
  accuracy: |-
    ### 使用 EvalScope

    命令见评测章节。下方精度数据为可选的 W8A8 参考结果，基于 TP1 W8A8 服务测得；默认 BF16 配置本次完成了功能与性能验证，未重新评测精度。

  benchmark: |-
    ### 实测结果

    以下数据均在单台 Atlas 800I A3（共 16 芯片，最多使用 4 芯片）与 `quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler` 镜像上采集。

    | 场景 | TP | 请求数 | 并发 | 输出吞吐（tok/s） | 平均 TTFT（ms） | 平均 TPOT（ms） |
    | --- | --- | --- | --- | --- | --- | --- |
    | 高吞吐 | 2 | 200/200 | 32 | 960.72 | 293.05 | 30.60 |
    | 低时延 | 4 | 200/200 | 1 QPS | 126.89 | 168.74 | 15.92 |
    | 长上下文 | 4 | 20/20 | 4 | 201.30 | 864.92 | 16.54 |

    基准形状：高吞吐为 200 输入 / 512 输出、并发 32；低时延为 200 输入 / 128 输出、每秒 1 请求；长上下文为 8192 输入 / 256 输出、并发 4，并额外用 70025 tokens 单请求做功能验证。以上数据均使用官方 BF16 权重。

    ### 场景概览

    | 场景 | 部署方式 | NPU 总数 | 权重版本 | 关键考量 |
    | --- | --- | --- | --- | --- |
    | 高吞吐 | 单节点（TP2） | 2（A3） | BF16 | 两芯片 TP 保持官方权重常驻，并最大化并发请求处理能力 |
    | 低时延 | 单节点（TP4） | 2（A3） | BF16 | 多芯片 TP + 专家并行降低单 token 时延 |
    | 长上下文 | 单节点（TP4） | 2（A3） | BF16 | 降低并发序列数为 131072 tokens 上下文预留空间 |

    > Atlas 800I A3 每个 NPU 包含两个 die（芯片），因此 TP4 使用 4 个芯片，即 2 个 NPU。

tuning: |-
  ### 调优建议

  - 逐步提高 `--max-num-seqs` 直到 NPU 显存或调度成为瓶颈。
  - 全模态请求超时时，降低 `--max-num-seqs` 与 `--max-model-len`。
  - 验证场景关闭前缀缓存；对于重复媒体或提示前缀的业务，可开启并先评估命中率。
  - 更多选项见[性能调优文档](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)。

faq: |-
  **为什么需要 `VLLM_ALLOW_LONG_MAX_MODEL_LEN=1`？** checkpoint 声明 65536 个位置，vLLM-Ascend v0.30.0 在 `--max-model-len` 更大时会拒绝启动。长上下文场景需同时设置该变量与 YaRN 覆盖项。

  **是否有公开的 W8A8 权重？** 没有。请使用 msmodelslim 对官方 BF16 权重量化，生成的目录可直接通过 `--quantization ascend` 加载。W8A8 是面向显存受限部署的可选路径，不属于 CI 验证场景。

  **CI 验证哪种精度？** BF16。三个场景均加载公开的官方 BF16 权重，无需本地转换权重。

  **是否支持 Eagle3 投机推理？** 支持。可选的草稿模型通过默认关闭的 `spec_decoding` 特性提供，已在 Atlas 800I A3 的 TP1 上完成功能验证（4/4 HTTP 200，日志无 ERROR/Traceback）。启用前请将 `your_eagle3_model_path` 替换为本地草稿模型目录。上方性能表仍为非 Eagle3 基线。

  **Thinking 版本会返回推理内容吗？** 会。响应 message 中包含推理轨迹，`max_tokens` 需同时覆盖推理与最终答案。

