meta:
  title: "Qwen3.5-27B/Qwen3.6-27B"
  slug: "qwen3.5-27b-qwen3.6-27b"
  provider: "Qwen"
  description: "Qwen3.5-27B 与 Qwen3.6-27B 是 Qwen3.5/Qwen3.6 系列的稠密混合 Mamba-Transformer 语言模型，在架构效率、强化学习规模和全球可访问性方面均有突破。两者共享相同的混合注意力设计（GDN + 全注意力）和 MTP 头设计，在昇腾 NPU 上的部署方式一致，适用于对话、内容创作、代码生成等通用文本生成任务。"
  date_added: 2026-07-27
  tasks:
    - text
  performance_headline: "Atlas 800 A2/A3 单节点部署，采用 TP=2 + DP=8 的 DP-first 并行策略"
  date_updated: 2026-07-27
  difficulty: advanced
  related_recipes:
    - "Qwen/Qwen3-30B-A3B"
  hardware:
    atlas_800_a3: verified
    atlas_800_a2: verified
    atlas_300i_duo: verified

model:
  model_id: "Qwen/Qwen3.6-27B"
  min_vllm_version: "0.18.0rc1"
  architecture: dense
  parameter_count: "27B"
  active_parameters: null
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    HCCL_BUFFSIZE: "512"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0rc1"
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.23.0rc1-a3"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:v0.23.0rc1-310p"
  nightly_required: false
  install:
    # Ascend 推荐 Docker 方式;pip 需源码编译,不提供官方 wheel,隐藏 pip 标签。
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=512g -v /root/.cache/modelscope:/root/.cache/modelscope --device /dev/davinci0 --device /dev/davinci1 ... --device /dev/davinci7 -it quay.io/ascend/vllm-ascend:v0.23.0rc1 bash"
      note: "Ascend 官方镜像;完整设备/驱动挂载见 env_setup.container。"

# —— 上游对齐:features / variants / strategies / overrides / guide ——
features:
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP 投机解码(qwen3_5_mtp,3 个投机 token),加速推理"
    args: ["--speculative-config", '{"method": "qwen3_5_mtp", "num_speculative_tokens": 3, "enforce_eager": true}']
  compilation_config:
    label: "Compilation Config"
    description: "decode 阶段全 ACL 图执行(--compilation-config cudagraph_mode=FULL_DECODE_ONLY)"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "异步调度,CPU 调度与 NPU 计算重叠"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV 缓存前缀缓存(--enable-prefix-caching / --no-enable-prefix-caching)"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  cpu_binding:
    label: "CPU Binding"
    description: "CPU 核绑定,降低 NUMA 时延"
    args: ["--additional-config", '{"enable_cpu_binding":true}']
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm 通信优化"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"

opt_in_features:
  - prefix_caching

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 33
    description: "W8A8 量化权重,适用于 Atlas 800 A2/A3"
  w8a8_mtp:
    model_id: "Eco-Tech/Qwen3.5-27B-w8a8-mtp"
    precision: W8A8
    vram_minimum_gb: 33
    description: "W8A8 + MTP 权重(Qwen3.5-27B-w8a8-mtp)"
  bf16:
    model_id: "Qwen/Qwen3.6-27B"
    precision: bf16
    vram_minimum_gb: 65
    description: "BF16 权重,适用于 Atlas 800 A3"

compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_310p
  - pd_cluster

hardware_overrides: {}
strategy_overrides: {}

dependencies: []

guide: ""

# —— 可配置数值参数(页面/CI 扩展;默认值 = tutorial 基线)——
config_params:
  max_model_len:
    default: 133000
    type: number
    description: "最大上下文长度(输入+输出 token 之和)"
  max_num_seqs:
    default: 32
    type: number
    description: "最大并发序列数"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "KV cache 可用的显存比例"

overview: |-
  Qwen3.5-27B 与 Qwen3.6-27B 是 Qwen3.5/Qwen3.6 系列的稠密混合 Mamba-Transformer 语言模型。两者共享相同的混合注意力设计（GDN + 全注意力）和 MTP 头设计，在昇腾 NPU 上的部署方式完全一致，适用于对话、内容创作、代码生成等通用文本生成任务。

  本文档涵盖：
    - 支持的特性与特性配置
    - 环境准备（Docker 镜像 / 源码安装）
    - Atlas 800 A2 / A3 单节点部署
    - Atlas 800 A3 多节点 PD 分离部署（基于 Mooncake）
    - 功能、精度与性能评估
    - 性能调优建议

  硬件支持：
    - Atlas 800 A3 (64G × 16)：单节点 + 多节点 PD 分离
    - Atlas 800I A2 (64G × 8)：仅支持单节点，不支持多节点 PD 分离
    - **最低版本要求**（参考 vllm-ascend release notes）：
      - `Qwen3.5-27B`：`vllm-ascend:v0.17.0rc1` 起支持
      - `Qwen3.6-27B`：`vllm-ascend:v0.18.0rc1` 起支持
      - Atlas 300I DUO昇腾产品（A2 300I 推理等）：`vllm-ascend:v0.23.0rc1` 起支持
      - 在 Atlas 800 A3 上跑 Qwen3.6-27B，请使用对应的 `v0.18.0rc1-a3`（或更新的 `-a3`）镜像
      - 在Atlas 300I DUO昇腾产品上，请使用 `vllm-ascend:v0.23.0rc1-310p`（或更新的 `-310p`）镜像

  本文档基于 `vllm-ascend:v0.23.0rc1` 验证。**强烈建议使用最新的 rc 或正式版本**以获得最佳兼容性和最新特性。

  > **说明**：本文档中部署命令以 `Qwen3.5-27B-w8a8-mtp`（及等价的 `Qwen3.6-27B-w8a8`）为例。BF16 部署请移除 `--quantization ascend`；跑 Qwen3.6-27B 时，将模型路径替换为 `Eco-Tech/Qwen3.6-27B-w8a8`、`--served-model-name` 替换为 `qwen3.6`。

