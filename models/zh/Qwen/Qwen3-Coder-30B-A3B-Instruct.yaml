meta:
  title: "Qwen3-Coder-30B-A3B-Instruct"
  slug: "qwen3-coder-30b-a3b-instruct"
  provider: "Qwen"
  description: "30.5B 总参、3.3B 激活的 MoE 代码模型，支持智能体编码、函数调用，原生上下文长度 262144 tokens。"
  date_added: 2026-11-19
  performance_headline: "Atlas 800I A3 单节点 W8A8 部署，覆盖高吞吐、低时延与 128K 长上下文场景"
  difficulty: intermediate
  hardware:
    atlas_800_a3: verified

model:
  model_id: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  min_vllm_version: "0.30.0"
  architecture: moe
  parameter_count: "30.5B"
  active_parameters: "3.3B"
  context_length: 262144
  modality: text
  base_args:
    - "--trust-remote-code"
  base_env:
    HCCL_BUFFSIZE: "1024"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler"
  nightly_required: false
  install:
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g -v /models:/models --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 -it quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler bash"
      note: "昇腾官方镜像；完整设备与驱动挂载见 env_setup.container。"

features:
  expert_parallel:
    description: "MoE 专家并行，适用于 TP4 场景"
    args: ["--enable-expert-parallel"]
  compilation_config:
    label: "Compilation Config"
    description: "Decode 阶段使用完整 ACL 图（--compilation-config cudagraph_mode=FULL_DECODE_ONLY）"
    args: ["--compilation-config", '{"cudagraph_mode": "FULL_DECODE_ONLY"}']
  async_scheduling:
    label: "Async Scheduling"
    description: "异步调度，重叠 CPU 调度与 NPU 计算"
    args: ["--async-scheduling"]
  prefix_caching:
    label: "Prefix Caching"
    description: "KV Cache 前缀缓存（验证场景默认关闭）"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

opt_in_features:
  - prefix_caching

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 32
    description: "Atlas 800I A3 上的 W8A8 量化权重"
  bf16:
    model_id: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
    precision: bf16
    vram_minimum_gb: 60
    description: "Atlas 800I A3 上的 BF16 权重"

compatible_strategies:
  - single_node_A3

hardware_overrides: {}
strategy_overrides: {}

guide: ""

config_params:
  max_model_len:
    default: 37364
    type: number
    description: "最大上下文长度（输入与输出 token 之和）"
  max_num_seqs:
    default: 100
    type: number
    description: "最大并发序列数"
  gpu_memory_utilization:
    default: 0.95
    type: number
    description: "可用于 KV Cache 的 NPU 显存比例"

overview: |-
  Qwen3-Coder-30B-A3B-Instruct 是 30.5B 总参、3.3B 激活的 MoE 代码模型，面向智能体编码、仓库级代码生成与工具调用，原生支持 262144 tokens 上下文。本 recipe 覆盖上游教程的三个单节点场景：高吞吐（TP1）、低时延（TP4 + 专家并行）与 131072 tokens 长上下文（TP4）。

