    url: https://github.com/vllm-project/vllm-ascend/blob/v0.23.0.post1/docs/source/tutorials/models/Qwen3-Next.md
  - title: "BF16 权重（ModelScope）"
    url: https://www.modelscope.cn/models/Qwen/Qwen3-Next-80B-A3B-Instruct
  - title: "模型卡（HuggingFace）"
    url: https://huggingface.co/Qwen/Qwen3-Next-80B-A3B-Instruct
