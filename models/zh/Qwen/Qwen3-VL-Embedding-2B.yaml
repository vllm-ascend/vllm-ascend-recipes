  pip:
    content: |-
      如果不使用 Docker 镜像，也可以从源码构建：

      - 从源码安装 `vllm-ascend`，参考[安装指南](https://docs.vllm.ai/projects/ascend/en/latest/installation.html)。

      如需部署多节点环境，需要在每个节点上配置环境。
scenarios:
  - npu: Atlas 800I A2
    precision: bf16
    deployment: 单节点
    case: 单节点单卡
    tags: [a2-single]
    strategy: single_node_A2
    steps:
      - title: 启动服务
        content: |-
          单卡 pooling 部署，适合开发、测试与中小规模嵌入服务场景。

          ```bash
          vllm serve Qwen/Qwen3-VL-Embedding-2B \
              --served-model-name Qwen/Qwen3-VL-Embedding-2B \
              --runner pooling \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - `--max-model-len` 表示上下文长度，即单条请求输入与输出的最大 token 数。若自动解析得到较大的上下文长度，分配该掩码（O(max_model_len^2)）可能超出 NPU 显存并触发 OOM。请务必显式设置保守值，例如 1024。
          > - 如已提前下载权重，请将 `Qwen/Qwen3-VL-Embedding-2B` 替换为本地权重目录。
      - title: 服务验证
        content: |-
          服务启动后，发送一条嵌入请求进行验证。用法示例参见下方"服务验证"部分。
  - npu: Atlas 300I DUO
    precision: fp16
    deployment: 单节点
    case: 300I DUO (TP1)
    tags: [310p-single]
    strategy: single_node_310p
    steps:
      - title: 启动服务
        content: |-
          Atlas 300I DUO 单节点 pooling 部署（TP=1）。

          ```bash
          vllm serve Qwen/Qwen3-VL-Embedding-2B \
              --served-model-name Qwen/Qwen3-VL-Embedding-2B \
              --compilation-config '{"cudagraph_capture_sizes": [1024,512]}' \
              --additional-config '{"ascend_compilation_config": {"fuse_norm_quant": false}}' \
              --runner pooling \
              --dtype float16 \
              --port 8000 \
              --max-model-len {{max_model_len}}
          ```

          > - `--compilation-config`：Atlas 300I DUO 受硬件流数量限制，需要限制 `cudagraph_capture_sizes` 的规模。
          > - `--dtype float16`：与 Atlas 300I DUO 推理执行路径一致。
          > - `--max-model-len`：若自动解析得到较大的上下文长度，分配该掩码（O(max_model_len^2)）可能超出 NPU 显存并触发 OOM。请务必显式设置保守值，例如 1024。
      - title: 服务验证
        content: |-
          服务启动后，发送一条嵌入请求进行验证。用法示例参见下方"服务验证"部分。
verification: |-
  服务启动后，可通过以下命令进行验证：

  ```bash
  curl -X POST http://localhost:<port>/v1/embeddings -H "Content-Type: application/json" -d '{
    "input": [
      "The capital of China is Beijing.",
      "Gravity is a force that attracts two bodies towards each other. It gives weight to physical objects and is responsible for the movement of planets around the sun."
    ]
  }'
  ```

  > - **URL**：将 `localhost` 替换为服务器 IP，端口与 `vllm serve` 命令一致。

  预期结果：服务返回 HTTP 200 OK，JSON 响应包含 `embedding` 字段。示例输出：

  ```json
  {
    "id": "embd-8136155c01e8411d",
    "object": "list",
    "created": 1784538286,
    "model": "Qwen/Qwen3-VL-Embedding-2B",
    "data": [
      {
        "index": 0,
        "object": "embedding",
        "embedding": [-0.028474265709519386, -0.02678542211651802]
      },
      {
        "index": 1,
        "object": "embedding",
        "embedding": [-0.016785264015197754, -0.003787524998188019]
      }
    ],
    "usage": {
      "prompt_tokens": 39,
      "total_tokens": 39,
      "completion_tokens": 0,
      "prompt_tokens_details": null
    }
  }
  ```

  更多用法示例请参考[嵌入示例](https://github.com/vllm-project/vllm/tree/main/examples/pooling/embed)。
evaluation:
  accuracy:
    content: |-
      ### 使用 MTEB

      详见 [MTEB](https://docs.mteb.org/)。

      运行以下代码执行精度评测：

      ```python
      import os
      import mteb

      from mteb.models.vllm_wrapper import VllmEncoderWrapper

      if __name__ == "__main__":
          data_path = "/home/data/mteb_data"
          os.environ["HF_DATASETS_CACHE"] = data_path
          os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"

          model = VllmEncoderWrapper("/root/.cache/Qwen3-VL-Embedding-2B",
                                      revision="norm",
                                      dtype="float16",
                                      max_model_len=10240,
                                      )

          cache = mteb.ResultCache(data_path)
          tasks = mteb.get_tasks(tasks=["LeCaRDv2"])
          results = mteb.evaluate(model, tasks=tasks, cache=cache, encode_kwargs={"batch_size": 2}, overwrite_strategy="always")
          df = results.to_dataframe()
          print(df)
      ```

      执行完成后即可得到评测结果。
  performance:
    content: |-
      ### 使用 vLLM Benchmark

      以 `Qwen3-VL-Embedding-2B` 的性能评测为例，详见 [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/cli/)。

      以 `serve` 子命令为例，运行以下命令：

      ```bash
      vllm bench serve --model Qwen/Qwen3-VL-Embedding-2B --backend openai-embeddings --port 8000 --dataset-name random --endpoint /v1/embeddings --random-input 200 --save-result --result-dir ./
      ```

      等待数分钟即可获得性能评测结果。
performance:
  accuracy: |-
    官方教程未发布该模型的固定精度数据。请使用"更多信息"页签中的 MTEB 评测在自己的部署环境实测检索精度。
  benchmark: |-
    官方未发布该模型的固定吞吐/延迟数据；实际结果取决于硬件资源、输入长度、并发数与运行时配置。

    请使用"更多信息"页签中可复现的 `vllm bench serve --backend openai-embeddings` 命令，在自己的部署环境实测嵌入吞吐与延迟。
