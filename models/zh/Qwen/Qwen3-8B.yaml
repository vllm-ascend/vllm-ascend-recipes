- npu: Atlas 300I DUO
  precision: W8A8SC-310
  deployment: Single-Node
  case: TP1
  strategy: single_node_310p
  npu_per_node: 1
  steps:
  - title: 启动服务
    content: |-
      使用与 TP 一致的分片权重目录。310P 使用 FP16，保留教程的图捕获批大小，并关闭前缀缓存和 npugraph_ex。

      默认端口为 `8080`。

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0

      vllm serve /weights/Qwen3-8B-w8a8sc-310-vllm/TP1/Qwen3-8B-w8a8sc-310-vllm-tp1 \
          --host 127.0.0.1 \
          --port 8080 \
          --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.90 \
          --max-num-seqs 32 \
          --served-model-name qwen3 \
          --dtype float16 \
          --additional-config '{"ascend_compilation_config": {"enable_npugraph_ex":false}}' \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY", "cudagraph_capture_sizes": [1,2,4,8,16,32]}' \
          --quantization ascend \
          --max-model-len 20480 \
          --no-enable-prefix-caching \
          --load-format sharded_state
      ```
  - title: 检查服务
    content: |-
      启动后，将 `<server_ip>` 替换为 `127.0.0.1`，并使用启动时的端口。模型列表应包含 `qwen3`。

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/health
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/models
      ```
  - title: 发送推理请求
    content: |-
      确认请求返回 HTTP 200，且 `choices[0].message.content` 非空。

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3","messages":[{"role":"user","content":"What is the capital of France?"}],"temperature":0.6,"top_p":0.95,"top_k":20,"max_tokens":64,"chat_template_kwargs":{"enable_thinking":false}}'
      ```
evaluation:
  accuracy:
    content: |-
      按 [AISBench 指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html) 配置 `vllm_api_general_chat.py`，使用本地权重路径、服务端口和模型名称 `qwen3`。教程使用 batch_size=32、max_out_len=32768、temperature=0.6、top_k=20、top_p=0.95 和 extract_non_reasoning_content。输出长度须适配服务上下文。

      ```bash
      ais_bench --models vllm_api_general_chat --datasets aime2025_gen_0_shot_chat_prompt --debug
      ```
  performance:
    content: |-
      将 AISBench 流式接口配置 `vllm_api_stream_chat.py` 指向同一服务。教程使用 batch_size=90、max_out_len=1500、temperature=0 和 ignore_eos=True。记录请求吞吐、输出 token 吞吐、平均和 P99 TTFT/TPOT。比较前固定权重、硬件、输入输出长度和并发。

      ```bash
      ais_bench --models vllm_api_stream_chat --datasets gsm8k_gen_0_shot_cot_str_perf --debug --summarizer default_perf --mode perf --num-prompts 360
      ```

      ```bash
      vllm bench serve --model "$WEIGHT_PATH" --served-model-name qwen3 --port "$PORT" --dataset-name random --random-input-len 200 --num-prompts 200 --request-rate 1 --save-result --result-dir .
      ```
