meta:
  title: Qwen3-8B
  slug: qwen3-8b
  provider: Qwen
  description: Qwen3-8B 昇腾单机推理配方。
  date_added: '2026-11-19'
  difficulty: intermediate
  hardware:
    atlas_800_a2: experimental
    atlas_800_a3: experimental
    atlas_300i_duo: experimental
model:
  model_id: Qwen/Qwen3-8B
  architecture: dense
  parameter_count: 8B
  active_parameters: null
  context_length: 40960
  modality: text
  min_vllm_version: 0.21.0
  docker_image:
    atlas_800_a2: quay.io/ascend/vllm-ascend:nightly-main
    atlas_800_a3: quay.io/ascend/vllm-ascend:nightly-main-a3
    atlas_300i_duo: quay.io/ascend/vllm-ascend:nightly-main-310p
  nightly_required: false
compatible_strategies:
- single_node_A2
- single_node_A3
- single_node_310p
overview: |-
  Qwen3-8B 是用于文本生成的稠密模型。原生上下文为 40,960 token。

  任务早期列出的 Dense W4A8 线性量化已在 [vLLM Ascend #13713](https://github.com/vllm-project/vllm-ascend/pull/13713) 中移除。W8A8SC-310 仍是独立的 Atlas 300I DUO 部署选项。
weight_download:
- weight_version: BF16
  sources:
  - source: HuggingFace
    url: https://huggingface.co/Qwen/Qwen3-8B
    command: |-
      ```bash
      hf download Qwen/Qwen3-8B --local-dir "$MODEL_DIR/Qwen3-8B"
      ```
  - source: ModelScope
    url: https://www.modelscope.cn/models/Qwen/Qwen3-8B
    command: |-
      ```bash
      modelscope download --model Qwen/Qwen3-8B --local_dir "$MODEL_DIR/Qwen3-8B"
      ```
- weight_version: W8A8SC-310
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/Eco-Tech/Qwen3-8B-w8a8sc-310-vllm
    command: |-
      ```bash
      modelscope download --model Eco-Tech/Qwen3-8B-w8a8sc-310-vllm --local_dir "$MODEL_DIR/Qwen3-8B-w8a8sc-310-vllm"
      ```
prerequisites:
- title: 权重与设备
  content: 在同一宿主机终端设置 `MODEL_DIR` 为权重父目录，然后运行对应的下载命令。容器将该目录挂载为 `/weights`。安装所选下载来源的 CLI，并通过 `npu-smi info` 确认可用芯片。默认按该平台所列场景的最大
    TP 映射芯片。将 `NPU_COUNT` 设为所选场景的 TP，可只映射需要的芯片。
env_setup:
  pip:
    content: 源码安装与驱动兼容性参见[安装指南](https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html)。在非容器环境执行命令时，将
      `/weights` 替换为实际目录。
      310P 源码安装若引入了 `triton-ascend` 或 `triton`，请在启动服务之前卸载它们。
  container:
    A2:
      content: |-
        ```bash
        IMAGE=quay.io/ascend/vllm-ascend:nightly-main
        MODEL_DIR="${MODEL_DIR:?Set MODEL_DIR to the absolute parent directory of the downloaded weights}"
        NPU_COUNT="${NPU_COUNT:-1}"
        device_flags=(
          --device /dev/davinci0
        )
        devices=("${device_flags[@]:0:2*NPU_COUNT}")
        docker pull "$IMAGE"
        docker run --rm -it --name qwen3-${USER} --shm-size=10g --net=host \
          "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm \
          --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
          -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
          -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
          -v "$MODEL_DIR:/weights:ro" "$IMAGE" bash
        ```
    A3:
      content: |-
        ```bash
        IMAGE=quay.io/ascend/vllm-ascend:nightly-main-a3
        MODEL_DIR="${MODEL_DIR:?Set MODEL_DIR to the absolute parent directory of the downloaded weights}"
        NPU_COUNT="${NPU_COUNT:-1}"
        device_flags=(
          --device /dev/davinci0
        )
        devices=("${device_flags[@]:0:2*NPU_COUNT}")
        docker pull "$IMAGE"
        docker run --rm -it --name qwen3-${USER} --shm-size=10g --net=host \
          "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm \
          --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
          -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
          -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
          -v "$MODEL_DIR:/weights:ro" "$IMAGE" bash
        ```
    Atlas 300I DUO:
      content: |-
        ```bash
        IMAGE=quay.io/ascend/vllm-ascend:nightly-main-310p
        MODEL_DIR="${MODEL_DIR:?Set MODEL_DIR to the absolute parent directory of the downloaded weights}"
        NPU_COUNT="${NPU_COUNT:-1}"
        device_flags=(
          --device /dev/davinci0
        )
        devices=("${device_flags[@]:0:2*NPU_COUNT}")
        docker pull "$IMAGE"
        docker run --rm -it --name qwen3-${USER} --shm-size=10g --net=host \
          "${devices[@]}" --device /dev/davinci_manager --device /dev/devmm_svm \
          --device /dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
          -v /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
          -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
          -v "$MODEL_DIR:/weights:ro" "$IMAGE" bash
        ```
scenarios:
- npu: Atlas 800I A2
  precision: BF16
  deployment: Single-Node
  case: TP1
  strategy: single_node_A2
  npu_per_node: 1
  steps:
  - title: 启动服务
    content: |-
      使用原始 BF16 权重。启动方式沿用官方 Qwen3 快速入门，并按模型大小分配张量并行芯片。

      默认端口为 `8000`。

      ```bash
      export ASCEND_RT_VISIBLE_DEVICES=0
      MODEL_PATH=Qwen/Qwen3-8B
      if [[ -r /weights/Qwen3-8B/config.json ]]; then MODEL_PATH=/weights/Qwen3-8B; fi
      vllm serve "$MODEL_PATH" --served-model-name qwen3 --dtype bfloat16 --host 127.0.0.1 --port 8000 --tensor-parallel-size 1
      ```
  - title: 检查服务
    content: |-
      启动后，将 `<server_ip>` 替换为 `127.0.0.1`，并使用启动时的端口。模型列表应包含 `qwen3`。

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/health
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/models
      ```
  - title: 发送推理请求
    content: |-
      确认请求返回 HTTP 200，且 `choices[0].message.content` 非空。

      ```bash
      curl -sS --fail-with-body http://<server_ip>:<port>/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"qwen3","messages":[{"role":"user","content":"What is the capital of France?"}],"temperature":0.6,"top_p":0.95,"top_k":20,"max_tokens":64,"chat_template_kwargs":{"enable_thinking":false}}'
      ```
- npu: Atlas 800I A3
  precision: BF16
  deployment: Single-Node
  case: TP1
  strategy: single_node_A3
  npu_per_node: 1
  steps:
  - title: 启动服务
    content: |-
      使用原始 BF16 权重。启动方式沿用官方 Qwen3 快速入门，并按模型大小分配张量并行芯片。

      默认端口为 `8000`。

