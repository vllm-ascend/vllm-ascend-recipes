meta:
  title: "Qwen3.6-35B-A3B"
  slug: "qwen3.6-35b-a3b"
  provider: "Qwen"
  description: "Qwen3.6-35B-A3B 的昇腾 NPU 部署指南。"
  date_added: "2026-10-28"
  difficulty: "intermediate"
  tasks:
    - "text"
  hardware:
    atlas_800_a3: "verified"
    atlas_800_a2: "experimental"
    ascend_950dt: "experimental"
    atlas_300i_duo: "experimental"

model:
  model_id: "Qwen/Qwen3.6-35B-A3B"
  min_vllm_version: "0.18.0rc1"
  architecture: "moe"
  parameter_count: "35B"
  active_parameters: "3B"
  context_length: 262144
  modality: "multimodal"
  base_args:
    - "--served-model-name"
    - "qwen3.6"
  base_env:
    VLLM_USE_MODELSCOPE: "True"
  docker_image:
    atlas_800_a3: "quay.io/ascend/vllm-ascend@sha256:943b63f8f634f09e3f8ca810f0d8c7a8c68a8e5312dfcb241caf0b0a48487c73"
    atlas_800_a2: "quay.io/ascend/vllm-ascend:nightly-main"
    ascend_950dt: "quay.io/ascend/vllm-ascend:nightly-main-a5"
    atlas_300i_duo: "quay.io/ascend/vllm-ascend:nightly-main-310p"
  nightly_required: true
  install:
    pip: false
    docker:
      command: "docker pull quay.io/ascend/vllm-ascend@sha256:943b63f8f634f09e3f8ca810f0d8c7a8c68a8e5312dfcb241caf0b0a48487c73"
      note: "各硬件镜像及设备挂载见下方环境准备。"

variants:
  default:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w8a8"
    precision: "W8A8"
    vram_minimum_gb: 48
    supported_hardware:
      - "atlas_800_a3"
      - "atlas_800_a2"
      - "atlas_300i_duo"
    description: "W8A8 量化权重。"
  bf16:
    model_id: "Qwen/Qwen3.6-35B-A3B"
    precision: "BF16"
    vram_minimum_gb: 84
    description: "原始 BF16 权重。"
  mxfp8:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8"
    precision: "W8A8 MXFP8"
    supported_hardware:
      - "ascend_950dt"
    description: "950DT 的 W8A8 MXFP8 权重。"
  c8_mxfp8:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8"
    precision: "W8A8C8 MXFP8"
    supported_hardware:
      - "ascend_950dt"
    description: "搭配 MXFP8 KV cache 的 950DT 权重。"
  w4a8_mxfp:
    model_id: "Eco-Tech/Qwen3.6-35B-A3B-w4a8-mxfp"
    precision: "W4A8 MXFP"
    supported_hardware:
      - "ascend_950dt"
    description: "950DT 的 W4A8 MXFP 权重，部署要求参见模型卡片。"

compatible_strategies:
  - "single_node_A3"
  - "single_node_A2"
  - "single_node_A5"
  - "single_node_310p"

hardware_overrides:
  atlas_800_a3:
    extra_args:
      - "--dtype"
      - "bfloat16"

strategy_overrides: {}

guide: ""

config_params:
  gpu_memory_utilization:
    default: 0.9
    type: "number"
    description: "模型执行器使用的 NPU 显存比例"

overview: "Qwen3.6-35B-A3B 是稀疏 MoE 模型，总参数量 35B，每 token 激活约 3B；结合门控 Delta 网络与全注意力，支持文本和视觉语言任务。"

