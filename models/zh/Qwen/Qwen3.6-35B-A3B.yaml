prerequisites:
  - title: "硬件"
    content: "A2/A3 和 Atlas 300I DUO 示例使用两个 NPU，950DT 示例使用一个 96 GB NPU。"
  - title: "软件"
    content: "模型从 vLLM-Ascend v0.18.0rc1 开始支持，950DT 要求 v0.30.0 及以上。以下示例使用 main 镜像，A3 镜像包含 vLLM 0.32.0 和 CANN 9.2。驱动与固件兼容要求参见[安装指南](https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html)。"

env_setup:
  container:
    A3:
      content: |-
        按宿主机配置设备编号和挂载路径。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend@sha256:943b63f8f634f09e3f8ca810f0d8c7a8c68a8e5312dfcb241caf0b0a48487c73
        export NAME=vllm-ascend

        docker run --rm \
          --name $NAME \
          --net=host \
          --shm-size=16g \
          --device /dev/davinci0 \
          --device /dev/davinci1 \
          --device /dev/davinci_manager \
          --device /dev/devmm_svm \
          --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    Atlas 800 A2:
      content: |-
        按宿主机配置设备编号和挂载路径。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:nightly-main
        export NAME=vllm-ascend

        docker run --rm \
          --name $NAME \
          --net=host \
          --shm-size=16g \
          --device /dev/davinci0 \
          --device /dev/davinci1 \
          --device /dev/davinci_manager \
          --device /dev/devmm_svm \
          --device /dev/hisi_hdc \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
          -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    A5:
      content: |-
        按宿主机配置设备编号和挂载路径。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:nightly-main-a5
        export NAME=vllm-ascend

        docker run --rm \
          --name $NAME \
          --net=host \
          --shm-size=500g \
          --device /dev/davinci_manager \
          --device /dev/hisi_hdc \
          --device /dev/ummu \
          --device /dev/uburma \
          --device /dev/davinci0 \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /usr/local/Ascend/firmware:/usr/local/Ascend/firmware \
          -v /root/host:/root/host  \
          -v /usr/local/sbin:/usr/local/sbin \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /var/log/npu:/usr/slog \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /etc/hixlep:/etc/hixlep \
          -v /root/.cache:/root/.cache \
          -it $IMAGE bash
        ```
    Atlas 300I DUO:
      content: |-
        按宿主机配置设备编号和挂载路径。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:nightly-main-310p

        docker run --rm \
        --name vllm-ascend \
        --shm-size=10g \
        --device /dev/davinci0 \
        --device /dev/davinci1 \
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /root/.cache:/root/.cache \
        -p 8080:8080 \
        -it $IMAGE bash
        ```

scenarios:
  - npu: "Atlas 800I A3"
    precision: "W8A8"
    deployment: "单节点"
    case: "TP2 + DP1"
    tags:
      - "a3-single"
    strategy: "single_node_A3"
    steps:
      - title: "启动服务"
        content: |-
          在两个 64 GB NPU 上部署 W8A8 权重，采用 BF16 运行类型。

          ```bash
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          export LD_LIBRARY_PATH=/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:$LD_LIBRARY_PATH

          export VLLM_USE_MODELSCOPE=True
          export HCCL_BUFFSIZE=1024
          export ASCEND_RT_VISIBLE_DEVICES=0,1
          export VLLM_USE_V2_MODEL_RUNNER=1
          export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=3000
          export HCCL_OP_EXPANSION_MODE="AIV"
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export TASK_QUEUE_ENABLE=1

          vllm serve "Eco-Tech/Qwen3.6-35B-A3B-w8a8" \
            --host 0.0.0.0 \
            --port 8000 \
            --data-parallel-size 1 \
            --tensor-parallel-size 2 \
            --enable-expert-parallel \
            --quantization ascend \
            --served-model-name qwen3.6 \
            --max-num-seqs 128 \
            --max-model-len 135168 \
            --max-num-batched-tokens 4096 \
            --trust-remote-code \
            --safetensors-load-strategy lazy \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
            --dtype bfloat16 \
            --enable-prefix-caching \
            --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE"}' \
            --additional-config '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
          ```
      - title: "验证推理"
        content: "按下方“功能验证”检查服务，端口为 8000。"
  - npu: "Atlas 800I A2"
    precision: "W8A8"
    deployment: "单节点"
    case: "TP2 + DP1"
    tags:
      - "a2-single"
    strategy: "single_node_A2"
    steps:
      - title: "启动服务"
        content: |-
          在两个 NPU 上部署 W8A8 权重，采用 BF16 运行类型。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export HCCL_BUFFSIZE=1024
          export ASCEND_RT_VISIBLE_DEVICES=0,1
          export VLLM_USE_V2_MODEL_RUNNER=1
          export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=3000
          export HCCL_OP_EXPANSION_MODE="AIV"
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export TASK_QUEUE_ENABLE=1

          vllm serve "Eco-Tech/Qwen3.6-35B-A3B-w8a8" \
            --host 0.0.0.0 \
            --port 8000 \
            --data-parallel-size 1 \
            --tensor-parallel-size 2 \
            --enable-expert-parallel \
            --quantization ascend \
            --served-model-name qwen3.6 \
            --max-num-seqs 128 \
            --max-model-len 135168 \
            --max-num-batched-tokens 4096 \
            --trust-remote-code \
            --safetensors-load-strategy lazy \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
            --dtype bfloat16 \
            --enable-prefix-caching \
            --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE"}' \
            --additional-config '{"enable_cpu_binding":true,"multistream_overlap_shared_expert":true}'
          ```
      - title: "验证推理"
        content: "按下方“功能验证”检查服务，端口为 8000。"
  - npu: "Ascend 950DT"
    precision: "W8A8 MXFP8"
    deployment: "单节点"
    case: "TP1 + DP1"
    tags:
      - "a5-single"
    strategy: "single_node_A5"
    steps:
      - title: "启动服务"
        content: |-
          单 NPU 部署，启用 MTP 和静态内核。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export ASCEND_RT_VISIBLE_DEVICES=0
          export VLLM_USE_V2_MODEL_RUNNER=1
          export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=3000
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export TASK_QUEUE_ENABLE=1

          vllm serve "Eco-Tech/Qwen3.6-35B-A3B-w8a8-mxfp8" \
            --host 0.0.0.0 \
            --port 8000 \
            --served-model-name qwen3.6 \
            --trust-remote-code \
            --quantization ascend \
            --safetensors-load-strategy lazy \
            --tensor-parallel-size 1 \
            --data-parallel-size 1 \
            --max-model-len 135168 \
            --max-num-seqs 128 \
            --max-num-batched-tokens 4096 \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --additional-config '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}' \
            --enable-prefix-caching
          ```
      - title: "验证推理"
        content: "按下方“功能验证”检查服务，端口为 8000。"
  - npu: "Ascend 950DT"
    precision: "W8A8C8 MXFP8"
    deployment: "单节点"
    case: "TP1 + DP1"
    tags:
      - "a5-single"
    strategy: "single_node_A5"
    steps:
      - title: "启动服务"
        content: |-
          C8 权重搭配 MXFP8 KV cache。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export ASCEND_RT_VISIBLE_DEVICES=0
          export VLLM_USE_V2_MODEL_RUNNER=1
          export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=3000
          export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
          export OMP_PROC_BIND=false
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export TASK_QUEUE_ENABLE=1

          vllm serve "Eco-Tech/Qwen3.6-35B-A3B-w8a8c8-mxfp8" \
            --host 0.0.0.0 \
            --port 8000 \
            --served-model-name qwen3.6 \
            --trust-remote-code \
            --quantization ascend \
            --safetensors-load-strategy lazy \
            --tensor-parallel-size 1 \
            --data-parallel-size 1 \
            --max-model-len 135168 \
            --max-num-seqs 128 \
            --max-num-batched-tokens 4096 \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":3}' \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
            --additional-config '{"enable_cpu_binding":true,"ascend_compilation_config":{"enable_npugraph_ex":true,"enable_static_kernel":true,"enable_super_kernel":false}}' \
            --enable-prefix-caching \
            --kv-cache-dtype mxfp8
          ```
      - title: "验证推理"
        content: "按下方“功能验证”检查服务，端口为 8000。"
  - npu: "Atlas 300I DUO"
    precision: "W8A8"
    deployment: "单节点"
    case: "TP2"
    tags:
      - "310p-single"
    strategy: "single_node_310p"
    steps:
      - title: "启动服务"
        content: |-
          采用 FP16 运行类型，并关闭前缀缓存。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export ASCEND_RT_VISIBLE_DEVICES=0,1

          vllm serve "Eco-Tech/Qwen3.6-35B-A3B-w8a8" \
            --host 127.0.0.1 \
            --port 8080 \
            --tensor-parallel-size 2 \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --max-num-seqs 16 \
            --served-model-name qwen3.6 \
            --dtype float16 \
            --additional-config '{"ascend_compilation_config":{"enable_npugraph_ex":false}}' \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,8]}' \
            --quantization ascend \
            --max-model-len 20480 \
            --no-enable-prefix-caching
          ```
      - title: "验证推理"
        content: "按下方“功能验证”检查服务，端口为 8080。"
  - npu: "Atlas 300I DUO"
    precision: "W8A8"
    deployment: "单节点"
    case: "TP2 + MTP1"
    tags:
      - "310p-single"
    strategy: "single_node_310p"
    steps:
      - title: "启动服务"
        content: |-
          并发低于 2 时，可启用单 token MTP。

          ```bash
          export VLLM_USE_MODELSCOPE=True
          export ASCEND_RT_VISIBLE_DEVICES=0,1

          vllm serve "Eco-Tech/Qwen3.6-35B-A3B-w8a8" \
            --host 127.0.0.1 \
            --port 8080 \
            --tensor-parallel-size 2 \
            --gpu-memory-utilization {{gpu_memory_utilization}} \
            --max-num-seqs 16 \
            --served-model-name qwen3.6 \
            --dtype float16 \
            --additional-config '{"ascend_compilation_config":{"enable_npugraph_ex":false}}' \
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,8]}' \
            --quantization ascend \
            --max-model-len 20480 \
            --no-enable-prefix-caching \
            --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
          ```
      - title: "验证推理"
        content: "按下方“功能验证”检查服务，端口为 8080。"

verification: |-
  将命令中的服务地址和端口替换为实际值。预期返回 HTTP 200，模型名为 qwen3.6，choices 包含生成文本。

  ```bash
  curl -fsS -i http://<server_ip>:<port>/health
  curl -fsS http://<server_ip>:<port>/v1/models
  curl -fsS http://<server_ip>:<port>/v1/completions \
    -H 'Content-Type: application/json' \
    -d '{"model":"qwen3.6","prompt":"The future of AI is","max_tokens":50,"temperature":0}'
  curl -fsS http://<server_ip>:<port>/v1/chat/completions \
    -H 'Content-Type: application/json' \
    -d '{"model":"qwen3.6","messages":[{"role":"user","content":"Reply with only the number: 2+2."}],"max_tokens":128,"temperature":0,"chat_template_kwargs":{"enable_thinking":false}}'
  ```

performance:
  accuracy: "使用 [AISBench](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html) 评测精度。官方 W8A8 参考结果基于 A3 节点（16 × 64 GB）：MMMU 83.3%、GPQA 83.3%。MMMU 数据准备参见[数据集指南](https://github.com/AISBench/benchmark/blob/master/ais_bench/benchmark/configs/datasets/mmmu/README_en.md)，对比时保持数据版本与生成参数一致。"
  benchmark: |-
    使用 [vLLM benchmark](https://docs.vllm.ai/en/latest/benchmarking/) 或 [AISBench](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation) 评测性能。按部署配置调整主机、端口和权重，对比时固定输出长度。

    ```bash
    export VLLM_USE_MODELSCOPE=True
    vllm bench serve \
      --model Eco-Tech/Qwen3.6-35B-A3B-w8a8 \
      --served-model-name qwen3.6 \
      --host <server_ip> --port <port> \
      --dataset-name random --random-input-len 200 \
      --num-prompts 200 --request-rate 1 \
      --save-result --result-dir ./
    ```

tuning: |-
  以下为官方教程的参考配置。调整 TP 或 DP 时同步更新 ASCEND_RT_VISIBLE_DEVICES 和设备挂载，详见[调优指南](https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)和[特性矩阵](https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/feature_matrix.html)。

  | 场景 | TP | DP | 序列上限 | 上下文 | 批处理 token |
  | --- | --- | --- | --- | --- | --- |
  | 长上下文参考 | 2 | 1 | 128 | 262144 | 16384 |
  | 950DT / A2 / A3 部署基线 | 1 / 2 / 2 | 1 | 128 | 135168 | 4096 |
  | 高吞吐（8 个及以上 NPU） | 2 | 4+ | 每 DP 32 | 65536 | 8192 |
  | 低时延 | 2 | 1 | 按并发调整 | 32768 或 65536 | 1024–4096 |

  高吞吐场景可调整 DP、异步调度、序列并行和共享专家计算重叠；低时延场景采用全量 decode ACLGraph，并对比 MTP 设置。前缀缓存适用于重复前缀负载。

faq: |-
  **GroupedMatmul 错误 161002：** CANN 9.2 下，A2/A3 的 W8A8 配置采用 --dtype bfloat16。

  **共享内存：** /dev/shm 至少配置 1 GB。

  **HBM 压力：** 调低 max-model-len、max-num-seqs、max-num-batched-tokens 或 gpu-memory-utilization，并保持 expandable_segments 开启。

  通用问题参见[公共 FAQ](https://docs.vllm.ai/projects/ascend/en/latest/faqs.html)。

