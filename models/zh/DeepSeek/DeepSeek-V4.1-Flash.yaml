      export HCCL_EXEC_TIMEOUT="204"
      export ASCEND_CUSTOM_OPP_PATH="/usr/local/python3.12.13/lib/python3.12/site-packages/fla_npu/opp/vendors/fla_npu_transformer:/usr/local/python3.12.13/lib/python3.12/site-packages/fla_npu/opp/vendors/fla_npu_transformer/op_api/lib"
      export VLLM_ENGINE_READY_TIMEOUT_S="36000"
      export TASK_QUEUE_ENABLE="1"
      export TP_SOCKET_IFNAME="bond4"
      export OMP_NUM_THREADS="1"
      export VLLM_RPC_TIMEOUT="3600000"
      export HCCL_IF_IP="135.98.25.4"
      
      # 模型启动命令
      # 以下参数可能需要根据实际环境修改：
      #   $MODEL_PATH  模型权重路径（已在上方定义）
      #   --port       服务端口，需确保未被占用
      # 其他参数为原始部署配置，请勿随意修改
      nohup vllm serve $MODEL_PATH --host 0.0.0.0 --port 6727 --data-parallel-size 8 --data-parallel-rank 6 --data-parallel-address 135.98.25.4 --data-parallel-rpc-port 10523 --tensor-parallel-size 2 --enable-expert-parallel --seed 1024 --served-model-name DeepSeek-V4.1-Flash --max-model-len {{max_model_len}} --max-num-batched-tokens 400 --max-num-seqs {{max_num_seqs}} --async-scheduling --block-size 128 --no-enable-prefix-caching --model-loader-extra-config={"enable_multithread_load":true,"num_threads":128} --safetensors-load-strategy lazy --trust-remote-code --tokenizer-mode deepseek_v41 --tool-call-parser deepseek_v41 --enable-auto-tool-choice --reasoning-parser deepseek_v41 --gpu-memory-utilization {{gpu_memory_utilization}} --quantization ascend --speculative-config '{"num_speculative_tokens": 5, "method":"dspark","enforce_eager":true}' --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' --kv-transfer-config '{"kv_connector": "MooncakeHybridConnector", "kv_role": "kv_consumer", "kv_port": "30100", "engine_id": "1", "kv_connector_extra_config": { "prefill": { "dp_size": 4, "tp_size": 4 }, "decode": { "dp_size": 8, "tp_size": 2 } } }' --engram-config '{"cpu_offload":true,"dp_shared_memory":true}' --additional-config '{ "ascend_compilation_config":{ "enable_npugraph_ex":true, "enable_static_kernel":false }, "enable_cpu_binding":true, "multistream_overlap_shared_expert":true, "recompute_scheduler_enable":true }' > run_model.log 2>&1 &
  - title: "服务验证"
    content: |-
      ```shell
      curl http://<node0_ip>:<port>/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{"model": "<served-model-name>", "messages": [{"role": "user", "content": "Who are you?"}], "max_tokens": 256, "temperature": 0}'
      ```
