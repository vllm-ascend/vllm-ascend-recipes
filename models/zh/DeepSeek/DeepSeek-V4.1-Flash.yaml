  container:
    A3:
      content: |-
      根据您的机器类型选择镜像，并在节点上启动 Docker 镜像。

        ```bash

        export IMAGE=quay.io/ascend/vllm-ascend:nightly-main-a3-openeuler
        docker run --rm \
            --name vllm-ascend \
            --shm-size=512g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci8 \
            --device /dev/davinci9 \
            --device /dev/davinci10 \
            --device /dev/davinci11 \
            --device /dev/davinci12 \
            --device /dev/davinci13 \
            --device /dev/davinci14 \
            --device /dev/davinci15 \
            --device /dev/davinci16 \
            --device /dev/davinci17 \
            --device /dev/davinci18 \
            --device /dev/davinci19 \
            --device /dev/davinci20 \
            --device /dev/davinci21 \
            --device /dev/davinci22 \
            --device /dev/davinci23 \
            --device /dev/davinci24 \
            --device /dev/davinci25 \
            --device /dev/davinci26 \
            --device /dev/davinci27 \
            --device /dev/davinci28 \
            --device /dev/davinci29 \
