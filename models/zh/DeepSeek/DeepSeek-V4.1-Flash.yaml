    # Ascend 推荐 Docker 方式；pip 需源码编译，隐藏 pip 标签
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=512g -v /root/.cache/modelscope:/root/.cache/modelscope --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci8 --device /dev/davinci9 --device /dev/davinci10 --device /dev/davinci11 --device /dev/davinci12 --device /dev/davinci13 --device /dev/davinci14 --device /dev/davinci15 -it quay.io/ascend/vllm-ascend:nightly-main-a3-openeuler bash"
      note: "Ascend 官方镜像；权重目录已挂载进容器；设备/驱动挂载见 env_setup.container。"
features:
  expert_parallel:
    description: "跨 DP rank 的 MoE 专家并行"
    args: ["--enable-expert-parallel"]
  tool_calling:
    description: "原生工具调用"
    args: ["--enable-auto-tool-choice", "--tool-call-parser deepseek_v41"]
  reasoning:
    description: "推理模式（思考链）"
    args: ["--reasoning-parser deepseek_v41"]
  spec_decoding:
    label: "MTP Spec Decoding"
    description: "MTP 投机解码，加速推理"
    args: ["--speculative-config", '{"num_speculative_tokens": 1, "method": "mtp", "enforce_eager": true}']
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm 通信优化，提升芯片间带宽"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"
  prefix_caching:
    label: "Prefix Caching"
    description: "KV 缓存前缀缓存"
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"
  async_scheduling:
    label: "Async Scheduling"
    description: "异步调度，CPU 调度与 NPU 计算重叠"
    args: ["--async-scheduling"]
  compilation_config:
    label: "Compilation Config"
    description: "decode 阶段全 ACL 图执行，降低调度时延"
    args: ["--compilation-config", '{"cudagraph_mode":"FULL_DECODE_ONLY"}']
  cpu_binding:
    label: "CPU Binding"
    description: "CPU 核绑定，降低 NUMA 时延"
    args: ["--additional-config", '{"enable_cpu_binding": true}']
  multistream_overlap:
    label: "Multi-stream Overlap"
    description: "MoE 共享专家多流重叠"
    args: ["--additional-config", '{"multistream_overlap_shared_expert": true}']
  npugraph_ex:
    label: "NPUGraph EX"
    description: "NPUGraph EX 加速图执行"
    args: ["--additional-config", '{"ascend_compilation_config": {"enable_npugraph_ex": true, "enable_static_kernel": false}}']
opt_in_features:
  - prefix_caching
  - cpu_binding
  - multistream_overlap
  - npugraph_ex
variants:
  ascend_w8a8:
    model_id: "deepseek-ai/DeepSeek-V4.1-Flash"
    label: "W8A8 (A3)"
    precision: W8A8
    vram_minimum_gb: 916
    description: "W8A8 量化服务于 Atlas 800I A3。"
    supported_hardware: [atlas_800_a3]
    tp:
      atlas_800_a3: 4
compatible_strategies:
  - single_node_A2
  - single_node_A3
  - single_node_A5
  - pd_cluster
hardware_overrides:
  ascend_a3:
    extra_args:
      - "--compilation-config"
      - '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
    extra_env:
      HCCL_BUFFSIZE: "2560"
strategy_overrides:
  pd_cluster:
    prefill:
      nodes: { default: 1 }
    decode:
      nodes: { default: 1 }
dependencies: []
guide: ""
performance_model_names:
  - "DeepSeek-V4.1-Flash"
config_params:
  max_model_len:
    default: 286720
    type: number
    description: "最大上下文长度(输入+输出 token 之和),按实际场景调整"
  max_num_seqs:
    default: 32
    type: number
    description: "每个 DP 组最大并发序列数"
  gpu_memory_utilization:
    default: 0.9
    type: number
    description: "KV cache 可用的显存比例"
overview: |-
  SWA
weight_download:
- weight_version: "W8A8"
  sources:
  - source: "Hugging Face"
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model deepseek-ai/DeepSeek-V4.1-Flash
      ```
prerequisites:
- title: "模型权重"
  content: |-
    请按上面 weight_download 下载权重；多节点部署请先验证多节点通信环境。
env_setup:
  container:
    A3:
      content: |-
      根据您的机器类型选择镜像，并在节点上启动 Docker 镜像。

        ```bash

        export IMAGE=quay.io/ascend/vllm-ascend:nightly-main-a3-openeuler
        docker run --rm \
            --name vllm-ascend \
            --shm-size=512g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci2 \
            --device /dev/davinci3 \
            --device /dev/davinci4 \
            --device /dev/davinci5 \
            --device /dev/davinci6 \
            --device /dev/davinci7 \
            --device /dev/davinci8 \
            --device /dev/davinci9 \
            --device /dev/davinci10 \
            --device /dev/davinci11 \
            --device /dev/davinci12 \
            --device /dev/davinci13 \
            --device /dev/davinci14 \
            --device /dev/davinci15 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      Ascend 推荐 Docker 方式；pip 需源码编译，不提供官方 wheel。
