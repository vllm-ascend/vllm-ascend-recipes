performance:
  accuracy: |-
    参考表见 evaluation.accuracy(教程 §7)。
  benchmark: |-
    AISBench 性能评测:[使用 AISBench 做性能评测](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation)(教程 §8.1)。vLLM 压测:见 [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/)(教程 §8.2;该文档仅有英文版)。钉定镜像 v0.23.0rc1-a3 上入口为
    `vllm bench serve`(`vllm.benchmarks.benchmark_serving` 模块路径不可用)。

tuning: |-
  场景总览(教程 §9.1,A3 1P1D 参考):

  | 场景 | 部署 | NPU 总数 | 权重 | 说明 |
  | --- | --- | --- | --- | --- |
  | 短序列/高吞吐 | 1P1D(2P+2D A3) | 64 | 0813-w4a8 | Prefill DP4/TP8 16 seqs;Decode DP16/TP2 8 seqs;prefill 开 FUSED_MC2 |
  | 长上下文(约 1M 输入,参考) | 1P1D(2P+2D A3) | 64 | 0813-w4a8 | 双侧 DP2/TP16、2 seqs,decode batched tokens 16;FUSED_MC2 关(省显存) |

  `--max-model-len 1048576` 为提示+生成总预算。W4A4C8(950 产品)将路由专家保持 W4A4
  MXFP4、注意力/共享专家 W8A8 MXFP8、门控/压缩器/indexer/MTP 不量化;C8 为 950 产品上的
  FP8 KV 缓存量化(教程 §10)。

  通用调优:[公开性能调优文档](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/performance_and_debug/optimization_and_tuning.html)
  与[特性矩阵](https://docs.vllm.ai/projects/ascend/zh-cn/latest/user_guide/support_matrix/feature_matrix.html)。

faq: |-
  常见环境、安装与通用参数问题参见[公共 FAQs](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)(教程 §10)。

  - **问:W4A4C8 超低比特量化权重如何保持精度?**

    答:msmodelslim 混合精度策略——路由专家 W4A4 MXFP4;注意力线性与共享专家 W8A8 MXFP8;
    门控/压缩投影/indexer/MTP 层保持高精度不量化。MXFP4/MXFP8 微缩格式按 32 元素分块、
    块级对称 min-max 缩放。C8 是 950PR/950DT 产品上的动态 FP8 KV 缓存量化(注意力 KV 按
    64 元素 tile 量化至 E4M3、scale 为 E8M0,RoPE 部分保持 BF16;indexer Q/K 经 Hadamard
    旋转后逐 token FP8),仅由服务配置控制(教程 §10)。

