dependencies:
  - name: mooncake-transfer-engine
    reason: PD 分离场景的 KV 传输依赖
    scenarios: ["pd"]

guide: ""

overview: |-
  DeepSeek-V3.1 是同时支持思考模式与非思考模式的混合模型。相比上一版本，本次升级带来多方面提升：

  - **混合思考模式**：一个模型通过切换对话模板即可支持思考与非思考两种模式。
  - **更智能的工具调用**：经过后训练优化，模型在工具使用与智能体任务上的表现显著提升。
  - **更高的思考效率**：DeepSeek-V3.1-Think 的回答质量对标 DeepSeek-R1-0528，同时响应更快。

  > **状态说明**：DeepSeek-V3.1（含 DeepSeek-V3）自 vLLM Ascend v0.30.0 起已停止支持，不再获得支持与修复。本 recipe 迁移自 v0.23.0 历史教程，供仍在既有集群上部署 V3.1 权重的用户使用。命令自 v0.23.0 文档逐字迁移，尚未在 v0.30.0rc1 镜像上重新验证（真机端到端验证完成前，上方硬件状态保持 `experimental`）。新部署建议优先选择 DeepSeek-V3.2。

