               --gpu-memory-utilization 0.9 \
               --quantization ascend \
               --no-enable-prefix-caching \
               --speculative-config '{"num_speculative_tokens": 1, "method": "mtp"}' \
               --kv-transfer-config \
               '{"kv_connector": "MooncakeConnectorV1",
               "kv_role": "kv_producer",
               "kv_port": "30000",
               "kv_connector_extra_config": {
