faq: |-
  常见环境、安装与通用参数问题请参考[公共 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)；本章仅涉及模型相关问题。

  - **Q：DeepSeek-V3.1 还支持吗？**

    A：DeepSeek-V3.1（含 DeepSeek-V3）自 vLLM Ascend v0.30.0 起已停止支持，不再获得支持与修复。本 recipe 迁移自 v0.23.0 历史教程，供仍需部署既有 V3.1 权重的用户使用；相关命令尚未在 v0.30.0rc1 镜像上重新验证。新部署建议优先选择 DeepSeek-V3.2。

