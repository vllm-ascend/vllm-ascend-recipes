scenarios:
- npu: Atlas 800I A3
  precision: W8A8
  deployment: Single-Node
  case: High Throughput
  tags: [a3-single]
  strategy: single_node
  steps:
  - title: 启动服务
    content: |-
      单机部署在同一节点上完成 Prefill 与 Decode。量化模型 `DeepSeek-V3.1-w8a8-mtp-QuaRot` 可部署在 1 台 Atlas 800 A3（64GB × 16）上。

      ```shell
        #!/bin/sh
        # nic_name/local_ip: obtain through ifconfig on your machine. When
        # unset, both are auto-detected so the command also runs as-is.
        nic_name="${nic_name:-$(ip -o -4 addr show scope global | cut -d' ' -f2 | head -n 1)}"
        local_ip="${local_ip:-$(hostname -I | cut -d' ' -f1)}"

        # [Optional] jemalloc
        # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
        # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

        # AIV
        export HCCL_OP_EXPANSION_MODE="AIV"

        export HCCL_IF_IP=$local_ip
        export GLOO_SOCKET_IFNAME=$nic_name
        export TP_SOCKET_IFNAME=$nic_name
        export HCCL_SOCKET_IFNAME=$nic_name
        export VLLM_ASCEND_BALANCE_SCHEDULING=1
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        # 700G-class weight loading exceeds the default engine-ready timeout
        export VLLM_ENGINE_READY_TIMEOUT_S=7200

        vllm serve your_model_path \
        --host 0.0.0.0 \
        --port 8015 \
        --data-parallel-size 4 \
        --tensor-parallel-size 4 \
        --quantization ascend \
        --seed 1024 \
        --served-model-name deepseek_v3 \
        --enable-expert-parallel \
        --max-num-seqs 16 \
        --max-model-len 16384 \
        --max-num-batched-tokens 4096 \
        --trust-remote-code \
        --no-enable-prefix-caching \
        --gpu-memory-utilization 0.92 \
        --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}' \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      ```

      关键参数说明：

      - 设置环境变量 `VLLM_ASCEND_BALANCE_SCHEDULING=1` 开启均衡调度，在 v1 调度器下有助于提升输出吞吐并降低 TPOT，但部分场景 TTFT 可能劣化；PD 分离场景不建议开启。
      - 单机部署推荐使用 `dp4tp4` 而非 `dp2tp8`。
      - `--max-model-len` 指定最大上下文长度，即单请求输入与输出 token 数之和。输入 3.5k、输出 1.5k 的性能测试取 `16384` 即可；精度测试请至少设置 `35000`。
      - `--no-enable-prefix-caching` 表示关闭前缀缓存；如需开启，删除该选项即可。
      - 使用 w4a8 权重时会为 kvcache 分配更多显存，可以尝试提升系统并发以获得更大吞吐。

      如遇问题，请参考[公共 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)排查。

  - title: 服务验证
    content: |-
      ```shell
      curl http://<node0_ip>:<port>/v1/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "deepseek_v3",
              "prompt": "The future of AI is",
              "max_completion_tokens": 50,
              "temperature": 0
          }'
      ```

- npu: Ascend 950DT
  precision: W4A4MLP+W8A8C8Attn
  deployment: Single-Node
  case: High Throughput
  tags: [a5-single]
  strategy: single_node_a5
  steps:
  - title: 启动服务
    content: |-
      Ascend 950DT 单机部署使用混合精度权重（`w4a4_mlp-w8a8c8_attn`）。950DT 上自 **vllm-ascend v0.23.0rc1** 起支持本模型。

      ```shell
        export HCCL_BUFFSIZE=512
        export HCCL_CONNECT_TIMEOUT=600
        export HCCL_EXEC_TIMEOUT=600

        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=10
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export TASK_QUEUE_ENABLE=1

        export VLLM_ASCEND_ENABLE_MLAPO=1
        # 700G-class weight loading exceeds the default engine-ready timeout
        export VLLM_ENGINE_READY_TIMEOUT_S=7200

        vllm serve your_model_path \
        --host 0.0.0.0 \
        --port 8015 \
        --max_model_len 135168 \
        --max-num-batched-tokens 16384 \
        --served-model-name deepseek_v3 \
        --gpu-memory-utilization 0.9 \
        --data-parallel-size 1 \
        --tensor-parallel-size 8 \
        --enable-expert-parallel \
        --async-scheduling \
        --max-num-seqs 96 \
        --no-enable-prefix-caching \
        --trust-remote-code \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
        --speculative-config '{"num_speculative_tokens": 3,"method": "deepseek_mtp"}' \
        --quantization ascend \
        --additional_config '{"enable_cpu_binding": true, "multistream_overlap_shared_expert": true, "enable_balance_scheduling": true}' \
      ```

      说明：`VLLM_ASCEND_ENABLE_MLAPO=1` 开启 MLAPO 融合算子以加速解码；`--additional_config` 开启 CPU 绑核、共享专家多流重叠与均衡调度。

  - title: 服务验证
    content: |-
      ```shell
      curl http://<node0_ip>:<port>/v1/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "deepseek_v3",
              "prompt": "The future of AI is",
              "max_completion_tokens": 50,
              "temperature": 0
          }'
      ```

- npu: Atlas 800I A2
  precision: W8A8
  deployment: Multi-Node Data Parallel
  case: 2-Node DP
  tags: [a2-dp]
  strategy: multi_node_dp
  steps:
  - title: 节点 0
    content: |-
      `DeepSeek-V3.1-w8a8-mtp-QuaRot` 需要至少 2 台 Atlas 800 A2（64GB × 8）。以下脚本在节点 0 上执行。

      ```shell
        #!/bin/sh

        # this obtained through ifconfig
        # nic_name is the network interface name corresponding to local_ip of the current node
        nic_name="xxxx"
        local_ip="xxxx"

        # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
        node0_ip="xxxx"

        # [Optional] jemalloc
        # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
        # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

        export HCCL_IF_IP=$local_ip
        export GLOO_SOCKET_IFNAME=$nic_name
        export TP_SOCKET_IFNAME=$nic_name
        export HCCL_SOCKET_IFNAME=$nic_name
        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=1
        export HCCL_BUFFSIZE=200
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export VLLM_ASCEND_BALANCE_SCHEDULING=1
        export HCCL_INTRA_PCIE_ENABLE=1
        export HCCL_INTRA_ROCE_ENABLE=0

        vllm serve your_model_path \
        --host 0.0.0.0 \
        --port 8004 \
        --data-parallel-size 4 \
        --data-parallel-size-local 2 \
        --data-parallel-address $node0_ip \
        --data-parallel-rpc-port 13389 \
        --tensor-parallel-size 4 \
        --quantization ascend \
        --seed 1024 \
        --served-model-name deepseek_v3 \
        --enable-expert-parallel \
        --max-num-seqs 16 \
        --max-model-len 16384 \
        --max-num-batched-tokens 4096 \
        --trust-remote-code \
        --no-enable-prefix-caching \
        --gpu-memory-utilization 0.92 \
        --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}' \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      ```

  - title: 节点 1
    content: |-
      以下脚本在节点 1 上执行。

      ```shell
        #!/bin/sh

        # this obtained through ifconfig
        # nic_name is the network interface name corresponding to local_ip of the current node
        nic_name="xxx"
        local_ip="xxx"

        # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
        node0_ip="xxxx"

        # [Optional] jemalloc
        # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
        # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

        export HCCL_IF_IP=$local_ip
        export GLOO_SOCKET_IFNAME=$nic_name
        export TP_SOCKET_IFNAME=$nic_name
        export HCCL_SOCKET_IFNAME=$nic_name
        export OMP_PROC_BIND=false
        export OMP_NUM_THREADS=1
        export HCCL_BUFFSIZE=200
        export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
        export VLLM_ASCEND_BALANCE_SCHEDULING=1
        export HCCL_INTRA_PCIE_ENABLE=1
        export HCCL_INTRA_ROCE_ENABLE=0

        vllm serve your_model_path \
        --host 0.0.0.0 \
        --port 8004 \
        --headless \
        --data-parallel-size 4 \
        --data-parallel-size-local 2 \
        --data-parallel-start-rank 2 \
        --data-parallel-address $node0_ip \
        --data-parallel-rpc-port 13389 \
        --tensor-parallel-size 4 \
        --quantization ascend \
        --seed 1024 \
        --served-model-name deepseek_v3 \
        --enable-expert-parallel \
        --max-num-seqs 16 \
        --max-model-len 16384 \
        --max-num-batched-tokens 4096 \
        --trust-remote-code \
        --no-enable-prefix-caching \
        --gpu-memory-utilization 0.92 \
        --speculative-config '{"num_speculative_tokens": 3, "method": "mtp"}' \
        --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}'
      ```

      关键参数说明：

      - `--data-parallel-size` 指定所有节点上 DP rank 的总数。
      - `--data-parallel-size-local` 指定当前节点上的 DP rank 数。
      - `--data-parallel-start-rank` 标识本节点的起始全局 DP rank。
      - `--data-parallel-address` 为 DP 主节点（节点 0）的 IP 地址。
      - `--data-parallel-rpc-port` 为 DP 主节点通信的 RPC 端口。
      - `--headless` worker 加入节点 0，不单独提供 HTTP 服务端点。
      - `--enable-expert-parallel` 将 MoE 专家分布到 EP 组。

- npu: Atlas 800I A3
  precision: W8A8
  deployment: Multi-Node PD Separation
  case: PD Separation (2P1D Layerwise)
  tags: [pd-multinode]
  strategy: pd_cluster
  steps:
  - title: 概述
    content: |-
      PD 分离部署推荐使用 Mooncake：[Mooncake](https://docs.vllm.ai/projects/ascend/zh-cn/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)。

      `DeepSeek-V3.1-w8a8-mtp-QuaRot 2P1D Layerwise` 需要 4 台 Atlas 800 A3（64GB × 16）。推荐部署 2P1D（4 台）而非 1P1D（2 台）：1P1D 场景下 NPU 显存不足以支撑高并发。

      运行 vllm-ascend 的 Prefill-Decode 分离服务，需要在每个节点部署 `launch_online_dp.py` 与 `run_dp_template.sh` 脚本，并在 prefill 主节点部署代理脚本转发请求：

      - [launch_online_dp.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/external_online_dp/launch_online_dp.py)
      - [load_balance_proxy_server_example.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py)

      `launch_online_dp.py` 参数说明：

      | 参数 | 类型 | 必填 | 默认值 | 说明 |
      | ---- | ---- | ---- | ------ | ---- |
      | `--dp-size` | int | 是 | - | 所有节点上 DP rank 的总数。 |
      | `--tp-size` | int | 否 | 1 | 每个 DP rank 内的张量并行数。 |
      | `--dp-size-local` | int | 否 | （同 `--dp-size`） | 当前节点上的 DP rank 数，未设置时默认同 `--dp-size`。 |
      | `--dp-rank-start` | int | 否 | 0 | 本节点数据并行 rank 的起始偏移。 |
      | `--dp-address` | str | 是 | - | 数据并行主节点（节点 0）的 IP 地址。 |
      | `--dp-rpc-port` | str | 否 | 12345 | 数据并行主节点通信的 RPC 端口。 |
      | `--vllm-start-port` | int | 否 | 9000 | 本节点每个 vLLM 引擎实例的起始端口；每个 DP rank 的引擎端口 = `vllm_start_port` + 本地 rank 序号。 |

  - title: 配置 Prefill 节点
    content: |-
      在每个 prefill 节点上设置网卡与 IP，然后以 `kv_producer` 角色启动 vLLM 引擎。以下展示节点 0（Prefill）；节点 1（Prefill）除 `local_ip`、`engine_id`（设为 1）、`kv_port`（设为 30100）不同外其余相同。

      ```shell
        # this obtained through ifconfig
           # nic_name is the network interface name corresponding to local_ip of the current node
           nic_name="xxx"
           local_ip="141.xx.xx.1"

           # The value of node0_ip must be consistent with the value of local_ip set in node0 (master node)
           node0_ip="xxxx"

           # [Optional] jemalloc
           # jemalloc is for better performance, if `libjemalloc.so` is installed on your machine, you can turn it on.
           # export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD

           export HCCL_IF_IP=$local_ip
           export GLOO_SOCKET_IFNAME=$nic_name
           export TP_SOCKET_IFNAME=$nic_name
           export HCCL_SOCKET_IFNAME=$nic_name

           export VLLM_RPC_TIMEOUT=3600000
           export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=30000
           export HCCL_EXEC_TIMEOUT=204
           export HCCL_CONNECT_TIMEOUT=120

           export OMP_PROC_BIND=false
           export OMP_NUM_THREADS=10
           export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
           export HCCL_BUFFSIZE=256
           export TASK_QUEUE_ENABLE=1
           export HCCL_OP_EXPANSION_MODE="AIV"
           export VLLM_USE_V1=1
           export ASCEND_RT_VISIBLE_DEVICES=$1
           export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH

           export VLLM_ASCEND_ENABLE_FLASHCOMM1=1

           vllm serve your_model_path \
               --host 0.0.0.0 \
               --port $2 \
               --data-parallel-size $3 \
               --data-parallel-rank $4 \
               --data-parallel-address $5 \
               --data-parallel-rpc-port $6 \
               --tensor-parallel-size $7 \
               --enable-expert-parallel \
               --seed 1024 \
               --served-model-name deepseek_v3 \
