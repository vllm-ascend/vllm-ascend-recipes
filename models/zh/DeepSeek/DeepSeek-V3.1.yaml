                               "tp_size": 1
                       }
                   }
               }'
      ```

      关键环境变量/配置说明（来自教程）：

      - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1`：开启 prefill 节点上的通信优化功能。
      - `VLLM_ASCEND_ENABLE_MLAPO=1`：开启 MLAPO 融合算子，可显著提升性能但消耗更多 NPU 显存；PD 分离场景仅在 decode 节点开启。
      - `recompute_scheduler_enable: true`：开启重计算调度器。当 decode 节点 KV 缓存不足时，请求会被发往 prefill 节点重算 KV 缓存；仅在 decode 节点开启。
      - `multistream_overlap_shared_expert: true`：当 TP 数为 1 或 `enable_shared_expert_dp` 为 true 时，启用额外数据流与共享专家计算过程重叠，提升效率。
      - `lmhead_tensor_parallel_size: 16`：当 decode 节点 TP 数为 1 时，该参数允许 LMHead 嵌入层的 TP 数大于 1，降低每张卡在 LMHead 嵌入层上的计算负载。

