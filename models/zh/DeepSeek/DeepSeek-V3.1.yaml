meta:
  title: DeepSeek-V3.1
  slug: deepseek-v3-1
  provider: DeepSeek
  description: DeepSeek-V3.1 混合思考/非思考模式的 MoE 模型，工具调用与思考效率提升（旧版 recipe，模型自 vLLM Ascend v0.30.0 起停支持）。
  date_added: "2026-10-13"
  date_updated: "2026-10-13"
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - deepseek-ai/DeepSeek-V3.2
  performance_headline: 685B/37B MoE — Atlas 800 A3 单机 W8A8 推理、A2 多机 DP、A3 / Ascend 950DT 2P1D PD 分离
  hardware:
    atlas_800_a3: verified   # v0.23.0 教程 §5.1/§7/§8 载官方 A3 部署与实测结果(依 GLM-5/V4-Flash 等存量惯例;第一方复验待资源,见 PR 说明)
    atlas_800_a2: experimental
    ascend_950dt: experimental

model:
  model_id: "deepseek-ai/DeepSeek-V3.1"
  min_vllm_version: "v0.23.0rc1"
  architecture: moe
  parameter_count: "685B"
  active_parameters: "37B"
  context_length: 163840
  modality: text

features:
  tool_calling:
    description: DeepSeek-V3.1 原生工具调用（经后训练优化）
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "deepseek_v3"]
  thinking_mode:
    label: Hybrid Thinking Mode
    description: 一个模型通过切换对话模板支持思考与非思考两种模式
    args: ["--trust-remote-code"]
  expert_parallel:
    description: MoE 专家并行
    args: ["--enable-expert-parallel"]
  mtp:
    label: MTP Speculative Decoding
    description: 多 token 预测草稿加速解码
    args: ["--speculative-config", '{"num_speculative_tokens": 3, "method": "mtp"}']
  prefix_caching:
    label: Prefix Caching
    args: ["--enable-prefix-caching"]
    flag_when_false: "--no-enable-prefix-caching"

variants:
  default:
    model_id: "Eco-Tech/DeepSeek-V3.1-w8a8-mtp-QuaRot"
    precision: W8A8
    vram_minimum_gb: 822
    description: W8A8 量化权重含 MTP 草稿 — A3 单机、A2 多机 DP、A3 2P1D Layerwise PD
    supported_hardware: ["atlas_800_a2", "atlas_800_a3"]
