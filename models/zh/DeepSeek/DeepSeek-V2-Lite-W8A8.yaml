meta:
  title: "DeepSeek-V2-Lite W8A8 — 多节点 PD 分离(demo)"
  slug: "deepseek-v2-lite-w8a8"
  provider: "DeepSeek"
  description: "DeepSeek-V2-Lite MoE(总参 16B / 激活 2.4B)以多节点 PD 分离拓扑(1P1D)部署,W8A8 量化 + Mooncake KV 传输。"
  date_added: "2026-08-07"
  date_updated: "2026-08-07"
  difficulty: advanced
  tasks:
    - text
  related_recipes:
    - "deepseek-ai/DeepSeek-V4-Flash"
  hardware:
    atlas_800_a2: verified

model:
  model_id: "vllm-ascend/DeepSeek-V2-Lite-W8A8"
  min_vllm_version: "v0.23.0rc1"
  architecture: moe
  parameter_count: "16B"
  active_parameters: "2.4B"
  context_length: 32768
  modality: text
  base_args:
    - "--trust-remote-code"
    - "--enable-expert-parallel"
    - "--quantization"
    - "ascend"
  base_env:
    HCCL_BUFFSIZE: "256"
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "1"
    PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
    TASK_QUEUE_ENABLE: "1"
  docker_image:
    atlas_800_a2: "quay.io/ascend/vllm-ascend:v0.23.0rc1"
  nightly_required: false
  install:
    # Ascend 推荐 Docker 方式;pip 需源码编译,不提供官方 wheel,隐藏 pip 标签。
    pip: false
    docker:
      command: "docker run --rm --net=host --shm-size=128g -v /root/.cache/modelscope:/root/.cache/modelscope --device /dev/davinci0 --device /dev/davinci1 ... --device /dev/davinci7 -it quay.io/ascend/vllm-ascend:v0.23.0rc1 bash"
      note: "Ascend 官方镜像;完整设备/驱动挂载见 env_setup.container。"

# —— 上游对齐:features / variants / strategies / overrides / guide ——
features:
  expert_parallel:
    description: "跨 DP rank 的 MoE 专家并行"
    args: ["--enable-expert-parallel"]
  flashcomm1:
    label: "FlashComm1"
    description: "FlashComm 通信优化"
    env:
      VLLM_ASCEND_ENABLE_FLASHCOMM1: "1"

opt_in_features: []

variants:
  default:
    precision: W8A8
    vram_minimum_gb: 20
    description: "W8A8 预量化权重,适用于 Atlas 800 A2"

compatible_strategies:
  - pd_cluster

hardware_overrides: {}
strategy_overrides:
  pd_cluster:
    prefill:
      nodes: { default: 1 }
    decode:
      nodes: { default: 1 }

dependencies:
  - note: "ModelScope 用于下载 W8A8 权重"
    command: "pip install modelscope"

guide: ""

# —— 可配置数值参数(页面/CI 扩展;默认值 = tutorial 基线)——
config_params:
  max_model_len:
    default: 4096
    type: number
    description: "最大上下文长度(输入+输出 token 之和)"
  max_num_seqs:
    default: 8
    type: number
    description: "最大并发序列数"

overview: |-
  DeepSeek-V2-Lite 是 DeepSeek-V2 的 16B 总参数量 / 2.4B 激活参数的 MoE 兄弟模型。
weight_download:
- weight_version: W8A8(预量化)
  sources:
  - source: ModelScope
    url: https://www.modelscope.cn/models/vllm-ascend/DeepSeek-V2-Lite-W8A8
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model vllm-ascend/DeepSeek-V2-Lite-W8A8
      ```

prerequisites:
- title: 模型权重
  content: |-
    - W8A8 权重:`vllm-ascend/DeepSeek-V2-Lite-W8A8`(预量化,[ModelScope](https://www.modelscope.cn/models/vllm-ascend/DeepSeek-V2-Lite-W8A8))。
    - 需要 2 台 Atlas 800I A2(64G × 8)节点;在每个节点上将权重下载到共享缓存(`/root/.cache/`)。
- title: 验证多节点通信
  content: |-
    先验证多节点通信:[验证多节点通信环境](../../installation.md#verify-multi-node-communication)。

env_setup:
  container:
    A2:
      content: |-
        选择 A2 镜像并在每个节点启动容器,参考[使用 Docker](../../installation.md#set-up-using-docker)。

        本场景每个节点使用 **2 张 NPU**;暴露 `davinci0`/`davinci1`(若您的卡索引不同请调整):

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.23.0rc1
        docker run --rm \
            --name vllm-ascend \
            --shm-size=64g \
            --net=host \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
            --device /dev/davinci_manager \
            --device /dev/devmm_svm \
            --device /dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi \
            -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
            -v /etc/ascend_install.info:/etc/ascend_install.info \
            -v /etc/hccn.conf:/etc/hccn.conf \
            -it $IMAGE bash
        ```
  pip:
    content: |-
      如果不想使用上面的 Docker 镜像,可在每个节点从源码安装 `vllm-ascend`,参考[安装文档](../../installation.md)。

scenarios:
- npu: Atlas 800I A2
  precision: W8A8
  deployment: 多节点-PD分离
  case: 1P1D(1 个 Prefill 节点 + 1 个 Decode 节点)
  tags: [pd-multinode]
  strategy: pd_cluster
  steps:
  - title: 概述
    content: |-
      使用 **2 台 Atlas 800 A2 节点**——1 个 Prefill 节点、1 个 Decode 节点。每个节点运行
      `TP=1 + DP=2`,使用 2 张 NPU。这是最轻量的 PD 拓扑:1P1D、每节点 2 卡,
      由 `launch_online_dp.py` 外部 DP 驱动(Mooncake KV 传输)。

  - title: 准备 run_dp_template.sh – Prefill 节点
    content: |-
      Prefill 节点:

      ```shell
      # HCCL 会自动发现 HCCN 网卡。不要强制把 HCCL_IF_IP / socket ifname
      # 绑定到管理网卡——否则会在 vllm 引擎中报 HCCL "ERR02005 DIST internal error"。
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=10
      export TASK_QUEUE_ENABLE=1
      export HCCL_BUFFSIZE=256
      # launch_online_dp.py 传入逻辑设备索引;映射到容器分配的实际物理设备
      # (ASCEND_RT_VISIBLE_DEVICES)。
      IFS=',' read -r -a selected_devices <<< "${ASCEND_RT_VISIBLE_DEVICES:-0,1}"
      export ASCEND_RT_VISIBLE_DEVICES="${selected_devices[$1]}"
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=0

      vllm serve your_model_path \
          --host 0.0.0.0 \
          --port $2 \
          --served-model-name dsv2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --trust-remote-code \
          --enable-expert-parallel \
          --quantization ascend \
          --max-model-len {{max_model_len}} \
          --max-num-seqs {{max_num_seqs}} \
          --kv-transfer-config '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_producer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1}, "decode": {"dp_size": 2, "tp_size": 1}}}'
      ```

  - title: 准备 run_dp_template.sh – Decode 节点
    content: |-
      Decode 节点:

      ```shell
      # HCCL 会自动发现 HCCN 网卡。不要强制把 HCCL_IF_IP / socket ifname
      # 绑定到管理网卡——否则会在 vllm 引擎中报 HCCL "ERR02005 DIST internal error"。
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=10
      export TASK_QUEUE_ENABLE=1
      export HCCL_BUFFSIZE=256
      # launch_online_dp.py 传入逻辑设备索引;映射到容器分配的实际物理设备
      # (ASCEND_RT_VISIBLE_DEVICES)。
      IFS=',' read -r -a selected_devices <<< "${ASCEND_RT_VISIBLE_DEVICES:-0,1}"
      export ASCEND_RT_VISIBLE_DEVICES="${selected_devices[$1]}"
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=0

      vllm serve your_model_path \
          --host 0.0.0.0 \
          --port $2 \
          --served-model-name dsv2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --trust-remote-code \
          --enable-expert-parallel \
          --quantization ascend \
          --max-model-len {{max_model_len}} \
          --max-num-seqs {{max_num_seqs}} \
          --kv-transfer-config '{"kv_connector": "MooncakeConnectorV1", "kv_role": "kv_consumer", "kv_port": "30000", "engine_id": "0", "kv_connector_extra_config": {"prefill": {"dp_size": 2, "tp_size": 1}, "decode": {"dp_size": 2, "tp_size": 1}}}'
      ```

  - title: 启动服务
    content: |-
      ```bash
      # p0(Prefill 节点 0)
      python launch_online_dp.py --dp-size 2 --tp-size 1 --dp-size-local 2 --dp-rank-start 0 \
        --dp-address 141.xx.xx.1 --dp-rpc-port 12321 --vllm-start-port 7100
      # d0(Decode 节点 0)
      python launch_online_dp.py --dp-size 2 --tp-size 1 --dp-size-local 2 --dp-rank-start 0 \
        --dp-address 141.xx.xx.2 --dp-rpc-port 12321 --vllm-start-port 7100
      ```

  - title: 服务验证
    content: |-
      ```bash
      # 查询 Prefill 节点的 OpenAI 兼容端点(或已部署的代理)
      curl -s http://<node0_ip>:7100/v1/models
      # 发送 chat completion 确认 prefill/decode 协同工作
      curl -s http://<node0_ip>:7100/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model": "dsv2", "messages": [{"role": "user", "content": "hello"}], "max_tokens": 16}'
      ```

references:
- title: ModelScope 模型下载
  url: https://www.modelscope.cn/models/vllm-ascend/DeepSeek-V2-Lite-W8A8
- title: PD 分离指南(Mooncake)
  url: https://docs.vllm.ai/projects/ascend/en/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html
- title: vllm-ascend GitHub
  url: https://github.com/vllm-project/vllm-ascend
