    command: |-
      ```bash
      huggingface-cli download lightseekorg/kimi-k2.6-eagle3
      ```
- weight_version: DFlash（投机解码）
  sources:
  - source: HuggingFace
    url: https://huggingface.co/z-lab/Kimi-K2.5-DFlash
    command: |-
      ```bash
