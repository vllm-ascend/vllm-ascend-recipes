      如需部署多机环境，需在每个节点上配置环境。

      使用 tool_calls 特性时，请确保 transformers 版本不高于 4.57.6。如果 vllm-ascend 已升级到 v0.21 或更高版本，此要求不再适用。

scenarios:
- npu: Atlas 800I A3
  precision: W4A8
  deployment: 单节点-多卡
  case: 高吞吐
  tags: [a3-single]
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      单节点部署在同一节点内完成 Prefill 与 Decode。量化模型 `Kimi-K2.6-w4a8` 可部署在 1 台 Atlas 800 A3（64G × 16）上。

      单节点部署支持所有输入/输出场景，但如需获得最佳性能，建议考虑多节点部署。

      ```shell
      export HCCL_OP_EXPANSION_MODE="AIV"
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1
      export VLLM_ASCEND_ENABLE_MLAPO=1
      # [可选] jemalloc
      # jemalloc 用于提升性能，如果机器上已安装 `libjemalloc.so`，可以开启。
      export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:$LD_PRELOAD
      echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
      sysctl -w vm.swappiness=0
      sysctl -w kernel.numa_balancing=0
      sysctl -w kernel.sched_migration_cost_ns=50000
      export HCCL_BUFFSIZE=600
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
      export VLLM_ASCEND_BALANCE_SCHEDULING=0

      vllm serve Eco-Tech/Kimi-K2.6-W4A8 \
          --quantization ascend \
          --tool-call-parser kimi_k2 \
          --reasoning-parser kimi_k2 \
          --allowed-local-media-path / \
          --served-model-name kimi_k26 \
          --trust-remote-code \
          --tensor-parallel-size 4 \
          --data-parallel-size 4 \
          --no-enable-prefix-caching \
          --enable-expert-parallel \
          --port 8000 \
          --max-num-seqs 4 \
          --max-model-len 34816 \
          --max-num-batched-tokens 16384 \
          --gpu-memory-utilization 0.87 \
          --seed 42 \
          --async-scheduling \
          --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
          --profiler-config '{"profiler": "torch", "torch_profiler_dir": "./vllm_profile", "torch_profiler_with_stack": true}' \
          --mm-processor-cache-gb 0 \
          --mm-encoder-tp-mode data \
          --additional-config '{"enable_balance_scheduling": true}' \
          --speculative-config '{"method": "dflash","model": "z-lab/Kimi-K2.5-DFlash", "num_speculative_tokens": 15}'
      ```

      关键参数说明：

      - 设置环境变量 `VLLM_ASCEND_BALANCE_SCHEDULING=1` 可开启负载均衡调度，可能有助于提升输出吞吐并降低 v1 调度器中的 TPOT，但在某些场景下 TTFT 可能变差。此外，在 PD 分离场景下不建议开启该特性。
      - `--max-model-len` 指定最大上下文长度，即单个请求输入与输出 token 之和。若输入长度 3.5K、输出长度 1.5K 的性能测试，`16384` 已足够；精度测试请至少设为 `35000`。
      - `--no-enable-prefix-caching` 表示关闭前缀缓存；如需开启，请移除该选项。
      - `--mm-encoder-tp-mode` 指定如何使用张量并行（TP）优化多模态编码器推理；对于多模态输入，推荐使用 `data`。
      - 若使用 w4a8 权重，将为 KV 缓存分配更多显存，可尝试增大 `--max-num-seqs` 以提升系统吞吐。

      常见问题提示：如遇到问题，请参考[公共 FAQ](https://docs.vllm.ai/projects/ascend/zh-cn/latest/faqs.html)排查。
  - title: 服务验证
    content: |-
      ```shell
      curl http://<node_ip>:8000/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "kimi_k26",
              "messages": [{
                  "role": "user",
                  "content": [
                  {
                      "type": "text",
                      "text": "The future of AI is"
                  }]
              }],
              "max_tokens": 1024,
              "temperature": 1.0,
              "top_p": 0.95
          }'
      ```

      预期结果：

      服务返回 HTTP 200 OK，JSON 响应中包含 `choices` 字段。
- npu: Atlas 800I A3
  precision: W4A8
  deployment: 多节点-PD分离
  case: PD 分离
  tags: [pd-multinode]
  strategy: pd_cluster
  steps:
  - title: 概述
    content: |-
      建议使用 Mooncake 进行部署：[Mooncake](https://docs.vllm.ai/projects/ascend/zh-cn/latest/tutorials/features/pd_disaggregation_mooncake_multi_node.html)。

      在标准单节点部署模式下，Prefill（提示处理）与 Decode（token 生成）任务在同一组 NPU 上运行，可能带来两个问题：

      1. **Prefill 抢占中断 Decode**：Prefill 是计算密集型任务，一次性处理整个输入上下文，而 Decode 逐个生成 token。当新用户请求到达时，其 Prefill 阶段可能抢占并中断正在进行的 Decode 任务，造成抖动与更高的每输出 token 时延（TPOT）。
      2. **资源分配不灵活**：Prefill 与 Decode 的计算特征根本不同——Prefill 是计算密集且内存带宽密集，Decode 是内存带宽密集。在同一硬件上运行二者会做出两边都不尽如人意的折中。

      PD（Prefill-Decode）分离通过在专用节点组上分别运行 Prefill 与 Decode 来解决这些问题，每组独立配置：

      - **Prefill 节点**专注于高吞吐提示处理，针对计算与通信优化（如启用 FlashComm 加速 Allreduce）。
      - **Decode 节点**专注于低时延 token 生成，针对内存带宽优化（如启用 MLAPO 融合算子）。

      该架构推荐用于同时要求稳定时延与高吞吐的生产级并发多用户工作负载。

      以 Atlas 800 A3（64G × 16）为例，推荐部署 2P1D（4 节点）而非 1P1D（2 节点），因为在 1P1D 情况下 NPU 显存不足以支撑高并发。

      - `Kimi-K2.6-w4a8 2P1D`：需要 4 台 Atlas 800 A3（64G × 16）。
  - title: 准备辅助脚本
    content: |-
      要运行 vllm-ascend 的 Prefill-Decode 分离服务，需在每个节点部署 `launch_online_dp.py` 与 `run_dp_template.sh` 脚本，并在 prefill 主节点部署代理脚本以转发请求。

      - [launch_online_dp.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/external_online_dp/launch_online_dp.py)
      - [load_balance_proxy_server_example.py](https://github.com/vllm-project/vllm-ascend/blob/main/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py)

      `launch_online_dp.py` 参数说明：

      | 参数 | 类型 | 必填 | 默认值 | 说明 |
      | --- | --- | --- | --- | --- |
      | `--dp-size` | int | 是 | - | 数据并行大小（所有节点上的 DP rank 总数）。 |
      | `--tp-size` | int | 否 | 1 | 每个 DP rank 内的张量并行大小。 |
      | `--dp-size-local` | int | 否 | （同 `--dp-size`） | 当前节点上的 DP rank 数。 |
      | `--dp-rank-start` | int | 否 | 0 | 当前节点数据并行 rank 的起始偏移。 |
      | `--dp-address` | str | 是 | - | 数据并行主节点（node 0）的 IP 地址。 |
      | `--dp-rpc-port` | str | 否 | 12345 | 数据并行主节点通信的 RPC 端口。 |
      | `--vllm-start-port` | int | 否 | 9000 | 当前节点每个 vLLM 引擎实例的起始端口。 |
  - title: 配置 Prefill 节点
    content: |-
      在每个 prefill 节点上设置网卡与 IP，并以 `kv_producer` 角色启动 vLLM 引擎。以下展示 Node 0（Prefill）；Node 1（Prefill）除 `local_ip`、`engine_id`、`kv_port` 不同外其余相同。

      ```shell
      # 通过 ifconfig 获取
      # nic_name 是当前节点 local_ip 对应的网卡名
      nic_name="xxx"
      local_ip="141.xx.xx.1"

      # node0_ip 的值必须与 node0（主节点）中设置的 local_ip 一致
      node0_ip="xxxx"

      export HCCL_IF_IP=$local_ip
      export GLOO_SOCKET_IFNAME=$nic_name
      export TP_SOCKET_IFNAME=$nic_name
      export HCCL_SOCKET_IFNAME=$nic_name
      export VLLM_RPC_TIMEOUT=3600000
      export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=30000
      export HCCL_EXEC_TIMEOUT=204
      export HCCL_CONNECT_TIMEOUT=120
      export HCCL_OP_EXPANSION_MODE="AIV"
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1
      export ASCEND_BUFFER_POOL=4:8
      export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
      export HCCL_BUFFSIZE=1536
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
      export ASCEND_RT_VISIBLE_DEVICES=$1

      vllm serve Eco-Tech/Kimi-K2.6-W4A8 \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --seed 1024 \
          --quantization ascend \
          --served-model-name kimi_k26 \
          --trust-remote-code \
          --max-num-seqs 1 \
          --max-model-len 133120 \
          --max-num-batched-tokens 16384 \
          --no-enable-prefix-caching \
          --gpu-memory-utilization 0.92 \
          --enforce-eager \
          --enable-auto-tool-choice \
          --tool-call-parser kimi_k2 \
          --reasoning-parser kimi_k2 \
          --additional-config '{"recompute_scheduler_enable":true,"enable_shared_expert_dp": true}' \
          --mm-encoder-tp-mode data \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_producer",
          "kv_port": "30000",
          "engine_id": "0",
          "kv_connector_extra_config": {
                  "use_ascend_direct": true,
                  "prefill": {
                          "dp_size": 4,
                          "tp_size": 4
                  },
                  "decode": {
                          "dp_size": 8,
                          "tp_size": 4
                  }
              }
          }'
      ```
  - title: 配置 Decode 节点
    content: |-
      在每个 decode 节点上以 `kv_consumer` 角色启动 vLLM 引擎。以下展示 Node 0（Decode）；Node 1（Decode）除 `local_ip`、`engine_id`、`kv_port` 不同外其余相同。

      ```shell
      nic_name="xxx"
      local_ip="141.xx.xx.3"
      node0_ip="xxxx"

      export HCCL_IF_IP=$local_ip
      export GLOO_SOCKET_IFNAME=$nic_name
      export TP_SOCKET_IFNAME=$nic_name
      export HCCL_SOCKET_IFNAME=$nic_name
      export VLLM_RPC_TIMEOUT=3600000
      export VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS=30000
      export HCCL_EXEC_TIMEOUT=204
      export HCCL_CONNECT_TIMEOUT=120
      export HCCL_OP_EXPANSION_MODE="AIV"
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export TASK_QUEUE_ENABLE=1
      export ASCEND_BUFFER_POOL=4:8
      export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:$LD_LIBRARY_PATH
      export HCCL_BUFFSIZE=800
      export VLLM_ASCEND_ENABLE_MLAPO=1
      export ASCEND_RT_VISIBLE_DEVICES=$1

      vllm serve Eco-Tech/Kimi-K2.6-W4A8 \
          --host 0.0.0.0 \
          --port $2 \
          --data-parallel-size $3 \
          --data-parallel-rank $4 \
          --data-parallel-address $5 \
          --data-parallel-rpc-port $6 \
          --tensor-parallel-size $7 \
          --enable-expert-parallel \
          --seed 1024 \
          --quantization ascend \
          --served-model-name kimi_k26 \
          --trust-remote-code \
          --max-num-seqs 8 \
          --max-model-len 133720 \
          --max-num-batched-tokens 32 \
          --no-enable-prefix-caching \
          --gpu-memory-utilization 0.91 \
          --enable-auto-tool-choice \
          --tool-call-parser kimi_k2 \
          --reasoning-parser kimi_k2 \
          --compilation-config '{"cudagraph_mode": "FULL_DECODE_ONLY"}' \
          --additional-config '{"recompute_scheduler_enable":true,"multistream_overlap_shared_expert": true}' \
          --speculative-config '{"method": "eagle3", "model":"lightseekorg/kimi-k2.6-eagle3", "num_speculative_tokens": 3}' \
          --kv-transfer-config \
          '{"kv_connector": "MooncakeConnectorV1",
          "kv_role": "kv_consumer",
          "kv_port": "30200",
          "engine_id": "2",
          "kv_connector_extra_config": {
                  "prefill": {
                          "dp_size": 4,
                          "tp_size": 4
                  },
                  "decode": {
                          "dp_size": 8,
                          "tp_size": 4
                  }
              }
          }'
      ```

      关键参数说明：

      - `VLLM_ASCEND_ENABLE_FLASHCOMM1=1` 在 prefill 节点上启用通信优化。
      - `VLLM_ASCEND_ENABLE_MLAPO=1` 启用融合算子，可显著提升性能但会占用更多 NPU 显存。在 PD 分离场景下，仅在 decode 节点启用 MLAPO。
      - `recompute_scheduler_enable: true` 启用重计算调度器。当 decode 节点的 KV 缓存不足时，请求将被发送到 prefill 节点重计算 KV 缓存。在 PD 分离场景下，建议在 prefill 与 decode 节点上同时启用该配置。
      - `multistream_overlap_shared_expert: true`：当 TP 大小为 1 或启用 `enable_shared_expert_dp: true` 时，额外启用一个流来重叠共享专家的计算过程。
  - title: 在各节点启动服务
    content: |-
      ```shell
      # Prefill — 每个 prefill 节点都是自己的 DP master（dp-address = 本机 IP）
      python launch_online_dp.py --dp-size 4 --tp-size 4 --dp-size-local 4 --dp-rank-start 0 --dp-address xx.xx.xx.1 --dp-rpc-port 12321 --vllm-start-port 7100
      # Decode — 一个 DP 组跨节点（dp-rank-start 按节点递增）
      python launch_online_dp.py --dp-size 8 --tp-size 4 --dp-size-local 4 --dp-rank-start 0 --dp-address xx.xx.xx.3 --dp-rpc-port 12321 --vllm-start-port 7100
      ```
  - title: 在 Prefill 主节点运行代理
    content: |-
      在与 prefill 服务实例相同的节点上运行代理服务器。

      ```shell
      python load_balance_proxy_server_example.py \
        --port 1999 \
        --host 141.xx.xx.1 \
        --prefiller-hosts \
          141.xx.xx.1 \
          141.xx.xx.1 \
          141.xx.xx.1 \
          141.xx.xx.1 \
          141.xx.xx.2 \
          141.xx.xx.2 \
          141.xx.xx.2 \
          141.xx.xx.2 \
        --prefiller-ports \
          7100 7101 7102 7103 7100 7101 7102 7103 \
        --decoder-hosts \
          141.xx.xx.3 \
          141.xx.xx.3 \
          141.xx.xx.3 \
          141.xx.xx.3 \
          141.xx.xx.4 \
          141.xx.xx.4 \
          141.xx.xx.4 \
          141.xx.xx.4 \
        --decoder-ports \
          7100 7101 7102 7103 \
          7100 7101 7102 7103 \
      ```

      ```shell
      cd vllm-ascend/examples/disaggregated_prefill_v1/
      bash proxy.sh
      ```
  - title: 部署验证
    content: |-
      PD 分离服务完全启动后，通过 prefill 主节点上的代理端口发送请求，验证 Prefill 与 Decode 节点是否协同工作：

      ```shell
      curl http://141.xx.xx.1:1999/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d '{
              "model": "kimi_k26",
              "messages": [{
                  "role": "user",
                  "content": [
                  {
                      "type": "text",
                      "text": "The future of AI is"
                  }]
              }],
              "max_tokens": 1024,
              "temperature": 1.0,
              "top_p": 0.95
          }'
      ```

      预期结果：

      代理返回 HTTP 200 OK。JSON 响应中包含 `choices` 字段及生成的文本，说明 Prefill 节点已成功处理提示、Decode 节点已生成响应。

verification: |-
  服务启动后，可使用输入提示查询模型：

  ```shell
  curl http://<node0_ip>:<port>/v1/chat/completions \
      -H "Content-Type: application/json" \
      -d '{
          "model": "kimi_k26",
          "messages": [{
