  benchmark: |-
    ### 推荐配置

    > **注意**：以下配置在特定测试环境中验证，仅供参考。最优配置取决于最大输入/输出长度、前缀缓存命中率、精度要求以及部署机器配比等因素。建议根据实际情况参考调优指南。

    #### 表 1：场景概览

    > `*Total NPUs` 表示所有节点使用的 NPU 总数。1 节点 = 1 台 Atlas 800 A3（64G × 16 NPU）。

    | 场景 | 部署模式 | *Total NPUs | 权重版本 | 关键考虑 |
    | --- | --- | --- | --- | --- |
    | 高吞吐（16k 输入） | 单节点混合 | 16 (A3) | kimi-k2.6-w4a8 | 使用 dp2 tp8 平衡显存容量与计算效率 |
    | 高吞吐（16k 输入） | 1P1D 部署 | 32 (A3) | kimi-k2.6-w4a8 | P 与 D 节点均 dp2 tp8；平衡时延与吞吐 |
    | 高吞吐（16k 输入） | 2P1D 部署 | 64 (A3) | kimi-k2.6-w4a8 | 跨节点从 dp4 tp4 扩展到 dp8 tp4 |
    | 长上下文（128k，无前缀缓存） | 单节点混合 | 16 (A3) | kimi-k2.6-w4a8 | dp1 tp16 最大化 TP，容纳极端上下文长度 |
    | 长上下文（128k，有前缀缓存） | 单节点混合 | 16 (A3) | kimi-k2.6-w4a8 | dp2 tp8 优化内存带宽并提升缓存利用率 |
    | 多模态（1080P） | 单节点混合 | 16 (A3) | kimi-k2.6-w4a8 | 高分辨率视觉输入使用 dp1 tp16 |
    | 多模态（1080P） | 1P1D 部署 | 32 (A3) | kimi-k2.6-w4a8 | 视内存与并发选择 dp2 tp8 或 dp16 tp1 |
    | 多模态（1080P） | 2P1D 部署 | 64 (A3) | kimi-k2.6-w4a8 | dp8 tp2 到 dp32 tp1，最大化重多模态负载吞吐 |

    #### 表 2：节点详细配置

    | 场景 | 配置 | NPUs | TP | DP | Max Model Len | MTP Speculation Num |
    | --- | --- | --- | --- | --- | --- | --- |
    | 高吞吐 / 低时延（16k） | Server / 单机 | 16 | 8 | 2 | 17k | 15 |
    | 高吞吐 / 低时延（16k） | Server-P 节点 | 16 | 8 | 2 | 17k | 3 |
    | 高吞吐 / 低时延（16k） | Server-D 节点 | 16 | 8 | 2 | 17k | 3 |
    | 长上下文（128k，无缓存） | Server / 单机 | 16 | 16 | 1 | 130k | 15 |
    | 长上下文（128k，有缓存） | Server / 单机 | 16 | 8 | 2 | 130k | 15 |
    | 多模态（1080P） | Server / 单机 | 16 | 16 | 1 | 17k | 15 |
    | 多模态（1080P） | Server-P 节点 | 16 | 8 | 2 | 17k | 3 |
    | 多模态（1080P） | Server-D 节点 | 16 | 1 | 16 | 17k | 3 |

    > 完整启动命令与参数说明请参考部署章节中的部署示例。

    **注意：**

    `max-model-len` 与 `max-num-seqs` 需要根据实际使用场景设置。其他设置请参考部署章节。

