        根据机器类型选择镜像，并在节点上启动 docker 镜像，参考[使用 docker](https://docs.vllm.ai/projects/ascend/zh-cn/latest/installation.html#set-up-using-docker)。

        在每个节点上启动 docker 镜像。

        ```shell
        export IMAGE=quay.io/ascend/vllm-ascend:v0.20.0rc1
        docker run --rm \
            --name vllm-ascend \
            --shm-size=1g \
            --net=host \
            --privileged=true \
            --device /dev/davinci0 \
            --device /dev/davinci1 \
