  performance:
    content: |-
      ### 使用 AISBench

      详情参考[使用 AISBench 进行性能评估](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation)。

      ### 使用 vLLM Benchmark

      以 `Kimi-K2.6-w4a8` 为例进行性能评估，详情参考 [vllm benchmark](https://docs.vllm.ai/en/latest/benchmarking/)。

      `vllm bench` 有三个子命令：

      - `latency`：基准测试单批请求的时延。
      - `serve`：基准测试在线服务吞吐。
      - `throughput`：基准测试离线推理吞吐。

      以 `serve` 为例，运行如下命令。

      ```shell
      vllm bench serve --model Eco-Tech/Kimi-K2.6-w4a8 --dataset-name random --random-input 1024 --num-prompts 200 --request-rate 1 --save-result --result-dir ./
      ```

      大约几分钟后即可得到性能评估结果。

performance:
  accuracy: |-
    ### 使用 AISBench

    1. 详情参考[使用 AISBench](https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/evaluation/using_ais_bench.html)。

    2. 执行后可得到结果。以下是 `Kimi-K2.6-w4a8` 在 `vllm-ascend:v0.20.0rc1` 上的结果，仅供参考。

    | dataset | version | metric | mode | vllm-api-general-chat | note |
