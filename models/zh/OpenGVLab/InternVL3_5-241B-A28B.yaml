meta:
  title: InternVL3_5-241B-A28B
  slug: internvl3-5-241b-a28b
  provider: OpenGVLab
  description: InternVL3_5-241B-A28B 昇腾部署：公开权重路径与实验性教程基线。
  date_added: '2026-10-20'
  difficulty: advanced
  hardware:
    atlas_800_a3: experimental
model:
  model_id: OpenGVLab/InternVL3_5-241B-A28B
  architecture: moe
  parameter_count: 240.7B
  active_parameters: 28B
  context_length: 40960
  modality: multimodal
  base_args:
  - --trust-remote-code
  - --served-model-name
  - internvl3_5
  - --tensor-parallel-size
  - '4'
  - --data-parallel-size
  - '2'
  - --enable-expert-parallel
  base_env:
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    TASK_QUEUE_ENABLE: '1'
    HCCL_OP_EXPANSION_MODE: AIV
    OMP_PROC_BIND: 'false'
    OMP_NUM_THREADS: '1'
    VLLM_USE_V1: '1'
    VLLM_TORCH_PROFILER_WITH_STACK: '0'
    HCCL_BUFFSIZE: '1536'
  docker_image:
    atlas_800_a3: quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
  install:
    pip: false
    docker:
      command: docker pull quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
      note: 手工验证使用 vLLM Ascend v0.30.0 正式版。模型启动、推理、精度和性能均待实机验证。v0.30.0 官方文档已标明停止支持该模型。
variants:
  default:
    precision: W8A8
    description: 教程权重，等待运行时验证。
    model_id: Eco-Tech/InternVL3_5-241B-A28B-w8a8
    vram_minimum_gb: 289
compatible_strategies:
- single_node_A3
hardware_overrides: {}
strategy_overrides: {}
guide: ''
overview: InternVL3_5-241B-A28B 将 InternViT 视觉编码器与 Qwen3 语言模型结合，用于图像理解和多模态对话。语言主干为稀疏 MoE，权重共 240.7B 参数，每次约激活 28B。
weight_download:
- weight_version: W8A8
  sources:
  - source: ModelScope
    url: https://modelscope.cn/models/Eco-Tech/InternVL3_5-241B-A28B-w8a8
    command: |-
      ```bash
      pip install modelscope
      modelscope download --model Eco-Tech/InternVL3_5-241B-A28B-w8a8 --local_dir /models/Eco-Tech/InternVL3_5-241B-A28B-w8a8
      ```
prerequisites:
- title: 运行时验证状态
  content: 手工验证使用 vLLM Ascend v0.30.0 正式版。模型启动、推理、精度和性能均待实机验证。v0.30.0 官方文档已标明停止支持该模型。
- title: 镜像验证记录
  content: 在每台测试节点上记录 docker image inspect 显示的镜像仓库摘要和已安装的软件包版本。
- title: 主机准备
  content: 使用具有 16 个可见 64 GB 逻辑设备（8 个双芯片 NPU）的 Atlas 800I A3 节点。按照[安装指南](https://docs.vllm.ai/projects/ascend/en/latest/installation.html)确认驱动、CANN、HCCL
    与容器兼容性。源文档中的 CPU 调频与 sysctl 调优属于可选管理员操作，以下命令不会自动执行。
env_setup:
  container:
    A3:
      content: |-
        在 Linux 昇腾主机上执行，先将权重下载到 `/models`。映射本次部署预留的设备。PD 场景在每个节点执行，各节点必须具有相同的权重相对路径。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:v0.30.0-a3-openeuler
        devices=()
        for i in {0..15}; do devices+=(--device "/dev/davinci$i"); done
        docker run --rm -it --name ascend-recipe --net=host --ipc=host \
          "${devices[@]}" \
          --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /models:/models -w /models "$IMAGE" bash
        ```
scenarios:
- npu: Atlas 800I A3
  precision: W8A8
  deployment: 单节点
  case: TP4 DP2 EP
  tags:
  - a3-single
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      ```bash
      cd /models
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export TASK_QUEUE_ENABLE=1
      export HCCL_OP_EXPANSION_MODE=AIV
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export VLLM_USE_V1=1
      export VLLM_TORCH_PROFILER_WITH_STACK=0
      export HCCL_BUFFSIZE=1536
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      vllm serve Eco-Tech/InternVL3_5-241B-A28B-w8a8 \
        --port 2001 \
        --served-model-name internvl3_5 \
        --trust-remote-code \
        --max-model-len 40960 \
        --max-num-batched-tokens 4096 \
        --tensor-parallel-size 4 \
        --data-parallel-size 2 \
        --max-num-seqs 70 \
        --gpu-memory-utilization 0.9 \
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
        --additional-config '{"weight_nz_mode":1,"enable_cpu_binding":true,"enable_fused_mc2":1}'  \
        --mm-processor-cache-gb 0 \
        --enable-chunked-prefill \
        --enable-expert-parallel \
        --safetensors-load-strategy prefetch \
        --allowed-local-media-path /
      ```
  - title: 检查就绪并执行推理
    content: |-
      在同一容器的第二个终端中执行。`/v1/models` 仅检查就绪，后续请求必须返回非空响应。

      ```bash
      set -euo pipefail
      curl --fail --silent --show-error http://127.0.0.1:2001/v1/models
      response=$(curl --fail --silent --show-error http://127.0.0.1:2001/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"internvl3_5","max_tokens":64,"temperature":0,"messages":[{"role":"user","content":[{"type":"image_url","image_url":{"url":"https://modelscope.oss-cn-beijing.aliyuncs.com/resource/tiger.jpeg"}},{"type":"text","text":"What is the text in the illustration?"}]}]}')
      python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["choices"]; m=r["choices"][0]["message"]; assert m.get("content") or m.get("tool_calls")' <<<"$response"
      ```
performance:
  accuracy: 尚未测量。按照 [AISBench 精度评估](https://docs.vllm.ai/projects/ascend/en/v0.23.0/developer_guide/evaluation/using_ais_bench.html)记录数据集版本、生成参数及权重版本。冒烟响应不能作为精度证据。
  benchmark: 尚未测量。使用 [vLLM 基准测试](https://docs.vllm.ai/en/latest/benchmarking/)或 [AISBench 性能评估](https://docs.vllm.ai/projects/ascend/en/v0.23.0/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation)，单独保存请求数、成功数、输入输出长度、并发、TTFT、TPOT
    和吞吐量，与就绪证据区分。
