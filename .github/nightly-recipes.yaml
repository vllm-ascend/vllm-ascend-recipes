# Nightly resource policy ONLY. PRs never use this as a model admission list.
# A plain recipe path uses model.docker_image; image is an optional explicit
# override for a known CI environment, not a requirement when adding a model.
single_node:
  a2:
    - recipe: models/en/Qwen/Qwen3-30B-A3B.yaml
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.23.0
    # Qwen3.5-27B / Qwen3.6-27B are intentionally absent here: the A2 scenario is
    # marked `experimental` because this A2 runner has 910B4 parts (32 GB per die)
    # and cannot host the tutorial's 133k-context layout, so there is no A2
    # verification target and a nightly run would produce a dot the page cannot
    # attribute. Add both entries together with matching verification-targets
    # entries when 64 GB A2 hardware is available.
    - models/en/Qwen/Qwen3-Embedding-0.6B.yaml
    - models/en/PaddlePaddle/PaddleOCR-VL.yaml
    - models/en/Qwen/Qwen3-Reranker.yaml
    - models/en/Qwen/Qwen3-VL-Reranker-2B.yaml
  a3:
    - recipe: models/en/Qwen/Qwen3-30B-A3B.yaml
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.23.0-a3
  a5:
    - models/en/DeepSeek/DeepSeek-V4-Flash.yaml
    - models/en/THUDM/GLM-5.yaml
    # Qwen3.5-27B / Qwen3.6-27B are intentionally absent here: the Ascend 950DT
    # paths are marked `experimental` in both recipes and have no verification
    # target, so a nightly run would produce a dot the page cannot attribute.
    # Add `models/en/Qwen/Qwen3.6-27B.yaml` with
    # image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.30.0-a5
    # together with a matching verification-targets.yaml entry when 950DT
    # validation is re-enabled.

# No multi-node resources are requested by default. Add existing target IDs
# from verification-targets.yaml when machines are available, for example:
# multi_node:
#   - deepseek-v2-lite-a2-w8a8-1p1d
#   - qwen3-30b-a3b-a2-bf16-2node
multi_node: []
