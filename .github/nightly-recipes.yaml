    - recipe: models/en/Qwen/Qwen3-30B-A3B.yaml
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.23.0
    - recipe: models/en/Qwen/Qwen3.5-27B-Qwen3.6-27B.yaml
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.23.0
  a3:
    - recipe: models/en/Qwen/Qwen3-30B-A3B.yaml
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.23.0-a3
  a5:
    - models/en/DeepSeek/DeepSeek-V4-Flash.yaml
    - models/en/THUDM/GLM-5.yaml
