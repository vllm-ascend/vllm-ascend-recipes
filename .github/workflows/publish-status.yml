#
# Publish CI verification status + run-params directly into `public/status/`
# and `public/runs/` on the `main` branch so the static Astro site can show
# fully traceable "Last PR pass / Last nightly pass" badges WITHOUT modifying
# any model YAML.
#
# Triggered by `workflow_run` → reacts to PR Recipe Verify / Nightly Recipe
# Verify completions. The commit message deliberately does NOT carry `[skip ci]`
# so deploy.yml fires on this push and ships the new status JSON immediately.
# Other workflows are unaffected (paths-filter excludes public/** on
# nightly-recipe-verify; pr-recipe-verify only listens to pull_request; lint
# uses dorny/paths-filter to skip on public/**-only commits).
#
# Why main, not a separate `gh-pages` branch?
#   - Astro's normal `public/` → `dist/` copy during `pnpm build` picks up
#     status files automatically; deploy.yml does NOT need to merge data
#     from a second branch at deploy time.
#   - One source of truth (main), no extra branch to babysit.
#   - Concurrency `cancel-in-progress: true` serializes publishes; the
#     `git pull --rebase` below tolerates the rare case where main moved
#     under us between fetch and push.
#
# Why a skeleton step?
#   - Every recipe in models/en/ gets a status JSON on first publish. Recipes
#     with `meta.hardware.atlas_800_a2: unsupported` are seeded with a
#     `status: "skip"` nightly record so the badge renders a gray "not run"
#     pill instead of HTTP 404. This replaces the dev-time mock fixtures that
#     previously shipped in git (commit 693d546) and stopped being overwritten
#     for hardware-incompatible recipes.
#
# Future migration to OBS (Object Storage Service):
#   When OBS becomes available for status JSON, only two things need to change:
#     1. This workflow's last step: replace `git push origin main` with
#        `obsutil cp` to the status bucket.
#     2. Frontend status loader: swap the relative `/status/<slug>.json`
#        path for the public OBS URL.
#   The frontend file shape, badge logic, and trigger wiring all stay
#   identical.
#
# Outputs (committed under `public/` in main):
#   status/<model-slug>.json            per-recipe latest PR+nightly summary
#   status/index.json                   aggregate index for /browse page
#   runs/<sha>/<recipe>.params.json     exact vllm-ascend command snapshot
#

name: 'Publish Verification Status'

on:
  workflow_run:
    workflows: ['PR Recipe Verify', 'Nightly Recipe Verify', 'Multi-node framework']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-status
  # Each completed run carries independent evidence; queue publishers instead
  # of dropping an in-flight result behind a newer unrelated verification.
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.workflow_run.name == 'Multi-node framework' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # workflow_run fires in the default-branch context; HEAD == origin/main
      # here. We commit + push status data back to main.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download run-params artifact
        uses: actions/download-artifact@v4
        with:
          name: recipe-verify-results-${{ github.event.workflow_run.id }}
          path: results/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download configuration verification results
        uses: actions/download-artifact@v4
        with:
          pattern: verification-target-results-${{ github.event.workflow_run.id }}-*
          path: target-results/
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Resolve trigger metadata
        id: meta
        env:
          RW_API_URL: ${{ github.event.workflow_run.html_url }}
          RW_NAME: ${{ github.event.workflow_run.name }}
          RW_EVENT: ${{ github.event.workflow_run.event }}
          RW_RUN_ID: ${{ github.event.workflow_run.id }}
          RW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RW_REPO: ${{ github.repository }}
        run: |
          case "$RW_NAME" in
            *"PR Recipe Verify"*) TRIGGER="pr" ;;
            *"Multi-node framework"*)
              if [ "$RW_EVENT" = "schedule" ]; then
                TRIGGER="nightly"
              elif [ "$RW_EVENT" = "workflow_dispatch" ]; then
                TRIGGER="manual"
              else
                TRIGGER="pr"
              fi ;;
            *) TRIGGER="nightly" ;;
          esac
          {
            echo "trigger=$TRIGGER"
            echo "workflow_name=$RW_NAME"
            echo "head_sha=$RW_HEAD_SHA"
            echo "conclusion=$RW_CONCLUSION"
            echo "run_url=$RW_API_URL"
            echo "run_id=$RW_RUN_ID"
            echo "repo=$RW_REPO"
          } >> "$GITHUB_OUTPUT"

      - name: Try to extract PR metadata
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          # gh API: find the PR that contains this SHA (works for PR-head runs and merges into main)
          set +e
          pr_json=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            -H 'Accept: application/vnd.github.gambit+json' 2>/dev/null)
          if [ -z "$pr_json" ] || [ "$pr_json" = "[]" ]; then
            {
              echo "pr_number="
              echo "pr_url="
              echo "pr_title="
              echo "pr_author="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number=$(echo "$pr_json" | jq -r '.[0].number // empty')
          pr_url=$(echo "$pr_json" | jq -r '.[0].html_url // empty')
          pr_title=$(echo "$pr_json" | jq -r '.[0].title // empty')
          pr_author=$(echo "$pr_json" | jq -r '.[0].user.login // empty')
          {
            echo "pr_number=$pr_number"
            echo "pr_url=$pr_url"
            echo "pr_title=$pr_title"
            echo "pr_author=$pr_author"
          } >> "$GITHUB_OUTPUT"

      - name: Install jq + pyyaml
        run: |
          set -euo pipefail
          sudo apt-get install -y jq || apt-get install -y jq
          python3 -m pip install --quiet pyyaml

      # Step 0: seed a status JSON for every recipe in models/en/ that does
      # not have one yet. Existing real records (40-char hex head_sha + real
      # workflow_run_id) are preserved verbatim; we only fill empty slots
      # and clear any stale mock fixtures that may have shipped in git.
      # Script lives in .github/_scripts/ rather than inline because the
      # heredoc approach (`python3 - <<'PYEOF'`) inside a YAML `run: |`
      # block confuses the workflow YAML parser — it reads `<<` as a YAML
      # merge-key marker and the workflow file fails to parse.
      - name: Seed skeleton status files for unsynced recipes
        env:
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/_scripts/publish_skeleton.py

      - name: Build status JSON files
        env:
          TRIGGER: ${{ steps.meta.outputs.trigger }}
          WORKFLOW_NAME: ${{ steps.meta.outputs.workflow_name }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          RUN_ID: ${{ steps.meta.outputs.run_id }}
          CONCLUSION: ${{ steps.meta.outputs.conclusion }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
          PR_AUTHOR: ${{ steps.pr.outputs.pr_author }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Write straight into the public/ tree so Astro's normal
          # public/ → dist/ copy picks them up — no separate branch,
          # no deploy-time merge step.
          mkdir -p public/status "public/runs/${HEAD_SHA}"

          # 1) Mirror params.json files verbatim to public/runs/<sha>/
          #    (frontend link target).
          if compgen -G "results/*.params.json" > /dev/null; then
            for f in results/*.params.json; do
              base="$(basename "$f")"
              cp "$f" "public/runs/${HEAD_SHA}/${base}"
              # Patch head_sha on the fly in case the inner dump missed it
              jq --arg sha "${HEAD_SHA}" '.head_sha = $sha' \
                "public/runs/${HEAD_SHA}/${base}" > "$f.tmp" \
                && mv "$f.tmp" "public/runs/${HEAD_SHA}/${base}"
            done
            mirrored=$(find results -maxdepth 1 -name '*.params.json' | wc -l)
            echo "Mirrored ${mirrored} params files to public/runs/${HEAD_SHA}/"
          else
            echo "No params.json artifacts found, skipping runs mirror"
          fi

          # 2) Build per-recipe status JSON.
          #    Recipe slug = stem name of *.params.json (e.g. Qwen3-30B-A3B).
          for f in results/*.params.json; do
            [ -f "$f" ] || continue
            slug="$(basename "$f" .params.json)"
            stat_file="results/${slug}.status"
            recipe_file="results/${slug}.recipe"
            status="unknown"
            if [ -f "$stat_file" ]; then
              status=$(tr -d ' \n\r' < "$stat_file")
            fi
            recipe_path=""
            if [ -f "$recipe_file" ]; then
              recipe_path=$(tr -d ' \n\r' < "$recipe_file")
            fi
            params_url="https://${REPO%/*}.github.io/${REPO##*/}/runs/${HEAD_SHA}/${slug}.params.json"
            head_sha_url="https://github.com/${REPO}/commit/${HEAD_SHA}"
            recipe_yaml_url="https://github.com/${REPO}/blob/${HEAD_SHA}/${recipe_path}"

            started_at=$(jq -r '.started_at // empty' "$f")
            concluded_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            status_block=$(jq -n \
              --arg kind "${TRIGGER}" \
              --arg status "${status}" \
              --arg conclusion "${CONCLUSION}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg head_sha_url "${head_sha_url}" \
              --arg run_id   "${RUN_ID}" \
              --arg run_url  "${RUN_URL}" \
              --arg recipe_path "${recipe_path}" \
              --arg recipe_yaml_url "${recipe_yaml_url}" \
              --arg params_url "${params_url}" \
              --arg started_at "${started_at}" \
              --arg finished_at "${concluded_iso}" \
              --arg pr_number "${PR_NUMBER}" \
              --arg pr_url    "${PR_URL}" \
              --arg pr_title  "${PR_TITLE}" \
              --arg pr_author "${PR_AUTHOR}" \
              '{
                kind: $kind,
                status: $status,
                conclusion: $conclusion,
                head_sha: $head_sha,
                head_sha_url: $head_sha_url,
                workflow_run_id: ($run_id|tonumber),
                workflow_run_url: $run_url,
                recipe_path: $recipe_path,
                recipe_yaml_url: $recipe_yaml_url,
                params_url: $params_url,
                started_at: $started_at,
                finished_at: $finished_at,
                pr_number: (if $pr_number != "" then ($pr_number|tonumber) else null end),
                pr_url: (if $pr_url != "" then $pr_url else null end),
                pr_title: (if $pr_title != "" then $pr_title else null end),
                pr_author: (if $pr_author != "" then $pr_author else null end)
              }')

            # Read previous status file if it exists, then merge: keep last_pr_run
            # from prior unless this is a PR run; keep last_nightly_run likewise.
            prev="public/status/${slug}.json"
            last_pr=$(jq -c '.last_pr_run // null' "$prev" 2>/dev/null || true)
            last_nightly=$(jq -c '.last_nightly_run // null' "$prev" 2>/dev/null || true)
            last_manual=$(jq -c '.last_manual_run // null' "$prev" 2>/dev/null || true)
            targets=$(jq -c '.targets // {}' "$prev" 2>/dev/null || true)
            if [ "${TRIGGER}" = "pr" ]; then
              last_pr="$status_block"
            elif [ "${TRIGGER}" = "nightly" ]; then
              last_nightly="$status_block"
            else
              last_manual="$status_block"
            fi
            jq -n \
              --arg slug "${slug}" \
              --argjson last_pr "${last_pr:-null}" \
              --argjson last_nightly "${last_nightly:-null}" \
              --argjson last_manual "${last_manual:-null}" \
              --argjson targets "${targets:-{}}" \
              '{
                 model: $slug,
                 last_pr_run: $last_pr,
                 last_nightly_run: $last_nightly,
                 last_manual_run: $last_manual,
                 targets: $targets
               }' > "public/status/${slug}.json"
          done

          # 3) Materialize every allowlisted configuration, including targets
          #    that have no successful run yet, so the homepage can distinguish
          #    partial coverage from fully verified models.
          python3 .github/_scripts/seed_target_statuses.py \
            --status-dir public/status \
            --targets .github/verification-targets.yaml

          # 4) Match recipe-verification params to the explicit single-node
          #    allowlist. This also refreshes historic pass/fail evidence
          #    without inventing a result for skipped or empty scenarios.
          python3 .github/_scripts/sync_single_node_target_status.py \
            --status-dir public/status \
            --runs-dir public/runs \
            --targets .github/verification-targets.yaml

          # 5) A scheduled run must supersede every target's former nightly
          #    result, even when an A2 runner never initialized and therefore
          #    could not upload its own artifact. Preserve real artifacts and
          #    materialize a failed record only for targets that are absent.
          if [ "$TRIGGER" = "nightly" ] && [ "$WORKFLOW_NAME" = "Multi-node framework" ]; then
            python3 .github/_scripts/fill_missing_target_results.py \
              --targets .github/verification-targets.yaml \
              --output-dir target-results
          elif [ "$TRIGGER" = "pr" ] && [ "$WORKFLOW_NAME" = "Multi-node framework" ]; then
            # A whole PR workflow can be cancelled before its in-workflow
            # fallback uploads. Query the completed job results here and
            # synthesize only targets whose job did not succeed or skip.
            failed_target_ids=()
            while IFS= read -r job_name; do
              case "$job_name" in
                "multi-node (deepseek-v2-lite-pd-2n2c)")
                  failed_target_ids+=(template-deepseek-v2-lite-pd-a2-w8a8-1p1d) ;;
                "multi-node (deepseek-v2-lite-recipe-pd-2n2c)")
                  failed_target_ids+=(deepseek-v2-lite-a2-w8a8-1p1d) ;;
                "multi-node (qwen3-30b-a3b-dp-2n2c)")
                  failed_target_ids+=(template-qwen3-30b-a3b-a2-bf16-2node) ;;
                "multi-node (qwen3-30b-a3b-recipe-dp-2n2c)")
                  failed_target_ids+=(qwen3-30b-a3b-a2-bf16-2node) ;;
              esac
            done < <(
              gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --paginate \
                | jq -r '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name'
            )
            if ((${#failed_target_ids[@]})); then
              fill_args=()
              for target_id in "${failed_target_ids[@]}"; do
                fill_args+=(--target-id "$target_id")
              done
              python3 .github/_scripts/fill_missing_target_results.py \
                --targets .github/verification-targets.yaml \
                --output-dir target-results "${fill_args[@]}"
            fi
          fi

          # 6) Merge configuration-level results emitted by the PR34-derived
          # multi-node jobs. A green detail-page dot is driven only by the
          # latest nightly record in this target map.
          for f in target-results/*.json; do
            [ -f "$f" ] || continue
            target_id=$(jq -r '.target_id // empty' "$f")
            recipe_path=$(jq -r '.recipe // empty' "$f")
            test_id=$(jq -r '.test_id // empty' "$f")
            status=$(jq -r '.status // "fail"' "$f")
            [ -n "$target_id" ] && [ -n "$recipe_path" ] || continue
            target=$(TARGET_ID="$target_id" python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path

          script = Path('.github/_scripts/verification_targets.py')
          spec = importlib.util.spec_from_file_location('verification_targets', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          found = module.find_target_id(module.load_targets(Path('.github/verification-targets.yaml')), os.environ['TARGET_ID'])
          if found:
              print(json.dumps(found))
          PY
            )
            [ -n "$target" ] || { echo "Unknown verification target: $target_id" >&2; exit 1; }
            target_recipe=$(jq -r '.recipe' <<<"$target")
            target_test_id=$(jq -r '.test_id // empty' <<<"$target")
            [ "$recipe_path" = "$target_recipe" ] && [ "$test_id" = "$target_test_id" ] || {
              echo "Target artifact does not match registry: $target_id" >&2
              exit 1
            }
            slug=$(basename "$target_recipe" .yaml)
            params_url="$RUN_URL"
            head_sha_url="https://github.com/${REPO}/commit/${HEAD_SHA}"
            recipe_yaml_url="https://github.com/${REPO}/blob/${HEAD_SHA}/${recipe_path}"
            concluded_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            status_block=$(jq -n \
              --arg kind "$TRIGGER" --arg status "$status" --arg conclusion "$CONCLUSION" \
              --arg head_sha "$HEAD_SHA" --arg head_sha_url "$head_sha_url" \
              --arg run_id "$RUN_ID" --arg run_url "$RUN_URL" \
              --arg recipe_path "$recipe_path" --arg recipe_yaml_url "$recipe_yaml_url" \
              --arg params_url "$params_url" --arg started_at "$concluded_iso" --arg finished_at "$concluded_iso" \
              --arg pr_number "$PR_NUMBER" --arg pr_url "$PR_URL" --arg pr_title "$PR_TITLE" --arg pr_author "$PR_AUTHOR" \
              '{kind:$kind,status:$status,conclusion:$conclusion,head_sha:$head_sha,head_sha_url:$head_sha_url,workflow_run_id:($run_id|tonumber),workflow_run_url:$run_url,recipe_path:$recipe_path,recipe_yaml_url:$recipe_yaml_url,params_url:$params_url,started_at:$started_at,finished_at:$finished_at,pr_number:(if $pr_number != "" then ($pr_number|tonumber) else null end),pr_url:(if $pr_url != "" then $pr_url else null end),pr_title:(if $pr_title != "" then $pr_title else null end),pr_author:(if $pr_author != "" then $pr_author else null end)}')
            prev="public/status/${slug}.json"
            mkdir -p public/status
            [ -f "$prev" ] || jq -n --arg slug "$slug" '{model:$slug,last_pr_run:null,last_nightly_run:null,last_manual_run:null,targets:{}}' > "$prev"
            target_file=$(mktemp)
            run_file=$(mktemp)
            printf '%s\n' "$target" > "$target_file"
            printf '%s\n' "$status_block" > "$run_file"
            python3 .github/_scripts/merge_target_status.py \
              --status-file "$prev" --target-file "$target_file" --run-file "$run_file" \
              --trigger "$TRIGGER"
            rm -f "$target_file" "$run_file"
          done

          # 7) Build public/status/index.json (used by /browse & home cards).
          #    IMPORTANT: exclude index.json itself — the previous glob matched
          #    it and emitted `{"slug": null}` entries on every run.
          #
          #    Note: we intentionally do NOT include an `updated_at` timestamp
          #    here. publish-status.yml runs on every Recipe Verify completion
          #    (via workflow_run), so any timestamp would change on every PR
          #    CI run and re-dirty the PR's `public/status/index.json`, breaking
          #    merges in an unbreakable loop. The frontend (src/lib/status.ts)
          #    does not read `updated_at` either, so dropping it is safe.
          index_items=$(for f in public/status/*.json; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "index.json" ] && continue
            slug=$(jq -r '.model // empty' "$f")
            [ -z "$slug" ] && continue
            jq -nc --arg s "$slug" '{slug: $s}'
          done | jq -s '.')
          jq -n --argjson items "$index_items" \
            '{ models: $items }' > public/status/index.json
          built=$(find public/status -maxdepth 1 -name '*.json' | wc -l)
          echo "Built ${built} status files + index.json"

      - name: Commit and push status data to main
        env:
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          TRIGGER: ${{ steps.meta.outputs.trigger }}
        run: |
          set -euo pipefail
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"

          # Track only the status payload, never touch other repo files.
          git add public/status public/runs
          if git diff --cached --quiet; then
            echo "No status changes to publish."
            exit 0
          fi

          # Tolerate the rare case where main moved under us (e.g. a merged
          # PR between our fetch and push). The rebase only touches commits
          # we just produced locally; if anything conflicts it aborts cleanly
          # and the next run will retry against the updated main.
          git pull --rebase --autostash origin main || {
            echo "::warning::Rebase onto main failed; aborting. Next publish will retry."
            git rebase --abort || true
            exit 0
          }

          git commit -m "ci: ${TRIGGER} status update from ${HEAD_SHA}" \
            -m "Triggered by: ${RUN_URL}" \
            -m "Repo: ${REPO}"

          # NOTE: no [skip ci] here — we WANT deploy.yml to fire on this push
          # so the new status JSON ships to GitHub Pages immediately. Other
          # workflows are unaffected:
          #   - nightly-recipe-verify: paths-filter excludes public/**
          #   - pr-recipe-verify:      pull_request trigger, not push
          #   - lint:                  dorny/paths-filter makes all sub-jobs
          #                             skip on public/**-only commits

          git push origin HEAD:main
          echo "Published status data to main."
