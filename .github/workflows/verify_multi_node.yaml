name: Multi-node framework

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      # Only recipe YAML changes trigger the multi-node framework on PRs;
      # framework/workflow changes are validated by workflow_dispatch / UT.
      - 'models/**/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.select.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed multi-node recipe YAMLs
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'models/**/*.yaml' || true)
            # Normalize zh mirrors to their en owner so `contains()` below works
            # for either language. Space-separated en recipe paths.
            SELECTED=''
            if echo "$CHANGED" | grep -q 'models/.*/DeepSeek/template_pd\.yaml'; then
              SELECTED="$SELECTED models/en/DeepSeek/template_pd.yaml"
            fi
            if echo "$CHANGED" | grep -q 'models/.*/DeepSeek/DeepSeek-V2-Lite-W8A8\.yaml'; then
              SELECTED="$SELECTED models/en/DeepSeek/DeepSeek-V2-Lite-W8A8.yaml"
            fi
            if echo "$CHANGED" | grep -q 'models/.*/Qwen/template2_non_pd\.yaml'; then
              SELECTED="$SELECTED models/en/Qwen/template2_non_pd.yaml"
            fi
            echo "Changed multi-node recipes:$SELECTED"
          else
            # workflow_dispatch: every matrix case runs.
            SELECTED=''
          fi
          echo "changed=$SELECTED" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    name: multi-node (${{ matrix.name }})
    # pull_request workflows cannot safely expose cluster credentials to forks.
    # Each static matrix case runs only when its recipe YAML changed (or on
    # workflow_dispatch); unrelated cases are skipped.
    if: >
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name == 'workflow_dispatch' || contains(needs.prepare.outputs.changed, matrix.recipe))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deepseek-v2-lite-pd-2n2c
            recipe: models/en/DeepSeek/template_pd.yaml
            test_id: pd-2n2c
          - name: deepseek-v2-lite-recipe-pd-2n2c
            recipe: models/en/DeepSeek/DeepSeek-V2-Lite-W8A8.yaml
            test_id: dsv2lite-pd-2n2c
          - name: qwen3-30b-a3b-dp-2n2c
            recipe: models/en/Qwen/template2_non_pd.yaml
            test_id: dp-2n2c
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: ${{ matrix.name }}
      recipe: ${{ matrix.recipe }}
      test_id: ${{ matrix.test_id }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}
