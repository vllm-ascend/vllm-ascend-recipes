name: Multi-node framework

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      # Only recipe YAML changes trigger the multi-node framework on PRs;
      # framework/workflow changes are validated by workflow_dispatch / UT.
      - 'models/**/*.yaml'
  workflow_dispatch:
    inputs:
      case:
        description: Framework case to run
        required: true
        type: choice
        default: all
        options:
          - all
          - deepseek-template-pd
          - deepseek-v2-lite-pd
          - qwen-template-non-pd
          - qwen3-30b-a3b-non-pd

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pd_template: ${{ steps.select.outputs.pd_template }}
      v2lite: ${{ steps.select.outputs.v2lite }}
      qwen: ${{ steps.select.outputs.qwen }}
      qwen30b: ${{ steps.select.outputs.qwen30b }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed multi-node recipe YAMLs
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'models/**/*.yaml' || true)
            if echo "$CHANGED" | grep -q 'models/.*/DeepSeek/template_pd\.yaml'; then
              echo "pd_template=true" >> "$GITHUB_OUTPUT"
            fi
            if echo "$CHANGED" | grep -q 'models/.*/DeepSeek/DeepSeek-V2-Lite-W8A8\.yaml'; then
              echo "v2lite=true" >> "$GITHUB_OUTPUT"
            fi
            if echo "$CHANGED" | grep -q 'models/.*/Qwen/template2_non_pd\.yaml'; then
              echo "qwen=true" >> "$GITHUB_OUTPUT"
            fi
            if echo "$CHANGED" | grep -q 'models/.*/Qwen/Qwen3-30B-A3B\.yaml'; then
              echo "qwen30b=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Changed multi-node recipes (en or zh):"
            echo "$CHANGED" | grep -E 'template_pd|V2-Lite|template2_non_pd|Qwen3-30B-A3B' || echo "(none)"
          else
            selected_case='${{ inputs.case }}'
            if [[ "$selected_case" == all || "$selected_case" == deepseek-template-pd ]]; then
              echo "pd_template=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$selected_case" == all || "$selected_case" == deepseek-v2-lite-pd ]]; then
              echo "v2lite=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$selected_case" == all || "$selected_case" == qwen-template-non-pd ]]; then
              echo "qwen=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$selected_case" == all || "$selected_case" == qwen3-30b-a3b-non-pd ]]; then
              echo "qwen30b=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  verify-template-pd:
    needs: prepare
    name: multi-node (deepseek-v2-lite-pd-2n2c)
    # pull_request workflows cannot safely expose cluster credentials to forks.
    if: always() && needs.prepare.outputs.pd_template == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: deepseek-v2-lite-pd-2n2c
      recipe: models/en/DeepSeek/template_pd.yaml
      test_id: pd-2n2c
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}

  verify-v2lite:
    needs: [prepare, verify-template-pd]
    name: multi-node (deepseek-v2-lite-recipe-pd-2n2c)
    if: always() && needs.prepare.outputs.v2lite == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: deepseek-v2-lite-recipe-pd-2n2c
      recipe: models/en/DeepSeek/DeepSeek-V2-Lite-W8A8.yaml
      test_id: dsv2lite-pd-2n2c
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}

  verify-qwen:
    needs: [prepare, verify-template-pd, verify-v2lite]
    name: multi-node (qwen3-30b-a3b-dp-2n2c)
    if: always() && needs.prepare.outputs.qwen == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: qwen3-30b-a3b-dp-2n2c
      recipe: models/en/Qwen/template2_non_pd.yaml
      test_id: dp-2n2c
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}

  verify-qwen30b:
    needs: [prepare, verify-template-pd, verify-v2lite, verify-qwen]
    name: multi-node (qwen3-30b-a3b-recipe-dp-2n2c)
    if: always() && needs.prepare.outputs.qwen30b == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: qwen3-30b-a3b-recipe-dp-2n2c
      recipe: models/en/Qwen/Qwen3-30B-A3B.yaml
      test_id: qwen30b-dp-2n2c
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}
