name: Multi-node framework

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/verify_multi_node.yaml
      - .github/workflows/_verify_multi_node.yaml
      - test/recipe/multi_node/**
      - models/en/DeepSeek/template_pd.yaml
      - models/en/DeepSeek/DeepSeek-V2-Lite-W8A8.yaml
      - models/en/Qwen/template2_non_pd.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: multi-node (${{ matrix.name }})
    # pull_request workflows cannot safely expose cluster credentials to forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deepseek-v2-lite-pd-2n2c
            recipe: models/en/DeepSeek/template_pd.yaml
            test_id: pd-2n2c
          - name: deepseek-v2-lite-recipe-pd-2n2c
            recipe: models/en/DeepSeek/DeepSeek-V2-Lite-W8A8.yaml
            test_id: dsv2lite-pd-2n2c
          - name: qwen3-30b-a3b-dp-2n2c
            recipe: models/en/Qwen/template2_non_pd.yaml
            test_id: dp-2n2c
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: ${{ matrix.name }}
      recipe: ${{ matrix.recipe }}
      test_id: ${{ matrix.test_id }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}
