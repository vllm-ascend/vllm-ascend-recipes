name: Multi-node framework

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      target_ids:
        description: 'Optional comma-separated target IDs; blank uses the nightly multi_node list'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install planner dependencies
        run: python -m pip install pyyaml

      - name: Plan selected multi-node targets
        id: plan
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
          TARGET_IDS: ${{ inputs.target_ids }}
        run: |
          python .github/_scripts/nightly_multi_node_plan.py \
            --trigger "$TRIGGER" --target-ids "$TARGET_IDS" > multi-node-plan.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path("multi-node-plan.json").read_text(encoding="utf-8"))
          selected = [entry["target_id"] for entry in matrix["include"]]
          Path("selected-targets.json").write_text(
              json.dumps({"selected_targets": selected}), encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write(f"count={len(selected)}\n")
          PY

      - name: Upload selected target manifest
        uses: actions/upload-artifact@v6
        with:
          name: verification-target-results-${{ github.run_id }}-selection
          path: selected-targets.json
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: prepare
    name: multi-node (${{ matrix.name }})
    if: needs.prepare.outputs.count != '0'
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/_verify_multi_node.yaml
    with:
      name: ${{ matrix.name }}
      target_id: ${{ matrix.target_id }}
      recipe: ${{ matrix.recipe }}
      test_id: ${{ matrix.test_id }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      OBS_AK: ${{ secrets.OBS_AK }}
      OBS_SK: ${{ secrets.OBS_SK }}
