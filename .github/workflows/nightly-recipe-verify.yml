name: 'Nightly Recipe Verify'

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Shanghai; multi-node keeps its own schedule.
  push:
    branches: [main]
    paths:
      - 'models/**'
      - '.github/nightly-recipes.yaml'
  workflow_dispatch:
    inputs:
      recipe_allowlist:
        type: string
        description: 'Optional English recipe paths, comma-separated. Blank uses .github/nightly-recipes.yaml.'
      full_run:
        type: boolean
        default: false
        description: 'Discover all English recipes with executable single-node scenarios. recipe_allowlist takes priority.'
      hardware_filter:
        type: choice
        description: 'Limit manual verification to one hardware family'
        options: [all, a2, a3, a5]
        default: all
      a2_image:
        type: string
        description: 'Override A2 image; blank uses the nightly entry or recipe image'
      a3_image:
        type: string
        description: 'Override A3 image; blank uses the nightly entry or recipe image'
      a5_image:
        type: string
        description: 'Override A5 image; blank uses the nightly entry or recipe image'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      recipe_matrix: ${{ steps.plan.outputs.matrix }}
      hardware_count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install recipe planner dependency
        run: python -m pip install pyyaml
      - name: Plan single-node verification
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.before }}
          FULL_RUN: ${{ inputs.full_run }}
          RECIPE_ALLOWLIST: ${{ inputs.recipe_allowlist }}
          HARDWARE_FILTER: ${{ inputs.hardware_filter || 'all' }}
          A2_IMAGE: ${{ inputs.a2_image }}
          A3_IMAGE: ${{ inputs.a3_image }}
          A5_IMAGE: ${{ inputs.a5_image }}
        run: |
          args=(--trigger nightly)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            args=(--trigger manual)
            if [ "$FULL_RUN" = true ]; then args+=(--full-run); fi
          elif [ "$EVENT_NAME" = push ] && [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASE_REF" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base-ref "$BASE_REF")
          fi
          python .github/_scripts/verification_plan.py "${args[@]}" \
            --recipe-allowlist "$RECIPE_ALLOWLIST" \
            --hardware-filter "$HARDWARE_FILTER" \
            --a2-image "$A2_IMAGE" --a3-image "$A3_IMAGE" --a5-image "$A5_IMAGE" \
            > /tmp/verification-plan.json
          {
            echo "matrix=$(jq -c . /tmp/verification-plan.json)"
            echo "count=$(jq '.include | length' /tmp/verification-plan.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.count != '0'
      - uses: actions/setup-node@v5
        if: steps.plan.outputs.count != '0'
        with:
          node-version: 22
          cache: pnpm
      - name: Validate recipe fields
        if: steps.plan.outputs.count != '0'
        run: |
          pnpm install --frozen-lockfile
          pnpm validate
          pnpm check:recipes

  verify:
    name: single-node (${{ matrix.job_id }})
    needs: prepare
    if: needs.prepare.outputs.hardware_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.recipe_matrix) }}
    uses: ./.github/workflows/_recipe_verify.yml
    with:
      plan_id: ${{ matrix.job_id }}
      runner: ${{ matrix.runner }}
      hardware_key: ${{ matrix.hardware_key }}
      image: ${{ matrix.image }}
      mount_share: ${{ matrix.mount_share }}
      recipe_files: ${{ matrix.recipe_files }}
      trigger_type: nightly
      head_sha: ${{ github.sha }}
    secrets:
      obs_ak: ${{ secrets.obs_ak }}
      obs_sk: ${{ secrets.obs_sk }}

  summary:
    needs: [prepare, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: recipe-verify-results-${{ github.run_id }}-*
          path: hardware-results/
          merge-multiple: false
      - name: Collect publisher-compatible recipe results
        if: needs.prepare.result == 'success'
        env:
          EXPECTED_PLAN: ${{ needs.prepare.outputs.recipe_matrix }}
        run: python3 .github/_scripts/collect_recipe_artifacts.py --input hardware-results --output combined-results --expected-plan "$EXPECTED_PLAN"
      - uses: actions/upload-artifact@v6
        with:
          name: recipe-verify-results-${{ github.run_id }}
          path: combined-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Nightly summary
        env:
          HARDWARE_COUNT: ${{ needs.prepare.outputs.hardware_count }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "Hardware jobs selected: $HARDWARE_COUNT"
          echo "Prepare: $PREPARE_RESULT"
          echo "Verification: $VERIFY_RESULT"
          test "$PREPARE_RESULT" = success
          test "$VERIFY_RESULT" != failure
          test "$VERIFY_RESULT" != cancelled
