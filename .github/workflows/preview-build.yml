name: PR Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML
        run: npx tsx scripts/validate-yaml.ts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh configuration verification data
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python .github/_scripts/seed_target_statuses.py \
            --status-dir public/status --targets .github/verification-targets.yaml
          python .github/_scripts/apply_verification_corrections.py
          python .github/_scripts/sync_single_node_target_status.py \
            --status-dir public/status --runs-dir public/runs --targets .github/verification-targets.yaml
          python .github/_scripts/apply_verification_corrections.py
          python .github/_scripts/build_status_index.py \
            --status-dir public/status --output public/status/index.json

      - name: Build
        run: pnpm exec astro build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          ASTRO_BASE: '/'

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pr-preview-dist-${{ github.event.pull_request.number }}
          path: ./dist
          retention-days: 3
          if-no-files-found: error
