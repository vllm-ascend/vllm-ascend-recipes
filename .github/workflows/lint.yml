name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.filter.outputs.models }}
      src: ${{ steps.filter.outputs.src }}
      workflows: ${{ steps.filter.outputs.workflows }}
      config: ${{ steps.filter.outputs.config }}
      multi_node: ${{ steps.filter.outputs.multi_node }}
      configuration_status: ${{ steps.filter.outputs.configuration_status }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            models:
              - 'models/**'
            src:
              - 'src/**'
            workflows:
              - '.github/workflows/**'
            multi_node:
              - 'test/recipe/multi_node/**'
              - 'test/ut/multi_node_framework/**'
            configuration_status:
              - '.github/_scripts/**'
              - '.github/verification-targets.yaml'
              - 'public/status/**'
              - 'test/unit/**'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'astro.config.*'
              - 'tsconfig.*'
              - 'eslint.config.*'
              - '.prettierrc.*'

  yaml:
    needs: detect
    if: needs.detect.outputs.models == 'true' || needs.detect.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate model YAML
        run: pnpm validate

      - name: Validate recipe fields
        run: pnpm check:recipes

  frontend:
    needs: detect
    if: needs.detect.outputs.src == 'true' || needs.detect.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

  workflow-lint:
    needs: detect
    if: needs.detect.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  multi-node:
    needs: detect
    if: |
      needs.detect.outputs.models == 'true' ||
      needs.detect.outputs.multi_node == 'true' ||
      needs.detect.outputs.configuration_status == 'true' ||
      needs.detect.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Multi-node framework dependencies
        run: python -m pip install pyyaml

      - name: Generate multi-node plans from isolated templates
        run: |
          python test/recipe/multi_node/convert.py \
            --recipe models/en/DeepSeek/template_pd.yaml \
            --test-id pd-2n2c
          python test/recipe/multi_node/convert.py \
            --recipe models/en/Qwen/template2_non_pd.yaml \
            --test-id dp-2n2c

      - name: Validate multi-node plans
        run: |
          find test/recipe/multi_node/.generated -name plan.yaml -print0 |
            while IFS= read -r -d '' plan; do
              MULTI_NODE_PLAN="$plan" MULTI_NODE_VALIDATE_ONLY=true \
                test/recipe/multi_node/scripts/run.sh
            done

      - name: Check shell entrypoints
        run: |
          find test/recipe/multi_node -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' script; do
              bash -n "$script"
            done

      - name: Run Multi-node framework unit tests
        run: python -m unittest discover -s test/ut/multi_node_framework -v

      - name: Run configuration status unit tests
        run: python -m unittest discover -s test/unit -p '*test.py' -v
