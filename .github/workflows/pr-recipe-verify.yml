name: 'PR Recipe Verify'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: pr-recipe-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Step 1: Detect what changed
  # ============================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_model_changes: ${{ steps.filter.outputs.models }}
      has_src_changes: ${{ steps.filter.outputs.src }}
      has_workflow_changes: ${{ steps.filter.outputs.workflows }}
      has_config_changes: ${{ steps.filter.outputs.config }}
      recipe_matrix: ${{ steps.recipes.outputs.matrix }}
      hardware_count: ${{ steps.recipes.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: csv
          filters: |
            models:
              - 'models/**'
            src:
              - 'src/**'
            workflows:
              - '.github/workflows/**'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'astro.config.*'
              - 'tsconfig.*'
              - 'eslint.config.*'
              - '.prettierrc.*'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install recipe planner dependency
        run: python -m pip install pyyaml

      - name: Discover changed recipes and their single-node hardware
        id: recipes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python .github/_scripts/verification_plan.py \
            --trigger pr --base-ref "$BASE_REF" > /tmp/verification-plan.json
          {
            echo "matrix=$(jq -c . /tmp/verification-plan.json)"
            echo "count=$(jq '.include | length' /tmp/verification-plan.json)"
          } >> "$GITHUB_OUTPUT"

  # ============================================================
  # Step 2: YAML validation + site build (always)
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML
        run: pnpm validate

      - name: Validate recipe fields
        run: pnpm check:recipes

      - name: Check i18n pairing
        run: |
          echo "=== Checking en/zh recipe pairing ==="
          MISSING_ZH=""
          for en_file in models/en/**/*.yaml; do
            zh_file="${en_file/en/zh}"
            if [ ! -f "$zh_file" ]; then
              MISSING_ZH="$MISSING_ZH  $zh_file"
            fi
          done
          if [ -n "$MISSING_ZH" ]; then
            echo "WARNING: Missing zh translations:"
            echo "$MISSING_ZH"
          fi
          echo "i18n pairing check done."

      - name: Build site
        run: pnpm build

  # ============================================================
  # Step 3: Frontend checks (src changes only)
  # ============================================================
  frontend:
    needs: detect
    if: needs.detect.outputs.has_src_changes == 'true' || needs.detect.outputs.has_config_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

  # ============================================================
  # Step 4: Workflow validation (workflow changes only)
  # ============================================================
  workflows:
    needs: detect
    if: needs.detect.outputs.has_workflow_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  # ============================================================
  # Step 5: Recipe deployment verification (models changes only)
  # Uses the reusable _recipe_verify workflow
  # ============================================================
  verify-deploy:
    name: single-node (${{ matrix.job_id }})
    needs: [detect, validate]
    if: |
      needs.detect.outputs.hardware_count != '0' &&
      needs.validate.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect.outputs.recipe_matrix) }}
    uses: ./.github/workflows/_recipe_verify.yml
    with:
      plan_id: ${{ matrix.job_id }}
      runner: ${{ matrix.runner }}
      hardware_key: ${{ matrix.hardware_key }}
      image: ${{ matrix.image }}
      mount_share: ${{ matrix.mount_share }}
      recipe_files: ${{ matrix.recipe_files }}
      trigger_type: pr
      head_sha: ${{ github.event.pull_request.head.sha }}
      started_at_iso: ${{ github.event.pull_request.updated_at }}

  # Preserve publish-status.yml's artifact name without letting hardware jobs
  # overwrite one another's params/status files.
  collect-results:
    needs: [detect, verify-deploy]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.hardware_count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: recipe-verify-results-${{ github.run_id }}-*
          path: hardware-results/
          merge-multiple: false
      - name: Collect publisher-compatible recipe results
        env:
          EXPECTED_PLAN: ${{ needs.detect.outputs.recipe_matrix }}
        run: python3 .github/_scripts/collect_recipe_artifacts.py --input hardware-results --output combined-results --expected-plan "$EXPECTED_PLAN"
      - uses: actions/upload-artifact@v6
        with:
          name: recipe-verify-results-${{ github.run_id }}
          path: combined-results/
          retention-days: 14
          if-no-files-found: warn
