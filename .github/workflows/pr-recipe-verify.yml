name: 'PR Recipe Verify'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: pr-recipe-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Step 1: Detect what changed
  # ============================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_model_changes: ${{ steps.filter.outputs.models }}
      has_src_changes: ${{ steps.filter.outputs.src }}
      has_workflow_changes: ${{ steps.filter.outputs.workflows }}
      has_config_changes: ${{ steps.filter.outputs.config }}
      recipe_files: ${{ steps.recipes.outputs.files }}
      recipe_count: ${{ steps.recipes.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: csv
          filters: |
            models:
              - 'models/**'
            src:
              - 'src/**'
            workflows:
              - '.github/workflows/**'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'astro.config.*'
              - 'tsconfig.*'
              - 'eslint.config.*'
              - '.prettierrc.*'

      - name: List changed recipes
        id: recipes
        if: steps.filter.outputs.models == 'true'
        run: |
          MODEL_FILES="${{ steps.filter.outputs.models_files }}"
          echo "All changed model files: $MODEL_FILES"
          EN_RECIPES=$(echo "$MODEL_FILES" | tr ',' '\n' | grep '^models/en/.*\.\(yaml\|yml\)$' || true)
          # These standalone templates are verified only by verify_multi_node;
          # do not pass them to the legacy single-node deployment workflow.
          LEGACY_RECIPES=$(echo "$EN_RECIPES" | grep -Ev \
            '^(models/en/DeepSeek/template_pd\.yaml|models/en/Qwen/template2_non_pd\.yaml)$' || true)
          # Only trigger deployment verify for whitelisted models. The legacy
          # multi-node workflow reads the same global whitelist.
          VERIFY_RECIPES=$(echo "$LEGACY_RECIPES" | grep -E -f <(grep -vE '^\s*(#|$)' .github/recipe-verify-whitelist.txt) || true)
          if [ -n "$VERIFY_RECIPES" ]; then
            COUNT=$(echo "$VERIFY_RECIPES" | wc -l)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            FILES=$(echo "$VERIFY_RECIPES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            echo "Verification recipes ($COUNT): $VERIFY_RECIPES"
            SKIPPED_RECIPES=$(echo "$LEGACY_RECIPES" | grep -v -E -f <(grep -vE '^\s*(#|$)' .github/recipe-verify-whitelist.txt) || true)
            if [ -n "$SKIPPED_RECIPES" ]; then
              echo "Skipped (not in whitelist): $SKIPPED_RECIPES"
            fi
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "files=[]" >> "$GITHUB_OUTPUT"
            echo "No models/en/ recipe files changed"
          fi

  # ============================================================
  # Step 2: YAML validation + site build (always)
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML
        run: pnpm validate

      - name: Validate recipe fields
        run: pnpm check:recipes

      - name: Check i18n pairing
        run: |
          echo "=== Checking en/zh recipe pairing ==="
          MISSING_ZH=""
          for en_file in models/en/**/*.yaml; do
            zh_file="${en_file/en/zh}"
            if [ ! -f "$zh_file" ]; then
              MISSING_ZH="$MISSING_ZH  $zh_file"
            fi
          done
          if [ -n "$MISSING_ZH" ]; then
            echo "WARNING: Missing zh translations:"
            echo "$MISSING_ZH"
          fi
          echo "i18n pairing check done."

      - name: Build site
        run: pnpm build

  # ============================================================
  # Step 3: Frontend checks (src changes only)
  # ============================================================
  frontend:
    needs: detect
    if: needs.detect.outputs.has_src_changes == 'true' || needs.detect.outputs.has_config_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

  # ============================================================
  # Step 4: Workflow validation (workflow changes only)
  # ============================================================
  workflows:
    needs: detect
    if: needs.detect.outputs.has_workflow_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1

  # ============================================================
  # Step 5: Recipe deployment verification (models changes only)
  # Uses the reusable _recipe_verify workflow
  # ============================================================
  verify-deploy:
    needs: [detect, validate]
    if: |
      needs.detect.outputs.has_model_changes == 'true' &&
      needs.detect.outputs.recipe_count != '0' &&
      needs.validate.result == 'success'
    uses: ./.github/workflows/_recipe_verify.yml
    with:
      runner: linux-aarch64-a2b4-8
      recipe_files: ${{ needs.detect.outputs.recipe_files }}
      trigger_type: pr
      head_sha: ${{ github.event.pull_request.head.sha }}
      started_at_iso: ${{ github.event.pull_request.updated_at }}

  # A5-capable recipes are verified separately so the legacy A2/A3 path keeps
  # its existing runner and image while the A5 scenario runs on real hardware.
  verify-a5:
    needs: [detect, validate]
    if: |
      needs.detect.outputs.has_model_changes == 'true' &&
      needs.detect.outputs.recipe_count != '0' &&
      needs.validate.result == 'success' &&
      contains(needs.detect.outputs.recipe_files, 'DeepSeek-V4-Flash.yaml')
    uses: ./.github/workflows/_recipe_verify.yml
    with:
      runner: linux-aarch64-a5-4
      hardware_key: ascend_950dt
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.23.0rc1-a5
      recipe_files: ${{ needs.detect.outputs.recipe_files }}
      trigger_type: pr
      head_sha: ${{ github.event.pull_request.head.sha }}
      started_at_iso: ${{ github.event.pull_request.updated_at }}
