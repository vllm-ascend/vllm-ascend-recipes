name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Status commits use GITHUB_TOKEN, whose pushes do not trigger workflows.
  workflow_run:
    workflows: ['Publish Verification Status']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML
        run: npx tsx scripts/validate-yaml.ts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh configuration verification data
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python .github/_scripts/seed_target_statuses.py \
            --status-dir public/status --targets .github/verification-targets.yaml
          python .github/_scripts/apply_verification_corrections.py
          python .github/_scripts/sync_single_node_target_status.py \
            --status-dir public/status --runs-dir public/runs --targets .github/verification-targets.yaml
          # Legacy SHA-keyed archives may have been replaced by another run.
          # Exact run-ID audits remain authoritative after synchronization.
          python .github/_scripts/apply_verification_corrections.py
          python .github/_scripts/build_status_index.py \
            --status-dir public/status --output public/status/index.json

      - name: Build
        run: pnpm build

      # Status JSON (public/status/, public/runs/) is committed to main by
      # publish-status.yml. Astro's normal `public/` → `dist/` copy during
      # `pnpm build` above already picked them up — no second-branch merge
      # step is needed at deploy time.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
