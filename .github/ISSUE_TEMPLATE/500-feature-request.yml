name: 🚀 Feature request
description: Propose a new feature for the recipes site or its tooling.
title: "[Feature]: "
labels: ["feature request"]

body:
  - type: markdown
    attributes:
      value: >
        #### Before submitting, please search [existing and past issues](https://github.com/vllm-ascend/vllm-ascend-recipes/issues?q=is%3Aissue+sort%3Acreated-desc+) to avoid duplicates.
  - type: textarea
    id: pitch
    attributes:
      label: 🚀 The feature, motivation and pitch
      description: >
        A clear and concise description of the feature proposal. Outline the motivation — is it related to a specific problem? e.g. *"I want to filter recipes by NPU SKU on the browse page"*. Link related issues if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: >
        Any alternative solutions or features you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Add any other context or screenshots about the feature request.
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
